<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONGIA: verify a certificate</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Oswald:wght@400;500&display=swap">
<style>
  /* The page the QR code on a certificate opens (Andrew 30 Oct 2026): is it genuine, and what does it certify. */
  :root{
    --paper:#f2efe8; --card:#fafaf7; --sunk:#edeae2;
    --ink:#12161f; --ink-mid:#2c3448; --muted:#596176;
    --navy:#1a2f5e; --navy-deep:#0e1a35; --gold:#b8922a; --gold-pale:#f4ecd6;
    --border:#ddd7c8; --edge:#bfb49a;
    --done:#2f6b4f; --done-bg:#e2efe7; --bad:#a33328; --bad-bg:#f7e3e0;
    --fd:"DM Serif Display",Georgia,serif;
    --fb:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --fu:"Oswald","Arial Narrow",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .bar{background:var(--navy-deep);padding:12px 18px;border-bottom:3px solid var(--gold);padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .bar img{height:46px;width:auto;display:block}
  main{max-width:560px;margin:28px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:22px 22px 20px;box-shadow:0 10px 30px rgba(14,26,53,.08)}
  .state{display:flex;align-items:center;gap:12px;font:600 18px var(--fb)}
  .mark{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:20px;color:#fff}
  .ok .mark{background:var(--done)} .no .mark{background:var(--bad)}
  .ok .state{color:var(--done)} .no .state{color:var(--bad)}
  h1{font:400 30px/1.15 var(--fd);margin:18px 0 2px}
  .agency{color:var(--ink-mid);font-size:17px}
  dl{margin:18px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;font-size:15px}
  dt{font:500 11px var(--fu);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
  dd{margin:0}
  .li{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:#0a66c2;color:#fff;text-decoration:none;font-weight:600;border-radius:999px;padding:11px 18px;min-height:44px}
  .fine{color:var(--muted);font-size:13px;margin-top:18px}
  .wait{color:var(--muted)}
  .lang{float:right;margin-top:10px;color:#fff;font:500 13px var(--fb);text-decoration:underline;background:none;border:0;cursor:pointer;padding:6px}
</style>
</head>
<body>
<div class="bar"><button type="button" class="lang" id="lang">Français</button><img src="/assets/ongia-logo-tagline-dark.png" alt="ONGIA: Knowledge. Network. Impact."></div>
<main><div class="card" id="box"><p class="wait" id="wait">Checking the certificate…</p></div></main>
<script>
  // English and French (audit 24 Nov 2026: the French certificate email linked to an English-only page). French when the
  // link says so (?lang=fr, from the French email) or the phone is set to French; the button switches.
  const T = {
    en: { checking: "Checking the certificate…", withdrawn: "This certificate has been withdrawn", none: "ONGIA has no certificate with this number",
      failed: "The certificate could not be checked. Try again in a moment", genuine: "A genuine ONGIA certificate", completed: "Completed", issued: "Date issued",
      by: "Issued by", number: "Number", linkedin: "Add to LinkedIn", fine: "This page confirms the certificate was issued by ONGIA. It shows only what the certificate itself says.",
      badFine: (c) => `Certificate number ${c}. If you think this is a mistake, write to info@ongia.ca.`, missing: "missing", other: "Français", title: "ONGIA: verify a certificate" },
    fr: { checking: "Vérification du certificat…", withdrawn: "Ce certificat a été retiré", none: "L'ONGIA n'a aucun certificat portant ce numéro",
      failed: "Le certificat n'a pas pu être vérifié. Réessayez dans un instant", genuine: "Un certificat authentique de l'ONGIA", completed: "Formation suivie", issued: "Date de délivrance",
      by: "Délivré par", number: "Numéro", linkedin: "Ajouter à LinkedIn", fine: "Cette page confirme que le certificat a été délivré par l'ONGIA. Elle n'indique que ce que le certificat lui-même mentionne.",
      badFine: (c) => `Certificat n<sup>o</sup> ${c}. Si vous croyez qu'il s'agit d'une erreur, écrivez à info@ongia.ca.`, missing: "manquant", other: "English", title: "ONGIA : vérifier un certificat" },
  };
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang") === "fr" || (!params.get("lang") && /^fr\b/i.test(navigator.language || "")) ? "fr" : "en";
  const t = () => T[lang];
  const box = document.getElementById("box");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const code = params.get("c") || "";
  let last = null;
  const bad = (key) => { last = { bad: key }; box.className = "card no"; box.innerHTML = `<div class="state"><span class="mark" aria-hidden="true">✕</span>${t()[key]}</div>
    <p class="fine">${t().badFine(esc(code || t().missing))}</p>`; };
  const good = (v) => { last = { v }; box.className = "card ok";
    box.innerHTML = `<div class="state"><span class="mark" aria-hidden="true">✓</span>${t().genuine}</div>
      <h1>${esc(v.name)}</h1>${v.agency ? `<div class="agency">${esc(v.agency)}</div>` : ""}
      <dl><dt>${t().completed}</dt><dd>${esc(v.training)}</dd><dt>${t().issued}</dt><dd>${esc(lang === "fr" && v.dateFr ? v.dateFr : v.date)}</dd><dt>${t().by}</dt><dd>ONGIA</dd><dt>${t().number}</dt><dd>${esc(v.code)}</dd></dl>
      <a class="li" href="${esc(v.linkedin)}" target="_blank" rel="noopener">${t().linkedin}</a>
      <p class="fine">${t().fine}</p>`; };
  const paint = () => {
    document.documentElement.lang = lang; document.title = t().title;
    document.getElementById("lang").textContent = t().other;
    const w = document.getElementById("wait"); if (w) w.textContent = t().checking;
    if (last?.v) good(last.v); else if (last?.bad) bad(last.bad);
  };
  document.getElementById("lang").onclick = () => { lang = lang === "fr" ? "en" : "fr"; paint(); };
  paint();
  (async () => {
    try {
      const res = await fetch(`/api/verify?c=${encodeURIComponent(code)}`);
      const v = await res.json();
      if (v.revoked) return bad("withdrawn");
      if (!v.valid) return bad("none");
      good(v);
    } catch { bad("failed"); }
  })();
</script>
</body>
</html>
