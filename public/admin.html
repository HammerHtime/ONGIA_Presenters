  document.querySelectorAll("#vr-need button").forEach((b) => {
    b.onclick = () => { vrNeed = b.dataset.need; document.querySelectorAll("#vr-need button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); vrCheck(); };
  });
  for (const el of [vrIn, vrOut, vrName]) if (el) { el.oninput = vrCheck; el.onchange = vrCheck; }
  if (vrGo) vrGo.onclick = async () => {
    vrGo.disabled = true; vrGo.textContent = "Approving…";
    try {
      await api(`/volunteers?${q}&id=${encodeURIComponent(vrFor.id)}&action=approve`, { method: "POST", body: JSON.stringify({
        approverName: vrName.value.trim(), hotel: { need: vrNeed, from: vrIn.value, to: vrOut.value, pays: document.getElementById("vr-pays").value } }) });
      vr.close(); toast(`${named(vrFor)} approved. The final copy is on its way, and ${vrNeed === "yes" ? "their nights are on the hotel list" : "no room was added"}.`); render();
    } catch (e) {
      document.getElementById("vr-err").innerHTML = `<div class="bad"><b>Couldn't approve it.</b> ${esc(e.message)}</div>`;
      vrGo.textContent = "Approve and send the final copy"; vrCheck();
    }
  };

  // Correct, or remove (two steps: say yes, then type DELETE, with a reason kept on the event).
  const vedit = document.getElementById("vedit");
  ROOT.querySelectorAll("[data-vedit]").forEach((b) => {
    b.onclick = () => {
      const v = list.find((x) => x.id === b.dataset.vedit);
      if (!v) return;
      vedit.dataset.id = v.id;
      for (const [id, val] of [["ve-first", v.first], ["ve-last", v.last], ["ve-email", v.email], ["ve-org", v.organization]]) document.getElementById(id).value = val ?? "";
      const sent = (v.mail ?? []).length > 0;
      document.getElementById("ve-warn").innerHTML = v.status === "signed"
        ? `<div class="note" style="margin-top:14px">This agreement is already signed and filed. Correcting it here does not change the PDF in SharePoint.</div>`
        : v.status === "submitted" ? `<div class="note" style="margin-top:14px">They have signed and are waiting for a board member to choose their hotel nights. Use <b>Review</b> on their row.</div>`
        : sent ? `<div class="note" style="margin-top:14px">Their link has already been emailed to the old address. After saving, use <b>Email link</b> on their row to send it to the corrected one.</div>` : "";
      vedit.showModal();
      document.getElementById("ve-email").focus();
    };
  });
  vedit?.addEventListener("close", async () => {
    if (vedit.returnValue !== "save") return;
    const body = { first: document.getElementById("ve-first").value.trim(), last: document.getElementById("ve-last").value.trim(),
      email: document.getElementById("ve-email").value.trim(), organization: document.getElementById("ve-org").value.trim() };
    try {
      const r = await api(`/volunteers?${q}&id=${encodeURIComponent(vedit.dataset.id)}`, { method: "PUT", body: JSON.stringify(body) });
      toast(r.emailChanged ? `Corrected — their link now goes to ${r.volunteer.email}.` : "Corrected.");
      render();
    } catch (e) { toast(e.message); }
  });
  const veRemove = document.getElementById("ve-remove");
  if (veRemove) veRemove.onclick = () => {
    const v = list.find((x) => x.id === vedit.dataset.id);
    if (!v) return;
    const signed = v.status === "signed";
    // As for presenters (Andrew 21 Oct 2026): someone who signed takes a reason and DELETE; someone who never did, one "are you sure?".
    const everSigned = signed || v.status === "submitted";
    const vrm = document.getElementById("vrm"), vgo = document.getElementById("vrm-go"), typed = document.getElementById("vrm-confirm");
    vedit.close();
    document.getElementById("vrm-title").textContent = `Remove ${named(v)}?`;
    document.getElementById("vrm-what").textContent = everSigned
      ? `Their agreement link stops working and they come off this event${signed ? ". Their signed agreement stays in SharePoint." : "."}`
      : `${named(v)} never signed, so there is no agreement on file. Their link stops working and they come off this event.`;
    document.getElementById("vrm-full").hidden = !everSigned;
    document.getElementById("vrm-why").value = ""; typed.value = ""; vgo.disabled = everSigned;
    typed.oninput = () => { vgo.disabled = typed.value.trim().toUpperCase() !== "DELETE"; };
    vrm.returnValue = "";
    vrm.onclose = async () => {
      if (vrm.returnValue !== "remove" || (everSigned && typed.value.trim().toUpperCase() !== "DELETE")) return;
      try {
        await api(`/volunteers?${q}&id=${encodeURIComponent(v.id)}${signed ? "&final=1" : ""}`, { method: "DELETE", body: JSON.stringify({ reason: document.getElementById("vrm-why").value }) });
        toast(`${named(v)} removed.`); render();
      } catch (e) { toast(e.message); }
    };
    vrm.showModal();
    if (everSigned) document.getElementById("vrm-why").focus(); else vgo.focus();
  };
}

/* ---------- integration status ---------- */
async function healthStrip() {
  const host = document.getElementById("health");
  if (!host) return;
  try {
    const h = await api("/health");
    const dot = (r) => `<span class="dot" style="background:${r?.ok ? "var(--done)" : "var(--late)"}"></span>`;
    const sp = h.sharepoint ?? h.microsoft;
    const spOk = !!sp?.ok;
    const spLabel = sp ? (spOk ? "SharePoint reachable" : "SharePoint unreachable") : "SharePoint not set up";
    const spWhy = spOk ? (sp.site ?? "").replace(/^https?:\/\//, "") : (sp?.error ?? "Microsoft credentials are not set on this site");
    const broken = !h.email?.ok || !spOk;
    // Healthy: one quiet line. Only a failure takes up room.
    if (!broken) { host.innerHTML = `<div class="hstrip ok"><span>${dot(h.email)}Email and SharePoint are working<small>${esc(h.email.from ?? "")}</small></span></div>`; return; }
    host.innerHTML = `<div class="hstrip${broken ? " bad" : ""}">
      ${broken ? `<b>Something is off — presenters and filing are affected.</b>` : ""}
      <span>${dot(h.email)}Email ${h.email?.ok ? "ready" : "not working"}<small>${esc(h.email?.ok ? h.email.from : (h.email?.reason ?? "no transport configured"))}</small></span>
      <span>${dot(sp)}${esc(spLabel)}<small>${esc(spWhy)}</small></span></div>`;
  } catch (e) { host.innerHTML = `<div class="hstrip bad"><b>Status unavailable.</b><span><span class="dot"></span>Could not reach the desk<small>${esc(e.message)}</small></span></div>`; }
}

/**
 * The nightly backup, on the Admin tab (desk owners only; anyone else is refused, so the tab is not offered): when it last ran, how big it
 * was, whether it checked out, a link to the folder, and "Back up now". Red when the last one failed or is over a day old.
 */
async function backupLine(host) {
  const B = await api("/backups").catch(() => null);
  if (!B) return;
  let box = document.getElementById("backupline");
  if (!box) { box = document.createElement("div"); box.id = "backupline"; host.appendChild(box); }
  const st = B.status ?? {};
  const when = (iso) => new Date(iso).toLocaleString("en-CA", { timeZone: "America/Vancouver", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const mb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
  const old = st.lastGoodAt ? (Date.now() - Date.parse(st.lastGoodAt)) / 3600000 > 30 : true;
  const running = st.state === "running", failed = st.state === "failed";
  const bad = !B.configured || failed || (!running && !!st.lastGoodAt && old);
  let line;
  if (!B.configured) line = `<b>Backups can't run:</b> Microsoft credentials are not set on this site, so there is nowhere to put them.`;
  else if (running) line = `<b>Backing up now…</b> <small>started ${esc(when(st.startedAt))}${st.by ? ` by ${esc(st.by)}` : ""}</small>`;
  else if (!st.lastGoodAt && !failed) line = `<b>No backup yet.</b> <small>One is made every night at ${esc(B.schedule.replace(/ .*/, ""))} Pacific. Press Back up now to make the first.</small>`;
  else line = `${failed ? `<b>The last backup failed:</b> ${esc(st.error ?? "")} ` : ""}<small>${st.lastGoodAt ? `Last good backup <b>${esc(when(st.lastGoodAt))}</b>${st.size ? ` · ${mb(st.size)}` : ""}${st.blobs ? ` · ${st.blobs} records` : ""}${st.codeFiles ? ` + ${st.codeFiles} code files` : st.codeFound === false ? " · code NOT included" : ""}${st.verified ? " · checked" : ""}` : "No good backup yet"}${old && st.lastGoodAt ? " · <b>over a day ago</b>" : ""}</small>`;
  box.innerHTML = `<div class="hstrip${bad ? " bad" : ""}"><span><span class="dot" style="background:${bad ? "var(--late)" : running ? "var(--gold, #c9a84c)" : "var(--done)"}"></span>Nightly backup<small>${line}</small></span>
    <span class="bkact">${st.folderUrl ? `<a class="mini" href="${esc(st.folderUrl)}" target="_blank" rel="noopener" style="text-decoration:none">Open the folder</a>` : ""}<button class="mini" id="bk-now"${running || !B.configured ? " disabled" : ""}>Back up now</button></span></div>`;
  const now = document.getElementById("bk-now");
  const hist = document.getElementById("backuphist");
  if (hist) hist.innerHTML = (st.history ?? []).length
    ? `<ul style="margin:8px 0 0;padding-left:18px;font-size:13.5px">${st.history.map((h) => `<li>${esc(when(h.at))} · ${h.ok ? `<b>ok</b>${h.size ? ` · ${mb(h.size)}` : ""}${h.name ? ` · ${esc(h.name)}` : ""}` : `<b style="color:var(--late)">failed</b> · ${esc(h.error ?? "")}`}</li>`).join("")}</ul>` : `<p class="hint">Nothing yet.</p>`;
  if (now) now.onclick = async () => { try { await api("/backups", { method: "POST" }); toast("Backing up. This takes a minute or two."); backupLine(host); } catch (e) { toast(e.message); } };
  clearTimeout(backupLine.t);
  if (running && document.body.contains(host)) backupLine.t = setTimeout(() => backupLine(host), 4000);
}

let ROSTER = [];
let ROSTER_META = { owners: [], canGrant: false };
async function loadRoster() {
  try { const r = await api("/roster"); ROSTER = r.members; ROSTER_META = { owners: r.owners ?? [], canGrant: r.canGrant === true }; }
  catch { ROSTER = []; }
  return ROSTER;
}

function boardRows(roster, chosen) {
  const byEmail = new Map(chosen.map((m) => [m.email.toLowerCase(), m]));
  const extras = chosen.filter((m) => !roster.some((r) => r.email.toLowerCase() === m.email.toLowerCase()));
  return [...roster, ...extras].map((m) => {
    const c = byEmail.get(m.email.toLowerCase());
    const phone = c?.phone || m.phone || "";
    return `<div class="member${c?.lead ? " lead" : ""}" data-name="${esc(m.name)}" data-email="${esc(m.email)}" data-phone="${esc(phone)}">
      <input type="checkbox" class="pick"${c ? " checked" : ""} aria-label="Include ${esc(m.name)}">
      <div>${esc(m.name)}<div class="em">${esc(m.email)}${phone ? " · " + esc(phone) : ""}</div></div>
      <label class="leadpick"><input type="radio" name="lead"${c?.lead ? " checked" : ""}${c ? "" : " disabled"}> Lead</label>
    </div>`;
  }).join("");
}

/** "first, last, email, organization" lines → presenter rows. */
function parsePeople(textBlock) {
  return textBlock.split(/\n+/).map((l) => l.trim()).filter(Boolean).map((l) => {
    const [first = "", last = "", email = "", ...org] = l.split(/\s*[,;\t]\s*/);
    return { first, last, email, organization: org.join(", ") };
  });
}

function rosterScreen(members) {
  BARRIGHT.innerHTML = `<button class="chip" id="back">All events</button>`;
  document.getElementById("back").onclick = () => { view = { name: "list" }; render(); };
  const owner = (m) => ROSTER_META.owners.includes(String(m.email).toLowerCase());
  const seen = (m) => (m.lastSignIn ? `Last signed in ${esc(fmtDate(m.lastSignIn))}` : "");
  const deskLine = (m, i) => owner(m)
    ? `<span class="owner">Desk access: always</span>${seen(m) ? `<span>${seen(m)}</span>` : ""}`
    : ROSTER_META.canGrant
      ? `<label class="deskpick"><input type="checkbox" class="deskbox" data-desk="${i}"${m.desk ? " checked" : ""}> Can sign in to the desk</label>${seen(m) ? `<span>${seen(m)}</span>` : ""}`
      : `<span>${m.desk ? "Can sign in to the desk" : "No desk access"}</span>${seen(m) ? `<span>${seen(m)}</span>` : ""}`;
  const rows = members.map((m, i) => `<div class="member" data-i="${i}"><span></span>
    <div>${esc(m.name)}<div class="em" data-em="${i}">${esc(m.email)} <button type="button" class="mini ghost chg" data-chg="${i}" aria-label="Change ${esc(m.name)}'s email">Change email</button></div><div class="deskline">${deskLine(m, i)}</div></div>
    <input class="rphone" type="tel" data-phone="${i}" value="${esc(formatPhone(m.phone ?? ""))}" placeholder="phone (optional)" aria-label="Phone number for ${esc(m.name)}">
    <button class="mini ghost" data-del="${i}" title="Remove">✕</button></div>`).join("");
  ROOT.innerHTML = `<div class="card" style="max-width:700px"><div class="card-head"><div><h2>Board members</h2>
    <div class="s">The list the event form picks from. A number stored here fills in by itself when that person is the lead on an event. Removing someone doesn't change events already created.</div>
    <div class="s" style="margin-top:6px">${ROSTER_META.canGrant ? "Tick <b>Can sign in to the desk</b> for each person who should get in with their ONGIA Microsoft account. Only you can change these." : "Only ONGIA's president can change who can sign in to the desk."}</div></div></div>
    <div class="card-body"><div class="board">${rows || `<div class="empty">Nobody yet.</div>`}</div>
      <div class="addrow"><input id="rb-name" placeholder="Name"><input id="rb-email" type="email" placeholder="email@ongia.ca"><input id="rb-phone" type="tel" placeholder="Phone (optional)"><button class="mini" id="rb-add">Add to list</button></div>
      <div class="actions" style="margin-top:16px"><button class="btn btn-gold" id="ph-save">Save numbers</button></div>
    </div></div>`;
  ROOT.insertAdjacentHTML("afterbegin", adminTabsHtml("board")); wireAdminTabs();
  const save = async (next) => { try { ROSTER = (await api("/roster", { method: "PUT", body: JSON.stringify({ members: next }) })).members; rosterScreen(ROSTER); } catch (e) { toast(e.message); } };
  // Numbers are saved in place — no re-render, so the cursor stays where you put it.
  const savePhones = async () => {
    const next = members.map((m, i) => ({ ...m, phone: ROOT.querySelector(`[data-phone="${i}"]`)?.value.trim() ?? m.phone ?? "" }));
    try { ROSTER = (await api("/roster", { method: "PUT", body: JSON.stringify({ members: next }) })).members; members.splice(0, members.length, ...ROSTER); toast("Numbers saved."); }
    catch (e) { toast(e.message); }
  };
  // Change one person's address in place. Their sign-in switch and last-signed-in go with them.
  ROOT.querySelectorAll("[data-chg]").forEach((b) => {
    b.onclick = () => {
      const i = +b.dataset.chg, m = members[i], cell = ROOT.querySelector(`[data-em="${i}"]`);
      cell.innerHTML = `<input type="email" class="emedit" value="${esc(m.email)}" aria-label="New email for ${esc(m.name)}" style="width:100%;max-width:300px">
        <span class="emacts"><button type="button" class="mini" data-emsave>Save</button> <button type="button" class="mini ghost" data-emcancel>Cancel</button></span>`;
      const input = cell.querySelector("input"); input.focus(); input.select();
      const done = async () => {
        const email = input.value.trim();
        if (email.toLowerCase() === String(m.email).toLowerCase() && email === m.email) return rosterScreen(members);
        const next = members.map((x, j) => ({ ...x, phone: ROOT.querySelector(`[data-phone="${j}"]`)?.value.trim() ?? x.phone ?? "",
          ...(j === i ? { email, was: m.email } : {}) }));
        try { ROSTER = (await api("/roster", { method: "PUT", body: JSON.stringify({ members: next }) })).members; toast(`${m.name}'s email is now ${email}.`); rosterScreen(ROSTER); }
        catch (e) { toast(e.message); }
      };
      cell.querySelector("[data-emsave]").onclick = done;
      cell.querySelector("[data-emcancel]").onclick = () => rosterScreen(members);
      input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); done(); } else if (e.key === "Escape") rosterScreen(members); };
    };
  });
  ROOT.querySelectorAll("[data-del]").forEach((b) => { b.onclick = () => { const m = members[+b.dataset.del]; if (confirm(`Remove ${m.name} from the list?`)) save(members.filter((_, i) => i !== +b.dataset.del)); }; });
  const boxes = [...ROOT.querySelectorAll("[data-phone]")];
  boxes.forEach((el, i) => {
    el.oninput = () => formatPhoneInput(el);
    // Enter (or Tab) drops to the next name, so a list can be filled in one pass.
    el.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); (boxes[i + 1] ?? el).focus(); if (!boxes[i + 1]) savePhones(); } };
  });
  ROOT.querySelector("#ph-save").onclick = savePhones;
  // Desk access saves the moment it is ticked; typed-but-unsaved numbers go along with it.
  ROOT.querySelectorAll("[data-desk]").forEach((box) => {
    box.onchange = async () => {
      const next = members.map((m, i) => ({ ...m, phone: ROOT.querySelector(`[data-phone="${i}"]`)?.value.trim() ?? m.phone ?? "",
        desk: i === +box.dataset.desk ? box.checked : m.desk === true }));
      try {
        const r = await api("/roster", { method: "PUT", body: JSON.stringify({ members: next }) });
        ROSTER = r.members; members.splice(0, members.length, ...ROSTER);
        const m = members[+box.dataset.desk];
        toast(m.desk ? `${m.name} can now sign in to the desk.` : `${m.name} can no longer sign in to the desk.`);
      } catch (e) { box.checked = !box.checked; toast(e.message); }
    };
  });
  document.getElementById("rb-phone").oninput = (e) => formatPhoneInput(e.target);
  document.getElementById("rb-add").onclick = () => {
    const name = document.getElementById("rb-name").value.trim(), email = document.getElementById("rb-email").value.trim();
    const phone = document.getElementById("rb-phone").value.trim();
    if (!name || !email) return toast("Name and email, please.");
    save([...members, { name, email, phone }]);
  };
}

/* ---------- shared helpers ---------- */
let toastTimer;
// 4165550100 → 416-555-0100 as it is typed; an extension survives as " x123".
function formatPhone(raw) {
  const s = String(raw ?? "").trim();
  if (!s) return "";
  if (/^\+(?!1)/.test(s)) return s;
  const m = s.match(/(?:x|ext\.?|poste|#)\s*(\d{0,6})\s*$/i);
  let ext = m ? m[1] : "", hasExt = !!m;
  let digits = (m ? s.slice(0, m.index) : s).replace(/\D/g, "");
  if (digits.length === 11 && digits[0] === "1") digits = digits.slice(1);
  digits = digits.slice(0, 10); // a mask, so stray extra digits are dropped; an extension needs an "x"
  const a = digits.slice(0, 3), b = digits.slice(3, 6), c = digits.slice(6, 10);
  let out = a; if (b) out += "-" + b; if (c) out += "-" + c;
  if (hasExt) out += " x" + ext;
  return out.trim();
}
// Reformat a phone input in place, keeping the caret after the same digit the user was on.
function formatPhoneInput(el) {
  const before = el.value, pos = el.selectionStart ?? before.length;
  const after = formatPhone(before);
  if (after === before) return after;
  const digitsBefore = before.slice(0, pos).replace(/\D/g, "").length;
  el.value = after;
  let i = 0, seen = 0;
  while (i < after.length && seen < digitsBefore) { if (/\d/.test(after[i])) seen++; i++; }
  if (pos >= before.length) i = after.length;
  try { el.setSelectionRange(i, i); } catch { /* not all input types allow it */ }
  return after;
}

function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}

async function invite(eventId, presenterIds, remind) {
  try {
    const out = await api(`/invite?id=${encodeURIComponent(eventId)}`, {
      method: "POST", body: JSON.stringify({ presenterIds: presenterIds ?? undefined, remind: !!remind }),
    });
    // Successes are a toast; failures are kept on the presenter and shown in the
    // red box on the event, because a toast that vanishes is not a report.
    if (out.failed.length) toast(`${out.sent.length} sent, ${out.failed.length} could not be sent — see the red box below.`);
    else toast(out.sent.length ? `Sent to ${out.sent.map((x) => x.name).join(", ")}.` : "Nothing to send.");
    render();
  } catch (e) { toast(e.message); }
}

/**
 * The hotel contract box on the event form. Upload the PDF; Claude reads it in
 * the background while the box asks back every few seconds; what it found comes
 * up as a ticked list. "Put these in the form" fills the hotel boxes — nothing is
 * saved until Andrew presses Save changes, so every date passes his eye first.
 */
function wireContract(ev, { $, showHotelHint, draftId = null }) {
  const body = $("ct-body"), picker = $("ct-file");
  if (!body || !picker) return;
  const q = ev ? `/contract?event=${encodeURIComponent(ev.id)}` : `/contract?draft=${draftId}`;
  const newBox = $("ctnewbox");
  if (!ev && $("ct-new")) $("ct-new").onclick = () => picker.click();
  const span = (a, b) => (!b || a === b ? fmtDate(a) : `${fmtDate(a)} – ${fmtDate(b)}`);
  let timer = null, found = null;

  const when = (iso) => (iso ? fmtDate(iso.slice(0, 10)) : "");
  const links = (st) => [
    st.file ? `<a href="#" data-ct="open">Open it</a>` : "",
    st.file && st.read?.state !== "reading" ? `<a href="#" data-ct="again">Read it again</a>` : "",
    st.read?.state !== "reading" ? `<a href="#" data-ct="pick">${st.file ? "Upload a different one" : "Upload the contract (PDF)"}</a>` : "",
  ].filter(Boolean).join(" · ");

  // One row per thing found. Only the first cut-off and the first food and
  // beverage date can go in their boxes; any others start unticked and, if
  // ticked, go in the notes with the rest.
  const rowsOf = (f) => {
    const rows = [];
    // The training days and the city. On a form that already has them and they
    // differ, they start unticked: moving day one moves every deadline.
    if (f.meetingFirst) {
      const d1 = $("e-day1").value, dl = $("e-last").value || d1;
      const same = d1 === f.meetingFirst && (!f.meetingLast || dl === f.meetingLast);
      const warn = [];
      if (!f.meetingLast) warn.push("the contract does not say when the training ends; set the last day yourself");
      if (d1 && !same) warn.push(`this event is set to ${span(d1, dl)}; tick this only if the contract is right`);
      rows.push({ key: "days", what: f.meetingLast ? `<b>Training days:</b> ${esc(span(f.meetingFirst, f.meetingLast))}`
          : `<b>Training starts:</b> ${esc(fmtDate(f.meetingFirst))}`, on: !d1 || same,
        quote: f.arrival && f.departure ? `Rooms are booked ${esc(span(f.arrival, f.departure))}, arrival to departure.` : "", warn });
    }
    if (f.city) {
      const c = $("e-city").value.trim();
      rows.push({ key: "city", what: `<b>City:</b> ${esc(f.city)}`, on: !c || c === f.city, warn: c && c !== f.city ? [`this event says ${c}`] : [] });
    }
    if (f.hotelName) rows.push({ key: "name", what: `<b>Hotel:</b> ${esc(f.hotelName)}`, on: true });
    if (f.rate) rows.push({ key: "rate", what: `<b>Rate:</b> ${esc(f.rate)}`, on: true });
    const firsts = new Set();
    f.dates.forEach((d, i) => {
      const boxed = d.kind === "cutoff" || d.kind === "foodAndBev";
      const first = boxed && !firsts.has(d.kind);
      if (first) firsts.add(d.kind);
      const warn = [...d.warn];
      if (boxed && !first) warn.push(`the contract gives more than one ${d.kind === "cutoff" ? "cut-off" : "food and beverage date"}; only one goes in its box`);
      rows.push({ key: `d${i}`, date: d, on: !boxed || first,
        what: `<b>${esc(d.label)}:</b> ${esc(d.dateReadable)}${d.what ? ` <span style="color:var(--muted)">— ${esc(d.what)}</span>` : ""}`,
        quote: d.quote ? `“${esc(d.quote)}”${d.page ? ` (page ${d.page})` : ""}` : "", warn });
    });
    return rows;
  };

  const draw = (st) => {
    clearTimeout(timer);
    const r = st.read, file = st.file;
    let html = "";
    if (!file && !r) {
      html = `<div class="cthead"><b>Hotel contract</b></div>
        <p class="hint" style="margin:4px 0 10px">Upload the PDF and Claude will read the cut-off, the food and beverage date and the other
          deadlines in it. You check every one before anything is saved.</p>
        <button type="button" class="mini" data-ct="pick">Upload the contract (PDF)</button>`;
    } else if (r?.state === "reading") {
      html = `<div class="cthead ctbusy"><span class="spin" aria-hidden="true"></span><b>Claude is reading ${esc(r.name || file?.name || "the contract")}…</b>
          <span class="hint" style="margin-left:8px" id="ct-clock" data-since="${esc(r.startedAt ?? "")}"></span></div>
        <div class="ctbar" role="progressbar" aria-label="Reading the contract"></div>
        <p class="hint" style="margin:8px 0 0" id="ct-slow">This usually takes under a minute. You can carry on with the form.</p>`;
    } else {
      html = `<div class="cthead"><b>${esc(file?.name ?? "Hotel contract")}</b>${file?.uploadedAt ? ` <span class="ctlinks">· uploaded ${esc(when(file.uploadedAt))}</span>` : ""}</div>
        <div class="ctlinks" style="margin-top:2px">${links(st)}</div>`;
      if (r?.state === "failed") html += `<div class="lprobs" style="margin:10px 0 0"><div>${esc(r.why)}</div></div>`;
      if (r?.state === "done") {
        found = r.found;
        const rows = rowsOf(found);
        html += rows.length
          ? `<p class="hint" style="margin:10px 0 0">Claude read it ${esc(when(r.at))}. Untick anything that is wrong, then press
              <b>Put these in the form</b>. Nothing is saved until you press <b>${ev ? "Save changes" : "Create event"}</b>.</p>
            <div class="ctlist">${rows.map((x) => `<label class="ctrow"><input type="checkbox" data-ctrow="${x.key}"${x.on ? " checked" : ""}>
              <span class="ctwhat">${x.what}</span>${x.quote ? `<span class="ctquote">${x.quote}</span>` : ""}${x.warn?.length ? `<span class="ctwarn">Check this: ${esc(x.warn.join("; "))}.</span>` : ""}</label>`).join("")}</div>
            ${found.notes ? `<p class="ctnote"><b>Claude's note:</b> ${esc(found.notes)}</p>` : ""}
            <button type="button" class="btn btn-navy" data-ct="fill" style="padding:9px 18px;font-size:14px">Put these in the form</button>
            <p class="hint" id="ct-said" style="margin:8px 0 0"></p>`
          : `<p class="hint" style="margin:10px 0 0">Claude read it and found no dates to act on.${found.notes ? ` Its note: ${esc(found.notes)}` : ""}</p>`;
        body._rows = rows;
      }
    }
    body.innerHTML = html;
    wire();
    // Keep asking while it reads — but only while this form is still on screen.
    if (r?.state === "reading") timer = setTimeout(() => { if (document.body.contains(body)) load(); }, 3000);
    tick();
  };

  // The time since Claude started, ticking each second, so a long read never looks frozen.
  let clock = null;
  const tick = () => {
    clearInterval(clock);
    const el = body.querySelector("#ct-clock");
    if (!el || !el.dataset.since) return;
    const show = () => {
      if (!document.body.contains(el)) return clearInterval(clock);
      const s = Math.max(0, Math.round((Date.now() - Date.parse(el.dataset.since)) / 1000));
      el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      const slow = body.querySelector("#ct-slow");
      if (slow && s >= 90) slow.textContent = ev
        ? "Still reading. A long or scanned contract can take a few minutes. You can carry on with the form, or leave and come back: the dates will be waiting."
        : "Still reading. A long or scanned contract can take a few minutes. Keep this page open and carry on with the form; the dates appear here when Claude is done.";
    };
    show();
    clock = setInterval(show, 1000);
  };

  const load = async () => {
    try { draw(await api(q)); }
    catch (e) { body.innerHTML = `<div class="lprobs" style="margin:0"><div>${esc(e.message)}</div></div>`; }
  };

  const upload = async (f) => {
    if (!f) return;
    if (newBox) newBox.hidden = false;
    if (f.size > 5 * 1024 * 1024) { toast("That file is over 5 MB. Save a smaller copy of the PDF and try again."); return; }
    body.innerHTML = `<div class="cthead ctbusy"><span class="spin" aria-hidden="true"></span><b>Uploading ${esc(f.name)}…</b></div><div class="ctbar"></div>`;
    try {
      draw(await api(q, { method: "POST", body: f, headers: { "content-type": "application/pdf", "x-file-name": encodeURIComponent(f.name) } }));
    } catch (e) { toast(e.message); load(); }
  };
  picker.onchange = () => { upload(picker.files?.[0]); picker.value = ""; };

  const fill = () => {
    const rows = body._rows ?? [];
    const ticked = new Set([...body.querySelectorAll("[data-ctrow]:checked")].map((b) => b.dataset.ctrow));
    const said = [], notes = [];
    const shown = (v) => (/^\d{4}-\d{2}-\d{2}$/.test(v) ? fmtDate(v) : v);
    const put = (id, value, label, { quiet = false } = {}) => {
      const box = $(id);
      if (!box || !value) return;
      if (!quiet) {
        if (box.value && box.value !== value) said.push(`replaced the ${label} (it was ${shown(box.value)})`);
        else if (box.value !== value) said.push(`the ${label}`);
      }
      box.value = value;
      box.dispatchEvent(new Event("input", { bubbles: true }));
      box.dispatchEvent(new Event("change", { bubbles: true }));
    };
    const boxed = new Set();
    for (const x of rows.filter((x) => ticked.has(x.key))) {
      if (x.key === "days") {
        // One message for the pair: setting day one also moves the last day on its own.
        const was = [$("e-day1").value, $("e-last").value];
        put("e-day1", found.meetingFirst, "", { quiet: true });
        if (found.meetingLast) put("e-last", found.meetingLast, "", { quiet: true });
        const what = found.meetingLast ? "the training days" : "day one (set the last day yourself: the contract does not give it)";
        if (was[0] && (was[0] !== found.meetingFirst || (found.meetingLast && (was[1] || was[0]) !== found.meetingLast))) {
          said.push(`replaced ${found.meetingLast ? "the training days" : "day one"} (${found.meetingLast ? "they were" : "it was"} ${span(was[0], found.meetingLast ? (was[1] || was[0]) : null)})`);
          if (!found.meetingLast) said.push("set the last day yourself: the contract does not give it");
        } else if (!was[0]) said.push(what);
      }
      else if (x.key === "city") put("e-city", found.city, "city");
      else if (x.key === "name") put("e-hotel", found.hotelName, "hotel");
      else if (x.key === "rate") put("e-hrate", found.rate, "rate");
      else if ((x.date.kind === "cutoff" || x.date.kind === "foodAndBev") && !boxed.has(x.date.kind)) {
        boxed.add(x.date.kind);
        put(x.date.kind === "cutoff" ? "e-hcut" : "e-hfb", x.date.date, x.date.kind === "cutoff" ? "cut-off" : "food and beverage date");
      } else notes.push(`${x.date.label}: ${x.date.dateReadable}${x.date.what ? ` — ${x.date.what}` : ""}`);
    }
    const notesBox = $("e-hnotes");
    const fresh = notes.filter((n) => !notesBox.value.includes(n));
    if (fresh.length) {
      notesBox.value = [notesBox.value.trim(), ...fresh].filter(Boolean).join("\n");
      said.push(`${fresh.length} other date${fresh.length === 1 ? "" : "s"} in the notes`);
    }
    showHotelHint();
    $("ct-said").innerHTML = said.length
      ? ev ? `Put in the form: ${esc(said.join(", "))}. Check them below, then press <b>Save changes</b>.`
        : `Put in the form: ${esc(said.join(", "))}. Now add the <b>title</b> and <b>venue</b>, choose the board members, and press <b>Create event</b>.`
      : "Nothing new to put in — the form already has these.";
    // On a new event the hotel section is where most of it went; open it so it can be checked.
    if (!ev) {
      const d = [...document.querySelectorAll("details")].find((x) => /Hotel and room block/.test(x.querySelector("summary")?.textContent ?? ""));
      if (d && said.length) d.open = true;
      if (!$("e-title").value.trim()) $("e-title").focus({ preventScroll: true });
    }
  };

  function wire() {
    body.querySelectorAll("[data-ct]").forEach((a) => {
      a.onclick = async (e) => {
        e.preventDefault();
        const what = a.dataset.ct;
        if (what === "pick") picker.click();
        if (what === "fill") fill();
        if (what === "again") { try { draw(await api(`${q}&again=1`, { method: "POST" })); } catch (err) { toast(err.message); } }
        if (what === "open") {
          try {
            const res = await apiFetch(`/api${q}&file=1`, { headers: { "x-admin-key": KEY } });
            if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `Could not open it (${res.status})`);
            const url = URL.createObjectURL(await res.blob());
            window.open(url, "_blank");
            setTimeout(() => URL.revokeObjectURL(url), 60_000);
          } catch (err) { toast(err.message); }
        }
      };
    });
  }
  if (ev) load();   // a new event has nothing to load until a contract is chosen
}

/** Fetch with the admin header, then open — a plain link can't carry the key. */
async function openPdf(eventId, presenterId, preview = false) {
  try {
    const res = await apiFetch(`/api/download?event=${encodeURIComponent(eventId)}&presenter=${encodeURIComponent(presenterId)}&inline=1${preview ? "&preview=1" : ""}`,
      { headers: { "x-admin-key": KEY } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `Download failed (${res.status})`);
    const url = URL.createObjectURL(await res.blob());
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
  } catch (e) { toast(e.message); }
}

const YN = (v) => (v === "yes" ? "Yes" : v === "no" ? "No" : v === "n/a" ? "n/a" : "—");
// What the presenter asked the venue for. Unanswered lines are left out rather
// than listed as blanks — the point is to see what was asked for at a glance.
const AV_WORDS = {
  mic: { lapel: "Clip-on mic", handheld: "Handheld mic", podium: "Podium mic", none: "No mic" },
  laptop: { own: "Own laptop", house: "Room computer" },
  plug: { hdmi: "HDMI", usbc: "USB-C", other: "Other connector", unsure: "Connector unknown" },
};
function avSummary(av, at) {
  const a = av ?? {};
  const bits = [AV_WORDS.mic[a.mic], AV_WORDS.laptop[a.laptop], AV_WORDS.plug[a.plug],
    a.sound === "yes" ? "Needs sound" : a.sound === "no" ? "No sound" : null,
    a.internet === "yes" ? "Needs internet" : null].filter(Boolean);
  if (!at) return `<span class="pill late">not sent back yet</span>`;
  if (!bits.length && !a.notes) return "<i>answered — nothing requested</i>";
  return `<div class="stack">${bits.length ? `<span>${bits.map(esc).join(" · ")}</span>` : ""}`
    + `${a.notes ? `<span class="said">${esc(a.notes)}</span>` : ""}`
    + `<span class="said">sent ${esc(fmtDate(String(at).slice(0, 10)).replace(/^\w+ /, ""))}</span></div>`;
}
const ALL_COSTS = [
  ["transport", "Transportation (ground/air)"],
  ["hotel", "Hotel / accommodation"],
  ["meals", "Meals (receipts required)"],
  ["other", "Other"],
];

/* ---------- review ---------- */
function reviewScreen(data) {
  const { event: ev, presenter: p, headshot } = data;
  const COSTS = ev.noTravel ? ALL_COSTS.filter(([k]) => k !== "transport") : ALL_COSTS;   // an RBH event has no travel
  const s = p.submission ?? {};
  const approved = p.status === "approved";
  BARRIGHT.innerHTML = `<button class="chip" id="back">Back to event</button>`;
  document.getElementById("back").onclick = () => { view = { name: "event", eventId: ev.id }; render(); };

  const consent = (row) => `${YN(s.media?.[row]?.internal)} internal · ${YN(s.media?.[row]?.public)} public`;
  const submission = `<div class="card">
    <div class="card-head"><div><h2>${esc(p.first)} ${esc(p.last)}</h2>
      <div class="s">${esc(p.organization || "")}${p.organization ? " · " : ""}${esc(p.email)}${s.phone ? " · " + esc(s.phone) : ""} · ${esc(p.reference)}</div></div>
      <div>${approved ? `<span class="pill done">Approved ${esc((p.approvedAt ?? "").slice(0, 10))}</span>` :
        p.status === "returned" ? `<span class="pill late">Sent back</span>` :
        p.status === "submitted" ? `<span class="pill wait">Submitted ${esc((p.submittedAt ?? "").slice(0, 10))}</span>` :
        p.openedAt ? `<span class="pill wait">Opened, not finished</span>` : `<span class="pill wait">Not opened</span>`}</div></div>
    <div class="card-body">
      ${p.status === "returned" && p.review?.returnNote ? `<div class="note"><b>Sent back${p.review.returnedBy ? " by " + esc(p.review.returnedBy) : ""}${p.review.returnedAt ? " on " + esc(fmtDate(p.review.returnedAt.slice(0, 10))) : ""}:</b> ${esc(p.review.returnNote)}${s.talk ? "" : " — the presenter hasn't re-submitted yet."}</div>` : ""}
      ${!s.talk ? `<div class="note">Nothing submitted yet — there is nothing to review until ${esc(p.first)} completes the form.</div>` : `
      <dl class="kv">
        <dt>Presentation</dt><dd>${esc(s.talk)}</dd>
        ${ev.noTravel ? "" : `<dt>Travel</dt><dd>${YN(s.travel)}${s.travel === "yes" ? ` — ${esc(fmtDate(s.travelFrom))} to ${esc(fmtDate(s.travelTo))}${approvedNote(p.review?.travel)}` : ""}</dd>`}
        <dt>Hotel</dt><dd>${YN(s.hotel)}${s.hotel === "yes" ? ` — ${esc(fmtDate(s.hotelFrom))} to ${esc(fmtDate(s.hotelTo))}${approvedNote(p.review?.hotel)}` : ""}</dd>
        <dt>Copyright</dt><dd>${s.copyright ? "Confirmed" : "Not confirmed"}</dd>
        <dt>Language</dt><dd>${p.language === "fr" ? "Français — their emails go out in French; the filed PDF is English" : "English"}</dd>
        ${s.wording >= 2 ? "" : `<dt>Good standing</dt><dd>${s.goodStanding ? "Confirmed — in good standing, no disciplinary proceedings or investigation" : "<b style=\"color:var(--late)\">Not confirmed</b> (submitted before this question existed)"}</dd>`}
        ${s.wording >= 2 ? `<dt>Investigation</dt><dd>${s.noInvestigation ? "Confirmed — not under a formal investigation or disciplinary proceedings" : "<b style=\"color:var(--late)\">Not confirmed</b>"}</dd>
        <dt>Presenter Terms</dt><dd>${s.termsAccepted ? "Read and agreed" : "<b style=\"color:var(--late)\">Not agreed</b>"}</dd>` : ""}
        <dt class="top">Room &amp; equipment</dt><dd>${avSummary(p.av, p.avAt)}</dd>
        <dt>Photographs</dt><dd>${consent("photo")}</dd>
        <dt>Materials</dt><dd>${consent("materials")}</dd>
        <dt>Summary</dt><dd>${consent("summary")}</dd>
        <dt>Community partners</dt><dd>${s.sensitive === "yes" ? `<b style="color:var(--late)">Has material they should not see</b> — follow up with the presenter before the event`
          : s.sensitive === "no" ? "Nothing they should not see" : "<i>not asked (signed before this question existed)</i>"}</dd>
        <dt class="top">Headshot</dt><dd>${headshot
          ? `<span class="shotcell"><img id="shot-img" alt=""><span class="porg">${esc(headshot.name)} (${Math.round(headshot.size / 1024)} KB) — this appears on the agreement</span></span>`
          : "<i>not uploaded — the agreement will have no photo</i>"}</dd>
        <dt>Signed</dt><dd><span class="script">${esc(s.signature)}</span> <span class="porg">(typed as “${esc(s.signature)}”)</span> · ${esc((s.signedAt ?? "").replace("T", " ").slice(0, 16))} UTC</dd>
      </dl>
      <div class="field" style="margin-top:14px"><label>Biography</label><div class="blurb">${s.bio ? esc(s.bio) : s.bioProvided ? "<i>The presenter ticked “Already provided to ONGIA”.</i>" : "<i>Not asked: on file with ONGIA for this event.</i>"}</div></div>
      <div class="field" style="margin-top:10px"><label>Outline</label><div class="blurb">${s.outline ? esc(s.outline) : s.outlineProvided ? "<i>The presenter ticked “Already provided to ONGIA”.</i>" : "<i>Not asked: on file with ONGIA for this event.</i>"}</div></div>`}
    </div></div>`;

  const covers = approved ? (p.review?.ongiaCovers ?? {}) : null;
  const costRows = COSTS.map(([k, label]) => {
    const agency = k === "hotel" && s.hotel !== "yes" ? "n/a" : s.expenses?.[k];
    const na = agency === "n/a";
    const checked = covers ? !!covers[k] : agency === "no";
    // A room is not a tick: the board member picks master block or own room under the hotel dates.
    const viaBlock = k === "hotel" && s.hotel === "yes" && !approved;
    const blockWas = approved && k === "hotel" && s.hotel === "yes" ? p.review?.hotel?.block : null;
    return `<div class="cost">
      <div>${esc(label)}${k === "other" && s.expenses?.otherText ? ` — ${esc(s.expenses.otherText)}` : ""}
        <div class="agency">Agency covering: <b>${YN(agency)}</b></div></div>
      ${viaBlock ? `<span class="agency" style="align-self:center">Choose below, under the hotel dates</span>`

  const decision = approved ? `<div class="card" style="margin-top:16px">

  : `<div class="card" style="margin-top:16px">

      <div class="field"><label for="r-note">Internal note</label>
        <textarea id="r-note" placeholder="Per board discussion 3 Dec…"></textarea>

      <div class="row2">
        <div class="field"><label for="r-name">Signing as</label>${data.signer
          ? `<input id="r-name" value="${esc(data.signer.name)}" readonly aria-readonly="true" style="background:var(--sunk)">
          <p class="hint">Your signature on the agreement is you, as signed in (${esc(data.signer.email)}). Someone else signs by signing in as themselves.</p>`
          : `<input id="r-name" value="${esc(sessionStorage.getItem("ongia-approver") || ev.reviewer?.name || "")}" placeholder="Andrew Hammond">

      <label class="attest"><input type="checkbox" id="r-attest"><span>${data.signer ? `Signing as ${esc(data.signer.name)} is my electronic signature.` : "My typed name is my electronic signature."} Approving issues the final PDF, emails it to the presenter, files it to SharePoint and notifies the board.</span></label>

  // On a computer the decision sits beside the submission, so Approve is never below a long biography (audit, 21 Oct 2026).

  }

  if (approved) {
    document.getElementById("pdf").onclick = () => openPdf(ev.id, p.id);
    const redo = (body, label) => async (e) => {

  // What the ticks add up to, in a sentence, right above the signature.
  const readback = () => {

      .map(([, l]) => l.split(" (")[0].toLowerCase());
    const blk = ROOT.querySelector('input[name="r-block"]:checked')?.value;

    }
    el.innerHTML = `<b>ONGIA will cover:</b> ${on.length ? esc(on.join(", ")) : "nothing"}.`
      + (dates.length ? `<br><b>Approved dates:</b> ${esc(dates.join(" · "))}.` : "")
      + (s.hotel === "yes" ? `<br><b>Hotel room:</b> ${blk === "master" ? "on ONGIA's master block" : blk === "own" ? "not on the master block, they pay their own" : "<span style=\"color:var(--late)\">not chosen yet</span>"}.` : "");
  };
  ROOT.querySelectorAll("[data-cover]").forEach((c) => c.addEventListener("change", readback));
  ROOT.querySelectorAll('input[name="r-block"]').forEach((c) => c.addEventListener("change", readback));
  // A second click on the chosen one clears it (Andrew 21 Oct 2026), so a wrong pick can be taken back, not only switched.
  ROOT.querySelectorAll('input[name="r-block"]').forEach((c) => {
    const was = () => { c.dataset.was = c.checked ? "1" : ""; };
    c.addEventListener("pointerdown", was);
    c.closest("label")?.addEventListener("pointerdown", was);
    c.addEventListener("keydown", (e) => { if (e.key === " ") was(); });
    c.addEventListener("click", () => {
      if (c.dataset.was === "1") { c.checked = false; c.dispatchEvent(new Event("change", { bubbles: true })); }
      c.dataset.was = "";
    });
  });
  ROOT.querySelectorAll("#r-tf, #r-tt, #r-hf, #r-ht").forEach((d) => d.addEventListener("change", readback));
  readback();

  document.getElementById("preview").onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = "Building…";

  };

  document.getElementById("approve").onclick = async (e) => {
    const problem = document.getElementById("problem");
    const covers = {};
    ROOT.querySelectorAll("[data-cover]").forEach((c) => { covers[c.dataset.cover] = c.checked && !c.disabled; });
    const dates = (key, f, t) => s[key] === "yes" ? { from: document.getElementById(f).value, to: document.getElementById(t).value } : undefined;
    const hotelBlock = ROOT.querySelector('input[name="r-block"]:checked')?.value;
    const body = {
      covers,
      hotelBlock,
      travel: dates("travel", "r-tf", "r-tt"),
      hotel: dates("hotel", "r-hf", "r-ht"),
      otherText: document.getElementById("r-other").value,
      note: document.getElementById("r-note").value,
      approverName: nameEl.value,

    if (s.hotel === "yes" && !hotelBlock) {
      document.getElementById("r-block").scrollIntoView({ block: "center", behavior: "smooth" });
      return (problem.innerHTML = `<div class="bad"><b>Choose how the hotel room is paid.</b> Pick "On ONGIA's master block" or "Not on the master block" under the hotel dates.</div>`);
    }
    // One confirmation (audit, 21 Oct 2026): the signature tick, with what you are approving shown right above the button.
    if (!body.attest) return (problem.innerHTML = `<div class="bad"><b>Please confirm</b> the electronic signature.</div>`);
    sessionStorage.setItem("ongia-approver", body.approverName);
    sessionStorage.setItem("ongia-approver-role", body.approverRole);
    e.target.disabled = true; e.target.textContent = "Issuing final copy…";
    try {
      await api(`/review?event=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(p.id)}&action=approve`,
        { method: "POST", body: JSON.stringify(body) });
      const next = (data.waiting ?? [])[0];
      toast(next ? `Approved. Final PDF issued. Next: ${next.name}.` : "Approved. Final PDF issued.");
      if (next) view = { name: "review", eventId: ev.id, presenterId: next.id };
      render();
    } catch (err) {
      problem.innerHTML = `<div class="bad"><b>Not approved.</b> ${esc(err.message)}</div>`;
      e.target.disabled = false; e.target.textContent = (data.waiting ?? []).length ? `Approve & open next (${data.waiting.length} left)` : "Approve & issue final";
    }
  };

  document.getElementById("return").onclick = async (e) => {
    const note = document.getElementById("r-return").value.trim();
    if (!note) return toast("Say what needs changing first.");
    if (!confirm(`Send this back to ${p.first} with your note?`)) return;
    e.target.disabled = true;
    try {
      await api(`/review?event=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(p.id)}&action=return`,
        { method: "POST", body: JSON.stringify({ note, approverName: nameEl.value }) });
      toast("Sent back to the presenter.");
      view = { name: "event", eventId: ev.id }; render();
    } catch (err) { toast(err.message); e.target.disabled = false; }
  };
}

    ${row("Hotel", s.hotel === "yes", s.hotelFrom, s.hotelTo, "r-hf", "r-ht", "Check-in", "Check-out")}

function deliveryMarkup(d = {}) {
  const line = (label, r) => {
    if (!r) return `<div class="stat"><span class="dot"></span><div>${label}<small>not attempted</small></div></div>`;
    const cls = r.ok ? "ok" : r.skipped ? "skip" : "err";
    const detail = r.ok
      ? (r.folderUrl ? `<a href="${esc(r.folderUrl)}" target="_blank" rel="noopener">Open folder</a> · ${(r.files ?? []).map((f) => esc(f.name)).join(", ")}` : `sent ${esc((r.at ?? "").replace("T", " ").slice(0, 16))} UTC`)
      : esc(r.reason ?? r.error ?? "failed");
    return `<div class="stat ${cls}"><span class="dot"></span><div>${label}<small>${detail}</small></div></div>`;
  };
  return line("Final copy emailed to the presenter", d.presenterEmail) +
    line("Filed to SharePoint", d.filing) +
    line("Board notified", d.boardEmail);
}

/* ---------- Back: every screen is a step in the browser's history ---------- */
let NAV_POP = false, NAV_FIRST = true;
// The home page keeps a plain address; every other screen carries itself in the hash.
const viewHash = (v) => v.name === "list" ? "" : "#v=" + encodeURIComponent(JSON.stringify(v, (k, x) => (x !== null && typeof x === "object" && k !== "" ? undefined : x)));
const parseViewHash = (h) => { if (!String(h).startsWith("#v=")) return null; try { const v = JSON.parse(decodeURIComponent(h.slice(3))); return v && typeof v.name === "string" ? v : null; } catch { return null; } };
function syncHistory() {
  const h = viewHash(view);
  if (NAV_POP) { NAV_POP = false; return; }
  if (location.hash === h) { NAV_FIRST = false; return; }
  // The first screen replaces the entry the page opened with; every later one is a new step.
  try { (NAV_FIRST ? history.replaceState : history.pushState).call(history, null, "", location.pathname + location.search + h); } catch { /* a sandboxed frame has no history */ }
  NAV_FIRST = false;
}
window.addEventListener("popstate", () => {
  const v = parseViewHash(location.hash) ?? (location.hash === "" ? { name: "list" } : null);
  if (!v) return;
  view = v; NAV_POP = true; render();
});

/* ---------- render ---------- */
let SCREEN_AT = "";
async function render() {
  if (!KEY) return signInScreen();
  syncHistory();
  // A different screen starts at the top; redrawing the same one (after a save or a send) keeps your place.
  const screenKey = `${view.name}|${view.eventId ?? ""}|${view.presenterId ?? ""}`;
  const keepY = screenKey === SCREEN_AT ? window.scrollY : null;   // a redraw after adding or saving stays where you were
  if (screenKey !== SCREEN_AT) { SCREEN_AT = screenKey; try { window.scrollTo(0, 0); } catch { /* no window */ } }
  try { return await drawScreen(); }
  finally { if (keepY !== null) requestAnimationFrame(() => { try { window.scrollTo(0, keepY); } catch { /* no window */ } }); }
}
async function drawScreen() {
  ROOT.classList.remove("ro");   // a view-only page's dimming goes with it
  whoami();
  try {

      eventFormScreen(data);

        if (d) d.open = true;

    }

      const B = await api("/backups").catch(() => null);

    if (view.name === "sponsors" && SPONSORS_ON) {

    if (view.name === "add") return addScreen(view.eventId);
    if (view.name === "event") {
      const [data, materials, checklist, guests, rooming, contract, agenda, inbox, list, volunteers, sheetcheck] = await Promise.all([
        api(`/events?id=${encodeURIComponent(view.eventId)}`),

        EMAIL_ON ? api("/events").catch(() => ({ events: [] })) : null,   // every event, only for filing email to another event
        api(`/volunteers?event=${encodeURIComponent(view.eventId)}`).catch(() => null),
        api(`/sheetcheck?event=${encodeURIComponent(view.eventId)}`).catch(() => null),   // the sheet check: refused (so hidden) for anyone but the president and the VP
        loadRoster(),   // the board, for the volunteer lead picker
      ]);
      CHECKLIST = checklist;       // set before drawing: the hotel line reads it too
      // An RBH event's costing is for the president and the VP: anyone else is refused, so the section stays hidden.
      const sow = data.event?.kind === "rbh" ? await api(`/sow?event=${encodeURIComponent(view.eventId)}`).catch(() => null) : null;
      // Receipts: the president, the VP and the board members on the event; anyone else is refused, so it stays hidden.
      const receipts = data.event?.kind === "rbh" ? await api(`/receipts?event=${encodeURIComponent(view.eventId)}`).catch(() => null) : null;
      const out = eventScreen({ ...data, sow, receipts, materials, checklist, guests, rooming, contract, agenda, inbox, volunteers, sheetcheck, allEvents: list?.events ?? [] });
      freshen(view.eventId, { guests, materials, event: data.event, canEdit: data.canEdit });

    }
    if (view.name === "unfiled" && EMAIL_ON) {
      const [inbox, list] = await Promise.all([api("/inbox?event=_unfiled").catch(() => null), api("/events")]);
      return unfiledScreen(inbox, list.events ?? []);
    }
    if (view.name === "review") {
      const [rv, evd] = await Promise.all([api(`/review?event=${encodeURIComponent(view.eventId)}&presenter=${encodeURIComponent(view.presenterId)}`),
        api(`/events?id=${encodeURIComponent(view.eventId)}`).catch(() => null)]);
      return reviewScreen({ ...rv, waiting: (evd?.presenters ?? []).filter((x) => x.status === "submitted" && x.id !== view.presenterId).map((x) => ({ id: x.id, name: `${x.first} ${x.last}`.trim() })) });
    }
    const list = await api("/events");
    return listScreen(list.events, list.inbox);
  } catch (e) {
    if (/not auth|ADMIN_KEY|sign in again/i.test(e.message)) { signOut(); try { localStorage.removeItem("ongia-ms-pick"); } catch {} return signInScreen(e.message); }
    BARRIGHT.innerHTML = `<button class="chip" id="home">All events</button>`;
    document.getElementById("home").onclick = () => { view = { name: "list" }; render(); };
    ROOT.innerHTML = `<div class="card"><div class="card-body"><div class="bad"><b>Something went wrong.</b> ${esc(e.message)}</div></div></div>`;
  }
}

  if (e) { view = { name: "event", eventId: decodeURIComponent(e[1]) }; history.replaceState(null, "", location.pathname); }
}
{ const v = parseViewHash(location.hash); if (v && !location.hash.startsWith("#review") ) { view = v; NAV_FIRST = true; } }
window.addEventListener("hashchange", () => {

  signInScreen(done);

// A tab left open for days keeps running old code and shows old wording. When the tab
// comes back into view, compare the served page's ETag with the one we loaded.
{
  let etag = null;
  const check = async () => {
    try {
      const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
      const tag = r.headers.get("etag");
      if (!tag) return;
      if (etag === null) { etag = tag; return; }
      if (tag !== etag && !document.getElementById("reloadbar")) {
        const bar = document.createElement("button"); bar.id = "reloadbar"; bar.className = "reloadbar"; bar.type = "button";
        bar.textContent = "This page has been updated. Tap to reload.";
        bar.onclick = () => location.reload();
        document.body.append(bar);
      }
    } catch { /* offline or blocked: nothing to do */ }
  };
  check();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
  setInterval(check, 10 * 60 * 1000);
}
