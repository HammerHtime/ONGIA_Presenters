      const out = await api(`/events?id=${encodeURIComponent(ev.id)}&folder=1`, { method: "POST" });
      toast(`Folder ready: ${out.folder.path}`); render();
    } catch (e) { toast(e.message); mk.disabled = false; mk.textContent = "Create it in SharePoint"; }
  };
  document.getElementById("delevent").onclick = async () => {
    const approved = presenters.filter((p) => p.status === "approved").length;
    const msg = `Delete "${ev.title}" and its ${presenters.length} presenter${presenters.length === 1 ? "" : "s"} from the desk?\n\n` +
      (approved ? `${approved} final PDF${approved === 1 ? " is" : "s are"} already filed in SharePoint and will stay there. ` : "") +
      `Presenter links stop working immediately. This cannot be undone.`;
    if (!confirm(msg)) return;
    if (prompt(`Type the city to confirm: ${ev.city}`) !== ev.city) return toast("Not deleted — city didn't match.");
    try { await api(`/events?id=${encodeURIComponent(ev.id)}`, { method: "DELETE" }); toast("Event deleted."); view = { name: "list" }; render(); }
    catch (e) { toast(e.message); }
  };
  const pedit = document.getElementById("pedit");
  pedit?.addEventListener("close", async () => {
    if (pedit.returnValue !== "save") return;
    const id = pedit.dataset.presenter;
    const body = {
      first: document.getElementById("pe-first").value.trim(),
      last: document.getElementById("pe-last").value.trim(),
      email: document.getElementById("pe-email").value.trim(),
      organization: document.getElementById("pe-org").value.trim(),
    };
    try {
      const out = await api(`/events?id=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(id)}`,
        { method: "PUT", body: JSON.stringify(body) });
      toast(out.emailChanged ? `Corrected — their link now goes to ${out.presenter.email}.` : "Corrected.");
      render();
    } catch (e) { toast(e.message); }
  });

  // Someone who signed: two steps (a reason, then type DELETE), because a signed agreement is a record. A signed one can go
  // too (a presenter called to court, or one ONGIA no longer wants); its copy stays in SharePoint. Someone who never
  // signed: one "are you sure?" (audit, 21 Oct 2026).
  const peRemove = document.getElementById("pe-remove");
  if (peRemove) peRemove.onclick = async () => {
    const p = presenters.find((x) => x.id === pedit.dataset.presenter);
    if (!p) return;
    const name = `${p.first} ${p.last}`.trim();
    const final = p.status === "approved";
    const prm = document.getElementById("prm"), go = document.getElementById("prm-go"), typed = document.getElementById("prm-confirm");
    pedit.close();
    const signed = ["submitted", "approved", "returned"].includes(p.status);
    document.getElementById("prm-title").textContent = `Remove ${name}?`;
    document.getElementById("prm-what").textContent = signed
      ? `Their agreement link stops working and they come off this event${final ? ". Their signed agreement stays in SharePoint." : "."}`
      : `${name} never signed, so there is no agreement on file. Their link stops working and they come off this event.`;
    document.getElementById("prm-full").hidden = !signed;
    document.getElementById("prm-why").value = ""; typed.value = ""; go.disabled = signed;
    // The button wakes only once DELETE is typed: the second step.
    typed.oninput = () => { go.disabled = typed.value.trim().toUpperCase() !== "DELETE"; };
    prm.returnValue = "";
    prm.onclose = async () => {
      if (prm.returnValue !== "remove" || (signed && typed.value.trim().toUpperCase() !== "DELETE")) return;
      try {
        await api(`/events?id=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(p.id)}${final ? "&final=1" : ""}`,
          { method: "DELETE", body: JSON.stringify({ reason: document.getElementById("prm-why").value }) });
        toast(`${name} removed.`); render();
      } catch (e) { toast(e.message); }
    };
    prm.showModal();
    if (signed) document.getElementById("prm-why").focus(); else go.focus();
  };
  // The presenter buttons, on the table and in the side panel: wired for the whole page, and again for the panel alone
  // when it opens (it is redrawn on its own, not with the page).
  function wireActs(root) {
    root.querySelectorAll("[data-called]").forEach((b) => {
      b.onclick = async () => {
        b.disabled = true; b.textContent = "Saving…";
        try {
          await api(`/invite?id=${encodeURIComponent(ev.id)}&called=1`, { method: "POST", body: JSON.stringify({ presenterIds: [b.dataset.called] }) });
          toast("Call logged. Automatic reminders pause for a week.");
          render();
        } catch (e) { toast(e.message); b.disabled = false; b.textContent = "Called them"; }
      };
    });
    root.querySelectorAll("[data-refile]").forEach((b) => {
      b.onclick = async () => {
        b.disabled = true; b.textContent = "Filing…";
        try {
          const out = await api(`/review?event=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(b.dataset.refile)}&action=redeliver`, { method: "POST", body: JSON.stringify({ all: false }) });
          toast(out.delivery?.filing?.ok ? "Filed to SharePoint." : `Still failing: ${out.delivery?.filing?.error ?? out.delivery?.filing?.reason ?? "unknown"}`);
          render();
        } catch (e) { toast(e.message); b.disabled = false; b.textContent = "Retry filing"; }
      };
    });
    root.querySelectorAll("[data-mat]").forEach((b) => {
      b.onclick = async () => {
        b.disabled = true;
        try {
          const out = await api(`/materials?event=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(b.dataset.mat)}`,
            { method: "POST", body: JSON.stringify({ [b.dataset.key]: b.dataset.on === "1" }) });
          eventScreen({ ...data, materials: out });
        } catch (e) { toast(e.message); b.disabled = false; }
      };
    });
    root.querySelectorAll("[data-edit]").forEach((b) => {
      b.onclick = () => {
        const p = presenters.find((x) => x.id === b.dataset.edit);
        if (!p) return;
        pedit.dataset.presenter = p.id;
        document.getElementById("pe-first").value = p.first ?? "";
        document.getElementById("pe-last").value = p.last ?? "";
        document.getElementById("pe-email").value = p.email ?? "";
        document.getElementById("pe-org").value = p.organization ?? "";
        // Say up front what a correction will and won't reach.
        const sent = (p.mail ?? []).some((m) => m.type !== "called");
        document.getElementById("pe-warn").innerHTML =
          p.status === "approved"
            ? `<div class="note" style="margin-top:14px">This agreement is already final and filed. Correcting it here does not
               change the PDF in SharePoint — use <b>Rebuild the PDF</b> on their details screen if the document itself is wrong.</div>`
            : sent
              ? `<div class="note" style="margin-top:14px">Their link has already been emailed to the old address. After saving,
                 use <b>Email link</b> on their row to send it to the corrected one.</div>`
              : "";
        pedit.showModal();
        document.getElementById("pe-email").focus();
      };
    });
    root.querySelectorAll("[data-invite]").forEach((b) => { b.onclick = () => invite(ev.id, [b.dataset.invite], b.textContent === "Remind"); });
    root.querySelectorAll("[data-pdf]").forEach((b) => { b.onclick = () => openPdf(ev.id, b.dataset.pdf); });
    root.querySelectorAll("[data-copy]").forEach((b) => {
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; }
        catch { prompt("Copy this link:", b.dataset.copy); }
        setTimeout(() => (b.textContent = "Copy link"), 1600);
      };
    });
    root.querySelectorAll("[data-review]").forEach((b) => {
      b.onclick = () => { view = { name: "review", eventId: ev.id, presenterId: b.dataset.review }; render(); };
    });
  }
  wireActs(ROOT);
}

/* ---------- the desk's own checklist ---------- */

/** "120 days before day one" / "21 days after" / "on day one". */
function offsetWords(n) {
  if (!Number.isFinite(n)) return "no date yet";
  if (n === 0) return "on day one";
  return n > 0 ? `${n} day${n === 1 ? "" : "s"} before` : `${-n} day${n === -1 ? "" : "s"} after it ends`;
}

/**
 * The standard list has moved on since this event's list was made: say what
 * updating would do, job by job, before Andrew presses anything.
 */
function behindNote(b) {
  if (!b?.any) return "";
  const lines = [];
  if (b.added.length) lines.push(`<b>Adds</b> ${b.added.map(esc).join(" · ")}`);
  if (b.renamed.length) lines.push(`<b>Renames</b> ${b.renamed.map((r) => `${esc(r.from)} → ${esc(r.to)}`).join(" · ")}`);
  if (b.removed.length) lines.push(`<b>Takes off</b> ${b.removed.map(esc).join(" · ")} <span class="porg">(not for this kind of event, and not started)</span>`);
  if (b.dated?.length) lines.push(`<b>Gives dates to</b> ${b.dated.map((d) => `${esc(d.what)} (${esc(d.when)})`).join(" · ")}`);
  if (b.reordered) lines.push(`<b>Puts the jobs in order</b>, the order they get done`);
  return `<div class="note" style="margin:0 0 14px">
    <div style="margin-bottom:6px">The standard checklist has changed since this list was made. Updating:</div>
    <ul style="margin:0 0 10px;padding-left:20px">${lines.map((l) => `<li style="margin:0 0 3px">${l}</li>`).join("")}</ul>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="mini gold" id="jsync">Update this list</button>
      <span class="porg">Ticks, dates and "not needed" marks stay as they are.</span></div></div>`;
}

/**
 * The jobs that are ONGIA's. Drawn as its own card under the event so it is
 * never confused with what the presenters owe.
 */
function checklistCard(ev, checklist) {
  if (!checklist) {
    return `<div class="card"><div class="card-head"><div><h2>Your checklist</h2></div></div>
      <div class="card-body"><div class="bad"><b>The checklist could not be loaded.</b> Reload the page.</div></div></div>`;
  }
  const { tasks, counts } = checklist;
  // One focus in a long list: the nearest job that is not already late. The
  // late ones are red already and do not need a second mark.
  const nextId = tasks.find((t) => !t.done && !t.na && !t.late)?.id ?? null;

  // Finished jobs sink to the bottom (Andrew 21 Oct 2026), so what is left to do is at the top; not-needed ones go last.
  const ordered = [...tasks.filter((t) => !t.done && !t.na), ...tasks.filter((t) => t.done && !t.na), ...tasks.filter((t) => t.na)];
  const rows = ordered.map((t) => {
    const when = t.na
      ? `<span>not needed for this one</span>`
      : t.scheduled
        ? `<b>${esc(t.dueReadable.replace(/^\w+ /, ""))}</b><span>${esc(t.when ?? offsetWords(t.daysBefore))}${t.late ? ` · ${-t.days} day${t.days === -1 ? "" : "s"} ago` : ""}</span>`
        : t.waiting === "cutoff"
          ? `<b class="nodate">Waits for the hotel cut-off</b><span>${esc(t.when)}; add the cut-off under hotel details</span>`
          : `<b class="nodate">No date yet</b><span>set one on Edit</span>`;
    return `<div class="job${t.na ? " na" : t.done ? " done" : t.late ? " late" : ""}${t.id === nextId ? " next" : ""}">
      <input type="checkbox" data-tick="${esc(t.id)}"${t.done ? " checked" : ""}${t.na ? " disabled" : ""} aria-label="${esc(t.what)}">
      <div class="what">${esc(t.what)}${t.auto ? `<span class="auto" title="The desk sends this one — you do not have to">sends itself</span>` : ""}</div>
      <div class="when">${when}</div>
      <div class="jact"><button data-jna="${esc(t.id)}" data-was="${t.na ? "1" : "0"}" title="${t.na ? "Put this job back on the event" : "This event does not need this job"}">${t.na ? "Put back" : "Not needed"}</button>
        <button data-jedit="${esc(t.id)}" title="Change the wording or the date">Edit</button>
        <button data-jdel="${esc(t.id)}" title="Remove this job for good" aria-label="Remove ${esc(t.what)}">&#10005;</button></div>
    </div>`;
  }).join("");

  const summary = counts.total || counts.na
    ? `<span class="chipstat${counts.total && counts.done === counts.total ? " good" : ""}"><b>${counts.done}<small>/${counts.total}</small></b>done</span>`
      + (counts.late ? `<span class="chipstat stop"><b>${counts.late}</b>overdue</span>` : "")
      + (counts.soon ? `<span class="chipstat hot"><b>${counts.soon}</b>in the next two weeks</span>` : "")
      + (counts.undated ? `<span class="chipstat"><b>${counts.undated}</b>with no date yet</span>` : "")
      + (counts.na ? `<span class="chipstat"><b>${counts.na}</b>not needed</span>` : "")
    : "";

  const line = !tasks.length ? "Nothing on the list yet"
    : [`${counts.done} of ${counts.total} done`, counts.undated ? `${counts.undated} with no date yet` : "", counts.na ? `${counts.na} not needed` : ""].filter(Boolean).join(" · ");
  const badge = [counts.late ? `<span class="late">${counts.late} overdue</span>` : "", counts.soon ? `<span class="chase">${counts.soon} due in 2 weeks</span>` : ""].filter(Boolean).join(" · ");
  return secFold("tasks", "Your checklist", line, badge, `
    <div class="card-head"><div>
      <div class="s">What ONGIA owes this event, not what the presenters owe, in the order the jobs get done. Every date counts back from day one, so moving the training moves the list.</div>
      <div class="jobsum" style="margin-top:8px">${summary}</div></div>
      <div class="cardacts"><button class="mini jobadd" id="jadd">Add a job</button>
        ${tasks.length ? "" : `<button class="mini jobadd" id="jseed">Use the standard list</button>`}</div></div>
    <div class="card-body">
      ${tasks.length ? behindNote(checklist.behind) : ""}
      ${tasks.length ? `<div class="jobs">${rows}</div>` : `<div class="empty">Nothing on the list yet.</div>`}
      <p class="hint jobadd">The standard list new events start from is on <b>The year</b> screen.</p>
    </div>`);
}

/** Ticking, adding, changing and removing — each one writes and redraws. */
function wireChecklist(ev) {
  const send = async (path, init) => {
    try { await api(path, init); render(); }
    catch (e) { toast(e.message); render(); }
  };
  ROOT.querySelectorAll("[data-tick]").forEach((box) => {
    box.onchange = () => send(`/tasks?event=${encodeURIComponent(ev.id)}&id=${encodeURIComponent(box.dataset.tick)}`,
      { method: "PUT", body: JSON.stringify({ done: box.checked }) });
  });
  ROOT.querySelectorAll("[data-jna]").forEach((b) => {
    b.onclick = () => send(`/tasks?event=${encodeURIComponent(ev.id)}&id=${encodeURIComponent(b.dataset.jna)}`,
      { method: "PUT", body: JSON.stringify({ na: b.dataset.was !== "1" }) });
  });
  ROOT.querySelectorAll("[data-jdel]").forEach((b) => {
    b.onclick = () => {
      if (!confirm("Remove this job from the checklist?")) return;
      send(`/tasks?event=${encodeURIComponent(ev.id)}&id=${encodeURIComponent(b.dataset.jdel)}`, { method: "DELETE" });
    };
  });

  const dlg = document.getElementById("jobdlg");
  if (!dlg) return;
  let editing = null;
  const fill = (task) => {
    editing = task?.id ?? null;
    document.getElementById("jd-title").textContent = task ? "Change this job" : "Add a job";
    document.getElementById("j-what").value = task?.what ?? "";
    // An undated job shows an empty box, never 0: 0 means "on day one", and a
    // save to fix the wording would quietly give it that date.
    document.getElementById("j-days").value = Number.isFinite(task?.daysBefore) ? Math.abs(task.daysBefore) : "";
    document.getElementById("j-when").value = task?.from === "cutoff" ? "cutoff" : task && task.daysBefore < 0 ? "after" : "before";
    document.getElementById("j-why").textContent = "";
  };
  document.getElementById("jadd").onclick = () => { fill(null); dlg.showModal(); document.getElementById("j-what").focus(); };
  const seed = document.getElementById("jseed");
  if (seed) seed.onclick = () => send(`/tasks?event=${encodeURIComponent(ev.id)}&seed=1`, { method: "POST" });
  const sync = document.getElementById("jsync");
  if (sync) sync.onclick = async () => {
    sync.disabled = true;
    try {
      const out = await api(`/tasks?event=${encodeURIComponent(ev.id)}&sync=1`, { method: "POST" });
      const c = out.changes ?? {};
      const said = [c.added?.length ? `${c.added.length} added` : "", c.renamed?.length ? `${c.renamed.length} renamed` : "",
        c.removed?.length ? `${c.removed.length} taken off` : "", c.dated?.length ? `${c.dated.length} given a date` : ""].filter(Boolean);
      toast(`Checklist updated${said.length ? `: ${said.join(", ")}` : ""}.`);
    } catch (e) { toast(e.message); }
    render();
  };
  ROOT.querySelectorAll("[data-jedit]").forEach((b) => {
    b.onclick = () => { fill((data_checklist()?.tasks ?? []).find((t) => t.id === b.dataset.jedit)); dlg.showModal(); };
  });

  document.getElementById("j-save").onclick = async (e) => {
    e.preventDefault();
    const what = document.getElementById("j-what").value.trim();
    const raw = document.getElementById("j-days").value.trim();
    const n = Number(raw);
    const why = document.getElementById("j-why");
    if (!what) { why.textContent = "What is the job?"; return; }
    // Blank is allowed: most jobs are done in order, not by a date.
    if (raw !== "" && !Number.isFinite(n)) { why.textContent = "That is not a number of days. Leave it empty if there is no date yet."; return; }
    const from = document.getElementById("j-when").value;
    const daysBefore = raw === "" ? null : from === "after" ? -Math.abs(n) : Math.abs(n);
    const body = JSON.stringify({ what, daysBefore, from: from === "cutoff" ? "cutoff" : "" });
    dlg.close();
    await send(editing
      ? `/tasks?event=${encodeURIComponent(ev.id)}&id=${encodeURIComponent(editing)}`
      : `/tasks?event=${encodeURIComponent(ev.id)}`, { method: editing ? "PUT" : "POST", body });
  };
}

/** Saved letters, fetched before the event form draws so it can offer them. */
let LETTER_CHOICES = [];
const loadLetterChoices = async () => { LETTER_CHOICES = (await api("/letters").catch(() => ({ letters: [] }))).letters ?? []; };

/** Same rule as the server: a letter with "only for" words fits an event whose title has them as whole words. */
const squash = (s) => String(s ?? "").toLowerCase().replace(/\s+/g, " ").trim();
const letterFits = (l, title) => {
  const words = squash(l.onlyFor);
  return !words || new RegExp(`(^|[^a-z0-9])${words.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}($|[^a-z0-9])`).test(squash(title));
};

/**
 * The choices for one letter box on the event form: the letters that fit this
 * title. One already chosen that no longer fits — the event was renamed — stays
 * in the list, marked, so a save never quietly swaps it for something else.
 */
function letterOptions(kind, title, chosen) {
  const mine = LETTER_CHOICES.filter((l) => (kind === "survey") === (l.kind === "survey"));
  return `<option value="">None — don't send one</option>` + mine
    .filter((l) => letterFits(l, title) || l.id === chosen)
    .map((l) => `<option value="${esc(l.id)}"${l.id === chosen ? " selected" : ""}>${esc(l.name)}${
      !letterFits(l, title) ? ` (only for ${esc(l.onlyFor)} events)` : l.problems?.length ? " (needs attention)" : ""}</option>`).join("");
}

/**
 * What the last import or pull said. The card redraws when it finishes, which
 * used to wipe the message before anyone could read it — so it survives one
 * redraw and is cleared on the next visit to the screen.
 */
let GUEST_NOTE = null;

const GUEST_WORDS = {
  ATTENDING: ["done", "coming"],
  NOT_ATTENDING: ["idle", "not coming"],
  IN_WAITLIST: ["wait", "waitlist"],
  WITHDRAWN: ["late", "withdrawn"],
};
const SHOW_GUESTS = 25;
let GCUT_ON = "coming";   // the "Who's coming" table's cut, kept through redraws
let GFIND = "";

/**
 * Hotel rooms: the rooming list, from the agreements and from anyone added by
 * hand. Ticked rows are what the email and the spreadsheet carry; rows not yet
 * approved start unticked, because their dates may still change.
 */
const BILL = { ONGIA: ["ongia", "ONGIA pays"], Guest: ["", "pays"], "To confirm": ["tbc", "to confirm"] };
let RG_OPEN = false;   // "Add people by hand" stays open while people are being added
const shortDate = (iso) => fmtDate(iso).replace(/ \d{4}$/, "");
let ROOMING = null;

function hotelStrip(ev, C) {
  const h = ev.hotel ?? {};
  // The job counted from the cut-off — names to the hotel — said next to it.
  const namesDue = () => {
    const j = (CHECKLIST?.tasks ?? []).find((t) => t.from === "cutoff" && !t.na);
    if (!j || !j.due) return "";
    return j.done ? `names sent ✓` : `<span${j.late ? ' style="color:var(--late)"' : ""}>names due ${esc(fmtDate(j.due))}</span>`;
  };
  const bits = [
    h.name ? `<b>${esc(h.name)}</b>` : `<span style="color:var(--muted)">No hotel set yet</span>`,
    h.cutoff ? `cut-off ${esc(fmtDate(h.cutoff))}` : "",
    namesDue(),
    h.foodAndBev ? `food and beverage numbers ${esc(fmtDate(h.foodAndBev))}` : "",
  ].filter(Boolean);
  const read = C?.read, file = C?.file;
  // On an RBH event the contract, its rates and its terms are for the president and the VP: the lead sees the
  // hotel, the contact and the dates, and nothing about the contract itself.
  if (ev.hotelCostsHidden) return `<div class="hstrip"><div class="hs-what">${bits.join(" · ")}</div>
    <div class="hs-acts"><button class="mini ghost" data-hgo="hotel">Edit hotel details</button></div></div>`;
  const contract = !file ? "No contract uploaded"
    : read?.state === "reading" ? `<span class="spin" aria-hidden="true" style="width:12px;height:12px"></span>Claude is reading ${esc(file.name)}…`
    : read?.state === "done" ? `Contract read ${esc(fmtDate(read.at.slice(0, 10)))}`
    : `Contract on file`;
  return `<div class="hstrip"><div class="hs-what">${bits.join(" · ")}<div class="hs-ct">${contract}</div></div>
    <div class="hs-acts"><button class="mini" data-hgo="contract">${file ? "Hotel contract" : "Upload the hotel contract"}</button>
      <button class="mini ghost" data-hgo="hotel">Edit hotel details</button></div></div>`;
}

/** Names compared the way the server compares them: case, accents and spacing do not count. */
const sameName = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]+/g, " ").trim();

/** Who a room is for — the same four the server takes, in Andrew's order. */
// "Other" is a comped room for another association, a dignitary and so on; it always says who they are (the note).
const GUEST_TYPES = ["Board Member", "Presenter", "Volunteer", "ONGIA Guest", "Other"];

/**
 * The only dates offered for a guest's room: three days before the training to
 * three days after it. A check-in can't be the last of them, nor a check-out
 * the first. Nothing is picked until Andrew picks it.
 */
function guestDays(win, end, ev, chosen = "") {
  if (!win) return `<option value="">Set the training dates first</option>`;
  const days = [];
  for (let d = win.from; d <= win.to; d = new Date(Date.parse(d) + 86400000).toISOString().slice(0, 10)) days.push(d);
  const offer = end === "in" ? days.slice(0, -1) : days.slice(1);
  // The training days stand out in the list: grouped under their own heading
  // and labelled, which every browser shows (a Mac will not colour a menu item;
  // where a browser will, they are red as well).
  const first = ev?.dayOne, last = ev?.lastDay && ev.lastDay >= ev.dayOne ? ev.lastDay : ev?.dayOne;
  const n = (d) => Math.round((Date.parse(d) - Date.parse(first)) / 86400000) + 1;
  const opt = (d) => {
    const training = first && d >= first && d <= last;
    return `<option value="${d}"${d === chosen ? " selected" : ""}${training ? ' style="color:#b3261e;font-weight:700"' : ""}>${esc(fmtDate(d))}${training ? ` · training day ${n(d)}` : ""}</option>`;
  };
  const group = (label, list) => (list.length ? `<optgroup label="${label}">${list.map(opt).join("")}</optgroup>` : "");
  // A date saved earlier that is outside today's window is still shown, so an edit never quietly changes it.
  const stray = chosen && !offer.includes(chosen) ? `<option value="${chosen}" selected>${esc(fmtDate(chosen))} (outside the window)</option>` : "";
  return `<option value=""${chosen ? "" : " selected"}>Pick a date</option>${stray}`
    + group("Before the training", offer.filter((d) => first && d < first))
    + group("Training days", offer.filter((d) => first && d >= first && d <= last))
    + group("After the training", offer.filter((d) => first && d > last));
}

/** Board members picked for this event who are not on the rooming list at all, by any route. */
function boardNoRoom(ev, R) {
  const listed = (R.rows ?? []).map((r) => sameName(r.name)).concat((R.waiting ?? []).map((w) => sameName(w.name)));
  const seen = new Set();
  return (ev.board ?? []).map((m) => String(m.name ?? "").trim()).filter((n) => {
    const k = sameName(n);
    if (!k || seen.has(k) || listed.includes(k)) return false;
    seen.add(k);
    return true;
  });
}

const noRoom = (ev, R) => {
  const names = boardNoRoom(ev, R);
  if (!names.length) return "";
  return `<div class="noroom" id="rg-noroom"><b>Board members on this event with no room yet</b>
    ${names.map((n) => `<div class="nr"><span>${esc(n)}</span><button type="button" class="mini" data-addboard="${esc(n)}">Add to hotel list</button></div>`).join("")}
    <p class="hint" style="margin:8px 0 0">Add fills in their name; you pick the nights and press Add. Skip anyone who is not staying.</p></div>`;
};

/**
 * Read an .xlsx in the browser (it is a zip of XML) and hand back the first sheet that has the
 * logistics headings as rows of text. Only that sheet's cells leave the browser; the server keeps
 * just the name, agency and night columns.
 */
async function readLogisticsXlsx(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("That isn't an Excel (.xlsx) file.");
  const entries = {};
  let p = dv.getUint32(eocd + 16, true);
  for (let n = dv.getUint16(eocd + 10, true); n > 0; n--) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    entries[new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nlen))] = { method, csize, off };
    p += 46 + nlen + xlen + clen;
  }
  const read = async (name) => {
    const e = entries[name];
    if (!e) return null;
    const start = e.off + 30 + dv.getUint16(e.off + 26, true) + dv.getUint16(e.off + 28, true);
    const raw = buf.subarray(start, start + e.csize);
    if (e.method === 0) return new TextDecoder().decode(raw);
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new TextDecoder().decode(await new Response(stream).arrayBuffer());
  };
  const xml = async (name) => { const t = await read(name); return t ? new DOMParser().parseFromString(t, "application/xml") : null; };
  const shared = [];
  const ss = await xml("xl/sharedStrings.xml");
  if (ss) for (const si of ss.getElementsByTagName("si")) shared.push([...si.getElementsByTagName("t")].filter((t) => t.parentNode.nodeName !== "rPh").map((t) => t.textContent).join(""));
  const wb = await xml("xl/workbook.xml"), rels = await xml("xl/_rels/workbook.xml.rels");
  if (!wb || !rels) throw new Error("That isn't an Excel (.xlsx) file.");
  const target = new Map([...rels.getElementsByTagName("Relationship")].map((r) => [r.getAttribute("Id"), r.getAttribute("Target")]));
  const col = (ref) => [...ref.replace(/\d+$/, "")].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;
  for (const sh of wb.getElementsByTagName("sheet")) {
    const t = target.get(sh.getAttribute("r:id") ?? sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id"));
    const doc = t && (await xml(`xl/${t.replace(/^\/?(xl\/)?/, "")}`));
    if (!doc) continue;
    const rows = [];
    for (const row of doc.getElementsByTagName("row")) {
      const r = +row.getAttribute("r") - 1;
      if (r > 400) break;
      const cells = (rows[r] = []);
      for (const c of row.getElementsByTagName("c")) {
        const i = col(c.getAttribute("r")), type = c.getAttribute("t");
        const v = c.getElementsByTagName("v")[0]?.textContent ?? "";
        cells[i] = type === "s" ? shared[+v] ?? "" : type === "inlineStr" ? [...c.getElementsByTagName("t")].map((x) => x.textContent).join("") : v;
      }
    }
    const grid = Array.from(rows, (r) => Array.from(r ?? [], (c) => c ?? ""));
    const headed = grid.slice(0, 12).some((r) => r.some((c) => /^presenter\b/i.test(c)) && r.filter((c) => /sunday|monday|tuesday|wednesday|thursday/i.test(c)).length >= 3);
    if (headed) {
      // Keep only what is compared: the heading row's Presenter and Agency columns and the
      // Sunday-to-Thursday accommodation columns. Notes and everything else stay in the browser.
      const at = grid.slice(0, 12).findIndex((r) => r.some((c) => /^presenter\b/i.test(c)) && r.filter((c) => /sunday|monday|tuesday|wednesday|thursday/i.test(c)).length >= 3);
      const keep = new Set();
      grid[at].forEach((c, i) => { if (/^(presenter|agency)\b/i.test(c) || (/accom/i.test(c) && /sunday|monday|tuesday|wednesday|thursday|friday|saturday/i.test(c))) keep.add(i); });
      return grid.slice(at).map((r) => r.map((c, i) => (keep.has(i) ? c : "")));
    }
  }
  throw new Error("I couldn't find the presenters' sheet in that file: no tab has a Presenter column with Sunday to Thursday accommodation columns.");
}

      <div style="flex:1 1 280px"><b>Is this an RBH event?</b><div class="hint" style="margin-top:4px">Marking it gives it a statement of work, a final invoice and receipts, and keeps the hotel contract and the costs to you and the VP. The event's lead no longer sees them.</div></div>
      <button class="btn btn-ghost" id="rbh-open">Yes, it's an RBH event…</button></div>
    <div id="rbh-form" hidden style="padding:0 20px 20px"><div class="row2">

      <div class="field"><label for="rbh-prefix">Invoice number starts with</label><input id="rbh-prefix" maxlength="8" value="${esc(ev.invoicePrefix || defaultPrefix(ev.title))}"><p class="hint" style="margin:6px 0 0">Then the year and a running number, like RBH-2026-001. ITP for the ITP trainings, CFAOC for the forum, RBH for the rest.</p></div></div>
      <div class="actions" style="margin-top:6px"><button class="btn btn-gold" id="rbh-go">Mark it as an RBH event</button><button class="btn btn-ghost" id="rbh-cancel">Not now</button></div></div></div>`;
}
function wireRbhOffer(ev) {
  const open = document.getElementById("rbh-open");
  if (!open) return;
  const form = document.getElementById("rbh-form");
  open.onclick = () => { form.hidden = false; open.hidden = true; document.getElementById("rbh-prov").focus(); };
  document.getElementById("rbh-cancel").onclick = () => { form.hidden = true; open.hidden = false; };

    catch (e) { toast(e.message); }

}

/** The invoice prefix an RBH event starts with (the same rule as sow.mjs): ITP for the ITP trainings, CFAOC for the forum, RBH for the rest. */
const defaultPrefix = (title = "") => /ITP\b|illicit trade/i.test(title) ? "ITP" : /organi[sz]ed crime|\bCFAOC\b/i.test(title) ? "CFAOC" : "RBH";
/**
 * A board member who isn't attached to an event may look but not change (the server refuses changes too): every
 * control on the page is switched off, and a line at the top says why. Folding sections open and shut still works.
 */
// Only what changes something is switched off on a view-only page: looking around (the tabs, the people switch and
// filters, the find box, opening a person's details, the way back) still works.
const VIEW_LOOK = ".etab, [data-pseg], [data-filter], #pfind, [data-pshow], [data-pclose], .crumb, [data-gotab], [data-gcutbtn], #gfind";
const lockForView = (root, why) => root.querySelectorAll("button, input, select, textarea").forEach((el) => { if (el.matches(VIEW_LOOK)) return; el.disabled = true; el.title = why; });
function makeViewOnly(why) {
  ROOT.classList.add("ro");
  lockForView(ROOT, why);
  ROOT.insertAdjacentHTML("afterbegin", `<div class="note viewonly" role="status" style="margin:0 0 14px"><b>View only.</b> ${esc(why.replace(/^This event is view only for you\. /, ""))}</div>`);
}

/** Provinces and territories, for the RBH event's tax. */
const PROVINCE_NAMES = { AB: "Alberta", BC: "British Columbia", MB: "Manitoba", NB: "New Brunswick", NL: "Newfoundland and Labrador", NS: "Nova Scotia", NT: "Northwest Territories", NU: "Nunavut", ON: "Ontario", PE: "Prince Edward Island", QC: "Quebec", SK: "Saskatchewan", YT: "Yukon" };
const SOW_STATUSES = [["draft", "Draft"], ["submitted", "Sent to RBH"], ["approved", "Approved"], ["invoiced", "Invoiced"], ["paid", "Paid"]];
const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const numOrNull = (v) => (v === "" || v === null || v === undefined || !Number.isFinite(Number(v)) ? null : Number(v));
/** The same sums the server makes (sow.mjs): the page shows them as you type, the server's are the ones filed. */
function sowSums(sow, which) {
  const amount = (l) => {
    if (which === "estimate") return r2(numOrNull(l.estimate) ?? 0);
    const typed = numOrNull(l.actual);
    if (typed !== null) return r2(typed);
    return r2(l.type === "fixed" ? (numOrNull(l.estimate) ?? 0) : (numOrNull(l.receiptsTotal) ?? 0));
  };
  const lines = sow.lines.map((l) => ({ id: l.id, amount: amount(l) }));
  // "Other": receipts that fit no line. Only the invoice has it.
  const other = which === "actual" ? r2(numOrNull(sow.otherActual) ?? numOrNull(sow.receiptsOther) ?? 0) : 0;
  const subtotal = r2(lines.reduce((n, l) => n + l.amount, 0) + other), fee = r2(subtotal * 0.2), deposit = r2(numOrNull(sow.deposit) ?? 0);
  const newSubtotal = r2(subtotal + fee - deposit), base = sow.taxBase === "subtotal" ? subtotal : r2(subtotal + fee);
  const taxes = sow.taxes.map((t) => ({ name: t.name, rate: Number(t.rate) || 0, amount: r2(base * (Number(t.rate) || 0) / 100) }));
  return { lines, other, subtotal, fee, deposit, newSubtotal, taxes, total: r2(newSubtotal + taxes.reduce((n, t) => n + t.amount, 0)) };
}
/** What was typed in a dollar box ("$1,234.50", "1234.5", "1 234") as a number; null when there is nothing usable. */
const moneyNum = (v) => {
  const t = String(v ?? "").replace(/[^0-9.]/g, "");
  if (!t) return null;
  const [whole, ...rest] = t.split(".");
  const n = Number(`${whole || "0"}.${rest.join("") || "0"}`);
  return Number.isFinite(n) ? n : null;
};
/** Dollar boxes show $1,234.50 when you leave them and the plain number while you type. */
function wireMoney(root) {
  root.querySelectorAll("input.money").forEach((el) => {
    el.onfocus = () => { const n = moneyNum(el.value); el.value = n === null ? "" : String(n); el.select(); };
    el.onblur = () => { const n = moneyNum(el.value); el.value = n === null ? "" : usd(n); };
  });
}
const usd = (n) => `$${Number(n).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
const afterApproval = (sow) => ["approved", "invoiced", "paid"].includes(sow.status);
const sentOrLater = (sow) => ["submitted", "approved", "invoiced", "paid"].includes(sow.status);

/** An RBH event's statement of work and invoice: the president's and the VP's, nobody else's. */
function sowCard(ev, S) {
  const sow = S.sow;
  // A Canadian Forum Against Organized Crime event starts from its own template: the Victoria one in Victoria.
  const forum = /organi[sz]ed crime|cfaoc/i.test(`${ev.title} ${ev.invoicePrefix ?? ""}`);
  const pre = forum ? (/victoria/i.test(ev.city ?? "") ? "cfaoc-victoria" : "cfaoc") : "";
  const line = !sow ? "Start the statement of work for RBH"
    : `${sow.invoice.number} · ${(SOW_STATUSES.find(([k]) => k === sow.status) ?? [])[1]} · ${usd(S.estimate.total)}`;
  const badge = sow ? (afterApproval(sow) && sow.status !== "paid" ? `${usd(S.actual.total)} invoice` : "") : "";
  const inner = !sow ? `<div class="card-body">
      <p class="hint" style="margin:0 0 12px">The statement of work is the estimate you send RBH, line by line. When the event is over the same lines carry the actuals and become the final invoice.
        The invoice number is given automatically, by year. Only you and the VP can see this.</p>
      <div class="field"><label>Start from</label>
        ${(S.templates ?? []).filter((t) => t.key !== "cfaoc-victoria" || /victoria/i.test(ev.city ?? "")).map((t) => `<label class="attest" style="margin-top:4px"><input type="radio" name="sw-from" value="${esc(t.key)}"${t.key === pre ? " checked" : ""}> <span><b>${esc(t.title)}</b>${t.total ? ` (${usd(t.total)} before fee and tax)` : ""}. ${esc(t.blurb)}</span></label>`).join("")}
        <label class="attest" style="margin-top:4px"><input type="radio" name="sw-from" value="standard"${pre ? "" : " checked"}> The standard lines (hotel, dinners, transportation, Via Rail, on-site and pre/post event management…)</label>
        ${S.copyFrom.map((c) => `<label class="attest" style="margin-top:4px"><input type="radio" name="sw-from" value="${esc(c.id)}"> A copy of <b>${esc(c.title)}</b>, ${esc(c.year)} (${usd(c.total)} before fee and tax)</label>`).join("")}</div>
      <p class="hint">${S.province ? `Tax will be ${esc(PROVINCE_NAMES[S.province])}'s.` : `<b>No province is set on this event.</b> Choose one under Edit event so the right tax goes on.`}</p>
      <div class="actions"><button class="btn btn-gold" id="sw-start">Start the statement of work</button></div></div>`
    : `<div class="card-body sow" id="sw-body"></div>`;
  return secFold("sow", "Statement of work and invoice", line, badge, inner, { id: "sowcard" });
}

    const act = afterApproval(sow);

    };

      </div>

        <ul style="margin:6px 0 0;padding-left:18px">${changes.map((c) => `<li>${esc(c.name || "A line")}: ${c.was === null ? "added" : usd(c.was)} → ${c.now === null ? "taken out" : usd(c.now)}${c.what === "amount changed" || c.what === "added" || c.what === "taken out" ? "" : ` (${esc(c.what)})`}</li>`).join("")}</ul>

      <div class="row2"><div class="field"><label for="sw-title">Program name (the big gold title)</label><input id="sw-title" value="${esc(sow.program.title)}"></div>

        ${sow.lines.map((l, i) => `<tr data-i="${i}"><td><input class="ln-name" value="${esc(l.name)}" aria-label="Line name"${locked ? " disabled" : ""}>
