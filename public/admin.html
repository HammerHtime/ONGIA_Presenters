<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONGIA Events</title>
<!-- The tab: ONGIA's leaf, which reads at 16 px; the Dock icon carries the words. -->
<link rel="icon" href="/assets/desk-favicon-32.png" sizes="32x32">
<link rel="icon" href="/assets/desk-favicon-16.png" sizes="16x16">
<!-- The desk as an app: Safari's File → Add to Dock (and Chrome's Install) use these. -->
<!-- 512 px so the Mac Dock (which shows icons up to 256 px on a Retina screen) gets a sharp one.
     Two bold words and nothing else: a tagline or a glow turns to mush at Dock size. -->
<link rel="apple-touch-icon" href="/assets/app-icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ONGIA Events">
<meta name="application-name" content="ONGIA Events">
<meta name="theme-color" content="#0e1a35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Oswald:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme:light;
    --paper:#f2efe8; --card:#fafaf7; --sunk:#edeae2; --sand:#e9e4d8;
    --ink:#12161f; --ink-mid:#2c3448; --muted:#767f92;
    --navy:#1a2f5e; --navy-deep:#0e1a35;
    --gold:#b8922a; --gold-light:#d9ae4b; --gold-pale:#f4ecd6;
    --border:#ddd7c8; --hair:rgba(18,22,31,.10);
    /* The line around a card or a row. Deliberately darker than --border,
       which stays soft for buttons, inputs and chips. */
    --edge:#bfb49a; --lift:0 1px 3px rgba(14,26,53,.07);
    --done:#2f6b4f; --done-bg:#e2efe7;
    --wait:#9a6a12; --wait-bg:#f8ecd5;
    --late:#a33328; --late-bg:#f7e3e0;
    --shadow:0 10px 30px rgba(14,26,53,.09),0 2px 6px rgba(14,26,53,.05);
    --fd:"DM Serif Display",Georgia,serif;
    --fb:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --fu:"Oswald","Arial Narrow",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
  h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
  p{margin:0}
  button{font:inherit;color:inherit}
  a{color:var(--navy)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

  .bar{background:var(--navy-deep);color:#fff;padding:13px 20px;display:flex;align-items:center;
       gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:10;
       padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .bar .logo{height:28px;width:auto;display:block;flex:none}
  @media (max-width:480px){.bar .logo{height:23px}}
  .bar .sub{font-size:13px;color:rgba(255,255,255,.62)}
  .bar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .chip{border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;
        border:1px solid rgba(255,255,255,.34);color:#fff;background:transparent;cursor:pointer}
  .chip.solid{background:var(--gold);border-color:var(--gold);color:#1c1608}

  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 70px}
  .card{background:var(--card);border:1.5px solid var(--edge);border-radius:20px;
        box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .card-head{background:var(--sand);padding:17px 22px;border-bottom:1.5px solid var(--edge);
             display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .card-head>div:first-child{flex:1 1 200px;min-width:0}
  .card-head h2{font-family:var(--fd);font-size:22px}
  .card-head .s{font-size:13.5px;color:var(--muted);margin-top:2px}
  .card-body{padding:20px 22px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1.5px;background:var(--edge);
         border-bottom:1.5px solid var(--edge)}
  .tile{background:var(--sunk);padding:15px 18px}
  .tile .k{font-family:var(--fu);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:var(--fd);font-size:32px;line-height:1.05;margin-top:3px;font-variant-numeric:tabular-nums}
  .tile.accent .v{color:var(--gold)}

  .field{margin-top:14px}
  .field label{display:block;font-family:var(--fu);font-size:11px;letter-spacing:.13em;
        text-transform:uppercase;color:var(--ink-mid);margin-bottom:6px}
  input,textarea,select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--sunk);
    border:1px solid var(--border);border-radius:12px;padding:11px 13px;-webkit-appearance:none}
  textarea{resize:vertical;min-height:92px;font-size:15px}
  /* Only the paste-a-list boxes are monospace; the rest is prose a person writes. */
  #e-people,#p-rows{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13.5px}
  input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;width:20px;height:20px;padding:0;margin:0;
    border:0;border-radius:4px;background:none;accent-color:var(--gold);flex:none}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  dialog.sheet{border:1.5px solid var(--edge);border-radius:16px;background:var(--card);color:var(--ink);
               padding:0;width:min(520px,calc(100vw - 28px));box-shadow:0 24px 60px rgba(0,0,0,.28)}
  dialog.sheet::backdrop{background:rgba(8,12,22,.55)}
  dialog.sheet h2{margin:0;font-size:19px}
  dialog.sheet .sheet-head{padding:18px 20px 0}
  dialog.sheet .sheet-body{padding:0 20px 20px}

  .btn{border-radius:999px;padding:12px 24px;font-weight:700;font-size:15px;border:1px solid transparent;cursor:pointer}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-gold{background:var(--gold);color:#1c1608}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--ink-mid)}
  .btn[disabled]{opacity:.55;cursor:progress}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

  .presenter{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    background:var(--sunk);border:1.5px solid var(--edge);border-radius:16px;padding:13px 15px;margin-bottom:10px}
  @media(max-width:660px){.presenter{grid-template-columns:auto 1fr}.presenter .act{grid-column:2}}
  .av{flex:0 0 42px;width:42px;height:42px;border-radius:999px;display:grid;place-items:center;background:var(--navy);
      color:var(--gold-light);font-family:var(--fu);font-size:15px}
  .pname{font-weight:700;font-size:15px}
  .porg{font-size:12.5px;color:var(--muted)}
  .ptalk{font-size:12.5px;color:var(--ink-mid);margin-top:3px}
  .act{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:11.5px;
    font-weight:700;white-space:nowrap;font-family:var(--fu);letter-spacing:.09em;text-transform:uppercase}
  .pill::before{content:"";width:7px;height:7px;border-radius:999px;background:currentColor}
  .pill.done{background:var(--done-bg);color:var(--done)}
  .pill.wait{background:var(--wait-bg);color:var(--wait)}
  .pill.late{background:var(--late-bg);color:var(--late)}
  /* Navy means "waiting on ONGIA" — it survives greyscale and colour blindness. */
  .pill.you{background:var(--navy);color:#fff}
  .pill.idle{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}
  .mini{border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink-mid);
    font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer}
  .mini:hover{border-color:var(--navy);color:var(--navy)}
  .mini.gold{background:var(--gold);border-color:var(--gold);color:#1c1608}

  .dates{display:grid;gap:1px;background:var(--border);border-radius:14px;overflow:hidden;margin-top:14px}
  .drow{background:var(--sunk);padding:11px 14px;display:grid;grid-template-columns:1fr auto auto;
    gap:10px 12px;align-items:center}
  .drow dt{font-size:13px;color:var(--muted)}
  .drow dt span{display:block;font-size:11.5px;color:var(--muted);opacity:.8}
  .drow dd{margin:0;font-size:13.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .daysback{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .daysback input{width:68px;padding:6px 8px;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
  @media (max-width:480px){
    .drow{grid-template-columns:1fr auto}
    .drow dd{grid-column:1/-1;text-align:left;font-size:15px}
  }

  /* Each event card's dates: one wrapping line, the date first so the eye can run down it. */
  .kdates{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;line-height:1.5;color:var(--ink-mid);
          padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--border)}
  .kdates .kl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:center}
  .kdates .kd b{font-weight:650;color:var(--navy)}
  .kdates .kd.cut b{color:var(--gold-deep,#8a6d1c)}
  .kdates .kd.late,.kdates .kd.late b{color:var(--late)}
  .note{margin-top:14px;background:var(--gold-pale);border:1px solid var(--gold);border-radius:14px;
        padding:12px 15px;font-size:13.5px;line-height:1.55;color:var(--ink-mid)}
  .bad{margin-top:14px;background:var(--late-bg);border:1px solid var(--late);border-radius:14px;
       padding:12px 15px;font-size:13.5px;color:var(--ink-mid)}
  .bad b{color:var(--late)}
  .bad .num{display:inline-block;background:var(--late);color:#fff;border-radius:7px;padding:0 8px;
            font-weight:700;font-variant-numeric:tabular-nums;line-height:1.5}
  .links{margin-top:14px;background:var(--sunk);border:1px solid var(--border);border-radius:14px;padding:13px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;word-break:break-all;line-height:1.8}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}

  /* tracking table */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .fchip{border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--ink-mid);
    border:1px solid var(--border);cursor:pointer} .fchip b{color:var(--muted);font-weight:700;margin-left:3px}
  .fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)} .fchip.on b{color:var(--gold-light)}
  .trow{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(190px,1fr) fit-content(230px);gap:14px;align-items:start;
    background:var(--card);border:1.5px solid var(--edge);border-radius:16px;padding:12px 14px;margin-bottom:8px;
    box-shadow:var(--lift)}
  .trow>*{min-width:0}
  .trow .who{display:flex;gap:12px;align-items:flex-start;min-width:0} .trow .who>div{min-width:0}
  .trow .who .pname,.trow .who .porg,.trow .who .ptalk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow .cell .pill{max-width:100%;white-space:normal;text-align:left}
  .trow .act{padding-top:2px}
  .trow .cell .cl{font-family:var(--fu);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .trow .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  /* The six steps of one presenter's agreement, in the order they happen.
     Squares are ONGIA's move, circles are the presenter's. */
  .steps{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:7px 15px;
         margin-top:11px;padding-top:10px;border-top:1px dashed var(--edge)}
  .scount{font-family:var(--fu);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
          color:var(--muted);white-space:nowrap}
  .step{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;
        background:none;border:0;padding:0;font-family:inherit;line-height:1.5}
  button.step{cursor:pointer} button.step:hover{color:var(--ink)} button.step:hover i{border-color:var(--ink-mid)}
  .step i{flex:none;width:14px;height:14px;border-radius:999px;border:1.5px solid var(--border);
          background:var(--sunk);display:grid;place-items:center;font-size:9px;font-weight:700;
          line-height:1;color:transparent}
  /* Done keeps its green tick — that is the thing being watched for — but the
     label goes quiet, so a finished row reads as calm rather than as six greens. */
  .step.done i{background:var(--done);border-color:var(--done);color:#fff}
  .step.done i::after{content:"\2713"}
  .step.soon i{border-color:var(--wait);background:var(--wait-bg)}
  /* Red is spent only on a step this row is behind its peers on. A date the whole
     event has missed is the event's problem and the banner says it once. */
  .step.late{color:var(--late);font-weight:600} .step.late i{border-color:var(--late);background:var(--late)}
  .step.late i::after{content:"!";color:#fff}
  .step.you{color:var(--navy);font-weight:700} .step.you i{border-color:var(--navy);background:var(--navy);color:#fff}
  .step.you i::after{content:"\2022"}
  @supports (grid-template-columns: subgrid){
    .tlist{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(190px,1fr) fit-content(230px);column-gap:14px}
    .tlist>.trow{grid-column:1/-1;grid-template-columns:subgrid}
    .tlist>.empty{grid-column:1/-1}
    .tlist>.thead{grid-column:1/-1;display:grid;grid-template-columns:subgrid;padding:0 14px 5px;
      font-family:var(--fu);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .tlist>.trow .cl{display:none}
  }
  @media (max-width:820px){.tlist>.thead{display:none}.tlist>.trow .cl{display:block}}
  @media (max-width:480px){.trow .act{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}}
  .tile .v small{font-size:14px;color:var(--muted);font-weight:400}
  /* events list: one wrapping row of small figures instead of six tiles */
  .stats{display:flex;flex-wrap:wrap;gap:6px 8px;padding:12px 22px;border-top:1px solid var(--hair)}
  .chipstat{font-size:12.5px;color:var(--muted);background:var(--sunk);border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .chipstat b{color:var(--ink);font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums} .chipstat b small{color:var(--muted);font-weight:400}
  .chipstat.hot{background:var(--wait-bg);border-color:var(--wait)} .chipstat.hot b{color:var(--wait)}
  .chipstat.good{background:var(--done-bg);border-color:var(--done)} .chipstat.good b{color:var(--done)}
  .chipstat.you{background:var(--navy);border-color:var(--navy);color:#fff} .chipstat.you b{color:var(--gold-light)}
  .chipstat.stop{background:var(--late-bg);border-color:var(--late)} .chipstat.stop b{color:var(--late)}
  /* What needs a person today, across every event. */
  .needs{background:var(--card);border:1.5px solid var(--edge);border-radius:20px;box-shadow:var(--shadow);
    overflow:hidden;margin-bottom:18px}
  .needs>h2{background:var(--navy-deep);color:#fff;font-family:var(--fu);font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;padding:12px 20px;border-bottom:3px solid var(--gold)}
  .needs .nrow{display:flex;gap:12px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid var(--hair);font-size:14px;line-height:1.5}
  .needs .nrow:last-child{border-bottom:0}
  .needs .nrow .why{flex:1;min-width:0}
  .needs .nrow b{display:block}
  .needs .nrow .who{color:var(--muted);font-size:13px;margin-top:2px}
  .needs .nrow .mini{flex:none}
  .needs .nrow.stop{background:var(--late-bg)} .needs .nrow.stop b{color:var(--late)}
  .needs .nrow.act b{color:var(--navy)}
  .needs .allclear{padding:15px 20px;font-size:14px;color:var(--ink-mid)}
  @media (max-width:560px){.needs .nrow{flex-direction:column;gap:9px}.needs .nrow .mini{align-self:flex-start}}
  /* ---------- the year at a glance ----------
     Twelve month tracks, each one a 1-to-31 scale. An event is a band sitting
     where it falls; its deadlines are ticks in the strip underneath. Empty
     months are drawn too — the gaps are half the point. */
  .yearhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .yearhead .yr{font-family:var(--fd);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
  .ynav{border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink-mid);
        width:34px;height:34px;cursor:pointer;font-size:15px;line-height:1;flex:none}
  .ynav:hover:not([disabled]){border-color:var(--navy);color:var(--navy)}
  .ynav[disabled]{opacity:.35;cursor:default}
  .months{display:grid;gap:1px;background:var(--border);border-top:1.5px solid var(--edge)}
  .mrow{background:var(--card);display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:stretch;
        padding:9px 22px 9px 16px}
  .mrow.quiet{background:var(--sunk)}
  .mrow.now{box-shadow:inset 3px 0 0 var(--gold)}
  .mname{font-family:var(--fu);font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
         padding-top:5px;white-space:nowrap}
  .mrow.now .mname{color:var(--gold)}
  .mtrack{position:relative;min-height:30px;display:flex;flex-direction:column;gap:3px;justify-content:center}
  .mweek{position:absolute;inset:0;pointer-events:none;background-size:100% 100%;border-radius:7px;overflow:hidden}
  .lane{position:relative;height:25px}
  .band{position:absolute;top:0;height:25px;border-radius:7px;background:var(--navy);color:#fff;
        font-size:11.5px;font-weight:700;line-height:25px;padding:0 8px;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;cursor:pointer;border:0;font-family:inherit;text-align:left;min-width:14px}
  .band:hover{background:var(--navy-deep)}
  .band.past{background:var(--muted)} .band.past:hover{background:var(--ink-mid)}
  .band.runs{background:var(--gold);color:#1c1608}
  .ticks{position:relative;height:13px;border-top:1px solid var(--hair);margin-top:1px}
  .tick{position:absolute;width:3px;border-radius:2px;cursor:help;bottom:2px}
  .tick.agreement{height:5px;background:var(--gold)}
  .tick.draft{height:8px;background:var(--wait)}
  .tick.final{height:11px;background:var(--navy)}
  .tick.late{background:var(--late);width:4px}
  /* A short event cannot hold its own name, so the name sits beside the bar. */
  .blabel{position:absolute;top:0;height:25px;line-height:25px;font-size:11.5px;font-weight:700;
          color:var(--ink-mid);white-space:nowrap;pointer-events:none}
  .blabel.left{transform:translateX(-100%);padding-right:7px}
  .blabel.right{padding-left:7px}
  .blabel.past{color:var(--muted);font-weight:600}
  .ylegend{display:flex;gap:7px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:12px 22px 0}
  .ylegend span{display:inline-flex;align-items:center;gap:6px}
  .ylegend i{width:11px;height:11px;border-radius:2px;flex:none;display:inline-block;align-self:center}
  /* The weeks that will hurt: two events at once, a deadline while you are away. */
  .crunch .nrow b{color:var(--wait)}
  .crunch .nrow.stop b{color:var(--late)}
  @media (min-width:821px){.yrlist .trow{grid-template-columns:minmax(190px,1.4fr) minmax(210px,1fr) fit-content(150px)}}
  .ydates{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .ydates b{color:var(--ink-mid);font-weight:600}
  .ydates .od{color:var(--late);font-weight:700}
  @media (max-width:640px){
    .mrow{grid-template-columns:1fr;gap:4px;padding:10px 16px}
    .mname{padding-top:0}
    .band{font-size:11px;padding:0 6px}
  }
  @media print{
    .bar,.ynav,.ylegend,.needs{display:none!important}
    .card{box-shadow:none;break-inside:avoid}
    .months{break-inside:avoid}
  }

  /* ---------- the desk's own checklist ----------
     Not what a presenter owes; what Andrew owes. A row is a tick, a job and
     the date it falls on, worked back from day one like every other date here. */
  .jobs{display:grid;gap:1px;background:var(--border);border-radius:14px;overflow:hidden;margin-top:4px;
        max-width:820px}
  .job{background:var(--sunk);display:grid;grid-template-columns:auto 1fr auto auto;gap:10px 14px;
       align-items:center;padding:10px 14px}
  .job.done{background:var(--done-bg)}
  .job.late{background:var(--late-bg)}
  /* Ruled out, but still on the page — so it reads as decided, not forgotten. */

<body>

<div class="bar">
  <img class="logo" src="/assets/ongia-logo.png" alt="ONGIA" width="168" height="28">
  <span class="sub">Presenter Agreement Desk</span>
  <span class="right" id="barright"></span>
</div>

<div class="wrap" id="root"><p class="empty">Loading…</p></div>

<script type="module">
const ROOT = document.getElementById("root");
const BARRIGHT = document.getElementById("barright");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = (iso) => { if (!/^\d{4}-\d{2}-\d{2}/.test(iso ?? "")) return iso ?? ""; const [y,m,d] = iso.slice(0,10).split("-").map(Number); const dt = new Date(y, m-1, d); return `${DAYS[dt.getDay()]} ${d} ${MONTHS[m-1]} ${y}`; };

/**
 * Today in Toronto, where the desk is, not in UTC. Between midnight and 5am a
 * UTC date reads as tomorrow, which would have shown a deadline as overdue a
 * day early. The server already computes it this way; now the page agrees.
 */
const DESK_TZ = "America/Toronto";
const todayIso = (now = new Date()) => {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: DESK_TZ, year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(now);
  const at = (t) => parts.find((x) => x.type === t).value;
  return `${at("year")}-${at("month")}-${at("day")}`;
};

/**
 * Sponsorship is parked. The tab, its screen and the "open to sponsors" tick
 * are hidden, and nothing sponsor-related can be reached from the desk — but
 * the functions, the sponsor's form and their tests are all still here, so
 * turning it back on is this one line. Anything already stored is left alone.
 */
const SPONSORS_ON = false;

let KEY = sessionStorage.getItem("ongia-admin-key") ?? "";
let view = { name: "list", eventId: null };
let busy = false;

async function api(path, options = {}) {
  const res = await fetch(`/api${path}`, {
    ...options,
    headers: { "content-type": "application/json", "x-admin-key": KEY, ...(options.headers ?? {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error ?? `Request failed (${res.status})`);
  return body;
}

/* ---------- sign in ---------- */
function signInScreen(message) {
  BARRIGHT.innerHTML = "";
  ROOT.innerHTML = `<div class="card" style="max-width:420px;margin:40px auto">
    <div class="signin-brand"><img src="/assets/ongia-logo.png" alt="ONGIA" width="232" height="39">
      <span>Presenter Agreement Desk</span></div>
    <div class="card-head"><div><h2>Sign in</h2>
      <div class="s">The admin key for this site.</div></div></div>
    <div class="card-body">
      ${message ? `<div class="bad"><b>Couldn't sign in.</b> ${esc(message)}</div>` : ""}
      <div class="field"><label for="k">Admin key</label>
        <input id="k" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div class="actions"><button class="btn btn-navy" id="go">Sign in</button></div>
      <p class="hint">Ask the coordinator for the key. (Technically: the site's ADMIN_KEY setting on Netlify.)</p>
    </div></div>`;
  document.getElementById("k").focus();
  const submit = () => {
    KEY = document.getElementById("k").value.trim();
    if (!KEY) return signInScreen("Please enter the key.");
    sessionStorage.setItem("ongia-admin-key", KEY);
    load();
  };
  document.getElementById("go").onclick = submit;
  document.getElementById("k").onkeydown = (e) => { if (e.key === "Enter") submit(); };
}

/* ---------- events list ---------- */
function listScreen(events) {
  BARRIGHT.innerHTML = `<button class="chip" id="theyear">The year</button><button class="chip" id="letters">Letters</button>${SPONSORS_ON ? `<button class="chip" id="sponsors">Sponsors</button>` : ""}<button class="chip" id="roster">Board members</button><button class="chip solid" id="newevent">New event</button>`;
  queueMicrotask(healthStrip);
  document.getElementById("theyear").onclick = () => { view = { name: "year", year: null }; render(); };
  document.getElementById("letters").onclick = () => { view = { name: "letters" }; render(); };
  document.getElementById("roster").onclick = () => { view = { name: "roster" }; render(); };
  if (SPONSORS_ON) document.getElementById("sponsors").onclick = () => { view = { name: "sponsors" }; render(); };
  document.getElementById("newevent").onclick = () => { view = { name: "new" }; render(); };

  if (!events.length) {
    ROOT.innerHTML = `<div class="healthwrap" id="health"><div class="hstrip">Checking email and SharePoint…</div></div><div class="card"><div class="empty">
      <p>No events yet.</p>
      <div class="actions" style="justify-content:center"><button class="btn btn-gold" id="first">Create your first event</button></div>
    </div></div>`;
    document.getElementById("first").onclick = () => { view = { name: "new" }; render(); };
    return;
  }

  ROOT.innerHTML = `<div class="healthwrap" id="health"><div class="hstrip">Checking email and SharePoint…</div></div>`
    + needsCard(events)
    + events.map((ev) => {
    const c = ev.counts;
    const md = ev.materials?.draft ?? 0, mf = ev.materials?.final ?? 0;
    const blockers = blockersOf(ev);
    return `<div class="card evcard" data-open="${esc(ev.id)}" role="link" tabindex="0">
      <div class="card-head"><div><h2>${esc(ev.title)}</h2>
        <div class="s">${esc(ev.city)}${ev.venue ? " · " + esc(ev.venue) : ""} · ${esc(fmtDate(ev.dayOne))}${ev.lastDay && ev.lastDay !== ev.dayOne ? " – " + esc(fmtDate(ev.lastDay)) : ""}</div></div></div>
      <div class="stats">
        <span class="chipstat"><b>${c.total}</b>presenter${c.total === 1 ? "" : "s"}</span>
        ${blockers.length ? `<span class="chipstat stop" title="${esc(blockers.map((b) => b.short).join(", "))}"><b>${blockers.length}</b>blocking ${blockers.length === 1 ? "problem" : "problems"}</span>` : ""}
        ${c.uninvited ? `<span class="chipstat stop"><b>${c.uninvited}</b>link never sent</span>` : ""}
        ${c.failed ? `<span class="chipstat stop"><b>${c.failed}</b>not filed</span>` : ""}
        <span class="chipstat${c.invited + c.opened ? " hot" : ""}"><b>${c.invited + c.opened}</b>waiting on them</span>
        <span class="chipstat${c.submitted ? " you" : ""}"><b>${c.submitted}</b>for you to review</span>
        <span class="chipstat${c.approved && c.approved === c.total ? " good" : ""}"><b>${c.approved}</b>final</span>
        <span class="chipstat"><b>${md}<small>/${c.total}</small></b>draft materials</span>
        <span class="chipstat"><b>${mf}<small>/${c.total}</small></b>final materials</span>
      </div>
      <div class="card-body" style="padding-top:10px;padding-bottom:12px">${datesLine(ev)}${nextLine(ev, c)}</div>
    </div>`;
  }).join("");

  ROOT.querySelectorAll(".evcard").forEach((card) => { card.onkeydown = (e) => { if (e.key === "Enter") card.click(); }; });
  ROOT.querySelectorAll("[data-open]").forEach((b) => {
    b.onclick = () => { GUEST_NOTE = null; view = { name: "event", eventId: b.dataset.open }; render(); };
  });
  ROOT.querySelectorAll("[data-goev]").forEach((b) => { b.onclick = (e) => { e.stopPropagation(); view = { name: "event", eventId: b.dataset.goev }; render(); }; });
  ROOT.querySelectorAll("[data-goreview]").forEach((b) => { b.onclick = (e) => {
    e.stopPropagation(); const [eid, pid] = b.dataset.goreview.split("|");
    view = { name: "review", eventId: eid, presenterId: pid }; render();
  }; });
}

/**
 * What stops an event working at all. These are quiet failures: with no lead
 * nobody is named on the agreement and nobody is cued to review; with no upload
 * link the materials reminders never fire; with no folder nothing is filed.
 */
function blockersOf(ev) {
  const out = [];
  if (!ev.reviewer?.name) out.push({ short: "no lead", title: "No lead board member",
    why: "Nobody is named on the agreement, nobody is prompted to review, and replies go to the speakers mailbox.", fix: "Pick a lead", act: "edit" });
  if (!ev.materialsUploadUrl) out.push({ short: "no upload link", title: "No upload link",
    why: "Presenters have nowhere to put their slides, and materials reminders are switched off for this event.", fix: "Create upload link", act: "mklink" });
  if (!ev.sharePointFolder) out.push({ short: "no SharePoint folder", title: "No SharePoint folder",
    why: "Approved agreements will not be filed anywhere.", fix: "Create it", act: "mkfolder" });
  return out;
}

/**
 * The front page of the desk: everything that is true, known to the app, and
 * otherwise invisible until someone opens each event in turn.
 */
function needsCard(events) {
  const today = todayIso();
  const days = (iso) => Math.round((Date.parse(iso) - Date.parse(today)) / 86400000);
  const rows = [];
  const names = (list, max = 4) => {
    const n = list.map((x) => esc(x.name));
    return n.length <= max ? n.join(", ") : `${n.slice(0, max).join(", ")} and ${n.length - max} more`;
  };
  for (const ev of events) {
    const a = ev.attention ?? {};
    const where = `${esc(ev.city)} · ${esc(ev.title)}`;
    for (const pr of a.review ?? []) rows.push({ cls: "act", rank: 0,
      title: "Waiting for your signature", who: `${esc(pr.name)} — ${where}`, label: "Review", goreview: `${ev.id}|${pr.id}` });
    if ((a.uninvited ?? []).length) rows.push({ cls: "stop", rank: 1,
      title: `${a.uninvited.length} presenter${a.uninvited.length === 1 ? " has" : "s have"} never been sent a link`,
      who: `${names(a.uninvited)} — ${where}. No reminder will ever reach them.`, label: "Open event", goev: ev.id });
    if ((a.failed ?? []).length) rows.push({ cls: "stop", rank: 2,
      title: `${a.failed.length} signed agreement${a.failed.length === 1 ? "" : "s"} never reached SharePoint`,
      who: `${names(a.failed)} — ${where}`, label: "Open event", goev: ev.id });
    if ((a.sendFailed ?? []).length) rows.push({ cls: "stop", rank: 2,
      title: `${a.sendFailed.length} email${a.sendFailed.length === 1 ? "" : "s"} could not be sent`,
      who: `${names(a.sendFailed)} — ${where}`, label: "Open event", goev: ev.id });
    const blockers = blockersOf(ev);
    if (blockers.length) rows.push({ cls: "stop", rank: 3,
      title: `Event is blocked: ${blockers.map((b) => b.short).join(", ")}`,
      who: `${where}${ev.deadlines?.agreement ? ` · agreements due ${esc(fmtDate(ev.deadlines.agreement))}` : ""}`, label: "Open event", goev: ev.id });
    const due = ev.deadlines?.agreement;
    const out = (a.outstanding ?? []).length;
    if (due && days(due) < 0 && out) rows.push({ cls: "stop", rank: 4,
      title: `${out} agreement${out === 1 ? "" : "s"} overdue by ${-days(due)} day${days(due) === -1 ? "" : "s"}`,
      who: `${names(a.outstanding)} — ${where}`, label: "Open event", goev: ev.id });
    // ONGIA's own jobs, which nobody else is going to chase.
    const k = ev.checklist;
    if (k?.late) rows.push({ cls: "stop", rank: 5,
      title: `${k.late} job${k.late === 1 ? "" : "s"} on your own checklist overdue`,
      who: `${where} · ${k.done} of ${k.total} done`, label: "Open event", goev: ev.id });
  }
  rows.sort((a, b) => a.rank - b.rank);
  const live = events.filter((e) => (e.lastDay || e.dayOne) >= today).length;
  const body = rows.length
    ? rows.map((r) => `<div class="nrow ${r.cls}"><div class="why"><b>${r.title}</b><div class="who">${r.who}</div></div>
        <button class="mini${r.goreview ? " gold" : ""}" ${r.goreview ? `data-goreview="${esc(r.goreview)}"` : `data-goev="${esc(r.goev)}"`}>${r.label}</button></div>`).join("")
    : `<div class="allclear">Nothing needs you today. ${live} event${live === 1 ? "" : "s"} on the rails.</div>`;
  return `<div class="needs"><h2>Needs you now</h2>${body}</div>`;
}

/* ---------- new event ---------- */

      <div id="preview"></div>
      <div class="field"><label>Board members for this event</label>
        <details class="bdrop" id="bdrop">
          <summary id="bsum"></summary>
          <div class="bpanel">
            <p class="hint" style="margin:0 0 8px">Tick everyone who should be kept informed. One is the <b>lead</b>: the ONGIA contact

            <div class="board" id="board">${boardRows(roster, ev?.board ?? [])}</div>
            <p class="hint" style="margin:8px 0 0"><a href="#" id="nb-toggle">Someone missing from this list? Add them</a></p>
            <div class="addrow" id="nb-row" hidden><input id="nb-name" placeholder="Name"><input id="nb-email" type="email" placeholder="email@ongia.ca"><button class="mini" id="nb-add" type="button">Add to list</button></div>
            <div style="text-align:right;margin-top:10px"><button class="mini solid" id="bdone" type="button">Done</button></div>
          </div>
        </details>
      </div>
      <div class="field"><label>Presenters reach</label>
        <p class="hint" id="cphonehint" style="margin:0"></p></div>
      <div class="field"><label for="e-folder">Event folder in SharePoint <span style="text-transform:none;letter-spacing:0;font-family:var(--fb)">(paste the link, or leave blank)</span></label>
        <input id="e-folder" value="${esc(ev?.sharePointFolderUrl || ev?.sharePointFolder || "")}" placeholder="https://ongia.sharepoint.com/sites/…/2026/Toronto 2026">
        <p class="hint" id="folderhint" style="margin:6px 0 0"></p>
        <p class="hint" style="margin:6px 0 0"><a href="#" id="adv-toggle">I already have an upload link for this folder</a></p>
        <div id="adv" hidden>
          <div class="field" style="margin:12px 0 0"><label for="e-upload">Presenter upload link</label>
            <input id="e-upload" value="${v("materialsUploadUrl")}" placeholder="Paste the “Request files” link for the event folder">

        </div>
      </div>
      <details class="settings" style="margin-top:16px"${(ev?.hotel && Object.values(ev.hotel).some(Boolean)) ? " open" : ""}>

        <div class="ctbox">${ev
          ? `<div id="ct-body"><p class="hint" style="margin:0">Loading the contract…</p></div><input type="file" id="ct-file" accept="application/pdf,.pdf" hidden>`

            <input id="e-hrate" value="${esc(ev?.hotel?.rate ?? "")}" placeholder="$189 + tax"></div>

            <input id="e-hcut" type="date" value="${esc(ev?.hotel?.cutoff ?? "")}"></div>

            <input id="e-hfb" type="date" value="${esc(ev?.hotel?.foodAndBev ?? "")}"></div>
        </div>
        <p class="hint" id="hotelhint" style="margin:8px 0 0"></p>
        <div class="field"><label for="e-hnotes">Anything else from the contract</label>
          <textarea id="e-hnotes" style="min-height:70px" placeholder="Attrition, deposit dates, parking">${esc(ev?.hotel?.notes ?? "")}</textarea></div>
      </details>
      <details class="settings" style="margin-top:4px"${(ev?.letters?.welcome || ev?.letters?.survey || ev?.surveyLink || (ev && ev.attendeeMail !== true)) ? " open" : ""}>

          date on the event's checklist — move the job there and the letter moves with it. "None" means it does not go.</p>
        <div class="row2" style="margin-top:12px">
          <div class="field" style="margin:0"><label for="e-lwelcome">Welcome letter</label>
            <select id="e-lwelcome">${letterOptions("welcome", ev?.title, ev?.letters?.welcome)}</select></div>
          <div class="field" style="margin:0"><label for="e-lsurvey">Survey</label>
            <select id="e-lsurvey">${letterOptions("survey", ev?.title, ev?.letters?.survey)}</select></div>
        </div>
        <div class="field"><label for="e-survey">Survey link</label>

      </details>
      ${ev ? "" : `<div class="field"><label for="e-people">Presenters (one per line: first, last, email, organization)</label>

        <label class="attest" style="margin-top:10px"><input type="checkbox" id="e-invite" checked><span>Email each presenter their agreement link as soon as the event is created</span></label>
        <p class="hint" style="margin:6px 0 0">Optional now — you can add more later from the event page.</p></div>`}
      <div id="problem"></div>
      <div class="actions"><button class="btn btn-gold" id="create">${ev ? "Save changes" : "Create event"}</button></div>
    </div></div>`;

  const $ = (id) => document.getElementById(id);
  const day1 = $("e-day1"), last = $("e-last"), preview = $("preview"), city = $("e-city"), folder = $("e-folder"), upload = $("e-upload"), folderhint = $("folderhint");

  // What the hotel dates would actually do, shown as they are typed. The
  // reminders count back from the cut-off, so the hint has to prove it.
  const HOTEL_DAYS = [30, 15, 7];
  const showHotelHint = () => {
    const hint = $("hotelhint"), cut = $("e-hcut"), link = $("e-hlink");
    if (!hint) return;
    const today = todayIso();
    if ((cut.value || link.value.trim()) && !$("e-amail")?.checked) {
      hint.innerHTML = "Emails to attendees are off for this event (see <b>Emails to attendees</b> below), so no hotel reminders go.";
      hint.style.color = "var(--wait)";
      return;
    }
    if (!cut.value) {
      hint.innerHTML = link.value.trim()
        ? `Set the cut-off and attendees are reminded ${HOTEL_DAYS.join(", ")} days before it.`
        : "";
      hint.style.color = "";
      return;
    }
    const when = HOTEL_DAYS.map((d) => ({ d, iso: new Date(Date.parse(cut.value) - d * 86400000).toISOString().slice(0, 10) }));
    const gone = when.filter((w) => w.iso < today);
    const after = day1.value && cut.value > day1.value;
    const parts = [`Attendees would be reminded ${when.map((w) => `<b>${esc(fmtDate(w.iso).replace(/^\w+ /, ""))}</b>`).join(", ")}.`];
    if (!link.value.trim()) parts.push("No booking link yet, so none of them would go.");
    if (gone.length === when.length) parts.push("All three dates have passed — nothing would be sent.");
    else if (gone.length) parts.push(`${gone.length} of them ${gone.length === 1 ? "has" : "have"} already passed; the rest still go.`);
    if (after) parts.push("The cut-off falls after the training starts, which is unusual — worth checking the contract.");
    hint.innerHTML = parts.join(" ");
    hint.style.color = (!link.value.trim() || gone.length || after) ? "var(--wait)" : "";
  };
  $("e-amail")?.addEventListener("change", showHotelHint);
  ["e-hcut", "e-hlink", "e-day1"].forEach((id) => {
    const el = $(id);
    if (el) el.addEventListener("input", showHotelHint);
  });
  showHotelHint();
  // On a new event the contract is held as a draft until Create, then becomes the event's.
  const draftId = ev ? null : Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, "0")).join("");
  wireContract(ev, { $, showHotelHint, draftId });

  // Letters written for one kind of training appear only once the title says
  // it is that kind. Whatever is picked stays picked while the title is typed.
  $("e-title").addEventListener("input", () => {
    for (const [id, kind] of [["e-lwelcome", "welcome"], ["e-lsurvey", "survey"]]) {
      const box = $(id);
      if (box) box.innerHTML = letterOptions(kind, $("e-title").value, box.value);
    }
  });

  // Folder convention: year, then "year City". Shown as the default so a blank field is never a surprise.
  const convention = () => {
    const y = day1.value.slice(0, 4), c = city.value.split(",")[0].trim();
    return y && c ? `ONGIA Board/ONGIA Training/${y}/${y} ${c}` : "";
  };
  const showFolderHint = () => {
    const conv = convention();
    folder.placeholder = conv || "ONGIA Board/ONGIA Training/2027/2027 Winnipeg";
    const val = folder.value.trim(), link = upload.value.trim();
    const stored = ev ? (ev.sharePointFolderUrl || ev.sharePointFolder || "") : "";
    const year = day1.value.slice(0, 4) || "2027";
    const inside = ` Inside it, each agreement is filed to Presenter Agreements / <presenter name> ${year}.`;
    let where;
    if (val && val === stored) where = `Using ${ev.sharePointFolder}.` + inside;
    else if (val) where = (/^https?:/i.test(val) ? "Using the folder behind that link; the app works out its path when you save." : `Using ${val.replace(/^(Shared Documents|Documents)\//i, "")}.`) + inside;
    else if (conv) where = `Left blank, the app creates ${conv} in SharePoint.` + inside;
    else where = "Paste the event's folder link, or leave this blank and the app creates the folder itself.";
    const up = link && ev && link === ev.materialsUploadUrl ? " Presenters already have an upload-only link for it."
      : link ? " Presenters upload to the link you pasted, once the app has checked it is upload-only."
      : " Presenters get an upload-only link the app makes for that folder. Nothing to paste.";
    folderhint.textContent = where + up;
  };
  city.oninput = showFolderHint; folder.oninput = showFolderHint; upload.oninput = showFolderHint;
  const cphonehint = $("cphonehint");
  // The lead's name, address and number are their entry on the board list. There
  // is nothing to type here: it is shown so the coordinator can see what prints.
  function showLeadPhone() {
    const lead = readBoard().find((m) => m.lead);
    if (!lead) { cphonehint.innerHTML = "Mark one board member as the lead. Their name, email and phone number go on the agreement, and presenters' replies reach them."; return; }
    cphonehint.innerHTML = lead.phone
      ? `<b>${esc(lead.name)}</b> · ${esc(lead.email)} · ${esc(lead.phone)} — printed on the agreement and on every email.`
      : `<b>${esc(lead.name)}</b> · ${esc(lead.email)} — <b>no phone number on file.</b> Add one on the <a href="#" id="goroster">Board members</a> page and it appears here.`;
    const go = $("goroster");
    if (go) go.onclick = (e) => { e.preventDefault(); view = { name: "roster" }; render(); };
  }
  $("adv-toggle").onclick = (e) => { e.preventDefault(); const a = $("adv"); a.hidden = !a.hidden; if (!a.hidden) upload.focus(); };

  // Board picker: a closed box that names who is picked; open it to tick people
  // and pick the lead. Ticking the first person makes them lead automatically.
  const boardEl = $("board"), bdrop = $("bdrop");
  const showBoardSummary = () => {
    const picked = readBoard();
    $("bsum").innerHTML = picked.length
      ? `<span>${picked.map((m) => `${esc(m.name)}${m.lead ? `<span class="ld">lead</span>` : ""}`).join(", ")}</span>`
      : `<span class="none">Choose the board members for this event</span>`;
  };
  const closeOutside = (e) => {
    if (!bdrop.isConnected) return document.removeEventListener("click", closeOutside);
    if (bdrop.open && !bdrop.contains(e.target)) bdrop.open = false;
  };
  document.addEventListener("click", closeOutside);
  bdrop.addEventListener("keydown", (e) => { if (e.key === "Escape") { bdrop.open = false; $("bsum").focus(); } });
  $("bdone").onclick = () => { bdrop.open = false; };
  boardEl.addEventListener("change", (e) => {
    const rows = [...boardEl.querySelectorAll(".member")];
    if (e.target.type === "radio") rows.forEach((r) => { const on = r.querySelector(".pick"); if (r.querySelector("input[type=radio]").checked) on.checked = true; });
    const picked = rows.filter((r) => r.querySelector(".pick").checked);
    if (!picked.some((r) => r.querySelector("input[type=radio]").checked) && picked[0]) picked[0].querySelector("input[type=radio]").checked = true;
    rows.forEach((r) => { const on = r.querySelector(".pick").checked; const radio = r.querySelector("input[type=radio]"); if (!on) radio.checked = false; r.classList.toggle("lead", radio.checked); radio.disabled = !on; });
    showLeadPhone();
    showBoardSummary();
  });
  $("nb-toggle").onclick = (e) => { e.preventDefault(); const r = $("nb-row"); r.hidden = !r.hidden; if (!r.hidden) $("nb-name").focus(); };
  $("nb-add").onclick = async () => {
    const name = $("nb-name").value.trim(), email = $("nb-email").value.trim();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("Name and a valid email, please.");
    try {
      const out = await api("/roster", { method: "PUT", body: JSON.stringify({ members: [...roster, { name, email }] }) });
      ROSTER = out.members; roster.splice(0, roster.length, ...out.members);
      const chosen = readBoard();
      boardEl.innerHTML = boardRows(roster, [...chosen, { name, email, lead: !chosen.length }]);
      $("nb-name").value = ""; $("nb-email").value = ""; showLeadPhone(); showBoardSummary(); toast(`${name} added.`);
    } catch (e) { toast(e.message); }
  };
  function readBoard() {
    return [...boardEl.querySelectorAll(".member")].filter((r) => r.querySelector(".pick").checked)
      .map((r) => ({ name: r.dataset.name, email: r.dataset.email, phone: r.dataset.phone || "", lead: r.querySelector("input[type=radio]").checked }));
  }
  showBoardSummary();

  // How far ahead each thing is wanted. ONGIA's defaults suit a national event;
  // a regional half-day can pull them in. The dates redraw as the numbers change.
  const OFFSET_ROWS = [
    ["agreement", "Agreements due back", "the signed agreement"],
    ["draft", "Draft materials", "for the board to read"],
    ["final", "Final materials", "production-ready, no more changes"],
  ];
  const offsets = { agreement: 90, draft: 50, final: 30, ...(ev?.offsets ?? {}) };
  let deadlineRun = 0;

  // The inputs are built once and then left alone. Rebuilding them on every
  // keystroke destroyed the field being typed into: refocusing the replacement
  // put the caret back at the start, so typing 60 produced 06.
  const drawSkeleton = () => {
    preview.innerHTML = `<dl class="dates">${OFFSET_ROWS.map(([k, label, sub]) => `
      <div class="drow"><dt>${label}<span>${sub}</span></dt>
        <label class="daysback"><input type="number" min="1" max="365" step="1" id="off-${k}" value="${offsets[k]}" aria-label="${label}: days before day one"> days before</label>
        <dd id="dd-${k}">—</dd></div>`).join("")}
    </dl><div id="dl-note"></div>`;
    for (const [k] of OFFSET_ROWS) {
      $(`off-${k}`).oninput = () => {
        const n = Math.round(Number($(`off-${k}`).value));
        if (n >= 1 && n <= 365) { offsets[k] = n; showDeadlines(); }
      };
    }
  };

  // Only the dates and the note below them change as the numbers do.
  const drawDeadlines = (out, busy, note = "") => {
    if (!$("dd-agreement")) drawSkeleton();
    for (const [k] of OFFSET_ROWS) {
      const dd = $(`dd-${k}`);
      if (dd) dd.textContent = busy ? "…" : (out?.readable?.[k] ?? "—");
    }
    const box = $("dl-note");
    if (box) box.innerHTML = (out?.moved?.length ? `<div class="note">${out.moved.map(esc).join("<br>")}</div>` : "") + note;
  };

  const showDeadlines = async () => {
    showFolderHint();
    if (!day1.value) { drawDeadlines(null, false); return; }
    if (!last.value || last.value < day1.value) last.value = day1.value;
    const order = offsets.agreement < offsets.draft
      ? "Agreements are due before draft materials, so use a larger number of days for them."
      : offsets.draft < offsets.final
        ? "Draft materials are due before final materials, so use a larger number of days for them."
        : null;
    const run = ++deadlineRun;
    drawDeadlines(null, true);
    if (order) {
      drawDeadlines(null, false, `<p class="hint" style="margin-top:8px;color:var(--late)">${esc(order)}</p>`);
      return;
    }
    try {
      const q = OFFSET_ROWS.map(([k]) => `${k}=${offsets[k]}`).join("&");
      const out = await api(`/deadlines?dayOne=${day1.value}&${q}`);
      if (run !== deadlineRun) return;             // a later keystroke already won
      drawDeadlines(out, false);
    } catch (e) {
      if (run !== deadlineRun) return;
      drawDeadlines(null, false, `<div class="bad" style="margin-top:8px">${esc(e.message)}</div>`);
    }
  };
  day1.onchange = showDeadlines;
  showDeadlines();
  showLeadPhone();

  $("create").onclick = async (e) => {
    if (busy) return;
    busy = true; e.target.disabled = true;
    const val = (id) => $(id).value.trim();
    const body = {
      title: val("e-title"), city: val("e-city"), venue: val("e-venue"), sessionMinutes: Number(val("e-mins")) || 70,
      dayOne: val("e-day1"), lastDay: val("e-last") || val("e-day1"),
      offsets,
      board: readBoard(),
      sharePointFolder: val("e-folder"), materialsUploadUrl: val("e-upload"),
      hotel: { name: val("e-hotel"), rate: val("e-hrate"), link: val("e-hlink"), contact: val("e-hcontact"),
               cutoff: val("e-hcut"), foodAndBev: val("e-hfb"), notes: val("e-hnotes") },
      letters: { welcome: val("e-lwelcome"), survey: val("e-lsurvey") },
      surveyLink: val("e-survey"),
      attendeeMail: $("e-amail")?.checked === true,
      // No tick on the form means "we are not saying", not "no" — otherwise
      // every save would clear the flag on an event that had it set.
      sponsorsWelcome: SPONSORS_ON ? $("e-sponsors")?.checked === true : undefined,
      contractDraft: draftId ?? undefined,
    };
    if (!ev) { body.presenters = parsePeople(val("e-people")); body.invite = $("e-invite").checked; }
    const leadRow = body.board.find((m) => m.lead);
    if (!leadRow) {
      $("problem").innerHTML = `<div class="bad"><b>Pick a lead.</b> Tick the board members for this event and mark one as the lead. Presenters reply to them, and their name and number go on the agreement.</div>`;
      $("board").scrollIntoView({ behavior: "smooth", block: "center" });
      busy = false; e.target.disabled = false; return;
    }

    try {
      const out = ev
        ? await api(`/events?id=${encodeURIComponent(ev.id)}`, { method: "PUT", body: JSON.stringify(body) })
        : await api("/events", { method: "POST", body: JSON.stringify(body) });
      const sent = (out.added ?? []).filter((a) => a.invited).length;
      toast(ev ? "Saved." : out.added?.length ? `Event created with ${out.added.length} presenter${out.added.length === 1 ? "" : "s"}${sent ? `; ${sent} invitation${sent === 1 ? "" : "s"} emailed` : ""}.` : "Event created. Add presenters next.");
      if (out.rejected?.length) alert("Not added:\n" + out.rejected.map((r) => `${JSON.stringify(r.row)} — ${r.why}`).join("\n"));
      if (out.notSent?.length) alert("Added but not emailed:\n" + out.notSent.map((r) => `${r.name} — ${r.why}`).join("\n"));
      view = { name: "event", eventId: out.event.id };
      busy = false; render();
    } catch (err) {
      busy = false; e.target.disabled = false;
      $("problem").innerHTML = `<div class="bad"><b>Couldn't save it.</b> ${esc(err.message)}</div>`;
    }
  };
}

/* ---------- the year ----------
   One screen that answers "what is coming, and when am I overloaded?".
   Everything here is derived from events that already exist — no new data. */
const MONTH_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const yearOf  = (iso) => Number(String(iso ?? "").slice(0, 4));
const monthOf = (iso) => Number(String(iso ?? "").slice(5, 7));
const dayOf   = (iso) => Number(String(iso ?? "").slice(8, 10));
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
const isDate = (iso) => /^\d{4}-\d{2}-\d{2}/.test(iso ?? "");
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);

/** Saturdays and Sundays, shaded, so a run of training days reads at a glance. */
function weekendWash(y, m) {
  const D = daysInMonth(y, m), stops = [];
  for (let d = 1; d <= D; d++) {
    const wd = new Date(y, m - 1, d).getDay();
    const col = wd === 0 || wd === 6 ? "rgba(18,22,31,.032)" : "transparent";
    stops.push(`${col} ${((d - 1) / D * 100).toFixed(3)}%`, `${col} ${(d / D * 100).toFixed(3)}%`);
  }
  return `linear-gradient(90deg,${stops.join(",")})`;
}

/** The three dates an event counts back to, and whether each still has work behind it. */
function deadlinesOf(ev) {
  const c = ev.counts ?? { total: 0, invited: 0, opened: 0, approved: 0 };
  return [
    { key: "agreement", label: "Agreements", iso: ev.deadlines?.agreement, left: (c.invited ?? 0) + (c.opened ?? 0) },
    { key: "draft", label: "Draft materials", iso: ev.deadlines?.draft, left: (c.total ?? 0) - (ev.materials?.draft ?? 0) },
    { key: "final", label: "Final materials", iso: ev.deadlines?.final, left: (c.total ?? 0) - (ev.materials?.final ?? 0) },
  ].filter((d) => isDate(d.iso));
}

/** Which years this desk has anything in — training dates and deadlines alike. */
function yearsWithWork(events) {
  const years = new Set();
  for (const ev of events) {
    if (isDate(ev.dayOne)) years.add(yearOf(ev.dayOne));
    if (isDate(ev.lastDay)) years.add(yearOf(ev.lastDay));
    for (const d of deadlinesOf(ev)) years.add(yearOf(d.iso));
  }
  return [...years].sort((a, b) => a - b);
}

/** Open on the year the next event falls in, not on an empty current year. */
function defaultYear(events, today) {
  const upcoming = events.filter((e) => isDate(e.lastDay ?? e.dayOne) && (e.lastDay ?? e.dayOne) >= today)
    .map((e) => yearOf(e.dayOne)).sort((a, b) => a - b);
  if (upcoming.length) return upcoming[0];
  const years = yearsWithWork(events);
  return years.length ? years[years.length - 1] : yearOf(today);
}

/** The weeks that will hurt, named plainly rather than left to be spotted. */
function crunchOf(events, year, today) {
  const inYear = events.filter((e) => isDate(e.dayOne) && yearOf(e.dayOne) === year)
    .sort((a, b) => a.dayOne.localeCompare(b.dayOne));
  const out = [];
  const span = (e) => ({ from: e.dayOne, to: e.lastDay && e.lastDay >= e.dayOne ? e.lastDay : e.dayOne });

  for (let i = 0; i < inYear.length; i++) {
    for (let j = i + 1; j < inYear.length; j++) {
      const a = span(inYear[i]), b = span(inYear[j]);
      if (a.from <= b.to && b.from <= a.to) {
        out.push({ stop: true, what: `${inYear[i].title} and ${inYear[j].title} overlap`,
          when: `${fmtDate(b.from)} — you cannot be at both.`, id: inYear[j].id });
      } else if (b.from > a.to && daysBetween(a.to, b.from) <= 2) {
        out.push({ stop: false, what: `${inYear[i].title} runs straight into ${inYear[j].title}`,
          when: `${daysBetween(a.to, b.from)} day${daysBetween(a.to, b.from) === 1 ? "" : "s"} between them — ${fmtDate(a.to)} to ${fmtDate(b.from)}.`, id: inYear[j].id });
      }
    }
  }

  // A deadline landing while you are away at something else.
  for (const ev of events) {
    for (const d of deadlinesOf(ev)) {
      if (yearOf(d.iso) !== year || d.left <= 0) continue;
      for (const other of inYear) {
        if (other.id === ev.id) continue;
        const o = span(other);
        if (d.iso >= o.from && d.iso <= o.to) {
          out.push({ stop: false, what: `${d.label.toLowerCase()} for ${ev.title} fall due while you are at ${other.title}`,
            when: `${fmtDate(d.iso)} · ${d.left} outstanding.`, id: ev.id });
        }
      }
    }
  }

  // Jobs that are ONGIA's own, already past their date.
  for (const ev of inYear) {
    const late = ev.checklist?.late ?? 0;
    if (late) {
      out.push({ stop: false, what: `${late} job${late === 1 ? "" : "s"} on your own checklist for ${ev.title} ${late === 1 ? "is" : "are"} overdue`,
        when: `${ev.checklist.done} of ${ev.checklist.total} done · ${fmtDate(ev.dayOne)}.`, id: ev.id });
    }
  }

  // Three or more deadlines inside one week.
  const marks = events.flatMap((ev) => deadlinesOf(ev).filter((d) => yearOf(d.iso) === year && d.left > 0)
    .map((d) => ({ ...d, title: ev.title, id: ev.id })));
  marks.sort((a, b) => a.iso.localeCompare(b.iso));
  for (let i = 0; i < marks.length; i++) {
    const week = marks.filter((m) => m.iso >= marks[i].iso && daysBetween(marks[i].iso, m.iso) <= 6);
    if (week.length >= 3 && (i === 0 || daysBetween(marks[i - 1].iso, marks[i].iso) > 6)) {
      out.push({ stop: false, what: `${week.length} deadlines inside one week`,
        when: `${fmtDate(week[0].iso)} to ${fmtDate(week[week.length - 1].iso)} · ${[...new Set(week.map((m) => m.title))].join(", ")}.`, id: week[0].id });
    }
  }
  return out;
}

function yearScreen(events, year) {
  BARRIGHT.innerHTML = `<button class="chip" id="back">Events</button><button class="chip" id="printyear">Print</button>`;
  document.getElementById("back").onclick = () => { view = { name: "list" }; render(); };
  document.getElementById("printyear").onclick = () => window.print();

  const today = todayIso();
  const years = yearsWithWork(events);
  const mine = events.filter((e) => isDate(e.dayOne) && yearOf(e.dayOne) === year)
    .sort((a, b) => a.dayOne.localeCompare(b.dayOne));

  const trainingDays = mine.reduce((n, e) => n + (isDate(e.lastDay) ? daysBetween(e.dayOne, e.lastDay) + 1 : 1), 0);
  const cities = new Set(mine.map((e) => (e.city ?? "").trim()).filter(Boolean)).size;
  const presenters = mine.reduce((n, e) => n + (e.counts?.total ?? 0), 0);
  const outstanding = mine.reduce((n, e) => n + ((e.counts?.total ?? 0) - (e.counts?.approved ?? 0)), 0);

  const head = `<div class="card"><div class="card-head">
      <div class="yearhead">
        <button class="ynav" id="yprev" ${years.some((y) => y < year) ? "" : "disabled"} title="Earlier year">&#8249;</button>
        <span class="yr">${year}</span>
        <button class="ynav" id="ynext" ${years.some((y) => y > year) ? "" : "disabled"} title="Later year">&#8250;</button>
      </div>
      <div style="flex:1"></div></div>
    <div class="tiles">
      <div class="tile"><div class="k">Events</div><div class="v">${mine.length}</div></div>
      <div class="tile"><div class="k">Training days</div><div class="v">${trainingDays}</div></div>
      <div class="tile"><div class="k">Cities</div><div class="v">${cities}</div></div>
      <div class="tile"><div class="k">Presenters</div><div class="v">${presenters}</div></div>
      <div class="tile${outstanding ? " accent" : ""}"><div class="k">Agreements out</div><div class="v">${outstanding}</div></div>
    </div>
    ${monthsMarkup(events, year, today)}
    <div class="ylegend">
      <span><i style="background:var(--navy);height:13px;border-radius:4px"></i>Training dates</span>
      <span><i style="background:var(--gold);width:3px;height:5px"></i>Agreements due</span>
      <span><i style="background:var(--wait);width:3px;height:8px"></i>Draft materials due</span>
      <span><i style="background:var(--navy);width:3px;height:11px"></i>Final materials due</span>
      <span><i style="background:var(--late);width:4px;height:13px"></i>Overdue</span>
      <span style="color:var(--muted)">Shaded columns are weekends.</span>
    </div>
    <div class="card-body" style="padding-top:10px"></div></div>`;

  const crunch = crunchOf(events, year, today);
  const crunchCard = crunch.length ? `<div class="needs crunch"><h2>Watch these weeks</h2>
    ${crunch.map((c) => `<div class="nrow${c.stop ? " stop" : ""}">
      <div class="why"><b>${esc(c.what)}</b><div class="who">${esc(c.when)}</div></div>
      <button class="mini" data-goev="${esc(c.id)}">Open event</button></div>`).join("")}</div>` : "";

  ROOT.innerHTML = head + crunchCard + listForYear(mine, today, year) + templateCard();

  wireTemplate();
  document.getElementById("yprev").onclick = () => { view = { name: "year", year: Math.max(...years.filter((y) => y < year)) }; render(); };
  document.getElementById("ynext").onclick = () => { view = { name: "year", year: Math.min(...years.filter((y) => y > year)) }; render(); };
  ROOT.querySelectorAll("[data-goev]").forEach((b) => {
    b.onclick = () => { view = { name: "event", eventId: b.dataset.goev }; render(); };
  });
}

/**
 * The standard checklist. Every new event starts from this, and an older event
 * can pull it in. Edited rarely, so it is folded away until it is wanted.
 */
function templateCard() {
  return `<div class="card"><div class="card-body" style="padding-top:6px">
    <details class="settings" id="tmpl"><summary>The standard checklist new events start from</summary>
      <p class="hint" style="margin-top:10px">Put the jobs in the order they get done; the arrows move a job up or down.
        A date is optional and counts from day one of the training, so one list works for every event whatever its
        dates. A new event is created with this list already on it, and an older event offers to catch up.</p>
      <div id="tmplrows" style="margin-top:12px"><p class="hint">Loading…</p></div>
      <div class="actions" style="justify-content:flex-start">
        <button class="mini" id="tmpl-add">Add a job</button>
        <button class="btn btn-gold" id="tmpl-save" style="padding:9px 20px;font-size:14px">Save the list</button>
        <span class="hint" id="tmpl-said" style="align-self:center"></span>
      </div>
    </details></div></div>`;
}

/** Rows are built once and never redrawn while typing — a rebuild eats the caret. */
function wireTemplate() {
  const host = document.getElementById("tmplrows");
  const said = document.getElementById("tmpl-said");
  const box = document.getElementById("tmpl");
  if (!host || !box) return;
  let loaded = false;

  // A job with no date yet shows an empty box, never 0: 0 would mean "on day
  // one", and saving would quietly give every undated job that date. The two
  // letter jobs and any "RBH ITP only" job carry their marking through a save.
  const rowHtml = (t = { what: "", daysBefore: null }) => {
    const dated = Number.isFinite(t.daysBefore);
    const tags = [t.auto ? "sends the " + (t.auto === "survey" ? "survey" : "welcome letter") + " by itself" : "", t.onlyFor ? `${esc(t.onlyFor)} events only` : ""].filter(Boolean);
    return `<div class="job tjob" data-trow data-auto="${esc(t.auto ?? "")}" data-only="${esc(t.onlyFor ?? "")}" style="border-radius:12px;margin-bottom:6px;background:var(--sunk)">
      <input data-twhat type="text" maxlength="160" value="${esc(t.what)}" placeholder="Confirm the room layout">
      <input data-tdays type="number" min="0" max="730" inputmode="numeric" value="${dated ? Math.abs(t.daysBefore) : ""}" placeholder="no date">
      <select data-twhen style="width:auto"><option value="before"${t.from !== "cutoff" && (!dated || t.daysBefore >= 0) ? " selected" : ""}>before day one</option><option value="after"${t.from !== "cutoff" && dated && t.daysBefore < 0 ? " selected" : ""}>after the last day</option><option value="cutoff"${t.from === "cutoff" ? " selected" : ""}>before the hotel cut-off</option></select>
      <div class="jact"><button type="button" data-tup title="Move up" aria-label="Move up">&#8593;</button><button type="button" data-tdown title="Move down" aria-label="Move down">&#8595;</button><button type="button" data-tdel title="Remove this job" aria-label="Remove this job">&#10005;</button></div>
      ${tags.length ? `<div class="hint" style="grid-column:1/-1;margin:0">${tags.join(" · ")}</div>` : ""}
    </div>`;
  };

  // Order matters: the list runs in the order the jobs get done, and events keep it.
  const wireRow = (row) => {
    row.querySelector("[data-tdel]").onclick = () => { row.remove(); said.textContent = ""; };
    row.querySelector("[data-tup]").onclick = () => {
      const prev = row.previousElementSibling;
      if (prev?.matches("[data-trow]")) { host.insertBefore(row, prev); said.textContent = ""; row.querySelector("[data-tup]").focus(); }
    };
    row.querySelector("[data-tdown]").onclick = () => {
      const next = row.nextElementSibling;
      if (next?.matches("[data-trow]")) { host.insertBefore(next, row); said.textContent = ""; row.querySelector("[data-tdown]").focus(); }
    };
  };
  const addRow = (t) => {
    const wrap = document.createElement("div");
    wrap.innerHTML = rowHtml(t);
    const row = wrap.firstElementChild;
    host.appendChild(row);
    wireRow(row);
    return row;
  };

  const load = async () => {
    if (loaded) return;
    loaded = true;
    try {
      const { template } = await api("/tasks?template=1");
      host.innerHTML = "";
      if (!template.length) host.innerHTML = `<p class="hint">Nothing on the standard list yet.</p>`;
      template.forEach((t) => addRow(t));
    } catch (e) { host.innerHTML = `<div class="bad">${esc(e.message)}</div>`; }
  };
  box.addEventListener("toggle", () => { if (box.open) load(); });
  if (box.open) load();

  document.getElementById("tmpl-add").onclick = () => {
    if (!loaded) return;
    host.querySelector(".hint")?.remove();
    addRow().querySelector("[data-twhat]").focus();
  };

  document.getElementById("tmpl-save").onclick = async (e) => {
    const btn = e.currentTarget;
    const tasks = [...host.querySelectorAll("[data-trow]")].map((row) => {
      const raw = row.querySelector("[data-tdays]").value.trim();
      const n = raw === "" ? null : Math.abs(Number(raw));
      const from = row.querySelector("[data-twhen]").value;
      return {
        what: row.querySelector("[data-twhat]").value.trim(),
        daysBefore: n === null ? null : from === "after" ? -n : n,
        from: from === "cutoff" ? "cutoff" : undefined,
        auto: row.dataset.auto || undefined,
        onlyFor: row.dataset.only || undefined,
      };
    });
    const bad = tasks.filter((t) => !t.what || (t.daysBefore !== null && !Number.isFinite(t.daysBefore)));
    if (bad.length) { said.textContent = "Every row needs wording. Leave the days empty if there is no date yet."; said.style.color = "var(--late)"; return; }
    btn.disabled = true; said.style.color = ""; said.textContent = "Saving…";
    try {
      const out = await api("/tasks?template=1", { method: "PUT", body: JSON.stringify({ tasks }) });
      said.textContent = `Saved — ${out.template.length} job${out.template.length === 1 ? "" : "s"}. New events start from this; an older event offers to catch up on its own page.`;
    } catch (err) { said.textContent = err.message; said.style.color = "var(--late)"; }
    btn.disabled = false;
  };
}

/** Twelve tracks. An event is a band where it falls; its deadlines are ticks below. */
function monthsMarkup(events, year, today) {
  const rows = [];
  for (let m = 1; m <= 12; m++) {
    const D = daysInMonth(year, m);
    const pct = (d) => ((d - 1) / D) * 100;

    // Every event that touches this month, clipped to it.
    const segs = events.filter((e) => isDate(e.dayOne)).map((e) => {
      const from = e.dayOne, to = isDate(e.lastDay) && e.lastDay >= e.dayOne ? e.lastDay : e.dayOne;
      const first = `${year}-${String(m).padStart(2, "0")}-01`;
      const last = `${year}-${String(m).padStart(2, "0")}-${String(D).padStart(2, "0")}`;
      if (to < first || from > last) return null;
      return { ev: e, a: from < first ? 1 : dayOf(from), b: to > last ? D : dayOf(to),
               runs: from <= today && today <= to, past: to < today,
               // An event running across a month boundary is named once, in the
               // month it starts; the tail is just the bar continuing.
               starts: from >= first };
    }).filter(Boolean).sort((x, y) => x.a - y.a || x.b - y.b);

    // One line per event, so a short bar's name never runs under the next bar.
    // Only a crowded month packs them, and then names sit inside the bars.
    const crowded = segs.length > 4;
    const lanes = [];
    for (const seg of segs) {
      const lane = crowded ? lanes.find((rowSegs) => rowSegs[rowSegs.length - 1].b < seg.a) : null;
      if (lane) lane.push(seg); else lanes.push([seg]);
    }

    const marks = events.flatMap((e) => deadlinesOf(e)
      .filter((d) => yearOf(d.iso) === year && monthOf(d.iso) === m)
      .map((d) => ({ ...d, ev: e, late: d.iso < today && d.left > 0 })));

    const isNow = yearOf(today) === year && monthOf(today) === m;
    rows.push(`<div class="mrow${segs.length || marks.length ? "" : " quiet"}${isNow ? " now" : ""}">
      <div class="mname">${MONTH_LONG[m - 1]}</div>
      <div class="mtrack">
        ${segs.length ? `<div class="mweek" style="background-image:${weekendWash(year, m)}"></div>` : ""}
        ${isNow ? `<div style="position:absolute;top:0;bottom:0;left:${pct(dayOf(today)) + (100 / D) / 2}%;width:2px;background:var(--gold);opacity:.9;pointer-events:none" title="Today"></div>` : ""}
        ${lanes.length ? lanes.map((lane) => `<div class="lane">${lane.map((seg) => {
          const width = ((seg.b - seg.a + 1) / D) * 100;
          const name = esc(seg.ev.city || seg.ev.title);
          const tip = `${esc(seg.ev.title)} · ${esc(seg.ev.city ?? "")} · ${esc(fmtDate(seg.ev.dayOne))}${seg.ev.lastDay && seg.ev.lastDay !== seg.ev.dayOne ? " – " + esc(fmtDate(seg.ev.lastDay)) : ""}`;
          // Wide enough to hold the name, or the name goes alongside — on the
          // left when the bar is near the end of the month, so it never clips.
          const inside = width >= 17 || crowded;
          const side = seg.a / D > 0.62 ? "left" : "right";
          const at = side === "left" ? pct(seg.a) : pct(seg.a) + width;
          return `<button class="band${seg.runs ? " runs" : seg.past ? " past" : ""}" data-goev="${esc(seg.ev.id)}"
            style="left:${pct(seg.a)}%;width:${width}%" title="${tip}">${inside && seg.starts ? name : ""}</button>`
            + (!inside && seg.starts ? `<span class="blabel ${side}${seg.past ? " past" : ""}" style="left:${at}%">${name}</span>` : "");
        }).join("")}</div>`).join("") : `<div class="lane"></div>`}
        <div class="ticks">${marks.map((mk) => `<i class="tick ${mk.key}${mk.late ? " late" : ""}"
          style="left:${pct(dayOf(mk.iso)) + (100 / D) / 2}%"
          title="${esc(mk.label)} for ${esc(mk.ev.title)} — ${esc(fmtDate(mk.iso))}${mk.left > 0 ? ` · ${mk.left} outstanding` : " · all in"}"></i>`).join("")}</div>
      </div></div>`);
  }
  return `<div class="months">${rows.join("")}</div>`;
}

/** How the desk's own jobs are going on one event, in one chip. */
function jobsChip(ev) {
  const k = ev.checklist;
  if (!k || !k.total) return "";
  if (k.late) return `<span class="chipstat stop"><b>${k.late}</b>job${k.late === 1 ? "" : "s"} overdue</span>`;
  const cls = k.done === k.total ? " good" : k.soon ? " hot" : "";
  return `<span class="chipstat${cls}"><b>${k.done}<small>/${k.total}</small></b>jobs done</span>`;
}

/** The same year as a plain list — what you read, and what prints. */
function listForYear(mine, today, year) {
  if (!mine.length) {
    return `<div class="card"><div class="empty">Nothing in ${year} yet. Create an event and it appears here.</div></div>`;
  }
  const rows = mine.map((ev) => {
    const c = ev.counts ?? { total: 0, approved: 0 };
    const when = `${fmtDate(ev.dayOne)}${ev.lastDay && ev.lastDay !== ev.dayOne ? " – " + fmtDate(ev.lastDay) : ""}`;
    const dates = deadlinesOf(ev).map((d) => {
      const late = d.iso < today && d.left > 0;
      return `<span class="${late ? "od" : ""}">${esc(d.label)} <b>${esc(fmtDate(d.iso).replace(/^\w+ /, ""))}</b>${late ? ` · ${d.left} out` : ""}</span>`;
    }).join("");
    const lead = ev.contact?.name || ev.reviewer?.name || "";
    return `<div class="trow">
      <div class="who"><div><div class="pname">${esc(ev.title)}</div>
        <div class="porg">${esc(ev.city ?? "")}${ev.venue ? " · " + esc(ev.venue) : ""}</div>
        ${lead ? `<div class="ptalk">Lead: ${esc(lead)}</div>` : ""}</div></div>
      <div class="cell"><div class="cl">When</div><div style="font-weight:600">${esc(when)}</div>
        <div class="ydates" style="margin-top:5px">${dates}</div></div>
      <div class="act"><span class="chipstat"><b>${c.approved}<small>/${c.total}</small></b>signed</span>
        ${jobsChip(ev)}
        <button class="mini" data-goev="${esc(ev.id)}">Open</button></div></div>`;
  }).join("");
  return `<div class="card"><div class="card-head"><div><h2>${year} in order</h2>
      <div class="s">${mine.length} event${mine.length === 1 ? "" : "s"}, earliest first.</div></div></div>
    <div class="card-body"><div class="tlist yrlist">${rows}</div></div></div>`;
}
