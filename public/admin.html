function wireRooming(ev, R) {
  document.querySelectorAll("[data-hgo]").forEach((b) => {
    b.onclick = () => { view = { name: "edit", eventId: ev.id, focus: b.dataset.hgo }; render(); };
  });
  if (!R) return;
  const q = `/rooming?event=${encodeURIComponent(ev.id)}`;
  const keys = () => [...document.querySelectorAll("[data-room]:checked")].map((b) => b.dataset.room);

  const csv = document.getElementById("rm-csv");
  if (csv) csv.onclick = async () => {
    try {
      const res = await apiFetch(`/api${q}&csv=1&keys=${encodeURIComponent(keys().join(","))}`, { headers: { "x-admin-key": KEY } });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `Download failed (${res.status})`);
      const url = URL.createObjectURL(await res.blob());
      const a = Object.assign(document.createElement("a"), { href: url, download: `rooming-list-${ev.title.replace(/[^\w]+/g, "-").toLowerCase()}.csv` });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30_000);
    } catch (e) { toast(e.message); }
  };

  const open = document.getElementById("rm-send");
  if (open) open.onclick = async () => {
    const chosen = keys();
    if (!chosen.length) { toast("Tick at least one room to send."); return; }
    const dlg = document.getElementById("rmdlg"), said = document.getElementById("rm-said");
    said.textContent = "";
    try {
      const pv = await api(`${q}&preview=1`, { method: "POST", body: JSON.stringify({ keys: chosen }) });
      document.getElementById("rm-to").value = pv.to || "";
      document.getElementById("rm-cc").textContent = `${pv.rows} room${pv.rows === 1 ? "" : "s"}, with the list attached as a spreadsheet.${pv.cc ? ` A copy goes to ${pv.cc}, and the hotel's reply comes back to them.` : ""}`;
      document.getElementById("rm-frame").srcdoc = pv.html;
      dlg.showModal();
    } catch (e) { toast(e.message); }
  };
  const go = document.getElementById("rm-go");
  if (go) go.onclick = async () => {
    const said = document.getElementById("rm-said"), to = document.getElementById("rm-to").value.trim();
    if (!/@/.test(to)) { said.textContent = "Type the hotel's address."; return; }
    go.disabled = true; said.textContent = `Sending to ${to}…`;
    try {
      const out = await api(`${q}&send=1`, { method: "POST", body: JSON.stringify({ keys: keys(), to }) });
      document.getElementById("rmdlg").close();
      toast(`Sent to ${out.to}.${out.ticked ? ` "${out.ticked}" is ticked.` : ""}`);
      render();
    } catch (e) { said.textContent = e.message; go.disabled = false; }
  };

  const saveGuests = async (list) => {
    const said = document.getElementById("rg-said");
    try { await api(q, { method: "PUT", body: JSON.stringify({ guests: list }) }); render(); }
    catch (e) { said.textContent = e.message; said.style.color = "var(--late)"; }
  };
  const add = document.getElementById("rg-add");
  if (add) add.onclick = (e) => {
    e.preventDefault();
    const type = document.getElementById("rg-type").value, desc = document.getElementById("rg-desc")?.value.trim() ?? "";
    if (type === "Other" && !desc) { const said = document.getElementById("rg-said"); said.textContent = "Say who they are, e.g. Peel Police Association or a visiting dignitary."; said.style.color = "var(--late)"; document.getElementById("rg-desc")?.focus(); return; }
    saveGuests([...R.guests, { name: document.getElementById("rg-name").value, type,
      checkIn: document.getElementById("rg-in").value, checkOut: document.getElementById("rg-out").value, billing: document.getElementById("rg-bill").value,
      ...(type === "Other" ? { note: desc } : {}) }]);
  };
  // "Other" asks who they are.
  const rgType = document.getElementById("rg-type");
  if (rgType) rgType.addEventListener("change", () => { const box = document.getElementById("rg-descbox"); if (box) box.hidden = rgType.value !== "Other"; if (rgType.value === "Other") document.getElementById("rg-desc")?.focus(); });
  const geType = document.getElementById("ge-type");
  if (geType) geType.addEventListener("change", () => {
    const lab = document.querySelector('label[for="ge-note"]');
    if (lab) lab.textContent = geType.value === "Other" ? "Who they are (required)" : "Note (optional)";
  });

  // The blank sheet: the same columns as the form, ready for Excel.
  const blank = document.getElementById("rg-blank");
  if (blank) blank.onclick = (e) => {
    e.preventDefault();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeffName,Type,Check-in,Check-out,Who pays,Note\r\n"], { type: "text/csv" }));
    a.download = `hotel-rooms-${ev.title.replace(/[^\w]+/g, "-").replace(/^-|-$/g, "").toLowerCase()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  // A spreadsheet is read first and shown; nothing is added until Andrew says so.
  const up = document.getElementById("rg-up"), fileIn = document.getElementById("rg-file"), box = document.getElementById("rg-read");
  if (up && fileIn && box) {
    up.onclick = (e) => { e.preventDefault(); fileIn.click(); };
    fileIn.onchange = async () => {
      const f = fileIn.files?.[0];
      fileIn.value = "";
      if (!f) return;
      box.innerHTML = `<p class="gread">Reading ${esc(f.name)}…</p>`;
      const csv = await f.text();
      try {
        const out = await api(`${q}&upload=1`, { method: "POST", body: JSON.stringify({ csv }) });
        const list = (xs, fmt) => `<ul>${xs.map((x) => `<li>${fmt(x)}</li>`).join("")}</ul>`;
        const types = GUEST_TYPES.map((t) => [t, out.add.filter((g) => g.type === t).length]).filter(([, n]) => n).map(([t, n]) => `${n} ${t}${n === 1 ? "" : "s"}`).join(", ");
        box.innerHTML = `<div class="note gread" style="margin-top:12px">
          <b>${out.add.length} ${out.add.length === 1 ? "person" : "people"} to add</b>${types ? ` (${esc(types)})` : ""}.
          ${out.add.length ? list(out.add, (g) => `${esc(g.name)} · ${esc(g.type)} · ${esc(shortDate(g.checkIn))} → ${esc(shortDate(g.checkOut))}${g.board ? " · on the board" : ""}${g.billing === "Guest" ? " · pays their own room" : g.board ? ", ONGIA pays" : ""}`) : ""}
          ${out.problems.length ? `<b style="color:var(--late)">${out.problems.length} row${out.problems.length === 1 ? "" : "s"} not added, fix ${out.problems.length === 1 ? "it" : "them"} in the sheet and upload again:</b>
            ${list(out.problems, (p) => `Row ${p.line}${p.name ? `, ${esc(p.name)}` : ""}: ${esc(p.why)}`)}` : ""}
          ${out.skipped.length ? `<b>${out.skipped.length} left out, already on the list:</b>${list(out.skipped, (p) => `Row ${p.line}, ${esc(p.name)} (${esc(p.why)})`)}` : ""}
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
            ${out.add.length ? `<button class="mini gold" id="rg-save">Add ${out.add.length === 1 ? "this person" : `these ${out.add.length}`}</button>` : ""}
            <button class="mini ghost" id="rg-cancel">${out.add.length ? "Cancel" : "Close"}</button></div></div>`;
        document.getElementById("rg-cancel").onclick = (e) => { e.preventDefault(); box.innerHTML = ""; };
        const save = document.getElementById("rg-save");
        if (save) save.onclick = async (e) => {
          e.preventDefault();
          save.disabled = true;
          try {
            const done = await api(`${q}&upload=1&save=1`, { method: "POST", body: JSON.stringify({ csv }) });
            toast(`${done.added} added to the rooming list.`);
            render();
          } catch (err) { save.disabled = false; toast(err.message); }
        };
      } catch (err) { box.innerHTML = `<div class="bad">${esc(err.message)}</div>`; }
    };
  }
  // A board name starts as ONGIA pays, and can be changed (Andrew 21 Oct 2026: a board member may pay their own
  // room to earn the hotel's points). Typing a board name sets ONGIA unless "Who pays" was already picked by hand.
  const boardLock = (nameId, billId, noteId) => {
    const nameEl = document.getElementById(nameId), bill = document.getElementById(billId), note = document.getElementById(noteId);
    if (!nameEl || !bill) return;
    const check = (typing = false) => {
      const on = (R.board ?? []).some((n) => sameName(n) === sameName(nameEl.value) && sameName(n));
      if (on && typing && bill.dataset.touched !== "1") bill.value = "ONGIA";
      bill.disabled = false;
      if (note) note.hidden = !on;
    };
    nameEl.addEventListener("input", () => check(true));
    bill.addEventListener("change", () => { bill.dataset.touched = "1"; });
    check();
    return () => { bill.dataset.touched = ""; check(); };
  };
  boardLock("rg-name", "rg-bill", "rg-boardnote");
  const rgDet = document.getElementById("rg-details");
  if (rgDet) rgDet.addEventListener("toggle", () => { RG_OPEN = rgDet.open; });
  // "Add to hotel list": open the by-hand form with the board member filled in, so only the nights are left.
  document.querySelectorAll("[data-addboard]").forEach((b) => {
    b.onclick = (e) => {
      e.preventDefault();
      const det = document.getElementById("rg-details");
      if (det) det.open = true;
      const nameEl = document.getElementById("rg-name");
      nameEl.value = b.dataset.addboard;
      nameEl.dispatchEvent(new Event("input", { bubbles: true }));   // board name: ONGIA pays
      document.getElementById("rg-type").value = "Board Member";
      const said = document.getElementById("rg-said");
      said.style.color = ""; said.textContent = `Choose ${b.dataset.addboard}'s check-in and check-out, then press Add.`;
      const inEl = document.getElementById("rg-in");
      inEl.scrollIntoView({ block: "center", behavior: "smooth" });
      inEl.focus({ preventScroll: true });
    };
  });
  const lockEdit = boardLock("ge-name", "ge-bill", "ge-boardnote");

  // Edit someone added on the desk, from their row on the list.
  const gd = document.getElementById("gedlg");
  let editing = null;
  document.querySelectorAll("[data-gedit]").forEach((b) => {
    b.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();          // the row is a label: do not tick or untick it
      const g = R.guests.find((x) => x.id === b.dataset.gedit);
      if (!g || !gd) return;
      editing = g.id;
      document.getElementById("ge-name").value = g.name;
      document.getElementById("ge-type").innerHTML = (g.type ? "" : `<option value="" selected>Pick one</option>`)
        + GUEST_TYPES.map((t) => `<option${t === g.type ? " selected" : ""}>${t}</option>`).join("");
      document.getElementById("ge-bill").value = g.billing === "Guest" ? "Guest" : "ONGIA";
      document.getElementById("ge-in").innerHTML = guestDays(R.window, "in", ev, g.checkIn);
      document.getElementById("ge-out").innerHTML = guestDays(R.window, "out", ev, g.checkOut);
      document.getElementById("ge-note").value = g.note || "";
      document.querySelector('label[for="ge-note"]').textContent = g.type === "Other" ? "Who they are (required)" : "Note (optional)";
      document.getElementById("ge-said").textContent = "";
      lockEdit?.();
      gd.showModal();
    };
  });
  const geSave = document.getElementById("ge-save");
  if (geSave) geSave.onclick = async () => {
    const said = document.getElementById("ge-said");
    const list = R.guests.map((g) => (g.id !== editing ? g : { ...g,
      name: document.getElementById("ge-name").value, type: document.getElementById("ge-type").value,
      billing: document.getElementById("ge-bill").value, checkIn: document.getElementById("ge-in").value,
      checkOut: document.getElementById("ge-out").value, note: document.getElementById("ge-note").value }));
    geSave.disabled = true;
    try { await api(q, { method: "PUT", body: JSON.stringify({ guests: list }) }); gd.close(); toast("Saved."); render(); }
    catch (err) { said.textContent = err.message; }
    geSave.disabled = false;
  };
  const geDel = document.getElementById("ge-del");
  if (geDel) geDel.onclick = async () => {
    const g = R.guests.find((x) => x.id === editing);
    if (!g || !confirm(`Take ${g.name} off the rooming list?`)) return;
    try { await api(q, { method: "PUT", body: JSON.stringify({ guests: R.guests.filter((x) => x.id !== editing) }) }); gd.close(); render(); }
    catch (err) { document.getElementById("ge-said").textContent = err.message; }
  };

  // A presenter's row: how they are listed, nothing else.
  const pd = document.getElementById("pldlg");
  let listing = null;
  document.querySelectorAll("[data-pedit]").forEach((b) => {
    b.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      const r = R.rows.find((x) => x.key === b.dataset.pedit);
      if (!r || !pd) return;
      listing = r.key;
      document.getElementById("pl-title").textContent = `How ${r.name} is listed`;
      document.getElementById("pl-type").innerHTML = GUEST_TYPES.map((t) => `<option${t === r.type ? " selected" : ""}>${t}</option>`).join("");
      document.getElementById("pl-said").textContent = "";
      pd.showModal();
    };
  });
  const plSave = document.getElementById("pl-save");
  if (plSave) plSave.onclick = async () => {
    plSave.disabled = true;
    try {
      await api(`${q}&listed=1`, { method: "PUT", body: JSON.stringify({ id: listing, type: document.getElementById("pl-type").value }) });
      pd.close(); toast("Saved."); render();
    } catch (err) { document.getElementById("pl-said").textContent = err.message; }
    plSave.disabled = false;
  };

  // Who someone is can be changed in place: a slip in a spreadsheet, or a person saved before the four types.
  document.querySelectorAll("[data-rmtype]").forEach((sel) => {
    sel.onchange = () => saveGuests(R.guests.map((g) => (g.id === sel.dataset.rmtype ? { ...g, type: sel.value } : g)));
  });
  document.querySelectorAll("[data-rmdel]").forEach((b) => {
    b.onclick = (e) => { e.preventDefault(); saveGuests(R.guests.filter((g) => g.id !== b.dataset.rmdel)); };
  });
}

/* ---------- the agenda and each day's times ---------- */

/** "8:30 AM" → "08:30" for a time box, and back. */
const toBox = (t) => {
  const m = String(t ?? "").match(/^(\d{1,2}):(\d{2}) (AM|PM)$/);
  if (!m) return "";
  const h = (Number(m[1]) % 12) + (m[3] === "PM" ? 12 : 0);
  return `${String(h).padStart(2, "0")}:${m[2]}`;
};

/**
 * The agenda, and the times that go into letters. Claude's reading is a
 * suggestion shown beside the boxes; only what Andrew saves is used.
 */
/* ---------- attendee emails: the switch at the top of an event ---------- */
function mailSwitch(ev, guests) {
  const on = ev.attendeeMail === true;
  const n = guests?.letters?.welcome?.reaches ?? null;
  const who = n === null ? "this event's attendees" : `${n} attendee${n === 1 ? "" : "s"}`;
  return `<div class="mailsw ${on ? "on" : "off"}">
    <label class="sw"><input type="checkbox" role="switch" id="amail"${on ? " checked" : ""} data-reach="${n ?? ""}" aria-label="Automatic emails to attendees"><span class="track"><span class="knob"></span></span></label>
    <div><b>Automatic emails to attendees: ${on ? "On" : "Off"}</b>
      <span>${on ? `The welcome letter, survey and hotel reminders go out by themselves to ${esc(who)}.` : "Nothing goes to attendees. Presenter emails are not affected."}</span></div></div>`;
}
function wireMailSwitch(ev) {
  const box = document.getElementById("amail");
  if (!box) return;
  box.onchange = async () => {
    const on = box.checked;
    if (on) {
      const n = box.dataset.reach;
      const ok = confirm(`Turn on automatic emails for ${ev.title}?\n\nThe welcome letter, survey and hotel cut-off reminders will start going out by themselves${n !== "" ? ` to ${n} attendee${n === "1" ? "" : "s"}` : ""}, on their dates.`);
      if (!ok) { box.checked = false; return; }
    }
    box.disabled = true;
    try {
      await api(`/events?id=${encodeURIComponent(ev.id)}&attendeeMail=1`, { method: "PUT", body: JSON.stringify({ on }) });
      toast(on ? "Attendee emails are on." : "Attendee emails are off.");
      render();
    } catch (e) { toast(e.message); box.checked = !on; box.disabled = false; }
  };
}

/* ---------- from your email ---------- */
// The day it arrived, in Toronto: a message at 9pm Eastern is stamped the next day in UTC.
const mailDay = (iso) => (iso ? fmtDate(todayIso(new Date(iso))).replace(/^\w+ /, "").replace(/ \d{4}$/, "") : "");
const daysTo = (iso) => Math.round((Date.parse(iso) - Date.parse(todayIso())) / 86400000);
const daysSince = (iso) => (iso ? -daysTo(todayIso(new Date(iso))) : 0);
// A plain date (a hold date, a training day) is already a Toronto day: no time zone to convert.
const plainDay = (d) => fmtDate(d).replace(/^\w+ /, "").replace(/ \d{4}$/, "");
const CHASE_DAYS = 5;
const inDays = (n) => (n === 0 ? "today" : n === 1 ? "tomorrow" : n < 0 ? `${-n} day${n === -1 ? "" : "s"} ago` : `in ${n} days`);

/**
 * When each item has to be dealt with, and how to say it. Hotel offers go by
 * the date the hotel holds them to; what someone needs from Andrew goes by the
 * event; what he is waiting on goes by how long it has waited, and after five
 * days it is something to chase.
 */
function ibUrgency(x, ev) {
  if (x.kind === "offer") {
    const h = x.offer?.holdUntil;
    if (h) { const n = daysTo(h); return { by: h, b: n < 0 ? "Hold ended" : `Hold ends ${plainDay(h)}`, s: inDays(n), urgent: n <= 7 }; }
    return { by: todayIso(new Date(Date.parse(x.received) + 14 * 86400000)), b: "No hold date", s: `offer ${mailDay(x.received)}`, urgent: false };
  }
  if (x.kind === "them") {
    const n = daysSince(x.received);
    return { by: todayIso(new Date(Date.parse(x.received) + CHASE_DAYS * 86400000)), b: n >= CHASE_DAYS ? `No answer in ${n} days` : `Asked ${mailDay(x.received)}`,
      s: n >= CHASE_DAYS ? "time to chase" : n === 0 ? "today" : `${n} day${n === 1 ? "" : "s"} ago`, chase: n >= CHASE_DAYS };
  }
  if (ev?.dayOne && /^\d{4}/.test(ev.dayOne)) {
    const n = daysTo(ev.dayOne);
    return { by: ev.dayOne, b: n < 0 ? "Event over" : `Event ${inDays(n)}`, s: `came ${mailDay(x.received)}`, urgent: n >= 0 && n <= 10, fromEvent: true };
  }
  return { by: todayIso(new Date(Date.parse(x.received) + 7 * 86400000)), b: `Came ${mailDay(x.received)}`, s: `${daysSince(x.received)} days ago`, urgent: false };
}

/** One row: a tick, who and what, when it is due, and ⋯ for move or hide. */
function ibRow(x, ev, { showEvent = false } = {}) {
  const u0 = ibUrgency(x, ev);
  // On an event's own card every row would say the same "Event in 23 days": say when it came.
  const ago = daysSince(x.received);
  const u = !showEvent && u0.fromEvent && !u0.urgent
    ? { ...u0, b: `Came ${mailDay(x.received)}`, s: ago === 0 ? "today" : `${ago} day${ago === 1 ? "" : "s"} ago` } : u0;
  const done = x.status === "done";
  const o = x.offer ?? {};
  const where = showEvent ? (ev?.id === "_unfiled" ? `<span class="ev">Not on the desk yet${x.guess ? `: ${esc(x.guess)}` : ""}</span>` : `<span class="ev">${esc(ev?.city ?? "")}</span>`) : "";
  const subj = x.subject ? (x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener" title="Open in Outlook">${esc(x.subject)} ↗</a>` : esc(x.subject))
    : x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">Open in Outlook ↗</a>` : x.byHand ? "Added by you" : "";
  const sub = [where, subj].filter(Boolean).join(" · ");
  const what = x.kind === "offer"
    ? `<b>${esc(o.hotel || x.who)}</b> <span class="ask">— offer from ${esc(x.who)}</span>`
    : x.kind === "them" ? `<b>${esc(x.who || "Someone")}</b> <span class="ask">· you asked for:</span> ${esc(x.note)}`
    : `<b>${esc(x.who || x.from || "")}</b> — ${esc(x.note)}`;
  const offer = x.kind === "offer" ? `<div class="offer">${o.rate ? `<span><i>Rooms</i> ${esc(o.rate)}</span>` : ""}${o.fbMinimum ? `<span><i>F&amp;B min</i> ${esc(o.fbMinimum)}</span>` : ""}${o.meetingRoom ? `<span><i>Meeting room</i> ${esc(o.meetingRoom)}</span>` : ""}${o.notes ? `<span>${esc(o.notes)}</span>` : ""}</div>` : "";
  const still = !done && x.kind === "you" && x.repliedAt ? `<div class="still">You replied ${esc(mailDay(x.repliedAt))}${x.stillToDo ? " · this part is still to do" : ""}</div>` : "";
  const closed = done ? `<b>Done</b> <span>${x.doneBy === "your reply" ? `your reply, ${esc(mailDay(x.doneAt))}` : x.doneBy && x.doneBy !== "you" ? `${esc(x.doneBy)}` : `ticked ${esc(mailDay(x.closedAt || x.doneAt))}`}</span>` : `<b>${esc(u.b)}</b> <span>${esc(u.s)}</span>`;
  return `<div class="ibrow${done ? " done" : u.chase ? " chase" : u.urgent ? " urgent" : ""}" data-ibev="${esc(ev?.id ?? "")}">
    <input type="checkbox" data-ibtick="${esc(x.id)}"${done ? " checked" : ""} aria-label="${done ? "Not done after all" : "Done"}: ${esc(x.offer?.hotel || x.who || "")}">
    <div class="body"><div class="what">${what}</div>${offer}${still}${sub ? `<div class="sub">${sub}</div>` : ""}</div>
    <div class="when">${closed}</div>
    <button class="more" data-ibmore="${esc(x.id)}" aria-label="More: move or hide">⋯</button></div>`;
}

/**
 * Items sorted for doing: open ones first ("to do" by when, "waiting on others" oldest first),
 * then the ticked ones at the bottom, the one ticked last at the top of them. Ticking an item
 * redraws the list, so it drops to the bottom by itself and unticking brings it back up.
 */
function ibGroups(pairs) {
  const by = ({ x, ev }) => ibUrgency(x, ev).by;
  const isDone = ({ x }) => x.status === "done";
  const closed = ({ x }) => String(x.closedAt || x.doneAt || "");
  const sorted = (list, openOrder) => [...list.filter((p) => !isDone(p)).sort(openOrder),
    ...list.filter(isDone).sort((a, b) => closed(b).localeCompare(closed(a)))];
  const todo = sorted(pairs.filter(({ x }) => x.kind !== "them"), (a, b) => by(a).localeCompare(by(b)));
  const them = sorted(pairs.filter(({ x }) => x.kind === "them"), (a, b) => String(a.x.received).localeCompare(String(b.x.received)));
  return { todo, them };
}

function inboxCard(ev, IB) {
  const title = ev.id === "_unfiled" ? "Email about events not on the desk" : "From your email";
  if (!IB) return `<div class="card" id="inbox"><div class="card-head"><div><h2>${title}</h2></div></div>
    <div class="card-body"><div class="bad"><b>Your email items could not be loaded.</b> Reload the page.</div></div></div>`;
  const recent = (x) => x.status === "done" && x.closedAt && Date.now() - Date.parse(x.closedAt) < 86400000;
  const live = IB.items.filter((x) => x.status === "open" || recent(x)).map((x) => ({ x, ev }));
  const older = IB.items.filter((x) => x.status === "done" && !recent(x));
  const { todo, them } = ibGroups(live);
  // The most urgent few, and the rest behind "Show all", so a busy event is not ten screens of email.
  const cap = ev.id === "_unfiled" ? Infinity : EVENT_ROWS;
  const section = (label, rows, id) => rows.length ? `<h3>${label}<b>${rows.filter(({ x }) => x.status === "open").length}</b></h3>
    <div class="ibrows" id="${id}">${rows.map(({ x }, i) => (i === cap ? `<div class="ibmorerows" hidden>` : "") + ibRow(x, ev)).join("")}${rows.length > cap ? "</div>" : ""}</div>
    ${rows.length > cap ? `<button class="mini ibshowall" data-ibshow="${id}">Show all ${rows.length}</button>` : ""}` : "";
  const status = IB.running ? `<p class="agread"><span class="spin" aria-hidden="true"></span> Reading your email now. This takes a minute or two.</p>`
    : IB.runError ? `<div class="bad" style="margin-top:0">${esc(IB.runError)}</div>`
    : IB.last?.lastError ? `<div class="bad" style="margin-top:0">The last read had a problem: ${esc(IB.last.lastError)}</div>` : "";
  const body = todo.length + them.length
    ? section("To do", todo, "eib-todo") + section("Waiting on others", them, "eib-them")
    : `<p class="ibempty">${IB.connected && IB.last?.at ? "Nothing open from your email for this event." : "Nothing here yet."}</p>`;
  const doneList = older.length ? `<details class="ibdonelist"><summary>Done earlier (${older.length})</summary><div class="ibrows" style="margin-top:8px">${older.map((x) => ibRow(x, ev)).join("")}</div></details>` : "";
  const sub = !IB.connected ? `Not switched on yet: the desk needs permission to read ${esc(IB.mailbox || "your mailbox")}.`
    : ev.id !== "_unfiled" ? `${esc(IB.mailbox)} · ${IB.last?.at ? `checked ${esc(mailDay(IB.last.at))}` : "not checked yet"}`
    : `From ${esc(IB.mailbox)}, ${IB.last?.at ? `checked ${esc(mailDay(IB.last.at))}` : "not checked yet"}. Tick what is done.`;
  const openN = (rows) => rows.filter(({ x }) => x.status === "open").length;
  const chaseN = them.filter(({ x }) => x.status === "open" && ibUrgency(x).chase).length;
  // On an event it is one of the folded sections, closed to start; on its own screen it is the page.
  const fold = ev.id === "_unfiled" ? "event" : "sec-email";
  return `<details class="card ibfold${ev.id === "_unfiled" ? "" : " secfold"}" id="inbox" data-fold="${fold}"${foldOpen(fold, ev.id === "_unfiled") ? " open" : ""}>
    ${foldHead(title, sub, openN(todo), chaseN, openN(them))}
    <div class="card-body ib">${status}${body}${doneList}
      <div class="ibfoot">${ev.id === "_unfiled" ? "" : `<button class="mini" id="ibadd">Add a note</button>`}${IB.connected ? `<button class="mini" id="ibrun"${IB.running ? " disabled" : ""}>Check email now</button>` : ""}
        <span>Only a short note is kept, never the email itself.</span></div></div></details>`;
}

// Whether a folded card is open, per browser, remembered the way he left it. Private windows may
// refuse storage: then each card starts the way it was made to.
const foldKey = (id) => `ongia-fold-${id}`;
const foldOpen = (id, start = true) => {
  try { const v = localStorage.getItem(foldKey(id)); return v === "open" ? true : v === "closed" ? false : start; } catch { return start; }
};

/**
 * One section of an event, folded. Closed, it is a single line: the name, where
 * things stand, and anything that needs him on the right. Open, it is the whole
 * card. Every section starts closed, so an event opens as a short list of what is
 * there instead of twenty screens of it; each one then stays the way he left it.
 */
// Open unless the person closed it: on the tabbed event page each card is what the tab is for.
function secFold(key, title, line, badge, inner, { id = "", open = true } = {}) {
  return `<details class="card ibfold secfold"${id ? ` id="${id}"` : ""} data-fold="sec-${key}"${foldOpen(`sec-${key}`, open) ? " open" : ""}>
    <summary class="card-head"><div><h2>${title}</h2>${line ? `<div class="s">${line}</div>` : ""}</div>
      ${badge ? `<span class="ibcount">${badge}</span>` : ""}<span class="ibcaret" aria-hidden="true">▾</span></summary>
    ${inner}</details>`;
}
function wireFolds() {
  ROOT.querySelectorAll("details.ibfold[data-fold]").forEach((d) => {
    d.ontoggle = () => { try { localStorage.setItem(foldKey(d.dataset.fold), d.open ? "open" : "closed"); } catch {} };
  });
}
/** The heading of a folding email card: title, a line under it, the counts, and the open/close mark. */
function foldHead(title, line, todoN, chaseN, themN) {
  const counts = [todoN ? `${todoN} to do` : "", chaseN ? `<span class="chase">${chaseN} to chase</span>` : themN ? `${themN} waiting` : ""].filter(Boolean).join(" · ") || "nothing open";
  return `<summary class="card-head"><div><h2>${title}</h2>${line ? `<div class="s">${line}</div>` : ""}</div>
    <span class="ibcount">${counts}</span><span class="ibcaret" aria-hidden="true">▾</span></summary>`;
}

const EVENT_ROWS = 8;

function inboxDialogs() {
  return `<dialog class="sheet" id="ibdlg"><form method="dialog">
      <div class="sheet-head"><h2>Add a note</h2><p class="hint" style="margin-top:6px">For something that came by phone or in person. It sits with the email items until you tick it.</p></div>
      <div class="sheet-body">
        <div class="field"><label>Whose move is it?</label>
          <label class="attest" style="margin-top:4px"><input type="radio" name="ib-kind" value="you" checked> I need to do something</label>
          <label class="attest" style="margin-top:4px"><input type="radio" name="ib-kind" value="them"> I am waiting on someone</label></div>
        <div class="field"><label for="ib-who">Who</label><input id="ib-who" maxlength="120" autocomplete="off" placeholder="e.g. Jaclyn Austin, Delta Toronto Airport"></div>
        <div class="field"><label for="ib-note">What</label><input id="ib-note" maxlength="240" required autocomplete="off" placeholder="e.g. Send her the final room count"></div>
        <div class="actions" style="margin-top:18px"><button class="btn btn-gold" value="save">Add it</button><button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button></div>
      </div></form></dialog>
    <dialog class="sheet" id="ibmore"><form method="dialog">
      <div class="sheet-head"><h2>This item</h2><p class="hint" style="margin-top:6px" id="ibm-what"></p></div>
      <div class="sheet-body">
        <div class="field"><label for="ibm-to">Belongs to a different event?</label><select id="ibm-to"></select></div>
        <div class="actions" style="margin-top:18px;flex-wrap:wrap">
          <button class="btn btn-gold" value="move">Move it</button>
          <button class="btn btn-ghost" value="dismiss">Not about an event — hide it</button>
          <button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button></div>
      </div></form></dialog>`;
}

let INBOX_POLL = null;
/** Ticks, ⋯, notes and "check now", wherever the rows are drawn (an event, home, unfiled). */
function wireInbox(items, events = [], { eventId = null, running = false } = {}) {
  clearTimeout(INBOX_POLL);
  wireFolds();
  const evOf = (el) => el.closest("[data-ibev]")?.dataset.ibev || eventId;
  const set = async (ev, id, body) => { try { await api(`/inbox?event=${encodeURIComponent(ev)}&item=${encodeURIComponent(id)}`, { method: "PUT", body: JSON.stringify(body) }); render(); } catch (e) { toast(e.message); render(); } };
  ROOT.querySelectorAll("[data-ibtick]").forEach((b) => { b.onchange = () => set(evOf(b), b.dataset.ibtick, { status: b.checked ? "done" : "open" }); });
  ROOT.querySelectorAll("[data-ibshow]").forEach((b) => { b.onclick = () => { document.querySelector(`#${b.dataset.ibshow} .ibmorerows`).hidden = false; b.remove(); }; });

  const more = document.getElementById("ibmore");
  ROOT.querySelectorAll("[data-ibmore]").forEach((b) => {
    b.onclick = () => {
      const from = evOf(b);
      const x = items.find((i) => i.id === b.dataset.ibmore);
      if (!x || !more) return;
      document.getElementById("ibm-what").textContent = `${x.offer?.hotel || x.who || ""} — ${x.note}`;
      const opts = events.filter((e) => e.id !== from).map((e) => `<option value="${esc(e.id)}">${esc(e.city)} · ${esc(e.title)} (${esc(fmtDate(e.dayOne).replace(/^\w+ /, ""))})</option>`);
      if (from !== "_unfiled") opts.push(`<option value="_unfiled">None of these — not on the desk yet</option>`);
      document.getElementById("ibm-to").innerHTML = opts.join("");
      more.returnValue = "";
      more.onclose = () => {
        if (more.returnValue === "move") set(from, x.id, { moveTo: document.getElementById("ibm-to").value });
        else if (more.returnValue === "dismiss") set(from, x.id, { status: "dismissed" });
      };
      more.showModal();
    };
  });

  const dlg = document.getElementById("ibdlg"), add = document.getElementById("ibadd");
  if (add && dlg && eventId) add.onclick = () => {
    dlg.querySelector("form").reset();
    dlg.returnValue = "";
    dlg.onclose = async () => {
      if (dlg.returnValue !== "save") return;
      const kind = dlg.querySelector('input[name="ib-kind"]:checked')?.value ?? "you";
      try {
        await api(`/inbox?event=${encodeURIComponent(eventId)}`, { method: "POST", body: JSON.stringify({ who: document.getElementById("ib-who").value, note: document.getElementById("ib-note").value, kind }) });
        render();
      } catch (e) { toast(e.message); }
    };
    dlg.showModal();
  };

  const run = document.getElementById("ibrun");
  if (run) run.onclick = async () => {
    run.disabled = true; run.textContent = "Starting…";
    try { await api("/inbox?run=1", { method: "POST" }); render(); } catch (e) { toast(e.message); run.disabled = false; run.textContent = "Check email now"; }
  };
  // While the read runs, look again every few seconds; redraw when it is done.
  if (running && eventId) {
    const tick = async () => {
      if (view.name !== "event" && view.name !== "unfiled") return;
      try { if (!(await api(`/inbox?event=${encodeURIComponent(eventId)}`)).running) return render(); } catch {}
      INBOX_POLL = setTimeout(tick, 5000);
    };
    INBOX_POLL = setTimeout(tick, 5000);
  }
}

/* The email items about events that are not on the desk yet. */
function unfiledScreen(IB, events) {
  BARRIGHT.innerHTML = `<button class="chip" id="back">All events</button>`;
  document.getElementById("back").onclick = () => { view = { name: "list" }; render(); };
  const ev = { id: "_unfiled", title: "Not on the desk yet" };
  ROOT.innerHTML = `<div class="note" style="margin-bottom:14px">These came in about events that are not on the desk yet. Add the event with <b>New event</b>,
      then use <b>⋯</b> on each item to move it there. Or tick it if it is handled.</div>` + inboxCard(ev, IB) + inboxDialogs();
  wireInbox(IB?.items ?? [], events, { eventId: "_unfiled", running: IB?.running });
}

function agendaCard(ev, A) {
  if (!A) return `<div class="card"><div class="card-head"><div><h2>Agenda and daily times</h2></div></div>
    <div class="card-body"><div class="bad"><b>The agenda could not be loaded.</b> Reload the page.</div></div></div>`;
  const f = A.file, r = A.read;
  const saved = new Map((A.schedule ?? []).map((d) => [d.date, d]));
  const found = r?.state === "done" ? r.found : null;
  const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
  const fileLine = !f ? `<span class="porg">No agenda uploaded yet. Upload it as a PDF, up to 3 MB.</span>`
    : `<div class="agname"><b>${esc(f.name)}</b><small>${esc(kb(f.size))} · uploaded ${esc(fmtDate(f.uploadedAt.slice(0, 10)))}</small></div>`;
  const reading = r?.state === "reading"
    ? `<p class="agread"><span class="spin" aria-hidden="true"></span> Claude is reading the agenda for each day's times. This takes up to a minute.</p>`
    : r?.state === "failed" ? `<div class="bad" style="margin-top:10px">${esc(r.why)} ${f ? `<button class="mini" id="ag-again">Read it again</button>` : ""}</div>`
    : found ? `<p class="agread">Claude read it: times for ${found.days.length} of ${A.days.length} day${A.days.length === 1 ? "" : "s"}.${found.notes ? ` <span class="porg">${esc(found.notes)}</span>` : ""}</p>` : "";
  // Offered only before any times are saved: after that the boxes are Andrew's,
  // and one click must not quietly put the agenda's times back over his.
  const offerFill = found?.days.length && !saved.size;
  const tbd = !ev.venue || /^(tbd|tba|to be (determined|announced))$/i.test(ev.venue.trim());
  const venueOffer = found?.venue && tbd
    ? `<div class="note" style="margin:12px 0 0">The agenda gives the venue as <b>${esc(found.venue)}</b>${found.address ? `, ${esc(found.address)}` : ""}.
        <button class="mini gold" id="ag-venue" style="margin-left:6px">Use it as the venue</button></div>` : "";
  const rows = (A.days ?? []).map((d, i) => {
    const s0 = saved.get(d) ?? {};
    return `<div class="agrow" data-agday="${d}">
      <div class="agday"><b>${esc(fmtDate(d).replace(/ \d{4}$/, ""))}</b><small>day ${i + 1}</small></div>
      <div><label for="ag-s${i}">Starts</label><input type="time" id="ag-s${i}" data-ag="start" value="${toBox(s0.start)}"></div>
      <div><label for="ag-e${i}">Ends</label><input type="time" id="ag-e${i}" data-ag="end" value="${toBox(s0.end)}"></div>
      <div class="agwhere"><label for="ag-w${i}">Room <span class="porg">(optional)</span></label><input id="ag-w${i}" data-ag="where" maxlength="60" value="${esc(s0.where ?? "")}" placeholder="e.g. Salon A"></div>
    </div>`;
  }).join("");
  const timed = (A.days ?? []).filter((d) => saved.get(d)?.start).length;
  const line = [f ? `Agenda: ${esc(f.name)}` : "No agenda uploaded",
    !A.days?.length ? "" : timed ? `times set for ${timed} of ${A.days.length} day${A.days.length === 1 ? "" : "s"}` : "daily times not set"].filter(Boolean).join(" · ");
  return secFold("agenda", "Agenda and daily times", line, r?.state === "failed" ? `<span class="late">could not be read</span>` : "", `
    <div class="card-head"><div>
      <div class="s">The times each day starts and ends go into letters as {schedule}. A letter set to attach the agenda carries this file.</div></div>
      <div class="cardacts"><button class="mini${f ? "" : " gold"}" id="ag-up">${f ? "Replace the agenda" : "Upload the agenda"}</button>
        <input type="file" id="ag-file" accept="application/pdf,.pdf" hidden></div></div>
    <div class="card-body">
      <div class="agfile">${fileLine}${f ? `<div class="agbtns"><button class="mini ghost" id="ag-open">Open</button><button class="mini ghost" id="ag-del">Remove</button></div>` : ""}</div>
      ${reading}${venueOffer}
      ${A.days?.length ? `<div class="agrows">${rows}</div>
        <div class="actions" style="justify-content:flex-start;margin-top:12px">
          <button class="btn btn-gold" id="ag-save" style="padding:9px 20px;font-size:14px">Save the times</button>
          ${offerFill ? `<button class="mini" id="ag-fill">Fill in what Claude found</button>` : ""}
          <span class="hint" id="ag-said" style="align-self:center"></span></div>`
        : `<p class="hint">Set the training dates on Edit first.</p>`}

}

let AGENDA_POLL = null;
function wireAgenda(ev, A) {
  clearTimeout(AGENDA_POLL);
  if (!A) return;
  const q = `/agenda?event=${encodeURIComponent(ev.id)}`;
  const said = (t, bad = false) => { const el = document.getElementById("ag-said"); if (el) { el.textContent = t; el.style.color = bad ? "var(--late)" : ""; } };
  const up = document.getElementById("ag-up"), file = document.getElementById("ag-file");
  if (up && file) {
    up.onclick = () => file.click();
    file.onchange = async () => {
      const f = file.files?.[0];
      file.value = "";
      if (!f) return;
      up.disabled = true; up.textContent = "Uploading…";
      try {
        const res = await apiFetch(`/api${q}`, { method: "POST", headers: { "x-admin-key": KEY, "content-type": "application/pdf", "x-file-name": encodeURIComponent(f.name) }, body: f });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error || `Upload failed (${res.status}).`);
        render();
      } catch (e) { toast(e.message); up.disabled = false; up.textContent = A.file ? "Replace the agenda" : "Upload the agenda"; }
    };
  }
  const open = document.getElementById("ag-open");
  if (open) open.onclick = async (e) => {
    e.preventDefault();
    try {
      const res = await apiFetch(`/api${q}&file=1`, { headers: { "x-admin-key": KEY } });
      if (!res.ok) throw new Error("The agenda could not be opened.");
      window.open(URL.createObjectURL(await res.blob()), "_blank", "noopener");
    } catch (err) { toast(err.message); }
  };
  const del = document.getElementById("ag-del");
  if (del) del.onclick = async () => {
    if (!confirm("Take the agenda off this event? The saved times stay.")) return;
    try { await api(q, { method: "DELETE" }); render(); } catch (e) { toast(e.message); }
  };
  const again = document.getElementById("ag-again");
  if (again) again.onclick = async () => { try { await api(`${q}&again=1`, { method: "POST" }); render(); } catch (e) { toast(e.message); } };
  // While Claude reads, look again every few seconds; redraw once it is done.
  if (A.read?.state === "reading") {
    const tick = async () => {
      if (view.name !== "event" || view.eventId !== ev.id) return;
      const now = await api(q).catch(() => null);
      if (now && now.read?.state !== "reading") render(); else AGENDA_POLL = setTimeout(tick, 3000);
    };
    AGENDA_POLL = setTimeout(tick, 3000);
  }
  const fill = document.getElementById("ag-fill");
  if (fill) fill.onclick = () => {
    for (const d of A.read.found.days) {
      const row = document.querySelector(`[data-agday="${d.date}"]`);
      if (!row) continue;
      row.querySelector('[data-ag="start"]').value = toBox(d.start);
      row.querySelector('[data-ag="end"]').value = toBox(d.end);
      row.querySelector('[data-ag="where"]').value = d.where || "";
    }
    said("Filled in from the agenda. Check them, then save.");
  };
  const venue = document.getElementById("ag-venue");
  if (venue) venue.onclick = async () => {
    try { await api(q, { method: "PUT", body: JSON.stringify({ schedule: A.schedule ?? [], venue: A.read.found.venue }) }); toast("Venue set."); render(); }
    catch (e) { toast(e.message); }
  };
  const save = document.getElementById("ag-save");
  if (save) save.onclick = async () => {
    const schedule = [...document.querySelectorAll("[data-agday]")].map((row) => ({
      date: row.dataset.agday,
      start: row.querySelector('[data-ag="start"]').value,
      end: row.querySelector('[data-ag="end"]').value,
      where: row.querySelector('[data-ag="where"]').value,
    }));
    save.disabled = true; said("Saving…");
    try { await api(q, { method: "PUT", body: JSON.stringify({ schedule }) }); toast("Times saved."); render(); }
    catch (e) { said(e.message, true); save.disabled = false; }
  };
}

/** Who is coming to this event, however they got on the list. */
function attendeesCard(ev, guests) {
  if (!guests) {
    return `<div class="card"><div class="card-head"><div><h2>Who is coming</h2></div></div>
      <div class="card-body"><div class="bad"><b>The attendee list could not be loaded.</b> Reload the page.</div></div></div>`;
  }
  const { people, counts, syncedAt, wix } = guests;
  const chip = (n, cls, word) => (n ? `<span class="chipstat${cls}"><b>${n}</b>${word}</span>` : "");

  // A table like the presenters' (Andrew 20 Oct 2026): everyone, with a find box and the coming / waitlist / withdrew cuts.
  const GCUT = { ATTENDING: "coming", IN_WAITLIST: "waitlist", NOT_ATTENDING: "notcoming", WITHDRAWN: "withdrew" };
  const rows = people.map((p) => {
    const [cls, word] = GUEST_WORDS[p.status] ?? ["idle", String(p.status ?? "").toLowerCase()];
    const named = [p.first, p.last].filter(Boolean).join(" ");
    const name = named || (p.guestOf ? `Guest of ${p.guestOf}` : p.email || "Name not given");
    return `<tr class="grow${p.status === "WITHDRAWN" ? " out" : ""}" data-gcut="${GCUT[p.status] ?? "other"}" data-find="${esc(`${name} ${p.email} ${p.organization ?? ""}`.toLowerCase())}">
      <td class="pn"><b>${esc(name)}</b><span class="psub">${p.guestOf && named ? `guest of ${esc(p.guestOf)}` : esc(p.email || "no email of their own")}</span></td>
      <td class="go">${esc(p.organization || "")}</td>
      <td><span class="pill ${cls}">${esc(word)}</span></td>
      <td class="gs" title="${p.source === "wix" ? "Registered through the website" : "Added by hand or from a spreadsheet"}">${p.source === "wix" ? "Wix" : "by hand"}</td></tr>`;
  }).join("");
  const gcuts = [["coming", "Coming", counts.attending], ["waitlist", "Waitlist", counts.waitlist], ["notcoming", "Not coming", counts.notAttending], ["withdrew", "Withdrew", counts.withdrawn], ["all", "All", counts.total]]
    .filter(([k, , n]) => k === "all" || k === "coming" || n);

  // Linked to Wix, or not — the bar says which and offers the next move.
  const bar = wix?.eventId
    ? `<div class="wixbar"><span class="grow">Linked to <b>${esc(wix.title || "a Wix event")}</b>${syncedAt ? ` · guests pulled ${esc(fmtDate(syncedAt.slice(0, 10)))}` : " · not pulled yet"}</span>
        <button class="mini" id="g-sync">Pull from Wix now</button>
        <button class="mini ghost" id="g-unlink">Unlink</button></div>`
    : `<div class="wixbar"><span class="grow">Not linked to the website. Registrations will not arrive on their own.</span>
        <button class="mini" id="g-link">Link to a Wix event</button></div>`;

  const line = counts.total
    ? [`${counts.attending} coming`, counts.waitlist ? `${counts.waitlist} on the waitlist` : "", counts.withdrawn ? `${counts.withdrawn} withdrew` : "",
       wix?.eventId ? "linked to Wix" : "not linked to Wix"].filter(Boolean).join(" · ")
    : wix?.eventId ? "Nobody yet · linked to Wix" : "Nobody yet · not linked to Wix";
  return secFold("guests", "Who is coming", line, "", `
    <div class="card-head"><div>
      <div class="s">The people the welcome letter and the survey go to. Pulled from the website nightly, or imported from a spreadsheet.</div>
      <div class="jobsum" style="margin-top:8px">
        ${chip(counts.attending, " good", "coming")}
        ${chip(counts.waitlist, " hot", "on the waitlist")}
        ${chip(counts.notAttending, "", "not coming")}
        ${chip(counts.withdrawn, " stop", "withdrew")}
        ${counts.total ? `<span class="chipstat"><b>${counts.fromWix}</b>from the website</span>` : ""}
        ${counts.byHand ? `<span class="chipstat"><b>${counts.byHand}</b>added by hand</span>` : ""}
      </div></div>
      <div class="cardacts"><button class="mini" id="g-csv">Import a spreadsheet</button>
        <input type="file" id="g-file" accept=".csv,text/csv,text/plain" hidden></div></div>
    <div class="card-body">
      ${bar}
      ${lettersStrip(guests.letters)}
      <div id="g-said">${GUEST_NOTE
        ? `<div class="${GUEST_NOTE.bad ? "bad" : "note"}" style="margin:0 0 12px">${esc(GUEST_NOTE.msg)}</div>` : ""}</div>
      ${people.length ? `<div class="ptools">${people.length > 8 ? `<input type="search" id="gfind" class="pfind" placeholder="Find someone registered…" aria-label="Find someone registered" autocomplete="off">` : ""}
          <div class="filters">${gcuts.map(([k, l, n]) => `<button class="fchip${k === GCUT_ON ? " on" : ""}" data-gcutbtn="${k}">${l} <b>${n ?? 0}</b></button>`).join("")}</div></div>
        <div class="ptwrap"><table class="ptable gtable"><thead><tr><th>Name</th><th>Organization</th><th>Status</th><th>From</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="gempty porg" hidden>Nobody in this view.</div>`
        : `<div class="empty">Nobody on the list yet. Link the event to your website, or import a spreadsheet.</div>`}
    </div>`);
}

/** One line per automatic letter: which, when, to how many — or what is holding it back. */
function lettersStrip(L) {
  if (!L) return "";
  if (L.welcome?.off) return `<div class="lstrip"><div class="lrow"><b>Emails to attendees</b><span>off for this event — no welcome
    letter, survey or hotel reminder goes. Edit the event to turn them on.</span></div></div>`;
  const row = (kind, label) => {
    const x = L[kind];
    if (!x?.chosen) return `<div class="lrow"><b>${label}</b><span>none chosen — edit the event to pick one, or it will not go</span></div>`;
    const when = x.on ? fmtDate(x.on) : "no date on the checklist";
    if (x.problems.length) return `<div class="lrow bad"><b>${label}</b><span>${esc(x.name)} · held back: ${esc(x.problems[0])}</span></div>`;
    if (x.had && x.had >= x.reaches) return `<div class="lrow good"><b>${label}</b><span>${esc(x.name)} · sent to all ${x.had}</span></div>`;
    const tail = x.why === "due now" ? "goes tonight" : /^not until/.test(x.why) ? `goes ${esc(when)}` : esc(x.why);
    return `<div class="lrow"><b>${label}</b><span>${esc(x.name)} · ${tail} · ${x.reaches} ${x.reaches === 1 ? "person" : "people"}${x.had ? `, ${x.had} already had it` : ""}</span></div>`;
  };
  return `<div class="lstrip">${row("welcome", "Welcome letter")}${row("survey", "Survey")}</div>`;
}

const wixDialog = () => `<dialog class="sheet" id="wixdlg">
  <form method="dialog">
    <div class="sheet-head"><h2>Link to a Wix event</h2>
      <p class="hint" style="margin-top:6px">Registrations for the event you pick will arrive here, tonight and every
        night. Nothing is written back to your website.</p></div>
    <div class="sheet-body">
      <div id="wixlist"><p class="hint">Asking your website…</p></div>
      <div class="actions" style="justify-content:flex-end"><button class="btn btn-ghost" value="cancel">Close</button></div>
    </div>
  </form></dialog>`;

function wireAttendees(ev) {
  // The table's cuts and find box: shown and hidden in place, no redraw.
  const applyG = () => {
    const words = GFIND.toLowerCase().split(/\s+/).filter(Boolean);
    let shown = 0;
    ROOT.querySelectorAll("tr.grow").forEach((tr) => {
      const on = (GCUT_ON === "all" || tr.dataset.gcut === GCUT_ON) && words.every((w) => tr.dataset.find.includes(w));
      tr.hidden = !on; if (on) shown++;
    });
    const empty = ROOT.querySelector(".gempty"); if (empty) empty.hidden = shown > 0;
    ROOT.querySelectorAll("[data-gcutbtn]").forEach((b) => b.classList.toggle("on", b.dataset.gcutbtn === GCUT_ON));
  };
  ROOT.querySelectorAll("[data-gcutbtn]").forEach((b) => { b.onclick = () => { GCUT_ON = b.dataset.gcutbtn; applyG(); }; });
  const gfind = document.getElementById("gfind");
  if (gfind) { gfind.value = GFIND; gfind.oninput = () => { GFIND = gfind.value; applyG(); }; } else GFIND = "";
  applyG();
  const said = document.getElementById("g-said");
  if (!said) return;
  const note = (msg, bad = false) => {
    GUEST_NOTE = { msg, bad };
    said.innerHTML = `<div class="${bad ? "bad" : "note"}" style="margin:0 0 12px">${esc(msg)}</div>`;
  };
  const run = async (path, init, done) => {
    try { const out = await api(path, init); if (done) note(done(out)); setTimeout(render, 900); }
    catch (e) { note(e.message, true); }
  };

  const sync = document.getElementById("g-sync");
  if (sync) sync.onclick = () => {
    sync.disabled = true; sync.textContent = "Pulling…";
    run(`/wix?event=${encodeURIComponent(ev.id)}`, { method: "POST" },
      (o) => `Pulled ${o.read} from the website — ${o.added} new, ${o.changed} changed${o.withdrawn ? `, ${o.withdrawn} withdrew` : ""}.`);
  };

  const unlink = document.getElementById("g-unlink");
  if (unlink) unlink.onclick = () => {
    if (!confirm("Stop pulling registrations for this event? The people already on the list are kept.")) return;
    run(`/wix?event=${encodeURIComponent(ev.id)}&unlink=1`, { method: "PUT" }, () => "Unlinked.");
  };

  const link = document.getElementById("g-link");
  const dlg = document.getElementById("wixdlg");
  if (link && dlg) link.onclick = async () => {
    const list = document.getElementById("wixlist");
    list.innerHTML = `<p class="hint">Asking your website…</p>`;
    dlg.showModal();
    try {
      const { events } = await api("/wix?events=1");
      if (!events.length) { list.innerHTML = `<p class="hint">Your website has no events on it yet.</p>`; return; }
      list.innerHTML = `<div class="wixev">${events.map((w) => `
        <button type="button" data-wix="${esc(w.id)}"${w.linkedTo ? " disabled" : ""}>
          <b>${esc(w.title)}</b>
          <span class="ws">${esc(w.dayOne ? fmtDate(w.dayOne) : "no date")}${w.city ? " · " + esc(w.city) : ""}${w.registered !== null ? ` · ${w.registered} registered` : ""}
            ${w.linkedTo ? ` · already linked to ${esc(w.linkedTo.title)}` : ""}</span>
        </button>`).join("")}</div>`;
      list.querySelectorAll("[data-wix]").forEach((b) => {
        b.onclick = async () => {
          dlg.close();
          run(`/wix?event=${encodeURIComponent(ev.id)}&link=${encodeURIComponent(b.dataset.wix)}`, { method: "PUT" },
            (o) => `Linked. Pulled ${o.read} registration${o.read === 1 ? "" : "s"} straight away.`);
        };
      });
    } catch (e) {
      list.innerHTML = `<div class="bad">${esc(e.message)}</div>`;
    }
  };

  // A spreadsheet goes up as plain text; the desk works out the columns.
  const pick = document.getElementById("g-csv"), file = document.getElementById("g-file");
  if (pick && file) {
    pick.onclick = () => file.click();
    file.onchange = async () => {
      const f = file.files?.[0];
      if (!f) return;
      note(`Reading ${f.name}…`);
      try {
        const out = await api(`/attendees?event=${encodeURIComponent(ev.id)}&csv=1`,
          { method: "POST", headers: { "content-type": "text/csv" }, body: await f.text() });
        const n = out.skipped?.length ?? 0;
        const skipped = n ? ` ${n} row${n === 1 ? " had" : "s had"} no usable email and ${n === 1 ? "was" : "were"} left out.` : "";
        note(`${out.added} added, ${out.changed} updated.${skipped}`);
        setTimeout(render, 1400);
      } catch (e) { note(e.message, true); }
      file.value = "";
    };
  }
}

/**
 * Saved letters: written once, picked by every event that uses them. The form
 * is built once per letter and never rebuilt while typing — only the preview
 * and the problem list redraw — so the caret stays where it is.
 */
function lettersScreen(data, events, pickId = null) {
  BARRIGHT.innerHTML = `<button class="chip" id="back">Events</button>`;
  document.getElementById("back").onclick = () => { view = { name: "list" }; render(); };
  const letters = data.letters;
  const blanks = data.blanks;
  const upcoming = events.filter((e) => (e.lastDay || e.dayOne) >= todayIso()).sort((a, b) => a.dayOne.localeCompare(b.dayOne));
  const pickable = upcoming.length ? upcoming : events;
  let current = letters.find((l) => l.id === pickId) ?? letters.find((l) => l.kind !== "survey") ?? letters[0] ?? null;
  let dirty = false;

  // Events this letter can be used on come first, so the preview opens on one.
  const eventChoices = (l) => {
    const fit = pickable.filter((e) => letterFits(l ?? {}, e.title)), rest = pickable.filter((e) => !letterFits(l ?? {}, e.title));
    return [...fit, ...rest].map((e) => `<option value="${esc(e.id)}">${esc(e.title)} · ${esc(fmtDate(e.dayOne))}</option>`).join("")
      || `<option value="">No events yet</option>`;
  };

  const pickBar = () => `<div class="lpick">${letters.map((l) => `<button data-lpick="${esc(l.id)}" class="${current?.id === l.id ? "on" : ""}">
      ${esc(l.name)} <small style="opacity:.7">${l.kind === "survey" ? "survey" : "welcome"}${l.onlyFor ? ` · ${esc(l.onlyFor)} only` : ""}</small>${l.problems?.length ? `<span class="warn" title="${esc(l.problems[0])}">!</span>` : ""}</button>`).join("")}
      <button data-lpick="">+ New letter</button></div>`;

  const editor = (l) => `
    <div class="field" style="margin-top:0"><label for="l-name">Name</label>
      <input id="l-name" value="${esc(l?.name ?? "")}" placeholder="Welcome — National Gang Summit"></div>
    <div class="row2">
      <div class="field" style="margin:0"><label for="l-kind">Sent as</label>
        <select id="l-kind"><option value="welcome"${l?.kind !== "survey" ? " selected" : ""}>Welcome letter — before the event</option>
          <option value="survey"${l?.kind === "survey" ? " selected" : ""}>Survey — after the event</option></select></div>
      <div class="field" style="margin:0"><label for="l-subject">Subject</label>
        <input id="l-subject" value="${esc(l?.subject ?? "")}" placeholder="Welcome to {event}"></div>
    </div>
    <div class="field"><label for="l-only">Only for events with these words in the title <span style="text-transform:none;letter-spacing:0;font-family:var(--fb)">(optional)</span></label>
      <input id="l-only" value="${esc(l?.onlyFor ?? "")}" placeholder="RBH ITP">
      <p class="hint" style="margin:6px 0 0">Leave it empty for a letter any event can use. Filled in, only events whose title
        has these words can pick it, and it will never go to any other event.</p></div>
    <div class="field"><label for="l-body">The letter</label>
      <textarea id="l-body" spellcheck="true">${esc(l?.body ?? "")}</textarea>
      <p class="hint" style="margin:6px 0 0">A blank line starts a new paragraph. A line in [square brackets] is a note to
        yourself — the letter will not go while one is left in. Click a blank to put it where your cursor is:</p>
      <div class="blanks">${blanks.map((b) => `<button type="button" data-blank="${esc(b.name)}" title="${esc(b.means)}">{${esc(b.name)}}</button>`).join("")}</div></div>
    <div class="row2">
      <div class="field" style="margin:0"><label for="l-blabel">Button words <span style="text-transform:none;letter-spacing:0;font-family:var(--fb)">(optional)</span></label>
        <input id="l-blabel" value="${esc(l?.buttonLabel ?? "")}" placeholder="Take the survey"></div>
      <div class="field" style="margin:0"><label for="l-blink">Button goes to</label>
        <input id="l-blink" value="${esc(l?.buttonLink ?? "")}" placeholder="{surveyLink}"></div>
    </div>
    <label class="attest" style="margin-top:14px"><input type="checkbox" id="l-agenda"${l?.attachAgenda ? " checked" : ""}>
      <span>Attach the event's agenda. Upload it under Agenda on the event page; the letter will not go to an event without one.</span></label>
    <div class="actions">
      <button class="btn btn-gold" id="l-save">${l?.id ? "Save the letter" : "Save as a new letter"}</button>
      ${l?.id ? `<button class="btn btn-ghost" id="l-del">Delete</button>` : ""}
      <span class="hint" id="l-said" style="align-self:center"></span>
    </div>
    ${l?.usedBy?.length ? `<p class="hint">Used by ${l.usedBy.map((e) => esc(e.title)).join(", ")}. Saving changes what those events send.</p>` : ""}`;

  const side = `
    <div class="field" style="margin-top:0"><label for="l-event">See it filled in for</label>
      <select id="l-event">${eventChoices(current)}</select></div>
    <p class="lmeta" id="l-meta"></p>
    <div class="lprobs" id="l-probs"></div>
    <div class="lprev"><iframe id="l-frame" title="The email as it will look" sandbox=""></iframe></div>
    <div class="row2" style="margin-top:14px;align-items:end">
      <div class="field" style="margin:0"><label for="l-to">Send a test to</label>
        <input id="l-to" type="email" placeholder="you@ongia.ca"></div>
      <div><button class="btn btn-navy" id="l-test" style="width:100%">Send a test</button></div>
    </div>
    <p class="hint" id="l-tsaid">A test goes to that one address, marked [TEST], and counts as nobody having had the letter.</p>`;

  const draw = () => {
    ROOT.innerHTML = `<div class="card"><div class="card-head"><div><h2>Letters</h2>
        <div class="s">Written once, used by every event that picks them. Blanks in {curly brackets} are filled in for each event and each person.</div></div></div>
      <div class="card-body">${pickBar()}
        <div class="lgrid"><div>${editor(current)}</div><div>${side}</div></div></div></div>`;
    wire();
  };

  const fields = () => ({
    name: document.getElementById("l-name").value,
    kind: document.getElementById("l-kind").value,
    subject: document.getElementById("l-subject").value,
    body: document.getElementById("l-body").value,
    buttonLabel: document.getElementById("l-blabel").value,
    buttonLink: document.getElementById("l-blink").value,
    onlyFor: document.getElementById("l-only").value,
    attachAgenda: document.getElementById("l-agenda").checked,
  });

  let timer = null, seq = 0;
  const refresh = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const mine = ++seq;
      const eventId = document.getElementById("l-event")?.value;
      try {
        const out = await api("/letters?preview=1", { method: "POST", body: JSON.stringify({ letter: fields(), eventId }) });
        if (mine !== seq) return;   // a newer keystroke has already asked
        const probs = document.getElementById("l-probs");
        probs.innerHTML = out.problems?.length
          ? out.problems.map((p) => `<div>${esc(p)}</div>`).join("")
          : out.html ? `<div class="lok">Nothing wrong with it. This is exactly what goes out.</div>` : "";
        document.getElementById("l-meta").innerHTML = out.off
          ? `Emails to attendees are off for this event, so this would not go to its <b>${out.to?.count ?? 0}</b> ${(out.to?.count ?? 0) === 1 ? "person" : "people"}.`
          : out.to
          ? `Goes to <b>${out.to.count}</b> ${out.to.count === 1 ? "person" : "people"} on this event${out.when ? `, on <b>${esc(fmtDate(out.when))}</b>` : ""}. Shown addressed to ${esc(out.to.sample)}.`
          : esc(out.note ?? "");
        if (out.attached?.length) document.getElementById("l-meta").innerHTML += `<br>Attached: <b>${out.attached.map((a) => esc(a.name)).join(", ")}</b>`;
        if (out.html) document.getElementById("l-frame").srcdoc = out.html;
        const ev = events.find((e) => e.id === eventId);
        const to = document.getElementById("l-to");
        if (!to.value && ev?.contact?.email) to.placeholder = ev.contact.email;
      } catch (e) {
        document.getElementById("l-probs").innerHTML = `<div>${esc(e.message)}</div>`;
      }
    }, 350);
  };

  function wire() {
    let lastBox = document.getElementById("l-body");
    for (const id of ["l-name", "l-kind", "l-subject", "l-only", "l-body", "l-blabel", "l-blink", "l-agenda"]) {
      const el = document.getElementById(id);
      el.addEventListener("input", () => { dirty = true; refresh(); });
      el.addEventListener("change", () => { dirty = true; refresh(); });
      if (id === "l-subject" || id === "l-body" || id === "l-blink") el.addEventListener("focus", () => { lastBox = el; });
    }
    document.getElementById("l-event").onchange = refresh;

    ROOT.querySelectorAll("[data-blank]").forEach((b) => {
      b.onclick = () => {
        const box = lastBox;
        const at = box.selectionStart ?? box.value.length, end = box.selectionEnd ?? at;
        box.setRangeText(`{${b.dataset.blank}}`, at, end, "end");
        box.focus();
        box.dispatchEvent(new Event("input"));
      };
    });

    ROOT.querySelectorAll("[data-lpick]").forEach((b) => {
      b.onclick = () => {
        if (dirty && !confirm("You have changes that are not saved. Leave them?")) return;
        current = b.dataset.lpick ? letters.find((l) => l.id === b.dataset.lpick) : { kind: "welcome", name: "", subject: "", body: "", buttonLabel: "", buttonLink: "" };
        dirty = false;
        draw();
      };
    });

    document.getElementById("l-save").onclick = async (e) => {
      const btn = e.currentTarget, said = document.getElementById("l-said");
      btn.disabled = true; said.textContent = "Saving…";
      try {
        const out = current?.id
          ? await api(`/letters?id=${encodeURIComponent(current.id)}`, { method: "PUT", body: JSON.stringify(fields()) })
          : await api("/letters", { method: "POST", body: JSON.stringify(fields()) });
        dirty = false;
        view = { name: "letters", pick: out.letter.id };
        toast(out.letter.problems?.length ? "Saved — but it will not send until the problems are fixed." : "Saved.");
        render();
      } catch (err) { said.textContent = err.message; btn.disabled = false; }
    };

    const del = document.getElementById("l-del");
    if (del) del.onclick = async () => {
      if (!confirm(`Delete "${current.name}"?`)) return;
      try { await api(`/letters?id=${encodeURIComponent(current.id)}`, { method: "DELETE" }); toast("Deleted."); view = { name: "letters" }; render(); }
      catch (err) { document.getElementById("l-said").textContent = err.message; }
    };

    document.getElementById("l-test").onclick = async (e) => {
      const btn = e.currentTarget, said = document.getElementById("l-tsaid"), toBox = document.getElementById("l-to");
      const to = toBox.value.trim() || toBox.placeholder;
      if (!/@/.test(to) || to === "you@ongia.ca") { said.textContent = "Type the address the test should go to."; return; }
      btn.disabled = true; said.textContent = `Sending to ${to}…`;
      try {
        await api("/letters?test=1", { method: "POST", body: JSON.stringify({ letter: fields(), eventId: document.getElementById("l-event").value, to }) });
        said.textContent = `Sent to ${to}. It will arrive marked [TEST].`;
      } catch (err) { said.textContent = err.message; }
      btn.disabled = false;
    };
    refresh();
  }

  draw();
}

// People who sign the ONGIA Volunteer Terms before an event. Their own list, link and signed
// copy; no review, no materials, and nothing here touches the presenter counts.
function volunteerCard(ev, V, R = null) {
  const list = V?.volunteers ?? [];
  const c = V?.counts ?? { total: 0, signed: 0, waiting: 0, uninvited: 0, notFiled: 0 };
  const day = (iso) => (iso ? fmtDate(iso.slice(0, 10)).replace(/^\w+ /, "") : "");
  const cell = (v) => {
    const mails = v.mail ?? [], n = mails.length;
    if (v.status === "signed") {
      const f = v.delivery?.filing;
      return f && f.ok === false
        ? { pill: `<span class="pill done">Signed</span> <span class="pill late">Not filed</span>`, sub: `signed ${day(v.signedAt)} · never reached SharePoint${f.error ? ` — ${esc(f.error)}` : f.reason ? ` — ${esc(f.reason)}` : ""}`, failed: true }
        : { pill: `<span class="pill done">Signed</span>`, sub: `signed ${day(v.signedAt)}${f?.ok ? " · filed" : ""}` };
    }
    if (v.status === "submitted") return { pill: `<span class="pill you">Needs review</span>`, sub: `signed ${day(v.signedAt)} · asked for a hotel room · waiting on ONGIA`, review: true };
    if (!n) return { pill: `<span class="pill late">Never sent</span>`, sub: v.lastSendError ? `could not be emailed — ${esc(v.lastSendError.why)}` : "no link sent yet" };
    const chased = `${n} email${n === 1 ? "" : "s"}, last ${day(mails.at(-1).at)}`;
    return v.openedAt
      ? { pill: `<span class="pill wait">Opened, not signed</span>`, sub: `opened ${day(v.openedAt)} · ${chased}` }
      : { pill: `<span class="pill wait">Not opened</span>`, sub: chased };
  };
  const actions = (v, a) => {
    const b = (attrs, label, cls = "") => `<button class="mini${cls ? " " + cls : ""}" ${attrs}>${label}</button>`;
    const id = esc(v.id);
    let main = "";
    const rest = [];
    if (v.status === "signed") {
      if (a.failed) main = b(`data-vrefile="${id}"`, "Retry filing", "gold");
      rest.push(b(`data-vpdf="${id}"`, "PDF"));
    } else if (v.status === "submitted") main = b(`data-vreview="${id}"`, "Review", "gold");
    else if (!(v.mail ?? []).length) main = b(`data-vinvite="${id}"`, "Email link", "gold");
    else rest.push(b(`data-vinvite="${id}"`, "Email again"));
    rest.push(b(`data-vcopy="${esc(`${location.origin}/v/${v.token}`)}"`, "Copy link"), b(`data-vedit="${id}" title="Correct their name or email, or remove them from the event"`, "Correct or remove"));
    return main + rest.join("");
  };
  // A table like the presenters' (redesign step 3), with every button on the row: a volunteer has only a few.
  const roomOf = (v) => (R?.rows ?? []).find((r) => r.who === "volunteer" && r.key === v.id) ?? null;
  const rows = list.map((v) => {
    const a = cell(v), r = roomOf(v);
    return `<tr class="vrow">
      <td class="pn"><b>${esc(v.first)} ${esc(v.last)}</b>${v.language === "fr" ? ' <span class="pill info pflag">FR</span>' : ""}<span class="psub">${esc(v.organization || v.email)}</span></td>
      <td class="pa">${a.pill}<span class="psub">${a.sub}</span></td>
      <td class="pr">${r ? `${esc(shortDate(r.checkIn))} – ${esc(shortDate(r.checkOut))}<span class="psub">${r.nights} night${r.nights === 1 ? "" : "s"}</span>` : v.status === "submitted" ? `<span class="porg">asked for a room</span>` : `<span class="porg">—</span>`}</td>
      <td class="pact"><span class="vacts">${actions(v, a)}</span></td></tr>`;
  }).join("");
  const failedSends = list.filter((v) => v.lastSendError && v.status !== "signed");
  const line = list.length
    ? [`${list.length} volunteer${list.length === 1 ? "" : "s"}`, c.signed ? `${c.signed} signed` : "", c.review ? `${c.review} to review` : "", c.waiting ? `${c.waiting} waiting` : ""].filter(Boolean).join(" · ")
    : "Volunteers sign the ONGIA Volunteer Terms";
  const badge = [c.review ? `<span class="you">${c.review} to review</span>` : "", c.uninvited ? `<span class="late">${c.uninvited} never sent</span>` : "", c.notFiled ? `<span class="late">${c.notFiled} not filed</span>` : ""].filter(Boolean).join(" · ");
  return secFold("volunteers", "Volunteers", line, badge, `<div class="card-body">
    <details class="howit"><summary>Each volunteer gets a link, signs the <b>ONGIA Volunteer Terms</b>, and their signed copy is filed in SharePoint. <span class="howlink">How it works</span></summary>
      <div class="note" style="margin:8px 0 0">Each volunteer is emailed a link, reads the <b>ONGIA Volunteer Terms</b> (professional conduct, representing ONGIA and their own organization, behaviour and language),
      confirms they are in good standing and not under a formal investigation, says whether they need a hotel room, and signs by typing their name. The signed copy is emailed to them, filed in SharePoint under <b>Volunteer Agreements</b>, and the board is told.
      <span class="porg">If they need a room, a board member chooses their hotel nights first (or says none after all); only then is it final, and the nights go on the <b>Hotel rooms</b> list. Nothing to do with presenters.</span></div></details>
    ${leadPicker(ev, V)}
    ${failedSends.length ? `<div class="sendfail"><b>${failedSends.length} email${failedSends.length === 1 ? "" : "s"} could not be sent.</b>
      <div style="margin-top:6px">${failedSends.map((v) => `${esc(v.first)} ${esc(v.last)} — ${esc(v.lastSendError.why)}`).join("<br>")}</div>
      <div style="margin-top:6px;color:var(--ink-mid)">Fix the address on the volunteer, or the email settings, then use <b>Email link</b> on their row.</div></div>` : ""}
    <div class="actions vbar" style="margin:0 0 14px;justify-content:flex-start;flex-wrap:wrap">
      <button class="btn btn-gold" id="v-add">Add volunteers</button>
      ${c.waiting ? `<button class="btn btn-ghost" id="v-mailall">Email all outstanding</button>` : ""}</div>
    ${list.length ? `<div class="ptwrap"><table class="ptable vtable"><thead><tr><th>Volunteer</th><th>Agreement</th><th>Room</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">No volunteers yet. Add their names, emails and agency to send each their agreement.</div>`}
  </div>`);
}

/** Who manages the volunteers: replies, the signature on their emails, the PDF's contact, and the "signed" notice. */
function leadPicker(ev, V) {
  const onEvent = (ev.board ?? []).filter((m) => m.email);
  const seen = new Set(onEvent.map((m) => m.email.toLowerCase()));
  const others = (ROSTER ?? []).filter((m) => m.email && !seen.has(m.email.toLowerCase()));
  const chosen = (V?.lead?.email ?? "").toLowerCase();
  const opt = (m) => `<option value="${esc(m.email)}"${m.email.toLowerCase() === chosen ? " selected" : ""}>${esc(m.name || m.email)}</option>`;
  const fallback = ev.reviewer?.name ? `Same as the event lead (${esc(ev.reviewer.name)})` : "Same as the event lead";
  if (!onEvent.length && !others.length) return "";
  return `<div class="field" style="margin:0 0 14px;max-width:420px"><label for="v-lead">Volunteer lead</label>
    <select id="v-lead"><option value=""${chosen ? "" : " selected"}>${fallback}</option>
      ${onEvent.length ? `<optgroup label="On this event">${onEvent.map(opt).join("")}</optgroup>` : ""}
      ${others.length ? `<optgroup label="Other board members">${others.map(opt).join("")}</optgroup>` : ""}</select>
    <p class="hint">${chosen ? `Volunteers hear from <b>${esc(V.lead.name)}</b>: replies go to them, their name is on every volunteer email and signed copy, and they are told when a volunteer signs.`
      : "Volunteers hear from the event lead. Pick someone else to manage them: replies, the name on their emails and signed copies, and the signed notice all go to that person."}</p></div>`;
}

function wireVolunteers(ev, V) {
  const list = V?.volunteers ?? [];
  const q = `event=${encodeURIComponent(ev.id)}`;
  const named = (v) => `${v.first} ${v.last}`.trim();

  // The volunteer lead: saved the moment it is picked.
  const lead = document.getElementById("v-lead");
  if (lead) lead.onchange = async () => {
    try {
      const r = await api(`/volunteers?${q}&lead=1`, { method: "PUT", body: JSON.stringify({ email: lead.value }) });
      toast(r.lead ? `${r.lead.name} now manages the volunteers.` : "Volunteers go to the event lead.");
      render();
    } catch (e) { toast(e.message); }
  };

  // Add: one per line. Anything turned away stays in the box with the reason, so it can be fixed and sent again.
  const vadd = document.getElementById("vadd"), rows = document.getElementById("va-rows"), out = document.getElementById("va-out"), go = document.getElementById("va-go");
  let changed = false;
  document.getElementById("v-add")?.addEventListener("click", () => { out.innerHTML = ""; rows.value = ""; go.disabled = false; changed = false; vadd.showModal(); rows.focus(); });
  vadd?.addEventListener("close", () => { if (changed) render(); });
  if (go) go.onclick = async () => {
    const lines = rows.value.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lines.length) { out.innerHTML = `<div class="bad"><b>Nothing to add.</b> Type one volunteer per line.</div>`; return; }
    const volunteers = lines.map((line) => { const [first, last, email, ...org] = line.split(",").map((x) => x.trim()); return { first, last, email, organization: org.join(", ") }; });
    go.disabled = true; go.textContent = "Adding…";
    try {
      const r = await api(`/volunteers?${q}`, { method: "POST", body: JSON.stringify({ volunteers, invite: document.getElementById("va-invite").checked }) });
      changed = changed || r.added.length > 0;
      go.disabled = false; go.textContent = "Add volunteers";
      if (!r.rejected.length && !r.notSent.length) { vadd.close(); toast(`${r.added.length} volunteer${r.added.length === 1 ? "" : "s"} added${r.sent ? `, ${r.sent} emailed` : ""}.`); return; }
      // Keep only the lines that did not go in.
      const bad = new Set(r.rejected.map((x) => x.index));
      rows.value = lines.filter((l, i) => bad.has(i)).join("\n");
      out.innerHTML = `<div class="note"><b>${r.added.length} added${r.sent ? `, ${r.sent} emailed` : ""}.</b></div>`
        + (r.notSent.length ? `<div class="bad"><b>Not emailed:</b> ${r.notSent.map((x) => `${esc(x.name)} — ${esc(x.why)}`).join("; ")}<br>Use <b>Email link</b> on their row once it is fixed.</div>` : "")
        + (r.rejected.length ? `<div class="bad"><b>${r.rejected.length} not added, left in the box:</b><br>${r.rejected.map((x) => esc(x.why)).join("<br>")}</div>` : "");
    } catch (e) { go.disabled = false; go.textContent = "Add volunteers"; out.innerHTML = `<div class="bad"><b>Couldn't add them.</b> ${esc(e.message)}</div>`; }
  };

  // Email: a first send, or a reminder if they have been emailed before.
  const mail = async (ids, what) => {
    try {
      const r = await api(`/volunteers?${q}&action=invite`, { method: "POST", body: JSON.stringify({ ids }) });
      toast(r.failed.length ? `${r.sent.length} sent, ${r.failed.length} could not be sent — see the red box.` : r.sent.length ? `Sent to ${r.sent.map((x) => x.name).join(", ")}.` : what);
      render();
    } catch (e) { toast(e.message); }
  };
  document.getElementById("v-mailall")?.addEventListener("click", () => {
    const waiting = list.filter((v) => v.status === "invited");
    if (confirm(`Email their link to ${waiting.length} volunteer${waiting.length === 1 ? "" : "s"} who haven't signed?`)) mail(null, "Nothing to send.");
  });
  ROOT.querySelectorAll("[data-vinvite]").forEach((b) => { b.onclick = () => mail([b.dataset.vinvite], "Nothing to send."); });
  ROOT.querySelectorAll("[data-vcopy]").forEach((b) => {
    b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.vcopy); b.textContent = "Copied"; } catch { prompt("Copy this link:", b.dataset.vcopy); } };
  });
  ROOT.querySelectorAll("[data-vpdf]").forEach((b) => {
    b.onclick = async () => {
      try {
        const res = await apiFetch(`/api/volunteers?${q}&id=${encodeURIComponent(b.dataset.vpdf)}&pdf=1`, { headers: { "x-admin-key": KEY } });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `Download failed (${res.status})`);
        const url = URL.createObjectURL(await res.blob());
        window.open(url, "_blank");
        setTimeout(() => URL.revokeObjectURL(url), 60_000);
      } catch (e) { toast(e.message); }
    };
  });
  ROOT.querySelectorAll("[data-vrefile]").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true; b.textContent = "Filing…";
      try {
        const r = await api(`/volunteers?${q}&id=${encodeURIComponent(b.dataset.vrefile)}&action=redeliver`, { method: "POST", body: JSON.stringify({}) });
        toast(r.delivery?.filing?.ok ? "Filed to SharePoint." : `Still not filed — ${r.delivery?.filing?.error ?? r.delivery?.filing?.reason ?? "see the event's SharePoint setting"}.`);
        render();
      } catch (e) { toast(e.message); b.disabled = false; b.textContent = "Retry filing"; }
    };
  });

  // Review: choose the hotel nights, or say none is needed; nothing can be approved until one is chosen.
  const vr = document.getElementById("vreview");
  const vrIn = document.getElementById("vr-in"), vrOut = document.getElementById("vr-out"), vrName = document.getElementById("vr-name"), vrGo = document.getElementById("vr-go");
  let vrNeed = null, vrFor = null;
  const vrCheck = () => {
    const nights = vrNeed === "yes" && vrIn.value && vrOut.value && vrOut.value > vrIn.value;
    document.getElementById("vr-nights").hidden = vrNeed !== "yes";
    document.getElementById("vr-sum").textContent = nights ? `${Math.round((Date.parse(vrOut.value) - Date.parse(vrIn.value)) / 86400000)} night(s), ${fmtDate(vrIn.value)} to ${fmtDate(vrOut.value)}.` : (vrNeed === "yes" && vrIn.value && vrOut.value ? "Check-out has to be after check-in." : "");
    vrGo.disabled = !(vrName.value.trim() && (vrNeed === "no" || nights));
  };
