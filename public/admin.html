<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONGIA Presenter Agreement Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Oswald:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme:light;
    --paper:#f2efe8; --card:#fafaf7; --sunk:#edeae2; --sand:#e9e4d8;
    --ink:#12161f; --ink-mid:#2c3448; --muted:#767f92;
    --navy:#1a2f5e; --navy-deep:#0e1a35;
    --gold:#b8922a; --gold-light:#d9ae4b; --gold-pale:#f4ecd6;
    --border:#ddd7c8; --hair:rgba(18,22,31,.10);
    --done:#2f6b4f; --done-bg:#e2efe7;
    --wait:#9a6a12; --wait-bg:#f8ecd5;
    --late:#a33328; --late-bg:#f7e3e0;
    --shadow:0 10px 30px rgba(14,26,53,.09),0 2px 6px rgba(14,26,53,.05);
    --fd:"DM Serif Display",Georgia,serif;
    --fb:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --fu:"Oswald","Arial Narrow",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
  h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
  p{margin:0}
  button{font:inherit;color:inherit}
  a{color:var(--navy)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

  .bar{background:var(--navy-deep);color:#fff;padding:13px 20px;display:flex;align-items:center;
       gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:10}
  .bar .mark{font-family:var(--fu);font-weight:600;letter-spacing:.18em;font-size:17px}
  .bar .mark span{color:var(--gold-light)}
  .bar .sub{font-size:13px;color:rgba(255,255,255,.62)}
  .bar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .chip{border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;
        border:1px solid rgba(255,255,255,.34);color:#fff;background:transparent;cursor:pointer}
  .chip.solid{background:var(--gold);border-color:var(--gold);color:#1c1608}

  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 70px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;
        box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .card-head{background:var(--sand);padding:17px 22px;border-bottom:1px solid var(--border);
             display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .card-head h2{font-family:var(--fd);font-size:22px}
  .card-head .s{font-size:13.5px;color:var(--muted);margin-top:2px}
  .card-body{padding:20px 22px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border)}
  .tile{background:var(--sunk);padding:15px 18px}
  .tile .k{font-family:var(--fu);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:var(--fd);font-size:32px;line-height:1.05;margin-top:3px;font-variant-numeric:tabular-nums}
  .tile.accent .v{color:var(--gold)}

  .field{margin-top:14px}
  .field label{display:block;font-family:var(--fu);font-size:11px;letter-spacing:.13em;
        text-transform:uppercase;color:var(--ink-mid);margin-bottom:6px}
  input,textarea,select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--sunk);
    border:1px solid var(--border);border-radius:12px;padding:11px 13px;-webkit-appearance:none}
  textarea{resize:vertical;min-height:92px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13.5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}

  .btn{border-radius:999px;padding:12px 24px;font-weight:700;font-size:15px;border:1px solid transparent;cursor:pointer}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-gold{background:var(--gold);color:#1c1608}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--ink-mid)}
  .btn[disabled]{opacity:.55;cursor:progress}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

  .presenter{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    background:var(--sunk);border:1px solid var(--border);border-radius:16px;padding:13px 15px;margin-bottom:10px}
  @media(max-width:660px){.presenter{grid-template-columns:auto 1fr}.presenter .act{grid-column:2}}
  .av{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;background:var(--navy);
      color:var(--gold-light);font-family:var(--fu);font-size:15px}
  .pname{font-weight:700;font-size:15px}
  .porg{font-size:12.5px;color:var(--muted)}
  .ptalk{font-size:12.5px;color:var(--ink-mid);margin-top:3px}
  .act{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:11.5px;
    font-weight:700;white-space:nowrap;font-family:var(--fu);letter-spacing:.09em;text-transform:uppercase}
  .pill::before{content:"";width:7px;height:7px;border-radius:999px;background:currentColor}
  .pill.done{background:var(--done-bg);color:var(--done)}
  .pill.wait{background:var(--wait-bg);color:var(--wait)}
  .pill.late{background:var(--late-bg);color:var(--late)}
  .mini{border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink-mid);
    font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer}
  .mini:hover{border-color:var(--navy);color:var(--navy)}
  .mini.gold{background:var(--gold);border-color:var(--gold);color:#1c1608}

  .dates{display:grid;gap:1px;background:var(--border);border-radius:14px;overflow:hidden;margin-top:14px}
  .drow{background:var(--sunk);padding:11px 14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .drow dt{font-size:13px;color:var(--muted)}
  .drow dt span{display:block;font-size:11.5px;color:var(--muted);opacity:.8}
  .drow dd{margin:0;font-size:13.5px;font-weight:600;text-align:right}

  .note{margin-top:14px;background:var(--gold-pale);border:1px solid var(--gold);border-radius:14px;
        padding:12px 15px;font-size:13.5px;line-height:1.55;color:var(--ink-mid)}
  .bad{margin-top:14px;background:var(--late-bg);border:1px solid var(--late);border-radius:14px;
       padding:12px 15px;font-size:13.5px;color:var(--ink-mid)}
  .bad b{color:var(--late)}
  .links{margin-top:14px;background:var(--sunk);border:1px solid var(--border);border-radius:14px;padding:13px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;word-break:break-all;line-height:1.8}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<div class="bar">
  <span class="mark">ONGIA<span>.</span></span>
  <span class="sub">Presenter Agreement Desk</span>
  <span class="right" id="barright"></span>
</div>

<div class="wrap" id="root"><p class="empty">Loading…</p></div>

<script type="module">
const ROOT = document.getElementById("root");
const BARRIGHT = document.getElementById("barright");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

let KEY = sessionStorage.getItem("ongia-admin-key") ?? "";
let view = { name: "list", eventId: null };
let busy = false;

async function api(path, options = {}) {
  const res = await fetch(`/api${path}`, {
    ...options,
    headers: { "content-type": "application/json", "x-admin-key": KEY, ...(options.headers ?? {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error ?? `Request failed (${res.status})`);
  return body;
}

/* ---------- sign in ---------- */
function signInScreen(message) {
  BARRIGHT.innerHTML = "";
  ROOT.innerHTML = `<div class="card" style="max-width:420px;margin:40px auto">
    <div class="card-head"><div><h2>Sign in</h2>
      <div class="s">The admin key for this site.</div></div></div>
    <div class="card-body">
      ${message ? `<div class="bad"><b>Not in.</b> ${esc(message)}</div>` : ""}
      <div class="field"><label for="k">Admin key</label>
        <input id="k" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div class="actions"><button class="btn btn-navy" id="go">Sign in</button></div>
      <p class="hint">Set as the ADMIN_KEY environment variable on the Netlify site.</p>
    </div></div>`;
  document.getElementById("k").focus();
  const submit = () => {
    KEY = document.getElementById("k").value.trim();
    sessionStorage.setItem("ongia-admin-key", KEY);
    load();
  };
  document.getElementById("go").onclick = submit;
  document.getElementById("k").onkeydown = (e) => { if (e.key === "Enter") submit(); };
}

/* ---------- events list ---------- */
function listScreen(events) {
  BARRIGHT.innerHTML = `<button class="chip solid" id="newevent">New event</button>`;
  document.getElementById("newevent").onclick = () => { view = { name: "new" }; render(); };

  if (!events.length) {
    ROOT.innerHTML = `<div class="card"><div class="empty">
      <p>No events yet.</p>
      <div class="actions" style="justify-content:center"><button class="btn btn-gold" id="first">Create your first event</button></div>
    </div></div>`;
    document.getElementById("first").onclick = () => { view = { name: "new" }; render(); };
    return;
  }

  ROOT.innerHTML = events.map((ev) => {
    const c = ev.counts;
    const outstanding = c.total - c.approved;
    return `<div class="card">
      <div class="card-head"><div><h2>${esc(ev.title)}</h2>
        <div class="s">${esc(ev.city)}${ev.venue ? " · " + esc(ev.venue) : ""} · ${esc(ev.dayOne)}</div></div>
        <button class="mini gold" style="margin-left:auto" data-open="${esc(ev.id)}">Open</button></div>
      <div class="tiles">
        <div class="tile"><div class="k">Presenters</div><div class="v">${c.total}</div></div>
        <div class="tile"><div class="k">Not submitted</div><div class="v">${c.invited + c.opened}</div></div>
        <div class="tile accent"><div class="k">Needs review</div><div class="v">${c.submitted}</div></div>
        <div class="tile"><div class="k">Final &amp; filed</div><div class="v">${c.approved}</div></div>
      </div>
      ${outstanding ? "" : `<div class="card-body"><div class="note">Everything on this event is signed, approved and filed.</div></div>`}
    </div>`;
  }).join("");

  ROOT.querySelectorAll("[data-open]").forEach((b) => {
    b.onclick = () => { view = { name: "event", eventId: b.dataset.open }; render(); };
  });
}

/* ---------- new event ---------- */
function newEventScreen() {
  BARRIGHT.innerHTML = `<button class="chip" id="cancel">Back</button>`;
  document.getElementById("cancel").onclick = () => { view = { name: "list" }; render(); };

  ROOT.innerHTML = `<div class="card">
    <div class="card-head"><div><h2>New event</h2>
      <div class="s">Deadlines are worked out from day one of the training — you never type them.</div></div></div>
    <div class="card-body">
      <div class="row2">
        <div class="field"><label for="e-title">Event title</label><input id="e-title" placeholder="Gangs &amp; Guns Symposium"></div>
        <div class="field"><label for="e-city">City</label><input id="e-city" placeholder="Winnipeg, MB"></div>
      </div>
      <div class="field"><label for="e-venue">Venue</label><input id="e-venue" placeholder="RBC Convention Centre"></div>
      <div class="row2">
        <div class="field"><label for="e-day1">Day one of training</label><input id="e-day1" type="date"></div>
        <div class="field"><label for="e-last">Last day</label><input id="e-last" type="date"></div>
      </div>
      <div id="preview"></div>
      <div class="row3">
        <div class="field"><label for="e-cname">ONGIA contact</label><input id="e-cname" placeholder="Barb Konkle"></div>
        <div class="field"><label for="e-cemail">Contact email</label><input id="e-cemail" type="email" placeholder="training@ongia.ca"></div>
        <div class="field"><label for="e-cphone">Contact number</label><input id="e-cphone" placeholder="(306) 555-0100"></div>
      </div>
      <div class="field"><label for="e-notify">Notify these board members (one email per line)</label>
        <textarea id="e-notify" placeholder="president@ongia.ca&#10;training@ongia.ca"></textarea></div>
      <div class="field"><label for="e-folder">SharePoint folder for this event</label>
        <input id="e-folder" placeholder="ONGIA Board/ONGIA Training/2027/2027 Winnipeg"></div>
      <div class="field"><label for="e-upload">Materials file-request link (optional)</label>
        <input id="e-upload" placeholder="https://ongia.sharepoint.com/…/FileRequest.aspx?id=…"></div>
      <div id="problem"></div>
      <div class="actions"><button class="btn btn-gold" id="create">Create event</button></div>
    </div></div>`;

  const day1 = document.getElementById("e-day1");
  const preview = document.getElementById("preview");
  day1.onchange = async () => {
    if (!day1.value) { preview.innerHTML = ""; return; }
    preview.innerHTML = `<p class="hint">Working out deadlines…</p>`;
    try {
      const out = await api(`/deadlines?dayOne=${day1.value}`);
      preview.innerHTML = `<dl class="dates">
        <div class="drow"><dt>Agreements due back<span>90 days before</span></dt><dd>${esc(out.readable.agreement)}</dd></div>
        <div class="drow"><dt>Draft materials<span>50 days before</span></dt><dd>${esc(out.readable.draft)}</dd></div>
        <div class="drow"><dt>Final materials<span>30 days before</span></dt><dd>${esc(out.readable.final)}</dd></div>
      </dl>${out.moved.length ? `<div class="note">${out.moved.map(esc).join("<br>")}</div>` : ""}`;
    } catch (e) { preview.innerHTML = `<div class="bad">${esc(e.message)}</div>`; }
  };

  document.getElementById("create").onclick = async (e) => {
    if (busy) return;
    busy = true; e.target.disabled = true;
    const val = (id) => document.getElementById(id).value.trim();
    try {
      const out = await api("/events", { method: "POST", body: JSON.stringify({
        title: val("e-title"), city: val("e-city"), venue: val("e-venue"),
        dayOne: val("e-day1"), lastDay: val("e-last") || val("e-day1"),
        contactName: val("e-cname"), contactEmail: val("e-cemail"), contactPhone: val("e-cphone"),
        notify: val("e-notify").split(/[\n,]+/).map((s) => s.trim()).filter(Boolean),
        sharePointFolder: val("e-folder"), materialsUploadUrl: val("e-upload"),
      })});
      view = { name: "event", eventId: out.event.id };
      busy = false; render();
    } catch (err) {
      busy = false; e.target.disabled = false;
      document.getElementById("problem").innerHTML = `<div class="bad"><b>Couldn't create it.</b> ${esc(err.message)}</div>`;
    }
  };
}

/* ---------- one event ---------- */
function eventScreen(data) {
  const { event: ev, presenters, counts: c } = data;
  BARRIGHT.innerHTML = `<button class="chip" id="back">All events</button>
    <button class="chip solid" id="add">Add presenters</button>`;
  document.getElementById("back").onclick = () => { view = { name: "list" }; render(); };
  document.getElementById("add").onclick = () => { view = { name: "add", eventId: ev.id }; render(); };

  const rows = presenters.length ? presenters.map((p) => {
    const initials = `${p.first[0] ?? ""}${p.last[0] ?? ""}`.toUpperCase();
    const link = `${location.origin}/a/${p.token}`;
    let pill = `<span class="pill wait">Not opened</span>`;
    if (p.status === "approved") pill = `<span class="pill done">Final &amp; filed</span>`;
    else if (p.status === "submitted") pill = `<span class="pill wait">Needs review</span>`;
    else if (p.openedAt) pill = `<span class="pill wait">Opened, not finished</span>`;
    return `<div class="presenter">
      <div class="av">${esc(initials)}</div>
      <div><div class="pname">${esc(p.first)} ${esc(p.last)}</div>
        <div class="porg">${esc(p.organization || p.email)}</div>
        ${p.submission?.talk ? `<div class="ptalk">${esc(p.submission.talk)}</div>` : ""}</div>
      <div class="act">${pill}
        <button class="mini" data-copy="${esc(link)}">Copy link</button>
        ${p.status === "submitted" ? `<button class="mini gold" data-review="${esc(p.id)}">Review</button>` : ""}
      </div></div>`;
  }).join("") : `<div class="empty">No presenters yet. Add some to send their links.</div>`;

  ROOT.innerHTML = `<div class="card">
    <div class="card-head"><div><h2>${esc(ev.title)}</h2>
      <div class="s">${esc(ev.city)}${ev.venue ? " · " + esc(ev.venue) : ""} · ${esc(ev.dayOne)}</div></div></div>
    <div class="tiles">
      <div class="tile"><div class="k">Presenters</div><div class="v">${c.total}</div></div>
      <div class="tile"><div class="k">Not submitted</div><div class="v">${c.invited + c.opened}</div></div>
      <div class="tile accent"><div class="k">Needs review</div><div class="v">${c.submitted}</div></div>
      <div class="tile"><div class="k">Final &amp; filed</div><div class="v">${c.approved}</div></div>
    </div>
    <div class="card-body">${rows}</div></div>`;

  ROOT.querySelectorAll("[data-copy]").forEach((b) => {
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; }
      catch { prompt("Copy this link:", b.dataset.copy); }
      setTimeout(() => (b.textContent = "Copy link"), 1600);
    };
  });
  ROOT.querySelectorAll("[data-review]").forEach((b) => {
    b.onclick = () => { view = { name: "review", eventId: ev.id, presenterId: b.dataset.review }; render(); };
  });
}

/* ---------- add presenters ---------- */
function addScreen(eventId) {
  BARRIGHT.innerHTML = `<button class="chip" id="back">Back</button>`;
  document.getElementById("back").onclick = () => { view = { name: "event", eventId }; render(); };

  ROOT.innerHTML = `<div class="card">
    <div class="card-head"><div><h2>Add presenters</h2>
      <div class="s">One per line: first name, last name, email, organization.</div></div></div>
    <div class="card-body">
      <div class="field"><label for="p-rows">Presenters</label>
        <textarea id="p-rows" style="min-height:150px" placeholder="Dana, Whitfield, d.whitfield@example.ca, Ontario Provincial Police&#10;Marc, Thibault, m.thibault@example.ca, Service de police de la Ville de Montréal"></textarea>
        <p class="hint">Organization is optional. Everything else they fill in themselves.</p></div>
      <div id="problem"></div>
      <div class="actions"><button class="btn btn-gold" id="save">Add and create links</button></div>
    </div></div>`;

  document.getElementById("save").onclick = async (e) => {
    if (busy) return;
    busy = true; e.target.disabled = true;
    const presenters = document.getElementById("p-rows").value
      .split("\n").map((l) => l.trim()).filter(Boolean)
      .map((line) => {
        const [first, last, email, organization] = line.split(",").map((s) => (s ?? "").trim());
        return { first, last, email, organization };
      });
    try {
      const out = await api(`/events?id=${encodeURIComponent(eventId)}&add=1`, {
        method: "POST", body: JSON.stringify({ presenters }),
      });
      busy = false;
      const links = out.added.map((a) => `${esc(a.name)} — ${location.origin}${esc(a.link)}`).join("<br>");
      document.getElementById("problem").innerHTML =
        `<div class="note"><b>${out.added.length} added.</b> Their links:</div><div class="links">${links}</div>` +
        (out.rejected.length ? `<div class="bad"><b>${out.rejected.length} skipped.</b><br>` +
          out.rejected.map((r) => esc(r.why)).join("<br>") + `</div>` : "");
      document.getElementById("p-rows").value = "";
      e.target.disabled = false;
    } catch (err) {
      busy = false; e.target.disabled = false;
      document.getElementById("problem").innerHTML = `<div class="bad"><b>Couldn't add them.</b> ${esc(err.message)}</div>`;
    }
  };
}

/* ---------- render ---------- */
async function render() {
  if (!KEY) return signInScreen();
  try {
    if (view.name === "new") return newEventScreen();
    if (view.name === "add") return addScreen(view.eventId);
    if (view.name === "event") return eventScreen(await api(`/events?id=${encodeURIComponent(view.eventId)}`));
    return listScreen((await api("/events")).events);
  } catch (e) {
    if (/not auth|ADMIN_KEY/i.test(e.message)) { KEY = ""; sessionStorage.removeItem("ongia-admin-key"); return signInScreen(e.message); }
    ROOT.innerHTML = `<div class="card"><div class="card-body"><div class="bad"><b>Something went wrong.</b> ${esc(e.message)}</div></div></div>`;
  }
}
const load = render;
render();
</script>
</body>
</html>
