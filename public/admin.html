    return;
  }

  const nameEl = document.getElementById("r-name");
  const sig = () => { document.getElementById("sigline").textContent = nameEl.value.trim() || " "; };
  nameEl.oninput = sig; sig();

  // What the ticks add up to, in a sentence, right above the signature.
  const readback = () => {
    const on = COSTS.filter(([k]) => { const el = ROOT.querySelector(`[data-cover="${k}"]`); return el?.checked && !el.disabled; })
      .map(([, l]) => l.split(" (")[0].toLowerCase());
    const el = document.getElementById("readback");
    if (!el) return;
    const dates = [];
    for (const [key, f, t, word] of [["travel", "r-tf", "r-tt", "Travel"], ["hotel", "r-hf", "r-ht", "Hotel"]]) {
      if (s[key] !== "yes") continue;
      const from = document.getElementById(f)?.value, to = document.getElementById(t)?.value;
      if (from && to) dates.push(`${word} ${fmtDate(from)} to ${fmtDate(to)}`);
    }
    el.innerHTML = `<b>ONGIA will cover:</b> ${on.length ? esc(on.join(", ")) : "nothing"}.`
      + (dates.length ? `<br><b>Approved dates:</b> ${esc(dates.join(" · "))}.` : "");
  };
  ROOT.querySelectorAll("[data-cover]").forEach((c) => c.addEventListener("change", readback));
  ROOT.querySelectorAll("#r-tf, #r-tt, #r-hf, #r-ht").forEach((d) => d.addEventListener("change", readback));
  readback();

  document.getElementById("approve").onclick = async (e) => {
    const problem = document.getElementById("problem");
    const covers = {};
    ROOT.querySelectorAll("[data-cover]").forEach((c) => { covers[c.dataset.cover] = c.checked && !c.disabled; });
    const dates = (key, f, t) => s[key] === "yes" ? { from: document.getElementById(f).value, to: document.getElementById(t).value } : undefined;
    const body = {
      covers,
      travel: dates("travel", "r-tf", "r-tt"),
      hotel: dates("hotel", "r-hf", "r-ht"),
      otherText: document.getElementById("r-other").value,
      note: document.getElementById("r-note").value,
      approverName: nameEl.value,
      approverRole: document.getElementById("r-role").value,
      attest: document.getElementById("r-attest").checked,
    };
    if (!body.approverName.trim()) return (problem.innerHTML = `<div class="bad"><b>Your name is the signature.</b> Please type it.</div>`);
    if (!body.attest) return (problem.innerHTML = `<div class="bad"><b>Please confirm</b> the electronic signature.</div>`);
    const covered = COSTS.filter(([k]) => covers[k]).map(([, l]) => l.split(" (")[0]);
    if (!confirm(`Approve ${p.first} ${p.last}'s agreement?\n\nONGIA covers: ${covered.join(", ") || "nothing"}.\n\nThis issues the final PDF and emails it.`)) return;
    sessionStorage.setItem("ongia-approver", body.approverName);
    sessionStorage.setItem("ongia-approver-role", body.approverRole);
    e.target.disabled = true; e.target.textContent = "Issuing final copy…";
    try {
      await api(`/review?event=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(p.id)}&action=approve`,
        { method: "POST", body: JSON.stringify(body) });
      toast("Approved. Final PDF issued.");
      render();
    } catch (err) {
      problem.innerHTML = `<div class="bad"><b>Not approved.</b> ${esc(err.message)}</div>`;
      e.target.disabled = false; e.target.textContent = "Approve & issue final";
    }
  };

  document.getElementById("return").onclick = async (e) => {
    const note = document.getElementById("r-return").value.trim();
    if (!note) return toast("Say what needs changing first.");
    if (!confirm(`Send this back to ${p.first} with your note?`)) return;
    e.target.disabled = true;
    try {
      await api(`/review?event=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(p.id)}&action=return`,
        { method: "POST", body: JSON.stringify({ note, approverName: nameEl.value }) });
      toast("Sent back to the presenter.");
      view = { name: "event", eventId: ev.id }; render();
    } catch (err) { toast(err.message); e.target.disabled = false; }
  };
}

/** "· confirmed" or "· approved X to Y" next to what the presenter asked for. */
function approvedNote(r) {
  if (!r) return "";
  return r.changed ? ` · <b>approved ${esc(fmtDate(r.from))} to ${esc(fmtDate(r.to))}</b>` : " · confirmed";
}

/** Editable travel / hotel dates for the board member, boxed to the event's window. */
function dateRows(s, ev) {
  const win = ev.travelWindow ?? {};
  const row = (label, on, from, to, f, t, a, b) => !on ? "" : `<div class="daterow">
    <div class="req">${label} — presenter asked for <b>${esc(fmtDate(from))} to ${esc(fmtDate(to))}</b>. Confirm or adjust:</div>
    <div class="row2">
      <div class="field"><label for="${f}">${a}</label><input type="date" id="${f}" value="${esc(from)}" min="${esc(win.from ?? "")}" max="${esc(win.to ?? "")}"></div>
      <div class="field"><label for="${t}">${b}</label><input type="date" id="${t}" value="${esc(to)}" min="${esc(win.from ?? "")}" max="${esc(win.to ?? "")}"></div>
    </div></div>`;
  const any = s.travel === "yes" || s.hotel === "yes";
  return !any ? "" : `<h2 style="margin:18px 0 4px;font-size:16px">Travel &amp; accommodation dates</h2>
    <p class="hint" style="margin:0 0 4px">Allowed: ${esc(fmtDate(win.from))} to ${esc(fmtDate(win.to))} (training days plus one either side).</p>
    ${row("Travel", s.travel === "yes", s.travelFrom, s.travelTo, "r-tf", "r-tt", "Arriving", "Departing")}
    ${row("Hotel", s.hotel === "yes", s.hotelFrom, s.hotelTo, "r-hf", "r-ht", "Check-in", "Check-out")}`;
}

function deliveryMarkup(d = {}) {
  const line = (label, r) => {
    if (!r) return `<div class="stat"><span class="dot"></span><div>${label}<small>not attempted</small></div></div>`;
    const cls = r.ok ? "ok" : r.skipped ? "skip" : "err";
    const detail = r.ok
      ? (r.folderUrl ? `<a href="${esc(r.folderUrl)}" target="_blank" rel="noopener">Open folder</a> · ${(r.files ?? []).map((f) => esc(f.name)).join(", ")}` : `sent ${esc((r.at ?? "").replace("T", " ").slice(0, 16))} UTC`)
      : esc(r.reason ?? r.error ?? "failed");
    return `<div class="stat ${cls}"><span class="dot"></span><div>${label}<small>${detail}</small></div></div>`;
  };
  return line("Final copy emailed to the presenter", d.presenterEmail) +
    line("Filed to SharePoint", d.filing) +
    line("Board notified", d.boardEmail);
}

/* ---------- render ---------- */
async function render() {
  if (!KEY) return signInScreen();
  try {
    if (view.name === "new") { await loadRoster(); return eventFormScreen(); }
    if (view.name === "edit") { const [data] = await Promise.all([api(`/events?id=${encodeURIComponent(view.eventId)}`), loadRoster()]); return eventFormScreen(data); }
    if (view.name === "roster") return rosterScreen(await loadRoster());
    if (view.name === "add") return addScreen(view.eventId);
    if (view.name === "event") {
      const [data, materials] = await Promise.all([api(`/events?id=${encodeURIComponent(view.eventId)}`), api(`/materials?event=${encodeURIComponent(view.eventId)}`).catch(() => null)]);
      return eventScreen({ ...data, materials });
    }
    if (view.name === "review") return reviewScreen(await api(`/review?event=${encodeURIComponent(view.eventId)}&presenter=${encodeURIComponent(view.presenterId)}`));
    return listScreen((await api("/events")).events);
  } catch (e) {
    if (/not auth|ADMIN_KEY/i.test(e.message)) { KEY = ""; sessionStorage.removeItem("ongia-admin-key"); return signInScreen(e.message); }
    BARRIGHT.innerHTML = `<button class="chip" id="home">All events</button>`;
    document.getElementById("home").onclick = () => { view = { name: "list" }; render(); };
    ROOT.innerHTML = `<div class="card"><div class="card-body"><div class="bad"><b>Something went wrong.</b> ${esc(e.message)}</div></div></div>`;
  }
}
const load = render;
// The "ready for review" email links straight to a presenter: #review/<event>/<presenter>
{
  const m = location.hash.match(/^#review\/([^/]+)\/([^/]+)$/);
  if (m) { view = { name: "review", eventId: decodeURIComponent(m[1]), presenterId: decodeURIComponent(m[2]) }; history.replaceState(null, "", location.pathname); }
  const e = location.hash.match(/^#event\/([^/]+)$/);
  if (e) { view = { name: "event", eventId: decodeURIComponent(e[1]) }; history.replaceState(null, "", location.pathname); }
}
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#review\/([^/]+)\/([^/]+)$/);
  if (m) { view = { name: "review", eventId: decodeURIComponent(m[1]), presenterId: decodeURIComponent(m[2]) }; history.replaceState(null, "", location.pathname); render(); }
  const e = location.hash.match(/^#event\/([^/]+)$/);
  if (e) { view = { name: "event", eventId: decodeURIComponent(e[1]) }; history.replaceState(null, "", location.pathname); render(); }
});
render();

// A tab left open for days keeps running old code and shows old wording. When the tab
// comes back into view, compare the served page's ETag with the one we loaded.
{
  let etag = null;
  const check = async () => {
    try {
      const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
      const tag = r.headers.get("etag");
      if (!tag) return;
      if (etag === null) { etag = tag; return; }
      if (tag !== etag && !document.getElementById("reloadbar")) {
        const bar = document.createElement("button"); bar.id = "reloadbar"; bar.className = "reloadbar"; bar.type = "button";
        bar.textContent = "This page has been updated. Tap to reload.";
        bar.onclick = () => location.reload();
        document.body.append(bar);
      }
    } catch { /* offline or blocked: nothing to do */ }
  };
  check();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
  setInterval(check, 10 * 60 * 1000);
}
