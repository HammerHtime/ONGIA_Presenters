<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONGIA Presenter Agreement Desk</title>
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<meta name="theme-color" content="#0e1a35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Oswald:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme:light;
    --paper:#f2efe8; --card:#fafaf7; --sunk:#edeae2; --sand:#e9e4d8;
    --ink:#12161f; --ink-mid:#2c3448; --muted:#767f92;
    --navy:#1a2f5e; --navy-deep:#0e1a35;
    --gold:#b8922a; --gold-light:#d9ae4b; --gold-pale:#f4ecd6;
    --border:#ddd7c8; --hair:rgba(18,22,31,.10);
    --done:#2f6b4f; --done-bg:#e2efe7;
    --wait:#9a6a12; --wait-bg:#f8ecd5;
    --late:#a33328; --late-bg:#f7e3e0;
    --shadow:0 10px 30px rgba(14,26,53,.09),0 2px 6px rgba(14,26,53,.05);
    --fd:"DM Serif Display",Georgia,serif;
    --fb:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --fu:"Oswald","Arial Narrow",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
  h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
  p{margin:0}
  button{font:inherit;color:inherit}
  a{color:var(--navy)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

  .bar{background:var(--navy-deep);color:#fff;padding:13px 20px;display:flex;align-items:center;
       gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:10}
  .bar .logo{height:28px;width:auto;display:block;flex:none}
  @media (max-width:480px){.bar .logo{height:23px}}
  .bar .sub{font-size:13px;color:rgba(255,255,255,.62)}
  .bar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .chip{border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;
        border:1px solid rgba(255,255,255,.34);color:#fff;background:transparent;cursor:pointer}
  .chip.solid{background:var(--gold);border-color:var(--gold);color:#1c1608}

  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 70px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;
        box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .card-head{background:var(--sand);padding:17px 22px;border-bottom:1px solid var(--border);
             display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .card-head>div:first-child{flex:1 1 200px;min-width:0}
  .card-head h2{font-family:var(--fd);font-size:22px}
  .card-head .s{font-size:13.5px;color:var(--muted);margin-top:2px}
  .card-body{padding:20px 22px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border)}
  .tile{background:var(--sunk);padding:15px 18px}
  .tile .k{font-family:var(--fu);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:var(--fd);font-size:32px;line-height:1.05;margin-top:3px;font-variant-numeric:tabular-nums}
  .tile.accent .v{color:var(--gold)}

  .field{margin-top:14px}
  .field label{display:block;font-family:var(--fu);font-size:11px;letter-spacing:.13em;
        text-transform:uppercase;color:var(--ink-mid);margin-bottom:6px}
  input,textarea,select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--sunk);
    border:1px solid var(--border);border-radius:12px;padding:11px 13px;-webkit-appearance:none}
  textarea{resize:vertical;min-height:92px;font-size:15px}
  /* Only the paste-a-list boxes are monospace; the rest is prose a person writes. */
  #e-people,#p-rows{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13.5px}
  input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;width:20px;height:20px;padding:0;margin:0;
    border:0;border-radius:4px;background:none;accent-color:var(--gold);flex:none}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}

  .btn{border-radius:999px;padding:12px 24px;font-weight:700;font-size:15px;border:1px solid transparent;cursor:pointer}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-gold{background:var(--gold);color:#1c1608}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--ink-mid)}
  .btn[disabled]{opacity:.55;cursor:progress}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

  .presenter{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    background:var(--sunk);border:1px solid var(--border);border-radius:16px;padding:13px 15px;margin-bottom:10px}
  @media(max-width:660px){.presenter{grid-template-columns:auto 1fr}.presenter .act{grid-column:2}}
  .av{flex:0 0 42px;width:42px;height:42px;border-radius:999px;display:grid;place-items:center;background:var(--navy);
      color:var(--gold-light);font-family:var(--fu);font-size:15px}
  .pname{font-weight:700;font-size:15px}
  .porg{font-size:12.5px;color:var(--muted)}
  .ptalk{font-size:12.5px;color:var(--ink-mid);margin-top:3px}
  .act{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:11.5px;
    font-weight:700;white-space:nowrap;font-family:var(--fu);letter-spacing:.09em;text-transform:uppercase}
  .pill::before{content:"";width:7px;height:7px;border-radius:999px;background:currentColor}
  .pill.done{background:var(--done-bg);color:var(--done)}
  .pill.wait{background:var(--wait-bg);color:var(--wait)}
  .pill.late{background:var(--late-bg);color:var(--late)}
  /* Navy means "waiting on ONGIA" — it survives greyscale and colour blindness. */
  .pill.you{background:var(--navy);color:#fff}
  .pill.idle{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}
  .mini{border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink-mid);
    font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer}
  .mini:hover{border-color:var(--navy);color:var(--navy)}
  .mini.gold{background:var(--gold);border-color:var(--gold);color:#1c1608}

  .dates{display:grid;gap:1px;background:var(--border);border-radius:14px;overflow:hidden;margin-top:14px}
  .drow{background:var(--sunk);padding:11px 14px;display:grid;grid-template-columns:1fr auto auto;
    gap:10px 12px;align-items:center}
  .drow dt{font-size:13px;color:var(--muted)}
  .drow dt span{display:block;font-size:11.5px;color:var(--muted);opacity:.8}
  .drow dd{margin:0;font-size:13.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .daysback{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .daysback input{width:68px;padding:6px 8px;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
  @media (max-width:480px){
    .drow{grid-template-columns:1fr auto}
    .drow dd{grid-column:1/-1;text-align:left;font-size:15px}
  }

  .note{margin-top:14px;background:var(--gold-pale);border:1px solid var(--gold);border-radius:14px;
        padding:12px 15px;font-size:13.5px;line-height:1.55;color:var(--ink-mid)}
  .bad{margin-top:14px;background:var(--late-bg);border:1px solid var(--late);border-radius:14px;
       padding:12px 15px;font-size:13.5px;color:var(--ink-mid)}
  .bad b{color:var(--late)}
  .links{margin-top:14px;background:var(--sunk);border:1px solid var(--border);border-radius:14px;padding:13px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;word-break:break-all;line-height:1.8}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}

  /* tracking table */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .fchip{border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--ink-mid);
    border:1px solid var(--border);cursor:pointer} .fchip b{color:var(--muted);font-weight:700;margin-left:3px}
  .fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)} .fchip.on b{color:var(--gold-light)}
  .trow{display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(150px,1fr) minmax(170px,1.1fr) auto;gap:14px;align-items:start;
    background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px}
  .trow .who{display:flex;gap:12px;align-items:center;min-width:0} .trow .who>div{min-width:0}
  .trow .cell .pill{max-width:100%;white-space:normal;text-align:left}
  .trow .act{padding-top:2px}
  .trow .cell .cl{font-family:var(--fu);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .trow .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .mini.mat{white-space:nowrap}
  @supports (grid-template-columns: subgrid){
    .tlist{display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(150px,1fr) minmax(170px,1.1fr) max-content;column-gap:14px}
    .tlist>.trow{grid-column:1/-1;grid-template-columns:subgrid}
    .tlist>.empty{grid-column:1/-1}
    .tlist>.thead{grid-column:1/-1;display:grid;grid-template-columns:subgrid;padding:0 14px 5px;
      font-family:var(--fu);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .tlist>.trow .cl{display:none}
  }
  @media (max-width:820px){.tlist>.thead{display:none}.tlist>.trow .cl{display:block}}
  .mini.mat{font-size:11.5px;padding:5px 10px;background:var(--sunk)} .mini.mat.done{background:var(--done-bg);color:var(--done);border-color:var(--done)}
  .mini.mat.late{background:var(--late-bg);color:var(--late);border-color:var(--late)} .mini.mat.wait{background:var(--wait-bg);color:var(--wait);border-color:var(--wait)}
  .tile .v small{font-size:14px;color:var(--muted);font-weight:400}
  /* events list: one wrapping row of small figures instead of six tiles */
  .stats{display:flex;flex-wrap:wrap;gap:6px 8px;padding:12px 22px;border-top:1px solid var(--hair)}
  .chipstat{font-size:12.5px;color:var(--muted);background:var(--sunk);border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .chipstat b{color:var(--ink);font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums} .chipstat b small{color:var(--muted);font-weight:400}
  .chipstat.hot{background:var(--wait-bg);border-color:var(--wait)} .chipstat.hot b{color:var(--wait)}
  .chipstat.good{background:var(--done-bg);border-color:var(--done)} .chipstat.good b{color:var(--done)}
  .chipstat.you{background:var(--navy);border-color:var(--navy);color:#fff} .chipstat.you b{color:var(--gold-light)}
  .chipstat.stop{background:var(--late-bg);border-color:var(--late)} .chipstat.stop b{color:var(--late)}
  /* What needs a person today, across every event. */
  .needs{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
    overflow:hidden;margin-bottom:18px}
  .needs>h2{background:var(--navy-deep);color:#fff;font-family:var(--fu);font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;padding:12px 20px;border-bottom:3px solid var(--gold)}
  .needs .nrow{display:flex;gap:12px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid var(--hair);font-size:14px;line-height:1.5}
  .needs .nrow:last-child{border-bottom:0}
  .needs .nrow .why{flex:1;min-width:0}
  .needs .nrow b{display:block}
  .needs .nrow .who{color:var(--muted);font-size:13px;margin-top:2px}
  .needs .nrow .mini{flex:none}
  .needs .nrow.stop{background:var(--late-bg)} .needs .nrow.stop b{color:var(--late)}
  .needs .nrow.act b{color:var(--navy)}
  .needs .allclear{padding:15px 20px;font-size:14px;color:var(--ink-mid)}
  @media (max-width:560px){.needs .nrow{flex-direction:column;gap:9px}.needs .nrow .mini{align-self:flex-start}}
  /* Configuration that is read once, not on every visit. */
  .settings{border-top:1px solid var(--hair);margin-top:18px}
  .settings>summary{cursor:pointer;padding:13px 0 3px;font-family:var(--fu);font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted)}
  .blocked{margin-top:12px;background:var(--late-bg);border:1px solid var(--late);border-radius:14px;padding:13px 15px;font-size:13.5px}
  .blocked>b{color:var(--late)} .blocked .brow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:8px}
  .blocked .brow span{flex:1;min-width:190px}
  .sendfail{margin:0 0 12px;background:var(--late-bg);border:1px solid var(--late);border-radius:14px;padding:12px 15px;font-size:13.5px}
  .sendfail b{color:var(--late)}
  .cardacts{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end;margin-left:auto}
  @media (max-width:700px){.cardacts{margin-left:0;justify-content:flex-start;width:100%;margin-top:8px}}
  .evcard{cursor:pointer} .evcard:hover{box-shadow:0 6px 20px rgba(18,22,31,.08)}
  /* Working: a quiet line under the bar. Broken: a red box that cannot be missed. */
  .healthwrap{margin:0 0 16px}
  .hstrip{display:flex;gap:4px 20px;flex-wrap:wrap;align-items:baseline;font-size:12.5px;color:var(--muted)}
  .hstrip .dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:7px;
    vertical-align:1px;background:var(--muted)}
  .hstrip small{color:var(--muted);opacity:.85;font-size:12px;margin-left:6px}
  .hstrip small::before{content:"· ";opacity:.7}
  .hstrip.bad{display:block;background:var(--late-bg);border:1px solid var(--late);border-radius:14px;
    padding:12px 15px;font-size:13.5px;color:var(--ink-mid)}
  .hstrip.bad>b{display:block;color:var(--late);margin-bottom:5px}
  .hstrip.bad>span{display:block;margin-top:3px}
  .hstrip.bad small{display:block;margin-left:15px}
  @media (max-width:600px){
    .card-head{padding:14px 16px} .card-head h2{font-size:19px} .stats{padding:10px 16px}
    .tiles{grid-template-columns:repeat(3,1fr)} .tile{padding:10px 12px} .tile .k{font-size:9px;letter-spacing:.1em} .tile .v{font-size:22px}
  }
  @media (max-width:700px){.tiles{display:none}}
  /* Fingers, not pointers: nothing that changes data below the 44px floor. */
  @media (pointer:coarse){
    .mini,.fchip{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px}
    .mini.mat{min-height:44px;padding:0 13px;text-align:left}
    .member input[type=checkbox],.member input[type=radio]{width:22px;height:22px}
    .member .rphone{min-height:44px}
  }
  @media (max-width:820px){.tlist{display:block}.trow{grid-template-columns:1fr 1fr}.trow .who{grid-column:1/-1}.trow .act{grid-column:1/-1;justify-content:flex-start}}
  @media (max-width:480px){.trow{grid-template-columns:1fr}}

  /* review screen */
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px;margin-top:12px;align-items:baseline}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;white-space:pre-wrap;word-break:break-word}
  @media (max-width:560px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
  .blurb{background:var(--sunk);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:13.5px;
    line-height:1.55;white-space:pre-wrap;margin-top:6px}
  .costs{display:grid;gap:8px;margin-top:10px;max-width:760px}
  .cost{display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:center;background:var(--card);
    border:1px solid var(--border);border-radius:14px;padding:11px 14px;font-size:13.5px}
  .cost:has(input:checked){background:var(--gold-pale);border-color:var(--gold)}
  @media (max-width:560px){.cost{grid-template-columns:1fr}}
  .readback{margin-top:14px;background:var(--sunk);border:1px solid var(--border);border-radius:14px;padding:11px 14px;font-size:13.5px}
  .readback b{color:var(--navy)}
  .cost .agency{font-size:12px;color:var(--muted)} .cost .agency b{color:var(--ink)}
  .board{display:grid;gap:6px;margin-top:4px}
  .member{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);
    border:1px solid var(--border);border-radius:12px;padding:9px 12px;font-size:13.5px}
  .member .em{color:var(--muted);font-size:12px} .member.lead{border-color:var(--gold);background:var(--gold-pale)}
  .member label.leadpick{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
  .member input[type=radio]{width:16px;height:16px;padding:0;margin:0;border:0;background:none;accent-color:var(--gold);-webkit-appearance:radio;appearance:auto}
  #e-mins{max-width:150px} input[type=date]{max-width:230px}
  .addrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}
  .addrow:has(#rb-phone){grid-template-columns:1fr 1fr 1fr auto}
  .member:has(.rphone){grid-template-columns:auto 1fr auto auto}
  .member .rphone{width:150px;padding:6px 9px;font-size:12.5px;border:1px solid var(--border);border-radius:9px;background:var(--sunk);font-family:inherit}
  @media (max-width:560px){.member:has(.rphone){grid-template-columns:auto 1fr auto}.member .rphone{grid-column:2/-1;width:100%}}
  [hidden]{display:none!important}
  @media (max-width:560px){.addrow,.addrow:has(#rb-phone){grid-template-columns:1fr}}
  .daterow{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:8px}
  .daterow .req{color:var(--muted);font-size:12px;margin-bottom:8px} .daterow .req b{color:var(--ink)}
  .daterow .row2 .field{margin:0}
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:600}
  .toggle input{width:20px;height:20px;accent-color:var(--gold)}
  .stat{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--hair);font-size:13.5px}
  .stat:first-child{border-top:0}
  .stat .dot{width:10px;height:10px;border-radius:999px;margin-top:5px;flex:none;background:var(--muted)}
  .stat.ok .dot{background:var(--done)} .stat.err .dot{background:var(--late)} .stat.skip .dot{background:var(--wait)}
  .stat small{display:block;color:var(--muted)}
  @font-face{font-family:"Signature";src:url(/assets/fonts/GreatVibes-Regular.ttf) format("truetype");font-display:swap}
  .sigbox{margin-top:14px;border-bottom:2px solid var(--navy);padding:6px 8px;font-family:"Signature",var(--fd,"DM Serif Display",serif),cursive;
    font-size:38px;line-height:1.15;min-height:52px;color:var(--navy)}
  .script{font-family:"Signature",var(--fd,"DM Serif Display",serif),cursive;font-size:26px;line-height:1;color:var(--navy);vertical-align:-3px}
  .attest{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13.5px;line-height:1.5;cursor:pointer}
  .attest input{width:20px;height:20px;accent-color:var(--gold);flex:none;margin-top:1px}
  .mini.ghost{background:transparent}
  .pill.late{background:var(--late-bg);color:var(--late)}
  .btn-late{background:var(--late-bg);color:var(--late);border:1px solid var(--late)}
  .signin-brand{background:var(--navy-deep);padding:22px 20px 18px;text-align:center;border-bottom:3px solid var(--gold)}
  .signin-brand img{height:39px;width:auto;display:inline-block}
  .signin-brand span{display:block;margin-top:9px;font-family:var(--fu);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:rgba(255,255,255,.66)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy-deep);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9}
  .reloadbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gold);color:var(--ink);border:0;
    font:inherit;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:10;cursor:pointer}
</style>
</head>
<body>

<div class="bar">
  <img class="logo" src="/assets/ongia-logo.png" alt="ONGIA" width="168" height="28">
  <span class="sub">Presenter Agreement Desk</span>
  <span class="right" id="barright"></span>
</div>

<div class="wrap" id="root"><p class="empty">Loading…</p></div>

<script type="module">
const ROOT = document.getElementById("root");
const BARRIGHT = document.getElementById("barright");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = (iso) => { if (!/^\d{4}-\d{2}-\d{2}/.test(iso ?? "")) return iso ?? ""; const [y,m,d] = iso.slice(0,10).split("-").map(Number); const dt = new Date(y, m-1, d); return `${DAYS[dt.getDay()]} ${d} ${MONTHS[m-1]} ${y}`; };

let KEY = sessionStorage.getItem("ongia-admin-key") ?? "";
let view = { name: "list", eventId: null };
let busy = false;

async function api(path, options = {}) {
  const res = await fetch(`/api${path}`, {
    ...options,
    headers: { "content-type": "application/json", "x-admin-key": KEY, ...(options.headers ?? {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error ?? `Request failed (${res.status})`);
  return body;
}

/* ---------- sign in ---------- */
function signInScreen(message) {
  BARRIGHT.innerHTML = "";
  ROOT.innerHTML = `<div class="card" style="max-width:420px;margin:40px auto">
    <div class="signin-brand"><img src="/assets/ongia-logo.png" alt="ONGIA" width="232" height="39">
      <span>Presenter Agreement Desk</span></div>
    <div class="card-head"><div><h2>Sign in</h2>
      <div class="s">The admin key for this site.</div></div></div>
    <div class="card-body">
      ${message ? `<div class="bad"><b>Couldn't sign in.</b> ${esc(message)}</div>` : ""}
      <div class="field"><label for="k">Admin key</label>
        <input id="k" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div class="actions"><button class="btn btn-navy" id="go">Sign in</button></div>
      <p class="hint">Ask the coordinator for the key. (Technically: the site's ADMIN_KEY setting on Netlify.)</p>
    </div></div>`;
  document.getElementById("k").focus();
  const submit = () => {
    KEY = document.getElementById("k").value.trim();
    if (!KEY) return signInScreen("Please enter the key.");
    sessionStorage.setItem("ongia-admin-key", KEY);
    load();
  };
  document.getElementById("go").onclick = submit;
  document.getElementById("k").onkeydown = (e) => { if (e.key === "Enter") submit(); };
}

/* ---------- events list ---------- */
function listScreen(events) {
  BARRIGHT.innerHTML = `<button class="chip" id="roster">Board members</button><button class="chip solid" id="newevent">New event</button>`;
  queueMicrotask(healthStrip);
  document.getElementById("roster").onclick = () => { view = { name: "roster" }; render(); };
  document.getElementById("newevent").onclick = () => { view = { name: "new" }; render(); };

  if (!events.length) {
    ROOT.innerHTML = `<div class="healthwrap" id="health"><div class="hstrip">Checking email and SharePoint…</div></div><div class="card"><div class="empty">
      <p>No events yet.</p>
      <div class="actions" style="justify-content:center"><button class="btn btn-gold" id="first">Create your first event</button></div>
    </div></div>`;
    document.getElementById("first").onclick = () => { view = { name: "new" }; render(); };
    return;
  }

  ROOT.innerHTML = `<div class="healthwrap" id="health"><div class="hstrip">Checking email and SharePoint…</div></div>`
    + needsCard(events)
    + events.map((ev) => {
    const c = ev.counts;
    const md = ev.materials?.draft ?? 0, mf = ev.materials?.final ?? 0;
    const blockers = blockersOf(ev);
    return `<div class="card evcard" data-open="${esc(ev.id)}" role="link" tabindex="0">
      <div class="card-head"><div><h2>${esc(ev.title)}</h2>
        <div class="s">${esc(ev.city)}${ev.venue ? " · " + esc(ev.venue) : ""} · ${esc(fmtDate(ev.dayOne))}${ev.lastDay && ev.lastDay !== ev.dayOne ? " – " + esc(fmtDate(ev.lastDay)) : ""}</div></div></div>
      <div class="stats">
        <span class="chipstat"><b>${c.total}</b>presenter${c.total === 1 ? "" : "s"}</span>
        ${blockers.length ? `<span class="chipstat stop" title="${esc(blockers.map((b) => b.short).join(", "))}"><b>${blockers.length}</b>blocking ${blockers.length === 1 ? "problem" : "problems"}</span>` : ""}
        ${c.uninvited ? `<span class="chipstat stop"><b>${c.uninvited}</b>link never sent</span>` : ""}
        ${c.failed ? `<span class="chipstat stop"><b>${c.failed}</b>not filed</span>` : ""}
        <span class="chipstat${c.invited + c.opened ? " hot" : ""}"><b>${c.invited + c.opened}</b>waiting on them</span>
        <span class="chipstat${c.submitted ? " you" : ""}"><b>${c.submitted}</b>for you to review</span>
        <span class="chipstat${c.approved && c.approved === c.total ? " good" : ""}"><b>${c.approved}</b>final</span>
        <span class="chipstat"><b>${md}<small>/${c.total}</small></b>draft materials</span>
        <span class="chipstat"><b>${mf}<small>/${c.total}</small></b>final materials</span>
      </div>
      <div class="card-body" style="padding-top:10px;padding-bottom:12px">${nextLine(ev, c)}</div>
    </div>`;
  }).join("");

  ROOT.querySelectorAll(".evcard").forEach((card) => { card.onkeydown = (e) => { if (e.key === "Enter") card.click(); }; });
  ROOT.querySelectorAll("[data-open]").forEach((b) => {
    b.onclick = () => { view = { name: "event", eventId: b.dataset.open }; render(); };
  });
  ROOT.querySelectorAll("[data-goev]").forEach((b) => { b.onclick = (e) => { e.stopPropagation(); view = { name: "event", eventId: b.dataset.goev }; render(); }; });
  ROOT.querySelectorAll("[data-goreview]").forEach((b) => { b.onclick = (e) => {
    e.stopPropagation(); const [eid, pid] = b.dataset.goreview.split("|");
    view = { name: "review", eventId: eid, presenterId: pid }; render();
  }; });
}

/**
 * What stops an event working at all. These are quiet failures: with no lead
 * nobody is named on the agreement and nobody is cued to review; with no upload
 * link the materials reminders never fire; with no folder nothing is filed.
 */
function blockersOf(ev) {
  const out = [];
  if (!ev.reviewer?.name) out.push({ short: "no lead", title: "No lead board member",
    why: "Nobody is named on the agreement, nobody is prompted to review, and replies go to the speakers mailbox.", fix: "Pick a lead", act: "edit" });
  if (!ev.materialsUploadUrl) out.push({ short: "no upload link", title: "No upload link",
    why: "Presenters have nowhere to put their slides, and materials reminders are switched off for this event.", fix: "Create upload link", act: "mklink" });
  if (!ev.sharePointFolder) out.push({ short: "no SharePoint folder", title: "No SharePoint folder",
    why: "Approved agreements will not be filed anywhere.", fix: "Create it", act: "mkfolder" });
  return out;
}

/**
 * The front page of the desk: everything that is true, known to the app, and
 * otherwise invisible until someone opens each event in turn.
 */
function needsCard(events) {
  const today = new Date().toISOString().slice(0, 10);
  const days = (iso) => Math.round((Date.parse(iso) - Date.parse(today)) / 86400000);
  const rows = [];
  const names = (list, max = 4) => {
    const n = list.map((x) => esc(x.name));
    return n.length <= max ? n.join(", ") : `${n.slice(0, max).join(", ")} and ${n.length - max} more`;
  };
  for (const ev of events) {
    const a = ev.attention ?? {};
    const where = `${esc(ev.city)} · ${esc(ev.title)}`;
    for (const pr of a.review ?? []) rows.push({ cls: "act", rank: 0,
      title: "Waiting for your signature", who: `${esc(pr.name)} — ${where}`, label: "Review", goreview: `${ev.id}|${pr.id}` });
    if ((a.uninvited ?? []).length) rows.push({ cls: "stop", rank: 1,
      title: `${a.uninvited.length} presenter${a.uninvited.length === 1 ? " has" : "s have"} never been sent a link`,
      who: `${names(a.uninvited)} — ${where}. No reminder will ever reach them.`, label: "Open event", goev: ev.id });
    if ((a.failed ?? []).length) rows.push({ cls: "stop", rank: 2,
      title: `${a.failed.length} signed agreement${a.failed.length === 1 ? "" : "s"} never reached SharePoint`,
      who: `${names(a.failed)} — ${where}`, label: "Open event", goev: ev.id });
    if ((a.sendFailed ?? []).length) rows.push({ cls: "stop", rank: 2,
      title: `${a.sendFailed.length} email${a.sendFailed.length === 1 ? "" : "s"} could not be sent`,
      who: `${names(a.sendFailed)} — ${where}`, label: "Open event", goev: ev.id });
    const blockers = blockersOf(ev);
    if (blockers.length) rows.push({ cls: "stop", rank: 3,
      title: `Event is blocked: ${blockers.map((b) => b.short).join(", ")}`,
      who: `${where}${ev.deadlines?.agreement ? ` · agreements due ${esc(fmtDate(ev.deadlines.agreement))}` : ""}`, label: "Open event", goev: ev.id });
    const due = ev.deadlines?.agreement;
    const out = (a.outstanding ?? []).length;
    if (due && days(due) < 0 && out) rows.push({ cls: "stop", rank: 4,
      title: `${out} agreement${out === 1 ? "" : "s"} overdue by ${-days(due)} day${days(due) === -1 ? "" : "s"}`,
      who: `${names(a.outstanding)} — ${where}`, label: "Open event", goev: ev.id });
  }
  rows.sort((a, b) => a.rank - b.rank);
  const live = events.filter((e) => (e.lastDay || e.dayOne) >= today).length;
  const body = rows.length
    ? rows.map((r) => `<div class="nrow ${r.cls}"><div class="why"><b>${r.title}</b><div class="who">${r.who}</div></div>
        <button class="mini${r.goreview ? " gold" : ""}" ${r.goreview ? `data-goreview="${esc(r.goreview)}"` : `data-goev="${esc(r.goev)}"`}>${r.label}</button></div>`).join("")
    : `<div class="allclear">Nothing needs you today. ${live} event${live === 1 ? "" : "s"} on the rails.</div>`;
  return `<div class="needs"><h2>Needs you now</h2>${body}</div>`;
}

/* ---------- new event ---------- */
function eventFormScreen(existing = null) {
  const ev = existing?.event ?? null;
  const roster = existing?.roster ?? ROSTER;
  BARRIGHT.innerHTML = `<button class="chip" id="cancel">${ev ? "Back to event" : "Back"}</button>`;
  document.getElementById("cancel").onclick = () => { view = ev ? { name: "event", eventId: ev.id } : { name: "list" }; render(); };
  const v = (k, d = "") => esc(ev?.[k] ?? d);

  ROOT.innerHTML = `<div class="card">
    <div class="card-head"><div><h2>${ev ? "Edit event" : "New training event"}</h2>
      <div class="s">${ev ? "Change anything below. The three deadlines are recalculated from day one." : "Set how far ahead each deadline falls; the dates are worked back from day one of the training."}</div></div></div>
    <div class="card-body">
      <div class="row2">
        <div class="field"><label for="e-title">Event title</label><input id="e-title" value="${v("title")}" placeholder="Gangs &amp; Guns Symposium"></div>
        <div class="field"><label for="e-city">City</label><input id="e-city" value="${v("city")}" placeholder="Winnipeg, MB"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="e-venue">Venue</label><input id="e-venue" value="${v("venue")}" placeholder="RBC Convention Centre"></div>
        <div class="field"><label for="e-mins">Presentation slot (minutes)</label><input id="e-mins" type="number" min="15" step="5" value="${v("sessionMinutes", 70)}"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="e-day1">Day one of training</label><input id="e-day1" type="date" value="${v("dayOne")}"></div>
        <div class="field"><label for="e-last">Last day</label><input id="e-last" type="date" value="${v("lastDay")}"></div>
      </div>
      <div id="preview"></div>
      <div class="field"><label>Board members for this event</label>
        <p class="hint" style="margin:0 0 6px">Tick everyone who should be kept informed. Mark one as <b>lead</b>: they are the ONGIA contact presenters see and reply to, and they review each agreement, set what ONGIA covers, confirm travel dates and sign.</p>
        <div class="board" id="board">${boardRows(roster, ev?.board ?? [])}</div>
        <p class="hint" style="margin:8px 0 0"><a href="#" id="nb-toggle">Someone missing from this list? Add them</a></p>
        <div class="addrow" id="nb-row" hidden><input id="nb-name" placeholder="Name"><input id="nb-email" type="email" placeholder="email@ongia.ca"><button class="mini" id="nb-add" type="button">Add to list</button></div>
      </div>
      <div class="field"><label>Presenters reach</label>
        <p class="hint" id="cphonehint" style="margin:0"></p></div>
      <div class="field"><label for="e-folder">Event folder in SharePoint <span style="text-transform:none;letter-spacing:0;font-family:var(--fb)">(paste the link, or leave blank)</span></label>
        <input id="e-folder" value="${esc(ev?.sharePointFolderUrl || ev?.sharePointFolder || "")}" placeholder="https://ongia.sharepoint.com/sites/…/2026/Toronto 2026">
        <p class="hint" id="folderhint" style="margin:6px 0 0"></p>
        <p class="hint" style="margin:6px 0 0"><a href="#" id="adv-toggle">I already have an upload link for this folder</a></p>
        <div id="adv" hidden>
          <div class="field" style="margin:12px 0 0"><label for="e-upload">Presenter upload link</label>
            <input id="e-upload" value="${v("materialsUploadUrl")}" placeholder="Paste the “Request files” link for the event folder">
            <p class="hint" style="margin:6px 0 0">Must be a SharePoint <b>Request files</b> link; the app refuses anything that would let presenters see the folder. Clear it and the app makes a fresh upload-only link for the folder above.</p></div>
        </div>
      </div>
      ${ev ? "" : `<div class="field"><label for="e-people">Presenters (one per line: first, last, email, organization)</label>
        <textarea id="e-people" style="min-height:120px" placeholder="Dana, Whitfield, d.whitfield@example.ca, Ontario Provincial Police&#10;Marc, Thibault, m.thibault@example.ca, SPVM"></textarea>
        <label class="attest" style="margin-top:10px"><input type="checkbox" id="e-invite" checked><span>Email each presenter their agreement link as soon as the event is created</span></label>
        <p class="hint" style="margin:6px 0 0">Optional now — you can add more later from the event page.</p></div>`}
      <div id="problem"></div>
      <div class="actions"><button class="btn btn-gold" id="create">${ev ? "Save changes" : "Create event"}</button></div>
    </div></div>`;

  const $ = (id) => document.getElementById(id);
  const day1 = $("e-day1"), last = $("e-last"), preview = $("preview"), city = $("e-city"), folder = $("e-folder"), upload = $("e-upload"), folderhint = $("folderhint");

  // Folder convention: year, then "year City". Shown as the default so a blank field is never a surprise.
  const convention = () => {
    const y = day1.value.slice(0, 4), c = city.value.split(",")[0].trim();
    return y && c ? `ONGIA Board/ONGIA Training/${y}/${y} ${c}` : "";
  };
  const showFolderHint = () => {
    const conv = convention();
    folder.placeholder = conv || "ONGIA Board/ONGIA Training/2027/2027 Winnipeg";
    const val = folder.value.trim(), link = upload.value.trim();
    const stored = ev ? (ev.sharePointFolderUrl || ev.sharePointFolder || "") : "";
    const year = day1.value.slice(0, 4) || "2027";
    const inside = ` Inside it, each agreement is filed to Presenter Agreements / <presenter name> ${year}.`;
    let where;
    if (val && val === stored) where = `Using ${ev.sharePointFolder}.` + inside;
    else if (val) where = (/^https?:/i.test(val) ? "Using the folder behind that link; the app works out its path when you save." : `Using ${val.replace(/^(Shared Documents|Documents)\//i, "")}.`) + inside;
    else if (conv) where = `Left blank, the app creates ${conv} in SharePoint.` + inside;
    else where = "Paste the event's folder link, or leave this blank and the app creates the folder itself.";
    const up = link && ev && link === ev.materialsUploadUrl ? " Presenters already have an upload-only link for it."
      : link ? " Presenters upload to the link you pasted, once the app has checked it is upload-only."
      : " Presenters get an upload-only link the app makes for that folder. Nothing to paste.";
    folderhint.textContent = where + up;
  };
  city.oninput = showFolderHint; folder.oninput = showFolderHint; upload.oninput = showFolderHint;
  const cphonehint = $("cphonehint");
  // The lead's name, address and number are their entry on the board list. There
  // is nothing to type here: it is shown so the coordinator can see what prints.
  function showLeadPhone() {
    const lead = readBoard().find((m) => m.lead);
    if (!lead) { cphonehint.innerHTML = "Mark one board member as the lead. Their name, email and phone number go on the agreement, and presenters' replies reach them."; return; }
    cphonehint.innerHTML = lead.phone
      ? `<b>${esc(lead.name)}</b> · ${esc(lead.email)} · ${esc(lead.phone)} — printed on the agreement and on every email.`
      : `<b>${esc(lead.name)}</b> · ${esc(lead.email)} — <b>no phone number on file.</b> Add one on the <a href="#" id="goroster">Board members</a> page and it appears here.`;
    const go = $("goroster");
    if (go) go.onclick = (e) => { e.preventDefault(); view = { name: "roster" }; render(); };
  }
  $("adv-toggle").onclick = (e) => { e.preventDefault(); const a = $("adv"); a.hidden = !a.hidden; if (!a.hidden) upload.focus(); };

  // Board picker: tick to include, radio to make lead; ticking the first person makes them lead automatically.
  const boardEl = $("board");
  boardEl.addEventListener("change", (e) => {
    const rows = [...boardEl.querySelectorAll(".member")];
    if (e.target.type === "radio") rows.forEach((r) => { const on = r.querySelector(".pick"); if (r.querySelector("input[type=radio]").checked) on.checked = true; });
    const picked = rows.filter((r) => r.querySelector(".pick").checked);
    if (!picked.some((r) => r.querySelector("input[type=radio]").checked) && picked[0]) picked[0].querySelector("input[type=radio]").checked = true;
    rows.forEach((r) => { const on = r.querySelector(".pick").checked; const radio = r.querySelector("input[type=radio]"); if (!on) radio.checked = false; r.classList.toggle("lead", radio.checked); radio.disabled = !on; });
    showLeadPhone();
  });
  $("nb-toggle").onclick = (e) => { e.preventDefault(); const r = $("nb-row"); r.hidden = !r.hidden; if (!r.hidden) $("nb-name").focus(); };
  $("nb-add").onclick = async () => {
    const name = $("nb-name").value.trim(), email = $("nb-email").value.trim();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("Name and a valid email, please.");
    try {
      const out = await api("/roster", { method: "PUT", body: JSON.stringify({ members: [...roster, { name, email }] }) });
      ROSTER = out.members; roster.splice(0, roster.length, ...out.members);
      const chosen = readBoard();
      boardEl.innerHTML = boardRows(roster, [...chosen, { name, email, lead: !chosen.length }]);
      $("nb-name").value = ""; $("nb-email").value = ""; showLeadPhone(); toast(`${name} added.`);
    } catch (e) { toast(e.message); }
  };
  const readBoard = () => [...boardEl.querySelectorAll(".member")].filter((r) => r.querySelector(".pick").checked)
    .map((r) => ({ name: r.dataset.name, email: r.dataset.email, phone: r.dataset.phone || "", lead: r.querySelector("input[type=radio]").checked }));

  // How far ahead each thing is wanted. ONGIA's defaults suit a national event;
  // a regional half-day can pull them in. The dates redraw as the numbers change.
  const OFFSET_ROWS = [
    ["agreement", "Agreements due back", "the signed agreement"],
    ["draft", "Draft materials", "for the board to read"],
    ["final", "Final materials", "production-ready, no more changes"],
  ];
  const offsets = { agreement: 90, draft: 50, final: 30, ...(ev?.offsets ?? {}) };
  let deadlineRun = 0;

  const drawDeadlines = (out, busy) => {
    preview.innerHTML = `<dl class="dates">${OFFSET_ROWS.map(([k, label, sub]) => `
      <div class="drow"><dt>${label}<span>${sub}</span></dt>
        <label class="daysback"><input type="number" min="1" max="365" step="1" id="off-${k}" value="${offsets[k]}" aria-label="${label}: days before day one"> days before</label>
        <dd>${busy ? "…" : esc(out?.readable?.[k] ?? "—")}</dd></div>`).join("")}
    </dl>${out?.moved?.length ? `<div class="note">${out.moved.map(esc).join("<br>")}</div>` : ""}`;
    for (const [k] of OFFSET_ROWS) {
      const el = $(`off-${k}`);
      el.oninput = () => { const n = Math.round(Number(el.value)); if (n >= 1 && n <= 365) { offsets[k] = n; showDeadlines(); } };
    }
  };

  const showDeadlines = async () => {
    showFolderHint();
    if (!day1.value) { drawDeadlines(null, false); return; }
    if (!last.value || last.value < day1.value) last.value = day1.value;
    const order = offsets.agreement < offsets.draft
      ? "Agreements are due before draft materials, so use a larger number of days for them."
      : offsets.draft < offsets.final
        ? "Draft materials are due before final materials, so use a larger number of days for them."
        : null;
    const run = ++deadlineRun;
    const focused = document.activeElement?.id;
    drawDeadlines(null, true);
    if (focused?.startsWith("off-")) $(focused)?.focus();
    if (order) {
      drawDeadlines(null, false);
      preview.insertAdjacentHTML("beforeend", `<p class="hint" style="margin-top:8px;color:var(--late)">${esc(order)}</p>`);
      if (focused?.startsWith("off-")) $(focused)?.focus();
      return;
    }
    try {
      const q = OFFSET_ROWS.map(([k]) => `${k}=${offsets[k]}`).join("&");
      const out = await api(`/deadlines?dayOne=${day1.value}&${q}`);
      if (run !== deadlineRun) return;             // a later keystroke already won
      drawDeadlines(out, false);
      if (focused?.startsWith("off-")) $(focused)?.focus();
    } catch (e) {
      if (run !== deadlineRun) return;
      drawDeadlines(null, false);
      preview.insertAdjacentHTML("beforeend", `<div class="bad" style="margin-top:8px">${esc(e.message)}</div>`);
      if (focused?.startsWith("off-")) $(focused)?.focus();
    }
  };
  day1.onchange = showDeadlines;
  showDeadlines();
  showLeadPhone();

  $("create").onclick = async (e) => {
    if (busy) return;
    busy = true; e.target.disabled = true;
    const val = (id) => $(id).value.trim();
    const body = {
      title: val("e-title"), city: val("e-city"), venue: val("e-venue"), sessionMinutes: Number(val("e-mins")) || 70,
      dayOne: val("e-day1"), lastDay: val("e-last") || val("e-day1"),
      offsets,
      board: readBoard(),
      sharePointFolder: val("e-folder"), materialsUploadUrl: val("e-upload"),
    };
    if (!ev) { body.presenters = parsePeople(val("e-people")); body.invite = $("e-invite").checked; }
    const leadRow = body.board.find((m) => m.lead);
    if (!leadRow) {
      $("problem").innerHTML = `<div class="bad"><b>Pick a lead.</b> Tick the board members for this event and mark one as the lead. Presenters reply to them, and their name and number go on the agreement.</div>`;
      $("board").scrollIntoView({ behavior: "smooth", block: "center" });
      busy = false; e.target.disabled = false; return;
    }

    try {
      const out = ev
        ? await api(`/events?id=${encodeURIComponent(ev.id)}`, { method: "PUT", body: JSON.stringify(body) })
        : await api("/events", { method: "POST", body: JSON.stringify(body) });
      const sent = (out.added ?? []).filter((a) => a.invited).length;
      toast(ev ? "Saved." : out.added?.length ? `Event created with ${out.added.length} presenter${out.added.length === 1 ? "" : "s"}${sent ? `; ${sent} invitation${sent === 1 ? "" : "s"} emailed` : ""}.` : "Event created. Add presenters next.");
      if (out.rejected?.length) alert("Not added:\n" + out.rejected.map((r) => `${JSON.stringify(r.row)} — ${r.why}`).join("\n"));
      if (out.notSent?.length) alert("Added but not emailed:\n" + out.notSent.map((r) => `${r.name} — ${r.why}`).join("\n"));
      view = { name: "event", eventId: out.event.id };
      busy = false; render();
    } catch (err) {
      busy = false; e.target.disabled = false;
      $("problem").innerHTML = `<div class="bad"><b>Couldn't save it.</b> ${esc(err.message)}</div>`;
    }
  };
}

/* ---------- one event ---------- */
function eventScreen(data) {
  const { event: ev, presenters, counts: c, materials } = data;
  const mstat = materials?.status ?? {};
  const scan = materials?.scan ?? null;
  BARRIGHT.innerHTML = `<button class="chip" id="back">All events</button>`;
  document.getElementById("back").onclick = () => { view = { name: "list" }; render(); };
  // Wired after the card renders (the buttons live on it, not in the top bar).
  const wireActions = () => {
    document.getElementById("edit").onclick = () => { view = { name: "edit", eventId: ev.id }; render(); };
    document.getElementById("add").onclick = () => { view = { name: "add", eventId: ev.id }; render(); };
    document.getElementById("mailall").onclick = mailAll;
  };
  const mailAll = async () => {
    const outstanding = presenters.filter((p) => p.status !== "submitted" && p.status !== "approved");
    if (!presenters.length) return toast("No presenters yet.");
    if (!outstanding.length) return toast("Everyone has submitted.");
    if (!confirm(`Email their link to ${outstanding.length} presenter${outstanding.length === 1 ? "" : "s"} who haven't submitted?`)) return;
    await invite(ev.id, null, outstanding.some((p) => p.mail?.length));
  };

  const today = new Date().toISOString().slice(0, 10);
  const daysTo = (iso) => Math.round((Date.parse(iso) - Date.parse(today)) / 86400000);
  const short = (iso) => (iso ? fmtDate(iso.slice(0, 10)).replace(/^\w+ /, "") : "");

  // The reminder cadence, mirrored from netlify/functions/lib/reminders.mjs so a
  // row can say when the next automatic nudge goes out — or that it is paused.
  const NUDGE_DAYS = [-28, -14, -7, -4, -2, -1, 0];
  const overdueDay = (off) => off > 0 && (off <= 14 ? off % 3 === 0 : off % 7 === 0);
  const addDays = (iso, n) => new Date(Date.parse(iso) + n * 86400000).toISOString().slice(0, 10);
  const nextReminder = (p) => {
    if (p.status === "submitted" || p.status === "approved") return null;
    if (!(p.mail ?? []).some((m) => m.type !== "called")) return null;   // never invited: nothing is scheduled
    const due = ev.deadlines?.agreement;
    if (!due) return null;
    const calls = (p.mail ?? []).filter((m) => m.type === "called");
    const pausedTo = calls.length ? addDays(calls.at(-1).at.slice(0, 10), 7) : null;
    for (let k = 0; k <= 180; k++) {
      const d = addDays(today, k);
      if (pausedTo && d < pausedTo) continue;
      const off = Math.round((Date.parse(d) - Date.parse(due)) / 86400000);
      if (NUDGE_DAYS.includes(off) || overdueDay(off)) return d;
    }
    return null;
  };

  // One line that says where each agreement stands, who it is waiting on, and
  // how hard the desk has already chased.
  const agreementCell = (p) => {
    const mails = (p.mail ?? []).filter((m) => m.type !== "called");
    const calls = (p.mail ?? []).filter((m) => m.type === "called");
    const n = mails.length;
    const calledLine = calls.length ? ` · called ${short(calls.at(-1).at)}` : "";
    const nextLine = () => { const d = nextReminder(p); return d ? ` · next reminder ${short(d)}` : ""; };
    if (p.status === "approved") {
      const filing = p.delivery?.filing;
      if (filing && filing.ok === false) return { bucket: "failed",
        pill: `<span class="pill done">Final</span> <span class="pill late">Not filed</span>`,
        sub: `approved ${short(p.approvedAt)} · never reached SharePoint${filing.error ? ` — ${esc(filing.error)}` : ""}` };
      return { bucket: "final", pill: `<span class="pill done">Final</span>`, sub: `approved ${short(p.approvedAt)}${filing?.ok ? " · filed" : ""}` };
    }
    if (p.status === "submitted") return { bucket: "review", pill: `<span class="pill you">Needs review</span>`, sub: `submitted ${short(p.submittedAt)} · waiting on ONGIA` };
    // Nobody has ever sent this person their link: no reminder will ever chase them.
    if (!n) return { bucket: "uninvited", pill: `<span class="pill late">Never sent</span>`,
      sub: p.lastSendError ? `could not be emailed — ${esc(p.lastSendError.why)}` : "no link sent yet · no reminder will chase them" };
    const hard = n >= 4;
    const chased = `${n} reminder${n === 1 ? "" : "s"}`;
    if (p.status === "returned") return { bucket: "progress", pill: `<span class="pill late">Sent back</span>`,
      sub: `${short(p.review?.returnedAt)} · waiting for changes${calledLine}` };
    const callPill = hard && !calls.length ? `<div style="margin-top:5px"><span class="pill late">Call them</span></div>` : "";
    if (p.openedAt) return { bucket: "progress", pill: `<span class="pill ${hard ? "late" : "wait"}">Opened, not finished</span>${callPill}`,
      sub: `opened ${short(p.openedAt)} · ${chased}, last ${short(mails.at(-1).at)}${calledLine}${nextLine()}` };
    return { bucket: "notstarted", pill: `<span class="pill ${hard ? "late" : "wait"}">Not opened</span>${callPill}`,
      sub: `${chased}, last ${short(mails.at(-1).at)}${calledLine}${nextLine()}` };
  };

  // Draft and final materials, detected from uploads or ticked by hand.
  const matCell = (p) => {
    const m = mstat[p.id] ?? {};
    const files = materials?.files?.[p.id] ?? [];
    const due = ev.deadlines ?? {};
    const chip = (label, at, manual, key, deadline) => {
      const late = !at && deadline && daysTo(deadline) < 0;
      const soon = !at && deadline && daysTo(deadline) >= 0 && daysTo(deadline) <= 14;
      const cls = at ? "done" : late ? "late" : soon ? "wait" : "";
      const over = late ? -daysTo(deadline) : 0;
      const text = at ? `${label} ✓ ${short(at)}${manual ? "" : " (upload)"}`
        : late ? `${label} – overdue ${over} day${over === 1 ? "" : "s"}`
        : deadline ? `${label} – due ${short(deadline)}${soon ? ` (${daysTo(deadline)} days)` : ""}`
        : `${label} – not set`;
      return `<button class="mini mat ${cls}" data-mat="${esc(p.id)}" data-key="${key}" data-on="${at ? "0" : "1"}" title="${at ? "Click to clear" : "Click to mark received"}">${text}</button>`;
    };
    const missing = (!m.draft && due.draft && daysTo(due.draft) <= 14) || (!m.final && due.final && daysTo(due.final) <= 14);
    const none = !m.draft && !m.final;
    return {
      missing, none,
      html: `${chip("Draft", m.draft, m.draftManual, "draft", due.draft)} ${chip("Final", m.final, m.finalManual, "final", due.final)}` +
        (files.length ? `<div class="porg">${files.length} file${files.length === 1 ? "" : "s"} uploaded · latest ${short(files[0].at)}</div>` : ""),
    };
  };

  const enriched = presenters.map((p) => ({ p, a: agreementCell(p), m: matCell(p) }));
  const filter = view.filter ?? "all";
  const inFilter = ({ a, m }, f) => f === "all" ? true : f === "materials" ? m.missing : f === "nomaterials" ? m.none : a.bucket === f;
  const show = enriched.filter((row) => inFilter(row, filter));
  const count = (f) => enriched.filter((row) => inFilter(row, f)).length;

  const rows = show.length ? show.map(({ p, a, m }) => {
    const initials = `${p.first[0] ?? ""}${p.last[0] ?? ""}`.toUpperCase();
    const link = `${location.origin}/a/${p.token}`;
    return `<div class="trow">
      <div class="who"><div class="av">${esc(initials)}</div>
        <div><div class="pname">${esc(p.first)} ${esc(p.last)}${p.language === "fr" ? ' <span class="pill" style="font-size:10px;padding:2px 7px">FR</span>' : ""}</div>
          <div class="porg">${esc(p.organization || p.email)}</div>
          ${p.submission?.talk ? `<div class="ptalk">${esc(p.submission.talk)}</div>` : ""}</div></div>
      <div class="cell"><div class="cl">Agreement</div>${a.pill}<div class="porg">${a.sub}</div></div>
      <div class="cell"><div class="cl">Materials</div>${m.html}</div>
      <div class="act">
        <button class="mini" data-copy="${esc(link)}">Copy link</button>
        ${p.status !== "approved" && p.status !== "submitted" ? `<button class="mini" data-invite="${esc(p.id)}">${(p.mail ?? []).some((m) => m.type !== "called") ? "Email again" : "Email link"}</button>` : ""}
        ${p.status !== "approved" && p.status !== "submitted" && (p.mail ?? []).some((m) => m.type !== "called")
          ? `<button class="mini" data-called="${esc(p.id)}" title="Log a phone call — pauses the automatic reminders for a week">Called them</button>` : ""}
        ${p.status === "submitted" || p.status === "returned" ? `<button class="mini gold" data-review="${esc(p.id)}">Review</button>` : ""}
        ${a.bucket === "failed" ? `<button class="mini" data-refile="${esc(p.id)}">Retry filing</button>` : ""}
        ${p.status === "approved" ? `<button class="mini" data-review="${esc(p.id)}">Details</button><button class="mini" data-pdf="${esc(p.id)}">PDF</button>` : `<button class="mini ghost" data-remove="${esc(p.id)}" title="Remove presenter">✕</button>`}
      </div></div>`;
  }).join("") : `<div class="empty">${presenters.length ? "Nobody in this view." : "No presenters yet. Add some to send their links."}</div>`;

  // The exception cuts only appear when there is an exception to show.
  const chips = [["all", "All", true], ["uninvited", "Link never sent", false], ["notstarted", "Not started", true],
    ["progress", "Waiting on presenter", true], ["review", "For you to review", true], ["final", "Final", true],
    ["failed", "Not filed", false], ["materials", "Materials due within 2 weeks", false], ["nomaterials", "No materials yet", false]]
    .filter(([k, , always]) => always || count(k) > 0 || filter === k)
    .map(([k, l]) => `<button class="fchip${filter === k ? " on" : ""}" data-filter="${k}">${l}${k === "all" ? "" : ` <b>${count(k)}</b>`}</button>`).join("");

  const draftGot = enriched.filter(({ p }) => mstat[p.id]?.draft).length;
  const finalGot = enriched.filter(({ p }) => mstat[p.id]?.final).length;
  const nextDl = [["agreement", "Agreements due"], ["draft", "Draft materials due"], ["final", "Final materials due"], ["dayOne", "Training starts"]]
    .map(([k, l]) => ({ l, iso: k === "dayOne" ? ev.dayOne : ev.deadlines?.[k] })).filter((x) => x.iso).map((x) => ({ ...x, d: daysTo(x.iso) }));
  const overdue = nextDl.filter((x) => x.d < 0 && x.l !== "Training starts" && (x.l.startsWith("Agreements") ? c.invited + c.opened : x.l.startsWith("Draft") ? presenters.length - draftGot : presenters.length - finalGot) > 0);
  // When something is late, the bold line says so. It used to announce the next
  // future deadline while a red box two lines down said the last one was missed.
  const upcoming = overdue[0] ?? nextDl.find((x) => x.d >= 0) ?? nextDl.at(-1);
  const blockers = blockersOf(ev);
  const sendFailed = presenters.filter((p) => p.lastSendError);
  const off = { agreement: 90, draft: 50, final: 30, ...(ev.offsets ?? {}) };

  ROOT.innerHTML = `<div class="card">
    <div class="card-head"><div><h2>${esc(ev.title)}</h2>
      <div class="s">${esc(ev.city)}${ev.venue ? " · " + esc(ev.venue) : ""} · ${esc(fmtDate(ev.dayOne))}${ev.lastDay && ev.lastDay !== ev.dayOne ? " – " + esc(fmtDate(ev.lastDay)) : ""}
        ${upcoming ? ` · <b>${esc(upcoming.l)} ${upcoming.d === 0 ? "today" : upcoming.d > 0 ? `in ${upcoming.d} day${upcoming.d === 1 ? "" : "s"}` : `${-upcoming.d} day${upcoming.d === -1 ? "" : "s"} ago`}</b>` : ""}</div>
      ${overdue.length ? `<div class="bad" style="margin-top:10px">${overdue.map((x) => `<b>${esc(x.l.replace(" due", ""))}</b> were due ${esc(fmtDate(x.iso))} (${-x.d} day${x.d === -1 ? "" : "s"} ago) and some are still outstanding.`).join("<br>")}</div>` : ""}
      ${blockers.length ? `<div class="blocked"><b>This event is blocked.</b>${blockers.map((b) => `
        <div class="brow"><span><b>${esc(b.title)}</b> — ${esc(b.why)}</span><button class="mini" data-fix="${esc(b.act)}">${esc(b.fix)}</button></div>`).join("")}</div>` : ""}</div>
      <div class="cardacts"><button class="mini" id="edit">Edit event</button><button class="mini" id="mailall">Email all outstanding</button><button class="mini" id="add">Add presenters</button></div></div>
    <div class="tiles">
      <div class="tile"><div class="k">Presenters</div><div class="v">${c.total}</div></div>
      <div class="tile"><div class="k">Waiting on them</div><div class="v">${count("notstarted") + count("progress") + count("uninvited")}</div></div>
      <div class="tile accent"><div class="k">For you to review</div><div class="v">${count("review")}</div></div>
      <div class="tile"><div class="k">Final</div><div class="v">${count("final") + count("failed")}</div></div>
      <div class="tile"><div class="k">Draft materials</div><div class="v">${draftGot}<small>/${c.total}</small></div></div>
      <div class="tile"><div class="k">Final materials</div><div class="v">${finalGot}<small>/${c.total}</small></div></div>
    </div>
    <div class="card-body">
      <dl class="kv" style="margin:0 0 14px">
        <dt>Agreement due</dt><dd>${esc(fmtDate(ev.deadlines?.agreement))} <span class="porg">${off.agreement} days before day one</span></dd>
        <dt>Draft / final materials</dt><dd>${esc(fmtDate(ev.deadlines?.draft))} <span class="porg">${off.draft} days</span> · ${esc(fmtDate(ev.deadlines?.final))} <span class="porg">${off.final} days</span></dd>
      </dl>
      ${sendFailed.length ? `<div class="sendfail"><b>${sendFailed.length} email${sendFailed.length === 1 ? "" : "s"} could not be sent.</b>
        <div style="margin-top:6px">${sendFailed.map((p) => `${esc(p.first)} ${esc(p.last)} — ${esc(p.lastSendError.why)}`).join("<br>")}</div>
        <div style="margin-top:6px;color:var(--ink-mid)">Fix the address on the presenter, or the email settings, then use <b>Email link</b> on their row.</div></div>` : ""}
      <div class="filters">${chips}</div>
      <div class="tlist">${show.length ? `<div class="thead"><span>Presenter</span><span>Agreement</span><span>Materials</span><span></span></div>` : ""}${rows}</div>
      <details class="settings"><summary>Event settings and diagnostics</summary>
      <dl class="kv" style="margin:12px 0 0">
        <dt>Files to</dt><dd>${ev.sharePointFolder ? esc(ev.sharePointFolder) : "<i>No SharePoint folder set — approvals won't be filed</i>"}
          <div style="margin-top:6px">${ev.sharePointFolderUrl ? `<a class="mini" href="${esc(ev.sharePointFolderUrl)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Open in SharePoint</a>` : `<button class="mini" id="mkfolder">Create it in SharePoint</button>`}</div></dd>
        <dt>Uploads</dt><dd>${!ev.materialsUploadUrl ? `<i>no upload link yet${ev.provisioningError ? ` — ${esc(ev.provisioningError)}` : ""}</i> <button class="mini" id="mklink">Create upload link</button>`
          : `${ev.materialsLinkCheck?.verdict === "upload-only" ? `<span class="pill done">upload-only ✓</span>` : `<span class="pill late">unverified</span>`}
             ${scan ? `checked ${esc(short(scan.checkedAt))} · ${scan.total} file${scan.total === 1 ? "" : "s"} in ${esc(scan.folder?.name ?? "the folder")}` : "not checked yet"}
             <button class="mini" id="rescan">Check uploads now</button>
             ${scan?.unmatched?.length ? `<div class="porg" style="margin-top:6px"><b>${scan.unmatched.length} file${scan.unmatched.length === 1 ? "" : "s"} not matched to a presenter:</b> ${scan.unmatched.map((f) => `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`).join(", ")} — tick Draft/Final by hand for the right person.</div>` : ""}`}</dd>
        <dt>Presentation slot</dt><dd>${esc(ev.sessionMinutes ?? 70)} minutes</dd>
        <dt>Presenters reach</dt><dd>${ev.reviewer?.name ? `${esc(ev.reviewer.name)} · ${esc(ev.reviewer.email)}${ev.contact?.phone ? " · " + esc(ev.contact.phone) : ""}` : `<span class="pill late">no lead</span> Edit the event and mark one board member as the lead — until then replies go to the speakers mailbox and the agreement has no ONGIA contact.`}</dd>
        <dt>Board</dt><dd>${(ev.board ?? []).length ? ev.board.map((m) => `${esc(m.name || m.email)}${m.lead ? " <span class=\"pill done\" style=\"font-size:10px;padding:2px 8px\">lead</span>" : ""}`).join(" · ") : (ev.reviewer?.name ? esc(ev.reviewer.name) + " (lead)" : "<i>nobody picked — edit the event</i>")}</dd>
      </dl>
      <div class="note" style="margin-top:18px"><b>Test emails</b> (temporary, for checking the weekly summary): 
        <span style="display:inline-flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <button class="mini" id="digest-lead">Send summary to lead${ev.reviewer?.name ? ` (${esc(ev.reviewer.name)})` : ""}</button>
          <button class="mini" id="digest-board">Send summary to president &amp; VP</button>
        </span></div>
      <div class="actions" style="margin-top:22px;justify-content:flex-end"><button class="btn btn-late" id="delevent">Delete this event</button></div>
      </details>
    </div></div>`;

  for (const [id, to] of [["digest-lead", "lead"], ["digest-board", "board"]]) {
    const b = document.getElementById(id);
    b.onclick = async () => {
      b.disabled = true; const label = b.textContent; b.textContent = "Sending…";
      try {
        const out = await api(`/reminders?digest=1&event=${encodeURIComponent(ev.id)}&to=${to}`, { method: "POST" });
        const r = out.results?.[0];
        toast(r?.sent ? `Sent to ${r.to}.` : `Not sent: ${r?.error ?? "nothing to send"}`);
      } catch (e) { toast(e.message); }
      b.disabled = false; b.textContent = label;
    };
  }

  wireActions();
  // A blocked event's fix buttons drive the same actions as the settings block.
  ROOT.querySelectorAll("[data-fix]").forEach((b) => {
    b.onclick = () => {
      const act = b.dataset.fix;
      if (act === "edit") { view = { name: "edit", eventId: ev.id }; render(); return; }
      const target = document.getElementById(act === "mklink" ? "mklink" : "mkfolder");
      const box = document.querySelector(".settings");
      if (box) box.open = true;
      if (target) { target.scrollIntoView({ block: "center", behavior: "smooth" }); target.click(); }
      else toast("Open Event settings to finish this.");
    };
  });
  ROOT.querySelectorAll("[data-called]").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true; b.textContent = "Saving…";
      try {
        await api(`/invite?id=${encodeURIComponent(ev.id)}&called=1`, { method: "POST", body: JSON.stringify({ presenterIds: [b.dataset.called] }) });
        toast("Call logged. Automatic reminders pause for a week.");
        render();
      } catch (e) { toast(e.message); b.disabled = false; b.textContent = "Called them"; }
    };
  });
  ROOT.querySelectorAll("[data-refile]").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true; b.textContent = "Filing…";
      try {
        const out = await api(`/review?event=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(b.dataset.refile)}&action=redeliver`, { method: "POST", body: JSON.stringify({ all: false }) });
        toast(out.presenter?.delivery?.filing?.ok ? "Filed to SharePoint." : `Still failing: ${out.presenter?.delivery?.filing?.error ?? "unknown"}`);
        render();
      } catch (e) { toast(e.message); b.disabled = false; b.textContent = "Retry filing"; }
    };
  });
  ROOT.querySelectorAll("[data-filter]").forEach((b) => { b.onclick = () => { view = { ...view, filter: b.dataset.filter }; eventScreen(data); }; });
  ROOT.querySelectorAll("[data-mat]").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        const out = await api(`/materials?event=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(b.dataset.mat)}`,
          { method: "POST", body: JSON.stringify({ [b.dataset.key]: b.dataset.on === "1" }) });
        eventScreen({ ...data, materials: out });
      } catch (e) { toast(e.message); b.disabled = false; }
    };
  });
  const rescan = document.getElementById("rescan");
  if (rescan) rescan.onclick = async () => {
    rescan.disabled = true; rescan.textContent = "Checking…";
    try {
      const out = await api(`/materials?event=${encodeURIComponent(ev.id)}&scan=1`, { method: "POST" });
      toast(`${out.scan?.total ?? 0} file${out.scan?.total === 1 ? "" : "s"} found.`);
      eventScreen({ ...data, materials: out });
    } catch (e) { toast(e.message); rescan.disabled = false; rescan.textContent = "Check uploads now"; }
  };

  const mkl = document.getElementById("mklink");
  if (mkl) mkl.onclick = async () => {
    mkl.disabled = true; mkl.textContent = "Creating…";
    try {
      await api(`/events?id=${encodeURIComponent(ev.id)}&uploadlink=1`, { method: "POST" });
      toast("Folder and upload-only link ready."); render();
    } catch (e) { toast(e.message); mkl.disabled = false; mkl.textContent = "Create upload link"; }
  };
  const mk = document.getElementById("mkfolder");
  if (mk) mk.onclick = async () => {
    mk.disabled = true; mk.textContent = "Creating…";
    try {
      const out = await api(`/events?id=${encodeURIComponent(ev.id)}&folder=1`, { method: "POST" });
      toast(`Folder ready: ${out.folder.path}`); render();
    } catch (e) { toast(e.message); mk.disabled = false; mk.textContent = "Create it in SharePoint"; }
  };
  document.getElementById("delevent").onclick = async () => {
    const approved = presenters.filter((p) => p.status === "approved").length;
    const msg = `Delete "${ev.title}" and its ${presenters.length} presenter${presenters.length === 1 ? "" : "s"} from the desk?\n\n` +
      (approved ? `${approved} final PDF${approved === 1 ? " is" : "s are"} already filed in SharePoint and will stay there. ` : "") +
      `Presenter links stop working immediately. This cannot be undone.`;
    if (!confirm(msg)) return;
    if (prompt(`Type the city to confirm: ${ev.city}`) !== ev.city) return toast("Not deleted — city didn't match.");
    try { await api(`/events?id=${encodeURIComponent(ev.id)}`, { method: "DELETE" }); toast("Event deleted."); view = { name: "list" }; render(); }
    catch (e) { toast(e.message); }
  };

/** "Agreements due in 12 days" or a red "overdue" line for the events list. */
function nextLine(ev, c) {
  const today = new Date().toISOString().slice(0, 10);
  const d = (iso) => Math.round((Date.parse(iso) - Date.parse(today)) / 86400000);
  const items = [["Agreements due", ev.deadlines?.agreement, c.invited + c.opened], ["Draft materials due", ev.deadlines?.draft, c.total - (ev.materials?.draft ?? 0)],
    ["Final materials due", ev.deadlines?.final, c.total - (ev.materials?.final ?? 0)], ["Training starts", ev.dayOne, 0]].filter((x) => x[1]).map(([l, iso, open]) => ({ l, iso, open, days: d(iso) }));
  const late = items.filter((x) => x.days < 0 && x.open > 0 && x.l !== "Training starts");
  const next = items.find((x) => x.days >= 0);
  const when = (x) => x.days === 0 ? "today" : x.days > 0 ? `in ${x.days} day${x.days === 1 ? "" : "s"}` : `${-x.days} day${x.days === -1 ? "" : "s"} ago`;
  const parts = [];
  if (!c.total) parts.push("<b>No presenters yet.</b> Open the event to add them.");
  if (late.length) parts.push(`<span class="pill late">overdue</span> ${late.map((x) => `${esc(x.l.replace(" due", ""))}: ${x.open} outstanding (${when(x)})`).join(" · ")}`);
  if (next) parts.push(`${parts.length ? "<br>" : ""}<b>${esc(next.l)}</b> ${esc(fmtDate(next.iso))} · ${when(next)}`);
  if (!parts.length) parts.push("This event is in the past.");
  return `<div style="font-size:13.5px;line-height:1.7">${parts.join(" ")}</div>`;
}

/** "first, last, email, organization" lines → presenter rows. */
function parsePeople(textBlock) {
  return textBlock.split(/\n+/).map((l) => l.trim()).filter(Boolean).map((l) => {

}

/* ---------- shared helpers ---------- */
let toastTimer;
// 4165550100 → 416-555-0100 as it is typed; an extension survives as " x123".
function formatPhone(raw) {
  const s = String(raw ?? "").trim();
  if (!s) return "";
  if (/^\+(?!1)/.test(s)) return s;
  const m = s.match(/(?:x|ext\.?|poste|#)\s*(\d{0,6})\s*$/i);
  let ext = m ? m[1] : "", hasExt = !!m;
  let digits = (m ? s.slice(0, m.index) : s).replace(/\D/g, "");
  if (digits.length === 11 && digits[0] === "1") digits = digits.slice(1);
  digits = digits.slice(0, 10); // a mask, so stray extra digits are dropped; an extension needs an "x"
  const a = digits.slice(0, 3), b = digits.slice(3, 6), c = digits.slice(6, 10);
  let out = a; if (b) out += "-" + b; if (c) out += "-" + c;
  if (hasExt) out += " x" + ext;
  return out.trim();
}
// Reformat a phone input in place, keeping the caret after the same digit the user was on.
function formatPhoneInput(el) {
  const before = el.value, pos = el.selectionStart ?? before.length;
  const after = formatPhone(before);
  if (after === before) return after;
  const digitsBefore = before.slice(0, pos).replace(/\D/g, "").length;
  el.value = after;
  let i = 0, seen = 0;
  while (i < after.length && seen < digitsBefore) { if (/\d/.test(after[i])) seen++; i++; }
  if (pos >= before.length) i = after.length;
  try { el.setSelectionRange(i, i); } catch { /* not all input types allow it */ }
  return after;
}

function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}

async function invite(eventId, presenterIds, remind) {
  try {
    const out = await api(`/invite?id=${encodeURIComponent(eventId)}`, {
      method: "POST", body: JSON.stringify({ presenterIds: presenterIds ?? undefined, remind: !!remind }),
    });
    // Successes are a toast; failures are kept on the presenter and shown in the
    // red box on the event, because a toast that vanishes is not a report.
    if (out.failed.length) toast(`${out.sent.length} sent, ${out.failed.length} could not be sent — see the red box below.`);
    else toast(out.sent.length ? `Sent to ${out.sent.map((x) => x.name).join(", ")}.` : "Nothing to send.");
    render();
  } catch (e) { toast(e.message); }
}

/** Fetch with the admin header, then open — a plain link can't carry the key. */
async function openPdf(eventId, presenterId) {
  try {
    const res = await fetch(`/api/download?event=${encodeURIComponent(eventId)}&presenter=${encodeURIComponent(presenterId)}&inline=1`,
      { headers: { "x-admin-key": KEY } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `Download failed (${res.status})`);
    const url = URL.createObjectURL(await res.blob());
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
  } catch (e) { toast(e.message); }
}

  : `<div class="card" style="margin-top:16px">
