          <td class="n act"><input class="ln-act money" type="text" inputmode="decimal" autocomplete="off" value="${l.actual !== null && l.actual !== undefined ? usd(l.actual) : ""}" aria-label="Invoice amount in dollars"></td>
          <td class="v act"></td>
          <td class="b"><button class="mini ghost" data-up="${i}" title="Move up"${locked ? " disabled" : ""}>↑</button> <button class="mini ghost" data-down="${i}" title="Move down"${locked ? " disabled" : ""}>↓</button> <button class="mini ghost" data-rm="${i}" title="${l.receiptCount ? "There are receipts against this line" : "Remove the line"}"${locked || l.receiptCount ? " disabled" : ""}>✕</button></td></tr>`).join("")}
        ${act || sow.receiptsOther ? `<tr class="oth"><td><b>Other</b> <span class="hint">receipts that fit no line</span>${sow.otherNotes?.length ? `<div class="rcl">${esc(sow.otherNotes.join("; "))}</div>` : ""}</td>
          <td class="t"><span class="hint">At cost</span></td>
          <td class="n"><span class="hint">–</span></td>${anyRc ? `<td class="rcv">${sow.otherCount ? `<b>${usd(sow.receiptsOther)}</b><div class="rcl">${sow.otherCount} receipt${sow.otherCount === 1 ? "" : "s"}</div>` : `<span class="hint">–</span>`}</td>` : ""}<td class="n act"><input id="sw-oth" class="money" type="text" inputmode="decimal" autocomplete="off" value="${sow.otherActual !== null && sow.otherActual !== undefined ? usd(sow.otherActual) : ""}" aria-label="Other, in dollars"></td><td class="v act"></td><td class="b"></td></tr>` : ""}
      </tbody></table>
      ${anyRc ? `<div class="rctot">Receipts so far, before tax: <b>${usd(rcAll)}</b>${rcBudget ? ` · the at-cost lines are estimated at <b>${usd(rcBudget)}</b>` : ""}</div>` : ""}
      <div style="margin-top:10px"><button class="mini" id="sw-add"${locked ? " disabled" : ""}>Add a line</button>
        <span class="hint" style="margin-left:10px"><b>Fixed fee</b>: the invoice uses the estimate. <b>At cost</b>: it uses the receipts (add them under <b>Receipts</b>). Type an invoice amount to overwrite either.</span></div>
      <div class="swbottom">
        <div class="swtax"><h3 style="margin:0 0 4px;font-size:15px">Tax, deposit and fee</h3>
          <p class="hint" style="margin:0 0 8px">ONGIA's service fee is 20% of the subtotal, always.</p>
          <label class="hint" for="sw-prov">Tax for</label>
          <div style="display:flex;gap:8px;align-items:center"><select id="sw-prov" style="margin:0">${Object.entries(PROVINCE_NAMES).map(([k, n]) => `<option value="${k}"${(ev.province || S.province) === k ? " selected" : ""}>${n}</option>`).join("")}</select>
            <button class="mini" id="sw-useprov">Use its tax lines</button></div>
          <div id="sw-taxes">${sow.taxes.map((t, i) => `<div class="row" data-t="${i}"><input class="tx-name" value="${esc(t.name)}" aria-label="Tax name"><input class="tx-rate" type="number" min="0" max="100" step="0.001" value="${t.rate}" aria-label="Tax rate"><button class="mini ghost" data-txrm="${i}" title="Remove">✕</button></div>`).join("")}</div>
          <button class="mini" id="sw-addtax" style="margin-top:8px">Add a tax line</button>
          <div class="field" style="margin-top:12px"><label for="sw-base">Tax is worked out on</label><select id="sw-base"><option value="subtotal+fee"${sow.taxBase !== "subtotal" ? " selected" : ""}>The subtotal plus ONGIA's fee</option><option value="subtotal"${sow.taxBase === "subtotal" ? " selected" : ""}>The subtotal only</option></select></div>
          <div class="field"><label for="sw-dep">Deposit paid</label><input id="sw-dep" class="money" type="text" inputmode="decimal" autocomplete="off" value="${sow.deposit ? usd(sow.deposit) : ""}" placeholder="$0.00"></div></div>
        <div><div class="swsums${act ? "" : " noact"}" id="sw-sums"></div></div>
      </div>
      <div class="swwhy" id="sw-why" hidden><b id="sw-whyhead"></b>
        <textarea id="sw-reason" maxlength="1500" placeholder="Why the final cost is higher than the estimate"></textarea></div>
      <div class="actions" style="margin-top:18px;flex-wrap:wrap">
        <button class="btn btn-gold" id="sw-save">Save</button>
        <button class="btn btn-ghost" id="sw-pdf-sow">Statement of work (PDF)</button>
        <button class="btn btn-ghost" id="sw-pdf-inv">Final invoice (PDF)</button>
        <button class="btn btn-ghost" id="sw-file-sow">File the SOW to SharePoint</button>
        <button class="btn btn-ghost" id="sw-file-inv">File the invoice to SharePoint</button></div>
      <p class="hint" id="sw-said" style="margin-top:8px">${["sow", "invoice"].map((k) => sow.filed?.[k] ? `${k === "sow" ? "SOW" : "Invoice"} filed ${esc(fmtDate(sow.filed[k].at.slice(0, 10)))}: <a href="${esc(sow.filed[k].url)}" target="_blank" rel="noopener">open</a>` : "").filter(Boolean).join(" · ")}
        The files go in a folder called <b>SOW and Invoice</b> inside the event's folder.</p>
      ${sow.history?.length ? `<details class="settings" style="margin-top:10px"><summary>History (${sow.history.length})</summary><ul style="margin:8px 0 0;padding-left:18px;font-size:13.5px">${sow.history.slice().reverse().map((h) => `<li>${esc(fmtDate(h.at.slice(0, 10)))} · ${esc(h.who)} · ${esc(h.what)}</li>`).join("")}</ul></details>` : ""}`;
    $("sw-reason").value = sow.increaseReason ?? "";
    wire(); sums();
  };

  const read = () => {
    sow.program = { title: $("sw-title").value, place: $("sw-place").value, note: $("sw-note").value };
    sow.invoiceDate = $("sw-idate").value; sow.dueDate = $("sw-due").value;
    body.querySelectorAll("#sw-table tbody tr[data-i]").forEach((tr) => {
      const l = sow.lines[+tr.dataset.i];
      l.name = tr.querySelector(".ln-name").value; l.description = tr.querySelector(".ln-desc").value; l.type = tr.querySelector(".ln-type").value;
      l.estimate = moneyNum(tr.querySelector(".ln-est").value) ?? 0; l.actual = moneyNum(tr.querySelector(".ln-act").value);
    });
    body.querySelectorAll("#sw-taxes .row").forEach((r) => { const t = sow.taxes[+r.dataset.t]; t.name = r.querySelector(".tx-name").value; t.rate = Number(r.querySelector(".tx-rate").value) || 0; });
    sow.taxBase = $("sw-base").value; sow.deposit = moneyNum($("sw-dep").value) ?? 0;
    sow.increaseReason = $("sw-reason").value;
    if ($("sw-oth")) sow.otherActual = moneyNum($("sw-oth").value);
  };
  // Over by 20% or more: the contract wants a reason, and it prints at the foot of the invoice.
  const over = () => {
    const e = sowSums(sow, "estimate").subtotal, a = sowSums(sow, "actual").subtotal;
    const pct = e > 0 ? Math.round((a - e) / e * 1000) / 10 : 0;
    return { pct, over: afterApproval(sow) && e > 0 && pct >= 20 };
  };

  const sums = () => {
    const est = sowSums(sow, "estimate"), act = sowSums(sow, "actual"), showAct = afterApproval(sow);
    const row = (label, e, a, cls = "") => `<tr class="${cls}"><td>${label}</td><td>${e}</td><td class="act">${a}</td></tr>`;
    $("sw-sums").innerHTML = `<table><thead><tr><th></th><th>Statement of work</th><th class="act">Invoice</th></tr></thead><tbody>
      ${row("Subtotal", usd(est.subtotal), usd(act.subtotal), "bold")}${row("ONGIA service fee (20%)", usd(est.fee), usd(act.fee))}
      ${est.deposit || act.deposit ? row("Deposit paid", `(${usd(est.deposit)})`, `(${usd(act.deposit)})`) + row("New subtotal", usd(est.newSubtotal), usd(act.newSubtotal), "bold") : ""}
      ${est.taxes.map((t, i) => row(`${esc(t.name)} (${t.rate}%)`, usd(t.amount), usd(act.taxes[i].amount))).join("")}
      ${row("TOTAL BALANCE DUE", usd(est.total), usd(act.total), "tot")}</tbody></table>`;
    const o = over(), box = $("sw-why");
    box.hidden = !o.over;
    $("sw-whyhead").textContent = `The invoice is ${o.pct}% over the statement of work. Your contract with RBH asks for an explanation. Write it here and it prints in bold at the foot of the final invoice.`;
    if ($("sw-oth")) {
      const ph = $("sw-oth"), auto = sow.otherActual === null || sow.otherActual === undefined, d = act.other;
      ph.placeholder = usd(r2(numOrNull(sow.receiptsOther) ?? 0));
      ph.title = auto ? "Worked out from the receipts filed under Other. Type an amount to overwrite it." : "Typed by hand. Clear the box to go back to the receipts.";
      ph.closest("tr").querySelector(".v").innerHTML = d ? `<span class="over">+${usd(d)}</span>` : `<span style="color:var(--muted)">–</span>`;
    }
    body.querySelectorAll("#sw-table tbody tr[data-i]").forEach((tr) => {
      const i = +tr.dataset.i, l = sow.lines[i], e = est.lines[i].amount, a = act.lines[i].amount, auto = l.actual === null;
      const ph = tr.querySelector(".ln-act");
      ph.placeholder = usd(auto ? a : e) + (auto && l.type === "cost" && !a ? " (no receipts yet)" : "");
      ph.title = auto ? (l.type === "fixed" ? "Worked out: the estimate (a fixed fee). Type an amount to overwrite it." : "Worked out from the receipts. Type an amount to overwrite it.") : "Typed by hand. Clear the box to go back to the worked-out amount.";
      const d = a - e;
      tr.querySelector(".v").innerHTML = Math.abs(d) < 0.005 ? `<span style="color:var(--muted)">–</span>` : `<span class="${d > 0 ? "over" : "under"}">${d > 0 ? "+" : "−"}${usd(Math.abs(d))}</span>${e ? `<br><small>${d > 0 ? "+" : "−"}${Math.abs(Math.round(d / e * 1000) / 10)}%</small>` : ""}`;
    });
  };

  const save = async (quiet) => {
    read();
    const out = await api(q, { method: "PUT", body: JSON.stringify({ program: sow.program, lines: sow.lines, taxes: sow.taxes, taxBase: sow.taxBase, deposit: sow.deposit, invoiceDate: sow.invoiceDate, dueDate: sow.dueDate, increaseReason: sow.increaseReason, otherActual: sow.otherActual ?? null }) });
    Object.assign(sow, out.sow); locked = out.locked; changes = out.changedSinceSent ?? changes; dirty = false;
    if (!quiet) { toast("Saved."); render(); }
    return out;
  };
  const guard = (fn) => async (e) => { try { await fn(e); } catch (err) { toast(err.message); } };
  const pdf = (kind) => guard(async () => {
    if (dirty) await save(true);
    if (kind === "invoice" && over().over && !String(sow.increaseReason ?? "").trim() && !confirm(`The invoice is ${over().pct}% over the statement of work and has no explanation for RBH yet. Make the PDF anyway?`)) return;
    const res = await apiFetch(`/api${q}&doc=${kind}`, { headers: { "x-admin-key": KEY } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `Couldn't make the PDF (${res.status})`);
    window.open(URL.createObjectURL(await res.blob()), "_blank");
  });
  const file = (kind) => guard(async () => {
    if (dirty) await save(true);
    if (kind === "invoice" && over().over && !String(sow.increaseReason ?? "").trim() && !confirm(`The invoice is ${over().pct}% over the statement of work and has no explanation for RBH yet. File it anyway?`)) return;
    const out = await api(`${q}&file=${kind}`, { method: "POST" });
    toast(`Filed to SharePoint: ${out.filedTo.name}`); render();
  });

  function wire() {
    wireMoney(body);
    body.oninput = () => { dirty = true; read(); sums(); };
    body.onchange = () => { dirty = true; read(); sums(); };
    const rebuild = () => { read(); draw(); dirty = true; };
    body.querySelectorAll("[data-up]").forEach((b) => { b.onclick = () => { const i = +b.dataset.up; if (i) { read(); [sow.lines[i - 1], sow.lines[i]] = [sow.lines[i], sow.lines[i - 1]]; draw(); dirty = true; } }; });
    body.querySelectorAll("[data-down]").forEach((b) => { b.onclick = () => { const i = +b.dataset.down; if (i < sow.lines.length - 1) { read(); [sow.lines[i + 1], sow.lines[i]] = [sow.lines[i], sow.lines[i + 1]]; draw(); dirty = true; } }; });
    body.querySelectorAll("[data-rm]").forEach((b) => { b.onclick = () => { read(); sow.lines.splice(+b.dataset.rm, 1); draw(); dirty = true; }; });
    $("sw-add").onclick = () => { read(); sow.lines.push({ id: `new${Date.now()}`, name: "", description: "", type: "cost", estimate: 0, actual: null }); draw(); dirty = true; body.querySelectorAll(".ln-name")[sow.lines.length - 1]?.focus(); };
    body.querySelectorAll("[data-txrm]").forEach((b) => { b.onclick = () => { read(); sow.taxes.splice(+b.dataset.txrm, 1); draw(); dirty = true; }; });
    $("sw-addtax").onclick = () => { read(); sow.taxes.push({ name: "", rate: 0 }); draw(); dirty = true; };
    $("sw-useprov").onclick = guard(async () => { if (dirty) await save(true); await api(`${q}&province=${$("sw-prov").value}`, { method: "PUT" }); toast("Tax lines changed."); render(); });
    $("sw-status").onchange = guard(async () => { if (dirty) await save(true); await api(`${q}&status=${$("sw-status").value}`, { method: "PUT" }); toast("Status changed."); render(); });
    // Changing what RBH was sent takes a click and the word EDIT (Andrew 21 Oct 2026); it is noted in the history.
    $("sw-unlock")?.addEventListener("click", () => { $("sw-unlock").hidden = true; $("sw-unlockbox").hidden = false; $("sw-word").focus(); });
    $("sw-unlockno")?.addEventListener("click", () => { $("sw-unlockbox").hidden = true; $("sw-unlock").hidden = false; $("sw-word").value = ""; $("sw-unlockgo").disabled = true; });
    $("sw-word")?.addEventListener("input", () => { $("sw-unlockgo").disabled = $("sw-word").value.trim().toUpperCase() !== "EDIT"; });
    $("sw-word")?.addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("sw-unlockgo").disabled) $("sw-unlockgo").click(); });
    $("sw-unlockgo")?.addEventListener("click", guard(async () => { await api(`${q}&unlock=1`, { method: "PUT", body: JSON.stringify({ word: $("sw-word").value }) }); toast("Amounts unlocked. RBH has the copy you sent; changes show against it."); render(); }));
    $("sw-relock")?.addEventListener("click", guard(async () => { await api(`${q}&unlock=0`, { method: "PUT" }); render(); }));
    $("sw-save").onclick = guard(() => save(false));
    $("sw-pdf-sow").onclick = pdf("sow"); $("sw-pdf-inv").onclick = pdf("invoice");
    $("sw-file-sow").onclick = file("sow"); $("sw-file-inv").onclick = file("invoice");
  }
  draw();
}

/* ---------- receipts (RBH events) ---------- */
/**
 * A photo or a PDF goes up, Claude reads the vendor, date and amounts, and whoever is at the desk checks them,
 * picks the line of the statement of work (or Other) and confirms. Only confirmed receipts count toward the
 * invoice. Built for a phone: one column, big buttons, the camera one tap away.
 */
const RC_OTHER = "other";
function receiptsCard(ev, R) {
  const n = R.items.length, pend = R.drafts.length;
  const line = `${n} receipt${n === 1 ? "" : "s"}${n ? ` · ${usd(R.total)} before tax` : ""}`;
  const badge = pend ? `<span class="chase">${pend} to confirm</span>` : "";
  return secFold("receipts", "Receipts", line, badge, `<div class="card-body" id="rc-body"></div>`, { id: "receiptscard", open: pend > 0 });
}

/** A big photo is shrunk before it goes up: a phone's camera makes 4-8 MB pictures, and the limit is 5. */
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 900 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch { return file; }
}

function wireReceipts(ev, R0) {
  const q = `/receipts?event=${encodeURIComponent(ev.id)}`;
  const body = document.getElementById("rc-body");
  if (!body) return;
  let R = R0, timer = null, editing = null;
  const $ = (sel, root = body) => root.querySelector(sel);
  const lineName = (id) => id === RC_OTHER ? "Other" : (R.lines.find((l) => l.id === id)?.name ?? "a line that has since been removed");
  const urls = {};

  const fileBlob = async (id) => {
    if (urls[id]) return urls[id];
    const res = await apiFetch(`/api${q}&file=${encodeURIComponent(id)}`, { headers: { "x-admin-key": KEY } });
    if (!res.ok) throw new Error("Couldn't open the file.");
    return (urls[id] = URL.createObjectURL(await res.blob()));
  };
  const openFile = async (id) => { try { window.open(await fileBlob(id), "_blank"); } catch (e) { toast(e.message); } };

  // Who paid: the board members on the event, then the rest of the board (someone not going can still pay a deposit).
  // It starts as whoever is signed in, so the usual case is nothing to do.
  const payerSelect = (v) => {
    const me = String(WHO?.email ?? "").toLowerCase(), want = v.paidBy?.email ?? (R.payers.some((x) => x.email === me) ? me : "");
    const opt = (x) => `<option value="${esc(x.email)}"${want === x.email ? " selected" : ""}>${esc(x.name)}</option>`;
    const on = R.payers.filter((x) => x.onEvent), off = R.payers.filter((x) => !x.onEvent);
    return `<div class="field full"><label>Paid by (the board member who will claim it)</label><select class="f-paid" aria-label="Paid by"><option value="">Pick a board member…</option>
      ${on.length ? `<optgroup label="On this event">${on.map(opt).join("")}</optgroup>` : ""}${off.length ? `<optgroup label="Other board members">${off.map(opt).join("")}</optgroup>` : ""}</select></div>`;
  };
  const fields = (v, { lines }) => `<div class="rcf">${payerSelect(v)}
      <div class="field full"><label>Which line of the statement of work?</label>
        <select class="f-line" aria-label="Line of the statement of work"><option value="">Pick one…</option>${lines.map((l) => `<option value="${esc(l.id)}"${v.lineId === l.id ? " selected" : ""}>${esc(l.name)}</option>`).join("")}<option value="${RC_OTHER}"${v.lineId === RC_OTHER ? " selected" : ""}>Other</option></select></div>
      <div class="field full f-othwrap"${v.lineId === RC_OTHER ? "" : " hidden"}><label>What was it for? (Other)</label><input class="f-oth" maxlength="160" value="${esc(v.otherNote ?? "")}" placeholder="e.g. taxi to the studio"></div>
      <div class="field"><label>Vendor</label><input class="f-vendor" maxlength="120" value="${esc(v.vendor ?? "")}" autocomplete="off"></div>
      <div class="field"><label>Date on the receipt</label><input class="f-date" type="date" value="${esc(v.date ?? "")}"></div>
      <div class="field full"><label>Amount before tax <span style="text-transform:none;letter-spacing:0">(this is what counts)</span></label>
        <input class="f-amount" type="number" inputmode="decimal" min="0" step="0.01" value="${v.amount ?? ""}" placeholder="0.00"></div>
      <div class="three full"><div class="field"><label>Tax</label><input class="f-tax" type="number" inputmode="decimal" min="0" step="0.01" value="${v.tax ?? ""}" placeholder="0.00"></div>
        <div class="field"><label>Total paid</label><input class="f-total" type="number" inputmode="decimal" min="0" step="0.01" value="${v.total ?? ""}" placeholder="0.00"></div>
        <div class="field"><label>Currency</label><input class="f-cur" maxlength="3" value="${esc(v.currency || "CAD")}" autocapitalize="characters"></div></div>
    </div>`;
  const collect = (root) => ({
    paidBy: $(".f-paid", root).value, lineId: $(".f-line", root).value, otherNote: $(".f-oth", root).value, vendor: $(".f-vendor", root).value, date: $(".f-date", root).value,
    amount: $(".f-amount", root).value, tax: $(".f-tax", root).value, total: $(".f-total", root).value, currency: $(".f-cur", root).value,
  });
  const wireFields = (root) => {
    const sel = $(".f-line", root);
    sel.onchange = () => { $(".f-othwrap", root).hidden = sel.value !== RC_OTHER; };
    // Tax and total are filled in for the person: amount + tax = total, whichever two are typed.
    const a = $(".f-amount", root), t = $(".f-tax", root), tot = $(".f-total", root);
    const fill = (changed) => {
      const A = numOrNull(a.value), T = numOrNull(t.value), TOT = numOrNull(tot.value);
      if (changed !== tot && A !== null && T !== null && TOT === null) tot.value = r2(A + T);
      if (changed === tot && TOT !== null && T !== null && A === null) a.value = r2(TOT - T);
    };
    a.onblur = () => fill(a); t.onblur = () => fill(t); tot.onblur = () => fill(tot);
  };

  const draftHtml = (d) => {
    const pv = `<div class="pv">${d.type === "application/pdf" ? `<div class="pdf" data-open="${esc(d.id)}">PDF</div>` : `<img alt="Receipt" data-img="${esc(d.id)}" data-open="${esc(d.id)}">`}
      <div><div class="nm">${esc(d.name)}</div><div class="porg">added by ${esc(d.by?.name || d.by?.email || "")}</div></div></div>`;
    if (d.read.state === "reading") return `<div class="rcd reading" data-d="${esc(d.id)}" data-state="reading">${pv}<div class="reading-line"><span class="dot"></span> Claude is reading it…</div>
      <div class="acts"><button class="btn btn-ghost" data-discard="${esc(d.id)}">Discard</button></div></div>`;
    const f = d.read.found, failed = d.read.state === "failed";
    const v = failed ? {} : { ...f, amount: f.counted ?? "", lineId: f.suggestedLine === "Other" ? RC_OTHER : (R.lines.find((l) => l.name === f.suggestedLine)?.id ?? "") };
    const notes = failed ? `<div class="rcn warn">${esc(d.read.why)}</div>`
      : !f.isReceipt ? `<div class="rcn bad">This doesn't look like a receipt or an invoice. Check the file, or discard it.</div>`
      : [f.confidence === "low" ? `<div class="rcn warn"><b>Claude wasn't sure about this one.</b> Check each figure against the picture before you confirm.</div>` : f.confidence === "medium" ? `<div class="rcn info">Claude was fairly sure. A quick look at the figures is worth it.</div>` : "",
         f.notes ? `<div class="rcn info">${esc(f.notes)}</div>` : ""].join("");
    return `<div class="rcd" data-d="${esc(d.id)}" data-state="${d.read.state}">${pv}${notes}${fields(v, { lines: R.lines })}
      <div class="acts"><button class="btn btn-gold" data-confirm="${esc(d.id)}">Confirm and count it</button>
        ${failed ? `<button class="btn btn-ghost" data-again="${esc(d.id)}">Read it again</button>` : ""}<button class="btn btn-ghost" data-discard="${esc(d.id)}">Discard</button></div></div>`;
  };

  const itemHtml = (r) => {
    if (editing === r.id) return `<div class="rck" data-k="${esc(r.id)}"><b>Change this receipt</b>${fields(r, { lines: R.lines })}
      <div class="acts" style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-gold" data-save="${esc(r.id)}">Save</button><button class="btn btn-ghost" data-cancel="1">Cancel</button></div></div>`;
    const who = r.addedBy?.name || r.addedBy?.email || "";
    return `<div class="rck" data-k="${esc(r.id)}"><div class="top"><b>${esc(r.vendor)}</b><span class="amt">${usd(r.amount)}</span></div>
      <div class="sub">${esc(fmtDate(r.date))} · <b>${esc(lineName(r.lineId))}</b>${r.lineId === RC_OTHER ? ` (${esc(r.otherNote)})` : ""}${r.tax !== null && r.tax !== undefined ? ` · tax ${usd(r.tax)} not counted` : ""}</div>
      <div class="sub">paid by <b>${esc(r.paidBy?.name ?? "—")}</b> · added by ${esc(who)}${r.readBy === "hand" ? " · typed in by hand" : ""}${r.currency && r.currency !== "CAD" ? ` · <b>${esc(r.currency)}</b>: not converted` : ""}</div>
      <div class="rclinks"><button class="lnk" data-open="${esc(r.id)}">Open the ${r.type === "application/pdf" ? "PDF" : "photo"}</button>
        ${r.filed ? `<a href="${esc(r.filed.url)}" target="_blank" rel="noopener">In SharePoint</a>` : `<span class="rcprob">Not in SharePoint: ${esc(r.filedProblem ?? "not filed")}</span> <button class="lnk" data-refile="${esc(r.id)}">Try again</button>`}
        ${r.mine && !R.closed || R.canCost ? `<button class="lnk" data-edit="${esc(r.id)}">Change</button><button class="lnk" data-del="${esc(r.id)}">Remove</button>` : ""}</div></div>`;
  };

  const draw = () => {
    const sum = body.closest("details")?.querySelector("summary");
    if (sum) {
      const n = R.items.length, pend = R.drafts.length;
      sum.querySelector(".s").textContent = `${n} receipt${n === 1 ? "" : "s"}${n ? ` · ${usd(R.total)} before tax` : ""}`;
      let c = sum.querySelector(".ibcount");
      if (!c) { c = document.createElement("span"); c.className = "ibcount"; sum.insertBefore(c, sum.querySelector(".ibcaret")); }
      c.innerHTML = pend ? `<span class="chase">${pend} to confirm</span>` : ""; c.hidden = !pend;
    }
    const keep = {};
    body.querySelectorAll(".rcd").forEach((n) => { keep[n.dataset.d] = n; });
    // Rebuild the pending ones only when their state changed, so what someone is typing is not wiped by the poll.
    const dh = document.createElement("div");
    R.drafts.forEach((d) => {
      const old = keep[d.id];
      if (old && old.dataset.state === d.read.state && d.read.state !== "reading") { dh.appendChild(old); return; }
      const t = document.createElement("div"); t.innerHTML = draftHtml(d); const node = t.firstElementChild;
      dh.appendChild(node);
    });
    body.innerHTML = `${R.closed ? `<div class="rcn info">The invoice has gone out, so receipts can't be added or changed from here now. The president or the VP can still do it.</div>` : ""}
      ${R.hasSow ? "" : `<div class="rcn info">There is no statement of work for this event yet, so there are no lines to put receipts under. Use <b>Other</b> and say what each was for; the president or the VP can move them later.</div>`}
      ${R.closed ? "" : `<div class="rc-add"><label class="btn btn-gold" id="rc-cam">📷 Take a photo<input type="file" accept="image/*" capture="environment"></label>
        <label class="btn btn-ghost" id="rc-pick">Choose a photo or PDF<input type="file" accept="image/*,application/pdf" multiple></label></div>
        <p class="hint" style="margin:-4px 0 14px" id="rc-said">Claude reads the vendor, date and amounts; you check them and say which line they belong to. Nothing counts until you confirm it.</p>`}
      <div id="rc-drafts"></div>
      ${R.items.length ? `<div class="rcsum"><span><b>${usd(R.total)}</b> before tax, ${R.items.length} receipt${R.items.length === 1 ? "" : "s"}</span>${R.canCost && R.sums?.other ? `<span>of which <b>${usd(R.sums.other)}</b> is under Other</span>` : ""}</div>
      ${R.canCost && R.byPayer?.length ? `<div class="rcsum rcpay"><span><b>Paid by</b> (total paid, tax included, for checking claims):</span>${R.byPayer.map((x) => `<span>${esc(x.name)} <b>${usd(x.paid)}</b> <small>${x.count} receipt${x.count === 1 ? "" : "s"}</small></span>`).join("")}</div>` : ""}` : ""}
      <div id="rc-items">${R.items.map(itemHtml).join("") || `<p class="hint">No receipts yet.</p>`}</div>`;
    const slot = $("#rc-drafts");
    while (dh.firstChild) slot.appendChild(dh.firstChild);
    wire();
    clearTimeout(timer);
    if (R.drafts.some((d) => d.read.state === "reading")) timer = setTimeout(poll, 2500);
  };

  const refreshSow = async () => {
    const card = document.getElementById("sowcard");
    if (!card || SOW_DIRTY()) return;
    const S = await api(`/sow?event=${encodeURIComponent(ev.id)}`).catch(() => null);
    if (S?.sow) { card.outerHTML = sowCard(ev, S); wireSow(ev, S); wireFolds(); }
  };
  const poll = async () => { try { R = await api(q); draw(); } catch { /* try again on the next tick */ } };
  const act = (fn) => async (e) => { try { await fn(e); } catch (err) { toast(err.message); } };

  const upload = async (files) => {
    const said = $("#rc-said");
    for (const f of files) {
      if (said) said.textContent = `Sending ${f.name}…`;
      const out = await shrinkImage(f);
      if (out.size > 5 * 1024 * 1024) { toast(`${f.name} is over 5 MB. Take it again at a lower size, or save a smaller PDF.`); continue; }
      const res = await apiFetch(`/api${q}`, { method: "POST", headers: { "x-admin-key": KEY, "x-file-name": encodeURIComponent(out.name) }, body: out });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) { toast(j.error ?? `Upload failed (${res.status})`); continue; }
      R = j; draw();
    }
  };

  function wire() {
    body.querySelectorAll('input[type="file"]').forEach((inp) => { inp.onchange = act(async () => { const fs = [...inp.files]; inp.value = ""; if (fs.length) await upload(fs); }); });
    body.querySelectorAll("img[data-img]").forEach((img) => fileBlob(img.dataset.img).then((u) => { img.src = u; }).catch(() => {}));
    body.querySelectorAll("[data-open]").forEach((b) => { b.onclick = () => openFile(b.dataset.open); });
    body.querySelectorAll(".rcd .rcf, .rck .rcf").forEach((f) => wireFields(f.parentElement));
    body.querySelectorAll("[data-discard]").forEach((b) => { b.onclick = act(async () => { if (!confirm("Discard this upload? Nothing has been counted.")) return; R = await api(`${q}&draft=${b.dataset.discard}`, { method: "DELETE" }); draw(); }); });
    body.querySelectorAll("[data-again]").forEach((b) => { b.onclick = act(async () => { R = await api(`${q}&again=${b.dataset.again}`, { method: "POST" }); draw(); }); });
    body.querySelectorAll("[data-confirm]").forEach((b) => {
      b.onclick = act(async () => {
        const root = b.closest(".rcd"), id = b.dataset.confirm, v = collect(root);
        let force = false;
        for (;;) {
          try { R = await api(`${q}&confirm=${id}`, { method: "POST", body: JSON.stringify({ ...v, force }) }); break; }
          catch (e) { if (/already on this event/.test(e.message) && !force && confirm(`${e.message}\n\nAdd it anyway?`)) { force = true; continue; } throw e; }
        }
        toast(R.items.find((r) => r.id === id)?.filed ? "Counted, and filed in SharePoint." : "Counted. It isn't in SharePoint yet; see the receipt.");
        draw(); refreshSow();
      });
    });
    body.querySelectorAll("[data-refile]").forEach((b) => { b.onclick = act(async () => { R = await api(`${q}&refile=${b.dataset.refile}`, { method: "POST" }); draw(); }); });
    body.querySelectorAll("[data-edit]").forEach((b) => { b.onclick = () => { editing = b.dataset.edit; draw(); }; });
    body.querySelectorAll("[data-cancel]").forEach((b) => { b.onclick = () => { editing = null; draw(); }; });
    body.querySelectorAll("[data-save]").forEach((b) => { b.onclick = act(async () => { R = await api(`${q}&item=${b.dataset.save}`, { method: "PUT", body: JSON.stringify(collect(b.closest(".rck"))) }); editing = null; draw(); refreshSow(); }); });
    body.querySelectorAll("[data-del]").forEach((b) => { b.onclick = act(async () => { if (!confirm("Remove this receipt from the invoice?")) return; R = await api(`${q}&item=${b.dataset.del}`, { method: "DELETE" }); if (R.note) toast(R.note); draw(); refreshSow(); }); });
  }
  draw();
}

/** The dollar figure at the top: what following the sheet would have cost ONGIA, and what it missed. */
function costBanner(T, $) {
  const nn = (n) => `${n} room night${n === 1 ? "" : "s"}`;
  const left = T.extraNights - T.ongiaNights;
  const [a, b] = T.taxes;
  return `<div class="shcost"><div class="fig"><div class="big">${$(T.ongiaCost)}</div><div class="cap">total, all presenters</div></div>
    <div class="fig"><div class="big">${T.discrepancies}</div><div class="cap">discrepanc${T.discrepancies === 1 ? "y" : "ies"} in ${T.presenters} presenter${T.presenters === 1 ? "" : "s"}</div></div>
    <div class="why"><b>What following the sheet would have cost ONGIA.</b>
      ${T.ongiaNights ? `The sheet has ${nn(T.ongiaNights)} booked that the agreements don't call for.` : `Nothing so far: the sheet has no nights booked beyond what the agreements ask for.`}
      Each room night is counted at ${$(T.nightly)} + ${a}% + ${b}% = <b>${$(T.perNight)}</b>.
      <div class="sub">A discrepancy is one night the sheet and the agreement disagree about (a red or orange box), or one who-pays disagreement.</div>
      <div class="sub">${left ? `Not counted: ${nn(left)} where the presenter pays their own room or the sheet says an agency pays. ` : ""}${T.missingNights ? `The sheet also left out ${nn(T.missingNights)} the agreements have (presenters who would have had no room): ${$(T.missingCost)} at the same rate.` : "The sheet left out no nights the agreements have."}
        Only agreements already submitted are counted.</div>
      <details class="rates"><summary>Change the rate</summary>
        <span class="ratefields"><label>Room rate $<input id="rt-n" type="number" min="1" step="0.01" value="${T.nightly}"></label><label>+ <input id="rt-a" type="number" min="0" max="100" step="0.01" value="${a}">%</label><label>+ <input id="rt-b" type="number" min="0" max="100" step="0.01" value="${b}">%</label><button class="mini" id="rt-save">Save</button></span></details></div></div>`;
}

/** The president's and VP's page: the sheet as it stood against the agreements as they are now. */
function sheetCard(ev, SC) {
  const R = SC.result, B = SC.baseline;
  const when = (iso) => (iso ? fmtDate(String(iso).slice(0, 10)).replace(/^\w+ /, "") : "");
  const line = !B ? "Upload the sheet as it was, and every agreement is compared with it."
    : `${R.counts.differs} differ · ${R.counts.check} to check · ${R.counts.match} match · ${R.counts.waiting} haven't signed`;
  const $ = (n) => `$${Number(n).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const T = R?.totals;
  const badge = B ? [R.counts.differs ? `<span class="chase">${R.counts.differs} differ</span>` : R.counts.check ? `${R.counts.check} to check` : "all match", T?.ongiaNights ? `${$(T.ongiaCost)} extra` : ""].filter(Boolean).join(" · ") : "";
  const span = (a, b) => (a && b ? `${esc(shortDate(a))} → ${esc(shortDate(b))}` : "no room");
  const nn = (n) => `${n} night${n === 1 ? "" : "s"}`;
  // One box per night, the date above it. Green: both say yes. Red: the agreement has the night and the sheet
  // doesn't. Orange: the sheet has it and the agreement doesn't. Grey dash: neither. Blue: only one side has an answer.
  const dayHead = (iso) => { const d = fmtDate(iso).split(" "); return `<b>${esc(d[0])}</b><br>${esc(d[2])} ${esc(d[1])}`; };
  const nightBox = (n) => {
    let cls, mark, words;
    if (n.sheet === null || n.desk === null) {
      const one = n.sheet === null ? n.desk : n.sheet;
      [cls, mark, words] = one ? ["only", "✓", n.sheet === null ? "agreement yes<br>not on sheet" : "sheet yes<br>not signed yet"] : ["none", "–", "no night"];
    } else if (n.sheet && n.desk) [cls, mark, words] = ["ok", "✓", "both yes"];
    else if (n.desk) [cls, mark, words] = ["miss", "✗", "agreement yes<br>sheet no"];
    else if (n.sheet) [cls, mark, words] = ["extra", "✗", "sheet yes<br>agreement no"];
    else [cls, mark, words] = ["none", "–", "no night"];
    return `<div class="nb"><div class="dt">${dayHead(n.date)}</div><div class="box ${cls}"><span class="mk">${mark}</span><small>${words}</small></div></div>`;
  };
  const nights = (grid) => `<div class="nights">${grid.map(nightBox).join("")}</div>`;
  const chip = { differs: ["Differs", "bad"], check: ["Check", "warn"], match: ["Matches", "good"], nosheet: ["Not on the sheet", "info"], waiting: ["Not signed yet", "info"] };
  const card = (r) => {
    const sh = r.sheet, d = r.desk;
    const [chipText, chipCls] = chip[r.status] ?? ["", ""];
    const deskWord = d.state === "approved" ? `Agreement approved ${when(d.at)}` : d.state === "submitted" ? `Agreement submitted ${when(d.at)}, not approved yet` : "No agreement yet";
    const pay = sh && d.room && d.block
      ? `<div class="payline${r.issues.some((i) => !i.night && /pay/i.test(i.text)) ? " flag" : ""}">Who pays: the agreement says <b>${d.block === "master" ? "ONGIA (master block)" : "they pay their own room"}</b>; the sheet says <b>${sh.agencyPays ? "the agency is paying" : "nothing about an agency"}</b>.</div>` : "";
    const notes = r.issues.filter((i) => !i.night && !/pay/i.test(i.text));
    const pick = r.status === "nosheet" ? `<div class="fit">Spelled differently on the sheet? <select data-shlink-pick="${esc(r.id)}" aria-label="Sheet name for ${esc(r.name)}"><option value="">Pick the sheet row…</option>${R.sheetNames.map((n) => `<option>${esc(n)}</option>`).join("")}</select> <button class="mini" data-shlink="${esc(r.id)}">Match them</button></div>` : "";
    return `<div class="shc ${r.status}"><div class="shhead"><div><span class="nm">${esc(r.name)}</span> <span class="ag">${esc(r.agency)}</span></div><span class="shchip ${chipCls}">${chipText}</span></div>
      <div class="ag" style="margin-top:2px">${esc(deskWord)}${sh && r.how !== "exact" ? ` · matched to “${esc(r.matchedAs)}” on the sheet${r.how === "surname" ? " by surname only" : r.how === "linked" ? " (by you)" : ""} <button class="mini ghost" data-shlink-clear="${esc(r.id)}">Not them</button>` : ""}</div>
      ${r.grid.length ? nights(r.grid) : ""}${pay}
      ${notes.length ? `<ul class="iss">${notes.map((i) => `<li class="${i.kind}">${esc(i.text)}</li>`).join("")}</ul>` : ""}${pick}</div>`;
  };
  const group = (title, rows, open = true) => rows.length ? `<details class="settings"${open ? " open" : ""} style="margin-top:12px"><summary>${title} (${rows.length})</summary>${rows.map(card).join("")}</details>` : "";
  const of = (...s) => R?.rows.filter((r) => s.includes(r.status)) ?? [];
  const body = !B ? `<p class="hint" style="margin:0 0 10px">This compares each presenter's agreement with the logistics spreadsheet <b>as it stood before anyone corrected it</b>, so you can see what the sheet got wrong.
        To get that copy: in SharePoint open the spreadsheet, choose <b>Version history</b>, download the version from before the corrections, and upload it here. The desk only keeps each presenter's name, agency and Sunday to Thursday nights, never the notes, and it never changes the spreadsheet.</p>
      <div class="actions" style="margin:0"><button class="btn btn-gold" id="sh-up">Upload the sheet (.xlsx)</button></div>`
    : `${costBanner(R.totals, $)}<p class="hint" style="margin:14px 0 0">Baseline: <b>${esc(B.fileName)}</b>, uploaded ${esc(when(B.uploadedAt))}${B.uploadedBy ? ` by ${esc(B.uploadedBy)}` : ""}. ${B.count} rows read. Worked out fresh every time you open this page, so a presenter who submits or is approved shows up here at once. This page only reads the sheet; it never changes it.</p>
      <div class="actions" style="margin:8px 0 0"><button class="mini" id="sh-up">Replace with another copy</button><button class="mini ghost" id="sh-del">Remove the baseline</button></div>
      <div class="shlegend"><span><i class="box ok">✓</i> both say yes</span><span><i class="box miss">✗</i> agreement has it, sheet doesn't</span><span><i class="box extra">✗</i> sheet has it, agreement doesn't</span><span><i class="box none">–</i> neither</span></div>
      <div class="shchips"><span class="chipstat hot"><b>${R.counts.differs}</b>differ</span><span class="chipstat"><b>${R.counts.check}</b>to check</span><span class="chipstat"><b>${R.counts.match}</b>match</span><span class="chipstat"><b>${R.counts.nosheet}</b>not on the sheet</span><span class="chipstat"><b>${R.counts.waiting}</b>haven't signed</span></div>
      ${group("Differences", of("differs"))}${group("To check", of("check"))}${group("In the desk but not on the sheet", of("nosheet"))}
      ${R.sheetOnly.length ? `<details class="settings" style="margin-top:12px"><summary>On the sheet with nights booked, not on the desk (${R.sheetOnly.length})</summary>${R.sheetOnly.map((s) => `<div class="shc"><div class="shhead"><div><span class="nm">${esc(s.name)}</span> <span class="ag">${esc(s.agency)}</span></div><span class="shchip info">Sheet only</span></div>${nights(s.grid)}</div>`).join("")}</details>` : ""}
      ${group("Haven't signed yet", of("waiting"), false)}${group("Match", of("match"), false)}`;
  return secFold("sheet", "Logistics sheet check", line, badge, `<div class="card-body">${body}<input type="file" id="sh-file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden><div id="sh-said" class="hint" style="margin-top:8px"></div></div>`);
}

function wireSheet(ev, SC) {
  const q = `/sheetcheck?event=${encodeURIComponent(ev.id)}`;
  const up = document.getElementById("sh-up"), file = document.getElementById("sh-file"), said = document.getElementById("sh-said");
  if (up && file) {
    up.onclick = () => file.click();
    file.onchange = async () => {
      const f = file.files?.[0]; file.value = "";
      if (!f) return;
      said.style.color = ""; said.textContent = `Reading ${f.name}…`;
      try {
        const cells = await readLogisticsXlsx(f);
        await api(`${q}&baseline=1`, { method: "PUT", body: JSON.stringify({ fileName: f.name, cells }) });
        toast("Sheet read. Comparison is below."); render();
      } catch (e) { said.style.color = "var(--late)"; said.textContent = e.message; }
    };
  }
  const rt = document.getElementById("rt-save");
  if (rt) rt.onclick = async () => {
    try { await api(`${q}&rates=1`, { method: "PUT", body: JSON.stringify({ nightly: +document.getElementById("rt-n").value, taxes: [+document.getElementById("rt-a").value, +document.getElementById("rt-b").value] }) }); render(); }
    catch (e) { toast(e.message); }
  };
  const del = document.getElementById("sh-del");
  if (del) del.onclick = async () => { if (!confirm("Remove the baseline sheet? The comparison goes away until you upload one again.")) return; try { await api(q, { method: "DELETE" }); render(); } catch (e) { toast(e.message); } };
  const link = (presenterId, sheetName) => api(`${q}&link=1`, { method: "PUT", body: JSON.stringify({ presenterId, sheetName }) }).then(() => render()).catch((e) => toast(e.message));
  ROOT.querySelectorAll("[data-shlink]").forEach((b) => { b.onclick = () => { const v = ROOT.querySelector(`[data-shlink-pick="${b.dataset.shlink}"]`)?.value; if (!v) return toast("Pick the sheet row first."); link(b.dataset.shlink, v); }; });
  ROOT.querySelectorAll("[data-shlink-clear]").forEach((b) => { b.onclick = () => link(b.dataset.shlinkClear, ""); });
}

/**
 * The list in the groups the hotel gets it in: master block first, then everyone paying their own, then those waiting
 * for approval. Each is its own box with its rooms and nights; inside, a small heading per group (board, presenters,
 * volunteers, guests, other) and one tight line per person (Andrew chose this, option A, 21 Oct 2026: no dead space).
 */
const ROOM_KINDS = [["Board Member", "Board members"], ["Presenter", "Presenters"], ["Volunteer", "Volunteers"], ["ONGIA Guest", "ONGIA guests"], ["Other", "Other"]];
function roomGroups(rows, row) {
  const master = rows.filter((r) => r.billing === "ONGIA"), own = rows.filter((r) => r.billing === "Guest"), tbc = rows.filter((r) => r.billing !== "ONGIA" && r.billing !== "Guest");
  const nightsOf = (list) => list.reduce((n, r) => n + (r.nights || 0), 0);
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const byKind = (list) => {
    const known = new Set(ROOM_KINDS.map(([k]) => k));
    return [...ROOM_KINDS, ["", "Type not set"]].map(([k, label]) => {
      const part = list.filter((r) => (k ? r.type === k : !known.has(r.type))).sort((a, b) => a.name.localeCompare(b.name));
      return part.length ? `<div class="rkind">${label} <b>${part.length}</b><span>${plural(nightsOf(part), "night")}</span></div>${part.map(row).join("")}` : "";
    }).join("");
  };
  const group = (title, note, list) => list.length ? `<div class="roomgroup"><div class="rghead"><b>${title}</b> <span>${plural(list.length, "room")} · ${plural(nightsOf(list), "night")}</span><small>${note}</small></div>
    <div class="rooms">${byKind(list)}</div></div>` : "";
  return group("Master block (ONGIA pays)", "ONGIA pays the hotel for these.", master)
    + group("Not on the master block", "Each one pays their own room, so the hotel is told not to bill ONGIA.", own)
    + group("Waiting for approval", "Which group they go in is chosen when the agreement is approved.", tbc);
}

function roomingCard(ev, R, C = null) {
  if (!R) return `<div class="card"><div class="card-head"><div><h2>Hotel rooms</h2></div></div>
    <div class="card-body"><div class="bad"><b>The rooming list could not be loaded.</b> Reload the page.</div></div></div>`;
  ROOMING = R;
  const conf = R.rows.filter((r) => r.confirmed);
  const nightsAll = conf.reduce((n, r) => n + r.nights, 0);
  // One tight line: tick, name and Edit, who they are, the nights; who pays only where the box heading doesn't say it.
  const row = (r) => {
    const [cls, w0] = BILL[r.billing] ?? ["", r.billing];
    const word = r.billing === "Guest" ? `${r.name} pays` : w0;
    const type = r.type || (r.who === "guest" ? "type not set" : "Presenter");
    const about = [r.who === "presenter" && r.type !== "Presenter" ? "presenting" : "", r.organization || "", r.board && r.type !== "Board Member" ? "on the board" : ""].filter(Boolean).join(" · ");
    return `<label class="room${r.confirmed ? "" : " unconf"}">
      <input type="checkbox" data-room="${esc(r.key)}"${r.confirmed ? " checked" : ""}>
      <div class="rn">${esc(r.name)} ${r.who === "volunteer" ? "" : `<button type="button" class="gedit" ${r.who === "guest" ? "data-gedit" : "data-pedit"}="${esc(r.key)}" aria-label="Edit ${esc(r.name)}">Edit</button>`}</div>
      <div class="ro"><span class="rtype">${esc(type)}${about ? " · " : ""}</span>${esc(about)}${r.confirmed ? "" : ` · <span style="color:var(--wait)">${esc(r.why)}</span>`}</div>
      <div class="rd">${esc(shortDate(r.checkIn))} → ${esc(shortDate(r.checkOut))} <small>${r.nights} night${r.nights === 1 ? "" : "s"}</small></div>
      ${r.billing === "ONGIA" ? `<span class="rb sr">ONGIA pays</span>` : `<span class="rb ${cls}">${esc(word)}</span>`}</label>`;
  };
  const sent = R.sent
    ? `<p class="roomsent">Sent to <b>${esc(R.sent.to)}</b> on ${esc(fmtDate(R.sent.at.slice(0, 10)))} (${R.sent.count} room${R.sent.count === 1 ? "" : "s"}).</p>
       ${R.changes?.length ? `<div class="roomchg"><b>Since then:</b><ul>${R.changes.map((c) => `<li>${esc(c.text)}</li>`).join("")}</ul>
         The hotel does not know yet. Send the update and the email will list these changes.</div>` : ""}`
    : "";
  const waiting = R.waiting.length
    ? `<p class="roomwait">Not confirmed yet, so they may still need a room: ${R.waiting.map((w) => esc(w.name)).join(", ")}.</p>` : "";
  const ownN = conf.filter((r) => r.billing === "Guest").length;
  const line = [R.rows.length ? `${conf.length} room${conf.length === 1 ? "" : "s"}, ${nightsAll} room night${nightsAll === 1 ? "" : "s"}${ownN ? ` (${ownN} not on the master block)` : ""}` : "No one needs a room yet",
    R.hotel.name ? `at ${esc(R.hotel.name)}` : "no hotel set",
    R.sent ? `sent ${esc(shortDate(R.sent.at.slice(0, 10)))}` : R.rows.length ? "not sent to the hotel yet" : ""].filter(Boolean).join(" · ");
  const badge = [R.rows.length > conf.length ? `<span class="chase">${R.rows.length - conf.length} awaiting approval</span>` : "",
    R.changes?.length ? `<span class="late">${R.changes.length} change${R.changes.length === 1 ? "" : "s"} to send</span>` : ""].filter(Boolean).join(" · ");
  return secFold("hotel", "Hotel rooms", line, badge, `
    <div class="card-head"><div>
      <div class="s">From the presenters' and volunteers' agreements — the dates and billing the board approved — plus anyone you add.${R.hotel.name ? ` At ${esc(R.hotel.name)}.` : ""}</div>
      ${conf.length ? `<div class="jobsum" style="margin-top:8px"><span class="chipstat"><b>${conf.length}</b>room${conf.length === 1 ? "" : "s"}</span>
        <span class="chipstat"><b>${nightsAll}</b>room night${nightsAll === 1 ? "" : "s"}</span>
        ${R.rows.length > conf.length ? `<span class="chipstat hot"><b>${R.rows.length - conf.length}</b>awaiting approval</span>` : ""}</div>` : ""}</div>
      <div class="cardacts">${R.rows.length ? `<button class="mini" id="rm-csv">Download spreadsheet</button>
        <button class="mini solid" id="rm-send">${R.sent ? "Email the update to the hotel" : "Email it to the hotel"}</button>` : ""}</div></div>
    <div class="card-body">
      ${hotelStrip(ev, C)}
      ${sent}
      ${R.rows.length ? roomGroups(R.rows, row)
        : `<div class="empty" style="padding:24px 16px">No one needs a room yet. When a presenter asks for one on their agreement, they appear here.</div>`}
      ${waiting}
      ${noRoom(ev, R)}
      <details class="settings" id="rg-details" style="margin-top:12px"${RG_OPEN ? " open" : ""}>
        <summary>Add people by hand or from a spreadsheet${R.guests.length ? ` (${R.guests.length} added)` : ""}</summary>
        <p class="hint" style="margin-top:8px">Board members, volunteers, ONGIA guests, others (a comped room for another association, a dignitary and so on: pick Other and say who they are), and any presenter who is not on the desk.
          Presenters with an agreement come onto the list by themselves.</p>
        <div id="rm-guests">${R.guests.map((g) => `<div class="room"><span></span><div class="rn">${esc(g.name)}<div class="ro">
          <select data-rmtype="${esc(g.id)}" aria-label="Who ${esc(g.name)} is" style="width:auto;padding:3px 8px;font-size:12.5px;margin:3px 0">
            ${g.type ? "" : `<option value="" selected>Type not set</option>`}${GUEST_TYPES.map((t) => `<option${t === g.type ? " selected" : ""}>${t}</option>`).join("")}</select>${g.note ? ` · ${esc(g.note)}` : ""}</div></div>
          <div class="rd">${esc(shortDate(g.checkIn))} → ${esc(shortDate(g.checkOut))}</div>
          <button class="mini ghost" data-rmdel="${esc(g.id)}">Remove</button></div>`).join("")}</div>
        <div class="gform">
          <div class="gname"><label for="rg-name">Name</label><input id="rg-name" list="rg-board" autocomplete="off" placeholder="Start typing; board names are offered"></div>
          <datalist id="rg-board">${(R.board ?? []).map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist>
          <div><label for="rg-type">Type</label><select id="rg-type"><option value="">Pick one</option>${GUEST_TYPES.map((t) => `<option>${t}</option>`).join("")}</select></div>
          <div><label for="rg-bill">Who pays</label><select id="rg-bill"><option value="ONGIA">ONGIA</option><option value="Guest">The guest</option></select></div>
          <div><label for="rg-in">Check-in</label><select id="rg-in">${guestDays(R.window, "in", ev)}</select></div>
          <div><label for="rg-out">Check-out</label><select id="rg-out">${guestDays(R.window, "out", ev)}</select></div>
          <div><button class="mini" id="rg-add">Add</button></div>
          <div class="gdesc" id="rg-descbox" hidden><label for="rg-desc">Who they are</label><input id="rg-desc" maxlength="120" autocomplete="off" placeholder="e.g. Peel Police Association, visiting dignitary"></div>
        </div>
        <p class="hint" id="rg-said" style="margin:6px 0 0"></p>
        <p class="hint" id="rg-boardnote" style="margin:4px 0 0" hidden>On the ONGIA board: ONGIA pays unless you change "Who pays" (say, to earn their own hotel points).</p>
        <div class="gsheet"><button class="mini" id="rg-up">Upload a spreadsheet</button>
          <input type="file" id="rg-file" accept=".csv,text/csv,text/plain" hidden>
          <button class="mini ghost" id="rg-blank">Download the blank sheet</button></div>
        <p class="hint" style="margin:6px 0 0">Columns: Name, Type (${GUEST_TYPES.join(", ")}), Check-in, Check-out,
          Who pays (ONGIA or Guest; empty means ONGIA), and an optional Note.${R.window ? ` Dates from ${esc(fmtDate(R.window.from))} to ${esc(fmtDate(R.window.to))}.` : ""}
          Save it from Excel as CSV. Nobody is added until you have seen the list and pressed Add.</p>
        <div id="rg-read"></div>
      </details>
    </div>`);
}
