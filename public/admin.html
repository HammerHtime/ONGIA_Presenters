/* ---------- one event ---------- */
function eventScreen(data) {
  const { event: ev, presenters, counts: c, materials, checklist, guests, rooming, contract } = data;
  const mstat = materials?.status ?? {};
  const scan = materials?.scan ?? null;
  BARRIGHT.innerHTML = `<button class="chip" id="back">All events</button>`;
  document.getElementById("back").onclick = () => { view = { name: "list" }; render(); };
  // Wired after the card renders (the buttons live on it, not in the top bar).
  const wireActions = () => {
    document.getElementById("edit").onclick = () => { view = { name: "edit", eventId: ev.id }; render(); };
    document.getElementById("add").onclick = () => { view = { name: "add", eventId: ev.id }; render(); };
    document.getElementById("mailall").onclick = mailAll;
  };
  const mailAll = async () => {
    const outstanding = presenters.filter((p) => p.status !== "submitted" && p.status !== "approved");
    if (!presenters.length) return toast("No presenters yet.");
    if (!outstanding.length) return toast("Everyone has submitted.");
    if (!confirm(`Email their link to ${outstanding.length} presenter${outstanding.length === 1 ? "" : "s"} who haven't submitted?`)) return;
    await invite(ev.id, null, outstanding.some((p) => p.mail?.length));
  };

  const today = todayIso();
  const daysTo = (iso) => Math.round((Date.parse(iso) - Date.parse(today)) / 86400000);
  const short = (iso) => (iso ? fmtDate(iso.slice(0, 10)).replace(/^\w+ /, "") : "");

  // The reminder cadence, mirrored from netlify/functions/lib/reminders.mjs so a
  // row can say when the next automatic nudge goes out — or that it is paused.
  const NUDGE_DAYS = [-28, -14, -7, -4, -2, -1, 0];
  const overdueDay = (off) => off > 0 && (off <= 14 ? off % 3 === 0 : off % 7 === 0);
  const addDays = (iso, n) => new Date(Date.parse(iso) + n * 86400000).toISOString().slice(0, 10);
  const nextReminder = (p) => {
    if (p.status === "submitted" || p.status === "approved") return null;
    if (!(p.mail ?? []).some((m) => m.type !== "called")) return null;   // never invited: nothing is scheduled
    const due = ev.deadlines?.agreement;
    if (!due) return null;
    const calls = (p.mail ?? []).filter((m) => m.type === "called");
    const pausedTo = calls.length ? addDays(calls.at(-1).at.slice(0, 10), 7) : null;
    for (let k = 0; k <= 180; k++) {
      const d = addDays(today, k);
      if (pausedTo && d < pausedTo) continue;
      const off = Math.round((Date.parse(d) - Date.parse(due)) / 86400000);
      if (NUDGE_DAYS.includes(off) || overdueDay(off)) return d;
    }
    return null;
  };

  // One line that says where each agreement stands, who it is waiting on, and
  // how hard the desk has already chased.
  const agreementCell = (p) => {
    const mails = (p.mail ?? []).filter((m) => m.type !== "called");
    const calls = (p.mail ?? []).filter((m) => m.type === "called");
    const n = mails.length;
    const calledLine = calls.length ? ` · called ${short(calls.at(-1).at)}` : "";
    const nextLine = () => { const d = nextReminder(p); return d ? ` · next reminder ${short(d)}` : ""; };
    if (p.status === "approved") {
      const filing = p.delivery?.filing;
      if (filing && filing.ok === false) return { bucket: "failed",
        pill: `<span class="pill done">Final</span> <span class="pill late">Not filed</span>`,
        sub: `approved ${short(p.approvedAt)} · never reached SharePoint${filing.error ? ` — ${esc(filing.error)}` : ""}` };
      return { bucket: "final", pill: `<span class="pill done">Final</span>`, sub: `approved ${short(p.approvedAt)}${filing?.ok ? " · filed" : ""}` };
    }
    if (p.status === "submitted") return { bucket: "review", pill: `<span class="pill you">Needs review</span>`, sub: `submitted ${short(p.submittedAt)} · waiting on ONGIA` };
    // Nobody has ever sent this person their link: no reminder will ever chase them.
    if (!n) return { bucket: "uninvited", pill: `<span class="pill late">Never sent</span>`,
      sub: p.lastSendError ? `could not be emailed — ${esc(p.lastSendError.why)}` : "no link sent yet · no reminder will chase them" };
    const hard = n >= 4;
    const chased = `${n} reminder${n === 1 ? "" : "s"}`;
    if (p.status === "returned") return { bucket: "progress", pill: `<span class="pill late">Sent back</span>`,
      sub: `${short(p.review?.returnedAt)} · waiting for changes${calledLine}` };
    const callPill = hard && !calls.length ? `<div style="margin-top:5px"><span class="pill late">Call them</span></div>` : "";
    if (p.openedAt) return { bucket: "progress", pill: `<span class="pill ${hard ? "late" : "wait"}">Opened, not finished</span>${callPill}`,
      sub: `opened ${short(p.openedAt)} · ${chased}, last ${short(mails.at(-1).at)}${calledLine}${nextLine()}` };
    return { bucket: "notstarted", pill: `<span class="pill ${hard ? "late" : "wait"}">Not opened</span>${callPill}`,
      sub: `${chased}, last ${short(mails.at(-1).at)}${calledLine}${nextLine()}` };
  };

  /**
   * The six things that have to happen for one presenter, in the order they
   * happen. Two are ONGIA's move (sending the link, approving); four are the
   * presenter's (the signed agreement, their photo, draft and final material).
   * Grey is not started, amber is coming up, red is past its date, green is done.
   */
  const STEPS = [
    { key: "link", label: "Link sent" },
    { key: "agreement", label: "Agreement" },
    { key: "photo", label: "Headshot" },
    { key: "approved", label: "Approved" },
    { key: "room", label: "Room & kit" },
    { key: "draft", label: "Draft material" },
    { key: "final", label: "Final material" },
  ];

  // What has happened, with no judgement attached yet — the judgement needs to
  // see the whole list first.
  const stepFacts = (p) => {
    const m = mstat[p.id] ?? {};
    const sentMail = (p.mail ?? []).filter((x) => x.type !== "called");
    const inHand = p.status === "submitted" || p.status === "approved";
    return { inHand, at: {
      link: sentMail.length ? sentMail[0].at : null,
      agreement: inHand ? p.submittedAt : null,
      photo: inHand && p.submission?.headshotName ? p.submittedAt : null,
      approved: p.status === "approved" ? p.approvedAt : null,
      room: p.avAt ?? null,
      draft: m.draft ?? null,
      final: m.final ?? null,
    } };
  };
  const FACTS = new Map(presenters.map((p) => [p.id, stepFacts(p)]));

  /**
   * Only the NEXT thing a presenter owes is coloured; everything behind it stays
   * grey. One loud step per row points at the next action, and a presenter who
   * has not signed yet is not separately nagged about slides they cannot send.
   *
   * Every part of this is decided from the row alone. An earlier version judged
   * lateness by comparing a row with its neighbours, which meant ticking one
   * presenter's draft repainted five other rows — right in the data, alarming on
   * screen, and impossible to reason about.
   */
  const stepsOf = (p) => {
    const due = ev.deadlines ?? {};
    const { at, inHand } = FACTS.get(p.id);
    // Room and equipment is asked at approval and wanted when the venue starts
    // setting rooms up, which is the draft-materials date.
    const by = { link: due.agreement, agreement: due.agreement, photo: due.agreement,
                 approved: null, room: due.draft, draft: due.draft, final: due.final };
    const next = STEPS.findIndex((s) => !at[s.key]);
    return STEPS.map((s, i) => {
      const done = Boolean(at[s.key]);
      const deadline = by[s.key];
      const left = deadline ? daysTo(deadline) : null;
      // Waiting on the board is the one state that always shows, wherever it
      // sits: it is the only step that asks something of the person reading.
      const yours = s.key === "approved" && p.status === "submitted";
      const state = done ? "done"
        : yours ? "you"
        : i !== next ? "todo"
        // The photo arrives with the agreement, so it only counts as missing
        // once the agreement is in without one — and then it stays missing
        // unless the agreement goes back, which earns the red.
        : s.key === "photo" ? (inHand ? "late" : "todo")
        : left === null ? "todo"
        : left < 0 ? "late"
        : left <= 14 ? "soon"
        : "todo";
      return { ...s, done, state, at: at[s.key], deadline };
    });
  };

  const stepTitle = (s, p) => {
    const mat = s.key === "draft" || s.key === "final";
    const files = mat ? (materials?.files?.[p.id] ?? []) : [];
    const seen = files.length ? ` · ${files.length} file${files.length === 1 ? "" : "s"} in the folder, latest ${short(files[0].at)}` : "";
    const click = mat ? (s.done ? " · click to clear" : " · click to mark it received") : "";
    if (s.done) {
      const how = mat ? (mstat[p.id]?.[`${s.key}Manual`] ? " (ticked by hand)" : " (upload)") : "";
      return `${s.label} — done ${short(s.at)}${how}${seen}${click}`;
    }
    if (mat && s.deadline) {
      const d = daysTo(s.deadline);
      return `${s.label} — ${d < 0 ? `overdue ${-d} day${d === -1 ? "" : "s"}` : `due ${short(s.deadline)}`}${seen}${click}`;
    }
    if (s.state === "you") return `${s.label} — waiting on ONGIA: review and sign it`;
    if (s.key === "approved") return `${s.label} — nothing to approve until the agreement is in`;
    if (s.key === "photo") return p.status === "submitted" || p.status === "approved"
      ? "No headshot — the agreement has no photo. Send it back if you need one."
      : "Headshot — comes in with the signed agreement";
    if (!s.deadline) return `${s.label} — no date set on this event`;
    const d = daysTo(s.deadline);
    return d < 0 ? `${s.label} — overdue ${-d} day${d === -1 ? "" : "s"} (was due ${short(s.deadline)})`
      : `${s.label} — due ${short(s.deadline)}${d <= 14 ? ` (${d} day${d === 1 ? "" : "s"})` : ""}`;
  };

  const stepsHtml = (p) => {
    const st = stepsOf(p);
    const out = st.filter((s) => !s.done);
    // Draft and final stay clickable, the way the old Materials chips were, so
    // a file that arrived outside the drop folder can still be ticked by hand.
    const one = (s) => {
      const body = `<i></i>${esc(s.label)}`;
      const attrs = `class="step ${s.state}" title="${esc(stepTitle(s, p))}"`;
      return s.key === "draft" || s.key === "final"
        ? `<button type="button" ${attrs} data-mat="${esc(p.id)}" data-key="${s.key}" data-on="${s.done ? "0" : "1"}">${body}</button>`
        : `<span ${attrs}>${body}</span>`;
    };
    return `<div class="steps">
      <span class="scount">${out.length ? `${out.length} outstanding` : "all done"}</span>
      ${st.map(one).join("")}
    </div>`;
  };

  // Draft and final materials, detected from uploads or ticked by hand.
  // Which filter cuts this presenter falls into. The Draft/Final chips this used
  // to draw are the Draft/Final steps now, so only the flags are left.
  const matCell = (p) => {
    const m = mstat[p.id] ?? {};
    const due = ev.deadlines ?? {};
    return {
      missing: (!m.draft && due.draft && daysTo(due.draft) <= 14) || (!m.final && due.final && daysTo(due.final) <= 14),
      none: !m.draft && !m.final,
    };
  };

  const enriched = presenters.map((p) => ({ p, a: agreementCell(p), m: matCell(p) }));
  const filter = view.filter ?? "all";
  const inFilter = ({ a, m }, f) => f === "all" ? true : f === "materials" ? m.missing : f === "nomaterials" ? m.none : a.bucket === f;
  const show = enriched.filter((row) => inFilter(row, filter));
  const count = (f) => enriched.filter((row) => inFilter(row, f)).length;

  const rows = show.length ? show.map(({ p, a, m }) => {
    const initials = `${p.first[0] ?? ""}${p.last[0] ?? ""}`.toUpperCase();
    const link = `${location.origin}/a/${p.token}`;
    return `<div class="trow">
      <div class="who"><div class="av">${esc(initials)}</div>
        <div><div class="pname">${esc(p.first)} ${esc(p.last)}${p.language === "fr" ? ' <span class="pill" style="font-size:10px;padding:2px 7px">FR</span>' : ""}</div>
          <div class="porg" title="${esc(p.organization || p.email)}">${esc(p.organization || p.email)}</div>
          ${p.submission?.talk ? `<div class="ptalk">${esc(p.submission.talk)}</div>` : ""}</div></div>
      <div class="cell"><div class="cl">Agreement</div>${a.pill}<div class="porg">${a.sub}</div></div>
      <div class="act">
        <button class="mini" data-copy="${esc(link)}">Copy link</button>
        <button class="mini" data-edit="${esc(p.id)}" title="Correct their name, email or organization">Edit</button>
        ${p.status !== "approved" && p.status !== "submitted" ? `<button class="mini" data-invite="${esc(p.id)}">${(p.mail ?? []).some((m) => m.type !== "called") ? "Email again" : "Email link"}</button>` : ""}
        ${p.status !== "approved" && p.status !== "submitted" && (p.mail ?? []).some((m) => m.type !== "called")
          ? `<button class="mini" data-called="${esc(p.id)}" title="Log a phone call — pauses the automatic reminders for a week">Called them</button>` : ""}
        ${p.status === "submitted" || p.status === "returned" ? `<button class="mini gold" data-review="${esc(p.id)}">Review</button>` : ""}
        ${a.bucket === "failed" ? `<button class="mini" data-refile="${esc(p.id)}">Retry filing</button>` : ""}
        ${p.status === "approved" ? `<button class="mini" data-review="${esc(p.id)}">Details</button><button class="mini" data-pdf="${esc(p.id)}">PDF</button>` : `<button class="mini ghost" data-remove="${esc(p.id)}" title="Remove presenter">✕</button>`}
      </div>
      ${stepsHtml(p)}</div>`;
  }).join("") : `<div class="empty">${presenters.length ? "Nobody in this view." : "No presenters yet. Add some to send their links."}</div>`;

  // The exception cuts only appear when there is an exception to show.
  const chips = [["all", "All", true], ["uninvited", "Link never sent", false], ["notstarted", "Not started", true],
    ["progress", "Waiting on presenter", true], ["review", "For you to review", true], ["final", "Final", true],
    ["failed", "Not filed", false], ["materials", "Materials due within 2 weeks", false], ["nomaterials", "No materials yet", false]]
    .filter(([k, , always]) => always || count(k) > 0 || filter === k)
    .map(([k, l]) => `<button class="fchip${filter === k ? " on" : ""}" data-filter="${k}">${l}${k === "all" ? "" : ` <b>${count(k)}</b>`}</button>`).join("");

  const draftGot = enriched.filter(({ p }) => mstat[p.id]?.draft).length;
  const finalGot = enriched.filter(({ p }) => mstat[p.id]?.final).length;
  const nextDl = [["agreement", "Agreements due"], ["draft", "Draft materials due"], ["final", "Final materials due"], ["dayOne", "Training starts"]]
    .map(([k, l]) => ({ l, iso: k === "dayOne" ? ev.dayOne : ev.deadlines?.[k] })).filter((x) => x.iso).map((x) => ({ ...x, d: daysTo(x.iso) }));
  // How many people each missed deadline is actually still waiting on. The
  // agreement line counts anyone who has not submitted — including one that was
  // sent back — which is the same set "Email all outstanding" writes to.
  const stillOut = (label) => label.startsWith("Agreements")
    ? presenters.filter((p) => p.status !== "submitted" && p.status !== "approved").length
    : label.startsWith("Draft") ? presenters.length - draftGot : presenters.length - finalGot;
  const overdue = nextDl.filter((x) => x.d < 0 && x.l !== "Training starts" && stillOut(x.l) > 0)
    .map((x) => ({ ...x, out: stillOut(x.l) }));
  // When something is late, the bold line says so. It used to announce the next
  // future deadline while a red box two lines down said the last one was missed.
  const upcoming = overdue[0] ?? nextDl.find((x) => x.d >= 0) ?? nextDl.at(-1);
  const blockers = blockersOf(ev);
  const sendFailed = presenters.filter((p) => p.lastSendError);
  const off = { agreement: 90, draft: 50, final: 30, ...(ev.offsets ?? {}) };

  ROOT.innerHTML = `<div class="card">
    <div class="card-head"><div><h2>${esc(ev.title)}</h2>
      <div class="s">${esc(ev.city)}${ev.venue ? " · " + esc(ev.venue) : ""} · ${esc(fmtDate(ev.dayOne))}${ev.lastDay && ev.lastDay !== ev.dayOne ? " – " + esc(fmtDate(ev.lastDay)) : ""}
        ${upcoming ? ` · <b>${esc(upcoming.l)} ${upcoming.d === 0 ? "today" : upcoming.d > 0 ? `in ${upcoming.d} day${upcoming.d === 1 ? "" : "s"}` : `${-upcoming.d} day${upcoming.d === -1 ? "" : "s"} ago`}</b>` : ""}</div>
      ${overdue.length ? `<div class="bad" style="margin-top:10px">${overdue.map((x) => `<b>${esc(x.l.replace(" due", ""))}</b> were due ${esc(fmtDate(x.iso))} (${-x.d} day${x.d === -1 ? "" : "s"} ago) — <span class="num">${x.out}</span> of ${presenters.length} still outstanding.`).join("<br>")}</div>` : ""}
      ${blockers.length ? `<div class="blocked"><b>This event is blocked.</b>${blockers.map((b) => `
        <div class="brow"><span><b>${esc(b.title)}</b> — ${esc(b.why)}</span><button class="mini" data-fix="${esc(b.act)}">${esc(b.fix)}</button></div>`).join("")}</div>` : ""}</div>
      <div class="cardacts"><button class="mini" id="edit">Edit event</button><button class="mini" id="mailall">Email all outstanding</button><button class="mini" id="add">Add presenters</button></div></div>
    <div class="tiles">
      <div class="tile"><div class="k">Presenters</div><div class="v">${c.total}</div></div>
      <div class="tile"><div class="k">Waiting on them</div><div class="v">${count("notstarted") + count("progress") + count("uninvited")}</div></div>
      <div class="tile accent"><div class="k">For you to review</div><div class="v">${count("review")}</div></div>
      <div class="tile"><div class="k">Final</div><div class="v">${count("final") + count("failed")}</div></div>
      <div class="tile"><div class="k">Draft materials</div><div class="v">${draftGot}<small>/${c.total}</small></div></div>
      <div class="tile"><div class="k">Final materials</div><div class="v">${finalGot}<small>/${c.total}</small></div></div>
    </div>
    <div class="card-body">
      <dl class="kv" style="margin:0 0 14px">
        <dt>Agreement due</dt><dd>${esc(fmtDate(ev.deadlines?.agreement))} <span class="porg">${off.agreement} days before day one</span></dd>
        <dt>Draft / final materials</dt><dd>${esc(fmtDate(ev.deadlines?.draft))} <span class="porg">${off.draft} days</span> · ${esc(fmtDate(ev.deadlines?.final))} <span class="porg">${off.final} days</span></dd>
      </dl>
      ${sendFailed.length ? `<div class="sendfail"><b>${sendFailed.length} email${sendFailed.length === 1 ? "" : "s"} could not be sent.</b>
        <div style="margin-top:6px">${sendFailed.map((p) => `${esc(p.first)} ${esc(p.last)} — ${esc(p.lastSendError.why)}`).join("<br>")}</div>
        <div style="margin-top:6px;color:var(--ink-mid)">Fix the address on the presenter, or the email settings, then use <b>Email link</b> on their row.</div></div>` : ""}
      <div class="filters">${chips}</div>
      <div class="tlist">${show.length ? `<div class="thead"><span>Presenter</span><span>Agreement</span><span></span></div>` : ""}${rows}</div>
      <details class="settings"><summary>Event settings and diagnostics</summary>
      <dl class="kv" style="margin:12px 0 0">
        <dt class="top">Files to</dt><dd><div class="stack"><span>${ev.sharePointFolder ? esc(ev.sharePointFolder) : "<i>No SharePoint folder set — approvals won't be filed</i>"}</span>${ev.sharePointFolderUrl ? `<a class="mini" href="${esc(ev.sharePointFolderUrl)}" target="_blank" rel="noopener" style="text-decoration:none">Open in SharePoint</a>` : `<button class="mini" id="mkfolder">Create it in SharePoint</button>`}</div></dd>
        <dt class="top">Uploads</dt><dd><div class="stack">${!ev.materialsUploadUrl
          ? `<span class="said">no upload link yet${ev.provisioningError ? ` — ${esc(ev.provisioningError)}` : ""}</span><button class="mini" id="mklink">Create upload link</button>`
          : `<div class="line">${ev.materialsLinkCheck?.verdict === "upload-only" ? `<span class="pill done">upload-only ✓</span>` : `<span class="pill late">unverified</span>`}<span class="said">${scan ? `checked ${esc(short(scan.checkedAt))} · ${scan.total} file${scan.total === 1 ? "" : "s"} in ${esc(scan.folder?.name ?? "the folder")}` : "not checked yet"}</span></div><button class="mini" id="rescan">Check uploads now</button>${scan?.unmatched?.length ? `<div class="porg"><b>${scan.unmatched.length} file${scan.unmatched.length === 1 ? "" : "s"} not matched to a presenter:</b> ${scan.unmatched.map((f) => `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`).join(", ")} — tick Draft/Final by hand for the right person.</div>` : ""}`}</div></dd>
        <dt>Presentation slot</dt><dd>${esc(ev.sessionMinutes ?? 70)} minutes</dd>
        <dt class="top">Presenters reach</dt><dd>${ev.reviewer?.name ? `${esc(ev.reviewer.name)} · ${esc(ev.reviewer.email)}${ev.contact?.phone ? " · " + esc(ev.contact.phone) : ""}` : `<div class="stack"><span class="pill late">no lead</span><span class="said">Edit the event and mark one board member as the lead — until then replies go to the speakers mailbox and the agreement has no ONGIA contact.</span></div>`}</dd>
        <dt>Board</dt><dd>${(ev.board ?? []).length ? ev.board.map((m) => `${esc(m.name || m.email)}${m.lead ? " <span class=\"pill done\" style=\"font-size:10px;padding:2px 8px\">lead</span>" : ""}`).join(" · ") : (ev.reviewer?.name ? esc(ev.reviewer.name) + " (lead)" : "<i>nobody picked — edit the event</i>")}</dd>
      </dl>
      <div class="actions" style="margin-top:22px;justify-content:flex-end"><button class="btn btn-late" id="delevent">Delete this event</button></div>
      </details>
    </div></div>
    <dialog class="sheet" id="pedit">
      <form method="dialog">
        <div class="sheet-head"><h2>Correct this presenter</h2>
          <p class="hint" style="margin-top:6px">Their agreement link does not change, and anything they have already
            filled in is kept. Only what you type here is corrected.</p></div>
        <div class="sheet-body">
          <div class="row2">
            <div class="field"><label for="pe-first">First name</label><input id="pe-first" required autocomplete="off"></div>
            <div class="field"><label for="pe-last">Last name</label><input id="pe-last" required autocomplete="off"></div>
          </div>
          <div class="field"><label for="pe-email">Email</label><input id="pe-email" type="email" required autocomplete="off"></div>
          <div class="field"><label for="pe-org">Organization</label><input id="pe-org" autocomplete="off"></div>
          <div id="pe-warn"></div>
          <div class="actions" style="margin-top:18px">
            <button class="btn btn-gold" id="pe-save" value="save">Save the correction</button>
            <button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button>
          </div>
        </div>
      </form>
    </dialog>`
    + roomingCard(ev, rooming, contract) + roomingDialog() + guestDialog()
    + checklistCard(ev, checklist) + jobDialog()
    + attendeesCard(ev, guests) + wixDialog();

  CHECKLIST = checklist;
  wireActions();
  wireChecklist(ev);
  wireRooming(ev, rooming);
  wireAttendees(ev);
  // A blocked event's fix buttons drive the same actions as the settings block.
  ROOT.querySelectorAll("[data-fix]").forEach((b) => {
    b.onclick = () => {
      const act = b.dataset.fix;
      if (act === "edit") { view = { name: "edit", eventId: ev.id }; render(); return; }
      const target = document.getElementById(act === "mklink" ? "mklink" : "mkfolder");
      const box = document.querySelector(".settings");
      if (box) box.open = true;
      if (target) { target.scrollIntoView({ block: "center", behavior: "smooth" }); target.click(); }
      else toast("Open Event settings to finish this.");
    };
  });
  ROOT.querySelectorAll("[data-called]").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true; b.textContent = "Saving…";
      try {
        await api(`/invite?id=${encodeURIComponent(ev.id)}&called=1`, { method: "POST", body: JSON.stringify({ presenterIds: [b.dataset.called] }) });
        toast("Call logged. Automatic reminders pause for a week.");
        render();
      } catch (e) { toast(e.message); b.disabled = false; b.textContent = "Called them"; }
    };
  });
  ROOT.querySelectorAll("[data-refile]").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true; b.textContent = "Filing…";
      try {
        const out = await api(`/review?event=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(b.dataset.refile)}&action=redeliver`, { method: "POST", body: JSON.stringify({ all: false }) });
        toast(out.presenter?.delivery?.filing?.ok ? "Filed to SharePoint." : `Still failing: ${out.presenter?.delivery?.filing?.error ?? "unknown"}`);
        render();
      } catch (e) { toast(e.message); b.disabled = false; b.textContent = "Retry filing"; }
    };
  });
  ROOT.querySelectorAll("[data-filter]").forEach((b) => { b.onclick = () => { view = { ...view, filter: b.dataset.filter }; eventScreen(data); }; });
  ROOT.querySelectorAll("[data-mat]").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        const out = await api(`/materials?event=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(b.dataset.mat)}`,
          { method: "POST", body: JSON.stringify({ [b.dataset.key]: b.dataset.on === "1" }) });
        eventScreen({ ...data, materials: out });
      } catch (e) { toast(e.message); b.disabled = false; }
    };
  });
  const rescan = document.getElementById("rescan");
  if (rescan) rescan.onclick = async () => {
    rescan.disabled = true; rescan.textContent = "Checking…";
    try {
      const out = await api(`/materials?event=${encodeURIComponent(ev.id)}&scan=1`, { method: "POST" });
      toast(`${out.scan?.total ?? 0} file${out.scan?.total === 1 ? "" : "s"} found.`);
      eventScreen({ ...data, materials: out });
    } catch (e) { toast(e.message); rescan.disabled = false; rescan.textContent = "Check uploads now"; }
  };

  const mkl = document.getElementById("mklink");
  if (mkl) mkl.onclick = async () => {
    mkl.disabled = true; mkl.textContent = "Creating…";
    try {
      await api(`/events?id=${encodeURIComponent(ev.id)}&uploadlink=1`, { method: "POST" });
      toast("Folder and upload-only link ready."); render();
    } catch (e) { toast(e.message); mkl.disabled = false; mkl.textContent = "Create upload link"; }
  };
  const mk = document.getElementById("mkfolder");
  if (mk) mk.onclick = async () => {
    mk.disabled = true; mk.textContent = "Creating…";
    try {
      const out = await api(`/events?id=${encodeURIComponent(ev.id)}&folder=1`, { method: "POST" });
      toast(`Folder ready: ${out.folder.path}`); render();
    } catch (e) { toast(e.message); mk.disabled = false; mk.textContent = "Create it in SharePoint"; }
  };
  document.getElementById("delevent").onclick = async () => {
    const approved = presenters.filter((p) => p.status === "approved").length;
    const msg = `Delete "${ev.title}" and its ${presenters.length} presenter${presenters.length === 1 ? "" : "s"} from the desk?\n\n` +
      (approved ? `${approved} final PDF${approved === 1 ? " is" : "s are"} already filed in SharePoint and will stay there. ` : "") +
      `Presenter links stop working immediately. This cannot be undone.`;
    if (!confirm(msg)) return;
    if (prompt(`Type the city to confirm: ${ev.city}`) !== ev.city) return toast("Not deleted — city didn't match.");
    try { await api(`/events?id=${encodeURIComponent(ev.id)}`, { method: "DELETE" }); toast("Event deleted."); view = { name: "list" }; render(); }
    catch (e) { toast(e.message); }
  };
  const pedit = document.getElementById("pedit");
  ROOT.querySelectorAll("[data-edit]").forEach((b) => {
    b.onclick = () => {
      const p = presenters.find((x) => x.id === b.dataset.edit);
      if (!p) return;
      pedit.dataset.presenter = p.id;
      document.getElementById("pe-first").value = p.first ?? "";
      document.getElementById("pe-last").value = p.last ?? "";
      document.getElementById("pe-email").value = p.email ?? "";
      document.getElementById("pe-org").value = p.organization ?? "";
      // Say up front what a correction will and won't reach.
      const sent = (p.mail ?? []).some((m) => m.type !== "called");
      document.getElementById("pe-warn").innerHTML =
        p.status === "approved"
          ? `<div class="note" style="margin-top:14px">This agreement is already final and filed. Correcting it here does not
             change the PDF in SharePoint — use <b>Rebuild the PDF</b> on their details screen if the document itself is wrong.</div>`
          : sent
            ? `<div class="note" style="margin-top:14px">Their link has already been emailed to the old address. After saving,
               use <b>Email link</b> on their row to send it to the corrected one.</div>`
            : "";
      pedit.showModal();
      document.getElementById("pe-email").focus();
    };
  });
  pedit?.addEventListener("close", async () => {
    if (pedit.returnValue !== "save") return;
    const id = pedit.dataset.presenter;
    const body = {
      first: document.getElementById("pe-first").value.trim(),
      last: document.getElementById("pe-last").value.trim(),
      email: document.getElementById("pe-email").value.trim(),
      organization: document.getElementById("pe-org").value.trim(),
    };
    try {
      const out = await api(`/events?id=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(id)}`,
        { method: "PUT", body: JSON.stringify(body) });
      toast(out.emailChanged ? `Corrected — their link now goes to ${out.presenter.email}.` : "Corrected.");
      render();
    } catch (e) { toast(e.message); }
  });

  ROOT.querySelectorAll("[data-remove]").forEach((b) => {
    b.onclick = async () => {
      const p = presenters.find((x) => x.id === b.dataset.remove);
      if (!confirm(`Remove ${p.first} ${p.last}? Their link stops working.`)) return;
      try { await api(`/events?id=${encodeURIComponent(ev.id)}&presenter=${encodeURIComponent(p.id)}`, { method: "DELETE" }); toast("Removed."); render(); }
      catch (e) { toast(e.message); }
    };
  });
  ROOT.querySelectorAll("[data-invite]").forEach((b) => { b.onclick = () => invite(ev.id, [b.dataset.invite], b.textContent === "Remind"); });
  ROOT.querySelectorAll("[data-pdf]").forEach((b) => { b.onclick = () => openPdf(ev.id, b.dataset.pdf); });
  ROOT.querySelectorAll("[data-copy]").forEach((b) => {
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; }
      catch { prompt("Copy this link:", b.dataset.copy); }
      setTimeout(() => (b.textContent = "Copy link"), 1600);
    };
  });
  ROOT.querySelectorAll("[data-review]").forEach((b) => {
    b.onclick = () => { view = { name: "review", eventId: ev.id, presenterId: b.dataset.review }; render(); };
  });
}

/* ---------- the desk's own checklist ---------- */

/** "120 days before day one" / "21 days after" / "on day one". */
function offsetWords(n) {
  if (!Number.isFinite(n)) return "no date yet";
  if (n === 0) return "on day one";
  return n > 0 ? `${n} day${n === 1 ? "" : "s"} before` : `${-n} day${n === -1 ? "" : "s"} after it ends`;
}

/**
 * The standard list has moved on since this event's list was made: say what
 * updating would do, job by job, before Andrew presses anything.
 */
function behindNote(b) {
  if (!b?.any) return "";
  const lines = [];
  if (b.added.length) lines.push(`<b>Adds</b> ${b.added.map(esc).join(" · ")}`);
  if (b.renamed.length) lines.push(`<b>Renames</b> ${b.renamed.map((r) => `${esc(r.from)} → ${esc(r.to)}`).join(" · ")}`);
  if (b.removed.length) lines.push(`<b>Takes off</b> ${b.removed.map(esc).join(" · ")} <span class="porg">(not for this kind of event, and not started)</span>`);
  if (b.dated?.length) lines.push(`<b>Gives dates to</b> ${b.dated.map((d) => `${esc(d.what)} (${esc(d.when)})`).join(" · ")}`);
  if (b.reordered) lines.push(`<b>Puts the jobs in order</b>, the order they get done`);
  return `<div class="note" style="margin:0 0 14px">
    <div style="margin-bottom:6px">The standard checklist has changed since this list was made. Updating:</div>
    <ul style="margin:0 0 10px;padding-left:20px">${lines.map((l) => `<li style="margin:0 0 3px">${l}</li>`).join("")}</ul>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="mini gold" id="jsync">Update this list</button>
      <span class="porg">Ticks, dates and "not needed" marks stay as they are.</span></div></div>`;
}

/**
 * The jobs that are ONGIA's. Drawn as its own card under the event so it is
 * never confused with what the presenters owe.
 */
function checklistCard(ev, checklist) {
  if (!checklist) {
    return `<div class="card"><div class="card-head"><div><h2>Your checklist</h2></div></div>
      <div class="card-body"><div class="bad"><b>The checklist could not be loaded.</b> Reload the page.</div></div></div>`;
  }
  const { tasks, counts } = checklist;
  // One focus in a long list: the nearest job that is not already late. The
  // late ones are red already and do not need a second mark.
  const nextId = tasks.find((t) => !t.done && !t.na && !t.late)?.id ?? null;

  const rows = tasks.map((t) => {
    const when = t.na
      ? `<span>not needed for this one</span>`
      : t.scheduled
        ? `<b>${esc(t.dueReadable.replace(/^\w+ /, ""))}</b><span>${esc(t.when ?? offsetWords(t.daysBefore))}${t.late ? ` · ${-t.days} day${t.days === -1 ? "" : "s"} ago` : ""}</span>`
        : t.waiting === "cutoff"
          ? `<b class="nodate">Waits for the hotel cut-off</b><span>${esc(t.when)}; add the cut-off under hotel details</span>`
          : `<b class="nodate">No date yet</b><span>set one on Edit</span>`;
    return `<div class="job${t.na ? " na" : t.done ? " done" : t.late ? " late" : ""}${t.id === nextId ? " next" : ""}">
      <input type="checkbox" data-tick="${esc(t.id)}"${t.done ? " checked" : ""}${t.na ? " disabled" : ""} aria-label="${esc(t.what)}">
      <div class="what">${esc(t.what)}${t.auto ? `<span class="auto" title="The desk sends this one — you do not have to">sends itself</span>` : ""}</div>
      <div class="when">${when}</div>
      <div class="jact"><button data-jna="${esc(t.id)}" data-was="${t.na ? "1" : "0"}" title="${t.na ? "Put this job back on the event" : "This event does not need this job"}">${t.na ? "Put back" : "Not needed"}</button>
        <button data-jedit="${esc(t.id)}" title="Change the wording or the date">Edit</button>
        <button data-jdel="${esc(t.id)}" title="Remove this job for good" aria-label="Remove ${esc(t.what)}">&#10005;</button></div>
    </div>`;
  }).join("");

  const summary = counts.total || counts.na
    ? `<span class="chipstat${counts.total && counts.done === counts.total ? " good" : ""}"><b>${counts.done}<small>/${counts.total}</small></b>done</span>`
      + (counts.late ? `<span class="chipstat stop"><b>${counts.late}</b>overdue</span>` : "")
      + (counts.soon ? `<span class="chipstat hot"><b>${counts.soon}</b>in the next two weeks</span>` : "")
      + (counts.undated ? `<span class="chipstat"><b>${counts.undated}</b>with no date yet</span>` : "")
      + (counts.na ? `<span class="chipstat"><b>${counts.na}</b>not needed</span>` : "")
    : "";

  return `<div class="card">
    <div class="card-head"><div><h2>Your checklist</h2>
      <div class="s">What ONGIA owes this event, not what the presenters owe, in the order the jobs get done. Every date counts back from day one, so moving the training moves the list.</div>
      <div class="jobsum" style="margin-top:8px">${summary}</div></div>
      <div class="cardacts"><button class="mini jobadd" id="jadd">Add a job</button>
        ${tasks.length ? "" : `<button class="mini jobadd" id="jseed">Use the standard list</button>`}</div></div>
    <div class="card-body">
      ${tasks.length ? behindNote(checklist.behind) : ""}
      ${tasks.length ? `<div class="jobs">${rows}</div>` : `<div class="empty">Nothing on the list yet.</div>`}
      <p class="hint jobadd">The standard list new events start from is on <b>The year</b> screen.</p>
    </div></div>`;
}

/** Ticking, adding, changing and removing — each one writes and redraws. */
function wireChecklist(ev) {
  const send = async (path, init) => {
    try { await api(path, init); render(); }
    catch (e) { toast(e.message); render(); }
  };
  ROOT.querySelectorAll("[data-tick]").forEach((box) => {
    box.onchange = () => send(`/tasks?event=${encodeURIComponent(ev.id)}&id=${encodeURIComponent(box.dataset.tick)}`,
      { method: "PUT", body: JSON.stringify({ done: box.checked }) });
  });
  ROOT.querySelectorAll("[data-jna]").forEach((b) => {
    b.onclick = () => send(`/tasks?event=${encodeURIComponent(ev.id)}&id=${encodeURIComponent(b.dataset.jna)}`,
      { method: "PUT", body: JSON.stringify({ na: b.dataset.was !== "1" }) });
  });
  ROOT.querySelectorAll("[data-jdel]").forEach((b) => {
    b.onclick = () => {
      if (!confirm("Remove this job from the checklist?")) return;
      send(`/tasks?event=${encodeURIComponent(ev.id)}&id=${encodeURIComponent(b.dataset.jdel)}`, { method: "DELETE" });
    };
  });

  const dlg = document.getElementById("jobdlg");
  if (!dlg) return;
  let editing = null;
  const fill = (task) => {
    editing = task?.id ?? null;
    document.getElementById("jd-title").textContent = task ? "Change this job" : "Add a job";
    document.getElementById("j-what").value = task?.what ?? "";
    // An undated job shows an empty box, never 0: 0 means "on day one", and a
    // save to fix the wording would quietly give it that date.
    document.getElementById("j-days").value = Number.isFinite(task?.daysBefore) ? Math.abs(task.daysBefore) : "";
    document.getElementById("j-when").value = task?.from === "cutoff" ? "cutoff" : task && task.daysBefore < 0 ? "after" : "before";
    document.getElementById("j-why").textContent = "";
  };
  document.getElementById("jadd").onclick = () => { fill(null); dlg.showModal(); document.getElementById("j-what").focus(); };
  const seed = document.getElementById("jseed");
  if (seed) seed.onclick = () => send(`/tasks?event=${encodeURIComponent(ev.id)}&seed=1`, { method: "POST" });
  const sync = document.getElementById("jsync");
  if (sync) sync.onclick = async () => {
    sync.disabled = true;
    try {
      const out = await api(`/tasks?event=${encodeURIComponent(ev.id)}&sync=1`, { method: "POST" });
      const c = out.changes ?? {};
      const said = [c.added?.length ? `${c.added.length} added` : "", c.renamed?.length ? `${c.renamed.length} renamed` : "",
        c.removed?.length ? `${c.removed.length} taken off` : "", c.dated?.length ? `${c.dated.length} given a date` : ""].filter(Boolean);
      toast(`Checklist updated${said.length ? `: ${said.join(", ")}` : ""}.`);
    } catch (e) { toast(e.message); }
    render();
  };
  ROOT.querySelectorAll("[data-jedit]").forEach((b) => {
    b.onclick = () => { fill((data_checklist()?.tasks ?? []).find((t) => t.id === b.dataset.jedit)); dlg.showModal(); };
  });

  document.getElementById("j-save").onclick = async (e) => {
    e.preventDefault();
    const what = document.getElementById("j-what").value.trim();
    const raw = document.getElementById("j-days").value.trim();
    const n = Number(raw);
    const why = document.getElementById("j-why");
    if (!what) { why.textContent = "What is the job?"; return; }
    // Blank is allowed: most jobs are done in order, not by a date.
    if (raw !== "" && !Number.isFinite(n)) { why.textContent = "That is not a number of days. Leave it empty if there is no date yet."; return; }
    const from = document.getElementById("j-when").value;
    const daysBefore = raw === "" ? null : from === "after" ? -Math.abs(n) : Math.abs(n);
    const body = JSON.stringify({ what, daysBefore, from: from === "cutoff" ? "cutoff" : "" });
    dlg.close();
    await send(editing
      ? `/tasks?event=${encodeURIComponent(ev.id)}&id=${encodeURIComponent(editing)}`
      : `/tasks?event=${encodeURIComponent(ev.id)}`, { method: editing ? "PUT" : "POST", body });
  };
}

/** Saved letters, fetched before the event form draws so it can offer them. */
let LETTER_CHOICES = [];
const loadLetterChoices = async () => { LETTER_CHOICES = (await api("/letters").catch(() => ({ letters: [] }))).letters ?? []; };

/** Same rule as the server: a letter with "only for" words fits an event whose title has them as whole words. */
const squash = (s) => String(s ?? "").toLowerCase().replace(/\s+/g, " ").trim();
const letterFits = (l, title) => {
  const words = squash(l.onlyFor);
  return !words || new RegExp(`(^|[^a-z0-9])${words.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}($|[^a-z0-9])`).test(squash(title));
};

/**
 * The choices for one letter box on the event form: the letters that fit this
 * title. One already chosen that no longer fits — the event was renamed — stays
 * in the list, marked, so a save never quietly swaps it for something else.
 */
function letterOptions(kind, title, chosen) {
  const mine = LETTER_CHOICES.filter((l) => (kind === "survey") === (l.kind === "survey"));
  return `<option value="">None — don't send one</option>` + mine
    .filter((l) => letterFits(l, title) || l.id === chosen)
    .map((l) => `<option value="${esc(l.id)}"${l.id === chosen ? " selected" : ""}>${esc(l.name)}${
      !letterFits(l, title) ? ` (only for ${esc(l.onlyFor)} events)` : l.problems?.length ? " (needs attention)" : ""}</option>`).join("");
}

/**
 * What the last import or pull said. The card redraws when it finishes, which
 * used to wipe the message before anyone could read it — so it survives one
 * redraw and is cleared on the next visit to the screen.
 */
let GUEST_NOTE = null;

const GUEST_WORDS = {
  ATTENDING: ["done", "coming"],
  NOT_ATTENDING: ["idle", "not coming"],
  IN_WAITLIST: ["wait", "waitlist"],
  WITHDRAWN: ["late", "withdrawn"],
};
const SHOW_GUESTS = 25;

 * Hotel rooms: the rooming list, from the agreements and from anyone added by

const BILL = { ONGIA: ["ongia", "ONGIA pays"], Guest: ["", "guest pays"], "To confirm": ["tbc", "to confirm"] };
const shortDate = (iso) => fmtDate(iso).replace(/ \d{4}$/, "");

function hotelStrip(ev, C) {
  const h = ev.hotel ?? {};
  // The job counted from the cut-off — names to the hotel — said next to it.
  const namesDue = () => {
    const j = (CHECKLIST?.tasks ?? []).find((t) => t.from === "cutoff" && !t.na);
    if (!j || !j.due) return "";
    return j.done ? `names sent ✓` : `<span${j.late ? ' style="color:var(--late)"' : ""}>names due ${esc(fmtDate(j.due))}</span>`;
  };
  const bits = [
    h.name ? `<b>${esc(h.name)}</b>` : `<span style="color:var(--muted)">No hotel set yet</span>`,
    h.cutoff ? `cut-off ${esc(fmtDate(h.cutoff))}` : "",
    namesDue(),
    h.foodAndBev ? `food and beverage numbers ${esc(fmtDate(h.foodAndBev))}` : "",
  ].filter(Boolean);
  const read = C?.read, file = C?.file;
  const contract = !file ? "No contract uploaded"
    : read?.state === "reading" ? `<span class="spin" aria-hidden="true" style="width:12px;height:12px"></span>Claude is reading ${esc(file.name)}…`
    : read?.state === "done" ? `Contract read ${esc(fmtDate(read.at.slice(0, 10)))}`
    : `Contract on file`;
  return `<div class="hstrip"><div class="hs-what">${bits.join(" · ")}<div class="hs-ct">${contract}</div></div>
    <div class="hs-acts"><button class="mini" data-hgo="contract">${file ? "Hotel contract" : "Upload the hotel contract"}</button>
      <button class="mini ghost" data-hgo="hotel">Edit hotel details</button></div></div>`;
}

/** Names compared the way the server compares them: case, accents and spacing do not count. */
const sameName = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]+/g, " ").trim();

/** Who a room is for — the same four the server takes, in Andrew's order. */
const GUEST_TYPES = ["Board Member", "Presenter", "Volunteer", "ONGIA Guest"];

/**
 * The only dates offered for a guest's room: three days before the training to
 * three days after it. A check-in can't be the last of them, nor a check-out
 * the first. Nothing is picked until Andrew picks it.
 */
function guestDays(win, end, ev, chosen = "") {
  if (!win) return `<option value="">Set the training dates first</option>`;
  const days = [];
  for (let d = win.from; d <= win.to; d = new Date(Date.parse(d) + 86400000).toISOString().slice(0, 10)) days.push(d);
  const offer = end === "in" ? days.slice(0, -1) : days.slice(1);
  // The training days stand out in the list: grouped under their own heading
  // and labelled, which every browser shows (a Mac will not colour a menu item;
  // where a browser will, they are red as well).
  const first = ev?.dayOne, last = ev?.lastDay && ev.lastDay >= ev.dayOne ? ev.lastDay : ev?.dayOne;
  const n = (d) => Math.round((Date.parse(d) - Date.parse(first)) / 86400000) + 1;
  const opt = (d) => {
    const training = first && d >= first && d <= last;
    return `<option value="${d}"${d === chosen ? " selected" : ""}${training ? ' style="color:#b3261e;font-weight:700"' : ""}>${esc(fmtDate(d))}${training ? ` · training day ${n(d)}` : ""}</option>`;
  };
  const group = (label, list) => (list.length ? `<optgroup label="${label}">${list.map(opt).join("")}</optgroup>` : "");
  // A date saved earlier that is outside today's window is still shown, so an edit never quietly changes it.
  const stray = chosen && !offer.includes(chosen) ? `<option value="${chosen}" selected>${esc(fmtDate(chosen))} (outside the window)</option>` : "";
  return `<option value=""${chosen ? "" : " selected"}>Pick a date</option>${stray}`
    + group("Before the training", offer.filter((d) => first && d < first))
    + group("Training days", offer.filter((d) => first && d >= first && d <= last))
    + group("After the training", offer.filter((d) => first && d > last));
}

function roomingCard(ev, R, C = null) {

  const conf = R.rows.filter((r) => r.confirmed);

  };
  const sent = R.sent
    ? `<p class="roomsent">Sent to <b>${esc(R.sent.to)}</b> on ${esc(fmtDate(R.sent.at.slice(0, 10)))} (${R.sent.count} room${R.sent.count === 1 ? "" : "s"}).</p>
       ${R.changes?.length ? `<div class="roomchg"><b>Since then:</b><ul>${R.changes.map((c) => `<li>${esc(c.text)}</li>`).join("")}</ul>
         The hotel does not know yet. Send the update and the email will list these changes.</div>` : ""}`
    : "";
  const waiting = R.waiting.length
    ? `<p class="roomwait">Not answered yet, so they may still need a room: ${R.waiting.map((w) => esc(w.name)).join(", ")}.</p>` : "";
  return `<div class="card" id="roomcard">
    <div class="card-head"><div><h2>Hotel rooms</h2>
      <div class="s">From the presenters' agreements — the dates and billing the board approved — plus anyone you add.${R.hotel.name ? ` At ${esc(R.hotel.name)}.` : ""}</div>
      ${conf.length ? `<div class="jobsum" style="margin-top:8px"><span class="chipstat"><b>${conf.length}</b>room${conf.length === 1 ? "" : "s"}</span>
        <span class="chipstat"><b>${nightsAll}</b>room night${nightsAll === 1 ? "" : "s"}</span>
        ${R.rows.length > conf.length ? `<span class="chipstat hot"><b>${R.rows.length - conf.length}</b>awaiting approval</span>` : ""}</div>` : ""}</div>
      <div class="cardacts">${R.rows.length ? `<button class="mini" id="rm-csv">Download spreadsheet</button>
        <button class="mini solid" id="rm-send">${R.sent ? "Email the update to the hotel" : "Email it to the hotel"}</button>` : ""}</div></div>
    <div class="card-body">
      ${hotelStrip(ev, C)}
      ${sent}
      ${R.rows.length ? `<div class="rooms">${R.rows.map(row).join("")}</div>`

function wireRooming(ev, R) {
  document.querySelectorAll("[data-hgo]").forEach((b) => {
    b.onclick = () => { view = { name: "edit", eventId: ev.id, focus: b.dataset.hgo }; render(); };
  });
  if (!R) return;
  const q = `/rooming?event=${encodeURIComponent(ev.id)}`;
  const keys = () => [...document.querySelectorAll("[data-room]:checked")].map((b) => b.dataset.room);

  const csv = document.getElementById("rm-csv");
  if (csv) csv.onclick = async () => {
    try {
      const res = await fetch(`/api${q}&csv=1&keys=${encodeURIComponent(keys().join(","))}`, { headers: { "x-admin-key": KEY } });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `Download failed (${res.status})`);
      const url = URL.createObjectURL(await res.blob());
      const a = Object.assign(document.createElement("a"), { href: url, download: `rooming-list-${ev.title.replace(/[^\w]+/g, "-").toLowerCase()}.csv` });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30_000);
    } catch (e) { toast(e.message); }
  };

  const open = document.getElementById("rm-send");
  if (open) open.onclick = async () => {
    const chosen = keys();
    if (!chosen.length) { toast("Tick at least one room to send."); return; }
    const dlg = document.getElementById("rmdlg"), said = document.getElementById("rm-said");
    said.textContent = "";
    try {
      const pv = await api(`${q}&preview=1`, { method: "POST", body: JSON.stringify({ keys: chosen }) });
      document.getElementById("rm-to").value = pv.to || "";
      document.getElementById("rm-cc").textContent = `${pv.rows} room${pv.rows === 1 ? "" : "s"}, with the list attached as a spreadsheet.${pv.cc ? ` A copy goes to ${pv.cc}, and the hotel's reply comes back to them.` : ""}`;
      document.getElementById("rm-frame").srcdoc = pv.html;
      dlg.showModal();
    } catch (e) { toast(e.message); }
  };
  const go = document.getElementById("rm-go");
  if (go) go.onclick = async () => {
    const said = document.getElementById("rm-said"), to = document.getElementById("rm-to").value.trim();
    if (!/@/.test(to)) { said.textContent = "Type the hotel's address."; return; }
    go.disabled = true; said.textContent = `Sending to ${to}…`;
    try {
      const out = await api(`${q}&send=1`, { method: "POST", body: JSON.stringify({ keys: keys(), to }) });
      document.getElementById("rmdlg").close();
      toast(`Sent to ${out.to}.${out.ticked ? ` "${out.ticked}" is ticked.` : ""}`);
      render();
    } catch (e) { said.textContent = e.message; go.disabled = false; }
  };

  const saveGuests = async (list) => {
    const said = document.getElementById("rg-said");
    try { await api(q, { method: "PUT", body: JSON.stringify({ guests: list }) }); render(); }
    catch (e) { said.textContent = e.message; said.style.color = "var(--late)"; }
  };
  const add = document.getElementById("rg-add");
  if (add) add.onclick = (e) => {
    e.preventDefault();
    saveGuests([...R.guests, { name: document.getElementById("rg-name").value, type: document.getElementById("rg-type").value,
      checkIn: document.getElementById("rg-in").value, checkOut: document.getElementById("rg-out").value, billing: document.getElementById("rg-bill").value }]);
  };

  // The blank sheet: the same columns as the form, ready for Excel.
  const blank = document.getElementById("rg-blank");
  if (blank) blank.onclick = (e) => {
    e.preventDefault();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeffName,Type,Check-in,Check-out,Who pays,Note\r\n"], { type: "text/csv" }));
    a.download = `hotel-rooms-${ev.title.replace(/[^\w]+/g, "-").replace(/^-|-$/g, "").toLowerCase()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  // A spreadsheet is read first and shown; nothing is added until Andrew says so.
  const up = document.getElementById("rg-up"), fileIn = document.getElementById("rg-file"), box = document.getElementById("rg-read");
  if (up && fileIn && box) {
    up.onclick = (e) => { e.preventDefault(); fileIn.click(); };
    fileIn.onchange = async () => {
      const f = fileIn.files?.[0];
      fileIn.value = "";
      if (!f) return;
      box.innerHTML = `<p class="gread">Reading ${esc(f.name)}…</p>`;
      const csv = await f.text();
      try {
        const out = await api(`${q}&upload=1`, { method: "POST", body: JSON.stringify({ csv }) });
        const list = (xs, fmt) => `<ul>${xs.map((x) => `<li>${fmt(x)}</li>`).join("")}</ul>`;
        const types = GUEST_TYPES.map((t) => [t, out.add.filter((g) => g.type === t).length]).filter(([, n]) => n).map(([t, n]) => `${n} ${t}${n === 1 ? "" : "s"}`).join(", ");
        box.innerHTML = `<div class="note gread" style="margin-top:12px">
          <b>${out.add.length} ${out.add.length === 1 ? "person" : "people"} to add</b>${types ? ` (${esc(types)})` : ""}.
          ${out.add.length ? list(out.add, (g) => `${esc(g.name)} · ${esc(g.type)} · ${esc(shortDate(g.checkIn))} → ${esc(shortDate(g.checkOut))}${g.board ? " · on the board, ONGIA pays" : g.billing === "Guest" ? " · guest pays" : ""}`) : ""}
          ${out.problems.length ? `<b style="color:var(--late)">${out.problems.length} row${out.problems.length === 1 ? "" : "s"} not added, fix ${out.problems.length === 1 ? "it" : "them"} in the sheet and upload again:</b>
            ${list(out.problems, (p) => `Row ${p.line}${p.name ? `, ${esc(p.name)}` : ""}: ${esc(p.why)}`)}` : ""}
          ${out.skipped.length ? `<b>${out.skipped.length} left out, already on the list:</b>${list(out.skipped, (p) => `Row ${p.line}, ${esc(p.name)} (${esc(p.why)})`)}` : ""}
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
            ${out.add.length ? `<button class="mini gold" id="rg-save">Add ${out.add.length === 1 ? "this person" : `these ${out.add.length}`}</button>` : ""}
            <button class="mini ghost" id="rg-cancel">${out.add.length ? "Cancel" : "Close"}</button></div></div>`;
        document.getElementById("rg-cancel").onclick = (e) => { e.preventDefault(); box.innerHTML = ""; };
        const save = document.getElementById("rg-save");
        if (save) save.onclick = async (e) => {
          e.preventDefault();
          save.disabled = true;
          try {
            const done = await api(`${q}&upload=1&save=1`, { method: "POST", body: JSON.stringify({ csv }) });
            toast(`${done.added} added to the rooming list.`);
            render();
          } catch (err) { save.disabled = false; toast(err.message); }
        };
      } catch (err) { box.innerHTML = `<div class="bad">${esc(err.message)}</div>`; }
    };
  }
  // A board name always means ONGIA pays: the box says so and cannot be changed.
  const boardLock = (nameId, billId, noteId) => {
    const nameEl = document.getElementById(nameId), bill = document.getElementById(billId), note = document.getElementById(noteId);
    if (!nameEl || !bill) return;
    const check = () => {
      const on = (R.board ?? []).some((n) => sameName(n) === sameName(nameEl.value) && sameName(n));
      if (on) bill.value = "ONGIA";
      bill.disabled = on;
      if (note) note.hidden = !on;
    };
    nameEl.addEventListener("input", check);
    check();
    return check;
  };
  boardLock("rg-name", "rg-bill", "rg-boardnote");
  const lockEdit = boardLock("ge-name", "ge-bill", "ge-boardnote");

  // Edit someone added on the desk, from their row on the list.
  const gd = document.getElementById("gedlg");
  let editing = null;
  document.querySelectorAll("[data-gedit]").forEach((b) => {
    b.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();          // the row is a label: do not tick or untick it
      const g = R.guests.find((x) => x.id === b.dataset.gedit);
      if (!g || !gd) return;
      editing = g.id;
      document.getElementById("ge-name").value = g.name;
      document.getElementById("ge-type").innerHTML = (g.type ? "" : `<option value="" selected>Pick one</option>`)
        + GUEST_TYPES.map((t) => `<option${t === g.type ? " selected" : ""}>${t}</option>`).join("");
      document.getElementById("ge-bill").value = g.billing === "Guest" ? "Guest" : "ONGIA";
      document.getElementById("ge-in").innerHTML = guestDays(R.window, "in", ev, g.checkIn);
      document.getElementById("ge-out").innerHTML = guestDays(R.window, "out", ev, g.checkOut);
      document.getElementById("ge-note").value = g.note || "";
      document.getElementById("ge-said").textContent = "";
      lockEdit?.();
      gd.showModal();
    };
  });
  const geSave = document.getElementById("ge-save");
  if (geSave) geSave.onclick = async () => {
    const said = document.getElementById("ge-said");
    const list = R.guests.map((g) => (g.id !== editing ? g : { ...g,
      name: document.getElementById("ge-name").value, type: document.getElementById("ge-type").value,
      billing: document.getElementById("ge-bill").value, checkIn: document.getElementById("ge-in").value,
      checkOut: document.getElementById("ge-out").value, note: document.getElementById("ge-note").value }));
    geSave.disabled = true;
    try { await api(q, { method: "PUT", body: JSON.stringify({ guests: list }) }); gd.close(); toast("Saved."); render(); }
    catch (err) { said.textContent = err.message; }
    geSave.disabled = false;
  };
  const geDel = document.getElementById("ge-del");
  if (geDel) geDel.onclick = async () => {
    const g = R.guests.find((x) => x.id === editing);
    if (!g || !confirm(`Take ${g.name} off the rooming list?`)) return;
    try { await api(q, { method: "PUT", body: JSON.stringify({ guests: R.guests.filter((x) => x.id !== editing) }) }); gd.close(); render(); }
    catch (err) { document.getElementById("ge-said").textContent = err.message; }
  };

  // Who someone is can be changed in place: a slip in a spreadsheet, or a person saved before the four types.
  document.querySelectorAll("[data-rmtype]").forEach((sel) => {
    sel.onchange = () => saveGuests(R.guests.map((g) => (g.id === sel.dataset.rmtype ? { ...g, type: sel.value } : g)));
  });
  document.querySelectorAll("[data-rmdel]").forEach((b) => {
    b.onclick = (e) => { e.preventDefault(); saveGuests(R.guests.filter((g) => g.id !== b.dataset.rmdel)); };
  });
}

/** Who is coming to this event, however they got on the list. */
function attendeesCard(ev, guests) {
  if (!guests) {
    return `<div class="card"><div class="card-head"><div><h2>Who is coming</h2></div></div>
      <div class="card-body"><div class="bad"><b>The attendee list could not be loaded.</b> Reload the page.</div></div></div>`;
  }
  const { people, counts, syncedAt, wix } = guests;
  const chip = (n, cls, word) => (n ? `<span class="chipstat${cls}"><b>${n}</b>${word}</span>` : "");

  const rows = people.slice(0, SHOW_GUESTS).map((p) => {
    const [cls, word] = GUEST_WORDS[p.status] ?? ["idle", String(p.status ?? "").toLowerCase()];
    const name = [p.first, p.last].filter(Boolean).join(" ") || p.email;
    return `<div class="guest${p.status === "WITHDRAWN" ? " out" : ""}">
      <div class="gw"><div class="gn">${esc(name)}</div><div class="ge">${esc(p.email)}${p.organization ? " · " + esc(p.organization) : ""}</div></div>
      <span class="pill ${cls}" style="font-size:10px;padding:3px 9px">${esc(word)}</span>
      <span class="src" title="${p.source === "wix" ? "Registered through the website" : "Added by hand or from a spreadsheet"}">${p.source === "wix" ? "Wix" : "by hand"}</span>
    </div>`;
  }).join("");

  // Linked to Wix, or not — the bar says which and offers the next move.
  const bar = wix?.eventId
    ? `<div class="wixbar"><span class="grow">Linked to <b>${esc(wix.title || "a Wix event")}</b>${syncedAt ? ` · guests pulled ${esc(fmtDate(syncedAt.slice(0, 10)))}` : " · not pulled yet"}</span>
        <button class="mini" id="g-sync">Pull from Wix now</button>
        <button class="mini ghost" id="g-unlink">Unlink</button></div>`
    : `<div class="wixbar"><span class="grow">Not linked to the website. Registrations will not arrive on their own.</span>
        <button class="mini" id="g-link">Link to a Wix event</button></div>`;

  return `<div class="card">
    <div class="card-head"><div><h2>Who is coming</h2>
      <div class="s">The people the welcome letter and the survey go to. Pulled from the website nightly, or imported from a spreadsheet.</div>
      <div class="jobsum" style="margin-top:8px">
        ${chip(counts.attending, " good", "coming")}
        ${chip(counts.waitlist, " hot", "on the waitlist")}
        ${chip(counts.notAttending, "", "not coming")}
        ${chip(counts.withdrawn, " stop", "withdrew")}
        ${counts.total ? `<span class="chipstat"><b>${counts.fromWix}</b>from the website</span>` : ""}
        ${counts.byHand ? `<span class="chipstat"><b>${counts.byHand}</b>added by hand</span>` : ""}
      </div></div>
      <div class="cardacts"><button class="mini" id="g-csv">Import a spreadsheet</button>
        <input type="file" id="g-file" accept=".csv,text/csv,text/plain" hidden></div></div>
    <div class="card-body">
      ${bar}
      ${lettersStrip(guests.letters)}
      <div id="g-said">${GUEST_NOTE
        ? `<div class="${GUEST_NOTE.bad ? "bad" : "note"}" style="margin:0 0 12px">${esc(GUEST_NOTE.msg)}</div>` : ""}</div>
      ${people.length ? `<div class="guests">${rows}</div>
        ${people.length > SHOW_GUESTS ? `<div class="guestmore">and ${people.length - SHOW_GUESTS} more — the full list prints and is what the letters use</div>` : ""}`
        : `<div class="empty">Nobody on the list yet. Link the event to your website, or import a spreadsheet.</div>`}
    </div></div>`;
}

/** One line per automatic letter: which, when, to how many — or what is holding it back. */
function lettersStrip(L) {
  if (!L) return "";
  if (L.welcome?.off) return `<div class="lstrip"><div class="lrow"><b>Emails to attendees</b><span>off for this event — no welcome
    letter, survey or hotel reminder goes. Edit the event to turn them on.</span></div></div>`;
  const row = (kind, label) => {
    const x = L[kind];
    if (!x?.chosen) return `<div class="lrow"><b>${label}</b><span>none chosen — edit the event to pick one, or it will not go</span></div>`;
    const when = x.on ? fmtDate(x.on) : "no date on the checklist";
    if (x.problems.length) return `<div class="lrow bad"><b>${label}</b><span>${esc(x.name)} · held back: ${esc(x.problems[0])}</span></div>`;
    if (x.had && x.had >= x.reaches) return `<div class="lrow good"><b>${label}</b><span>${esc(x.name)} · sent to all ${x.had}</span></div>`;
    const tail = x.why === "due now" ? "goes tonight" : /^not until/.test(x.why) ? `goes ${esc(when)}` : esc(x.why);
    return `<div class="lrow"><b>${label}</b><span>${esc(x.name)} · ${tail} · ${x.reaches} ${x.reaches === 1 ? "person" : "people"}${x.had ? `, ${x.had} already had it` : ""}</span></div>`;
  };
  return `<div class="lstrip">${row("welcome", "Welcome letter")}${row("survey", "Survey")}</div>`;
}

function wireAttendees(ev) {
  const said = document.getElementById("g-said");
  if (!said) return;
  const note = (msg, bad = false) => {
    GUEST_NOTE = { msg, bad };
    said.innerHTML = `<div class="${bad ? "bad" : "note"}" style="margin:0 0 12px">${esc(msg)}</div>`;
  };
  const run = async (path, init, done) => {
    try { const out = await api(path, init); if (done) note(done(out)); setTimeout(render, 900); }
    catch (e) { note(e.message, true); }
  };

  const sync = document.getElementById("g-sync");
  if (sync) sync.onclick = () => {
    sync.disabled = true; sync.textContent = "Pulling…";
    run(`/wix?event=${encodeURIComponent(ev.id)}`, { method: "POST" },
      (o) => `Pulled ${o.read} from the website — ${o.added} new, ${o.changed} changed${o.withdrawn ? `, ${o.withdrawn} withdrew` : ""}.`);
  };

  const unlink = document.getElementById("g-unlink");
  if (unlink) unlink.onclick = () => {
    if (!confirm("Stop pulling registrations for this event? The people already on the list are kept.")) return;
    run(`/wix?event=${encodeURIComponent(ev.id)}&unlink=1`, { method: "PUT" }, () => "Unlinked.");
  };

  const link = document.getElementById("g-link");
  const dlg = document.getElementById("wixdlg");
  if (link && dlg) link.onclick = async () => {
    const list = document.getElementById("wixlist");
    list.innerHTML = `<p class="hint">Asking your website…</p>`;
    dlg.showModal();
    try {
      const { events } = await api("/wix?events=1");
      if (!events.length) { list.innerHTML = `<p class="hint">Your website has no events on it yet.</p>`; return; }
      list.innerHTML = `<div class="wixev">${events.map((w) => `
        <button type="button" data-wix="${esc(w.id)}"${w.linkedTo ? " disabled" : ""}>
          <b>${esc(w.title)}</b>
          <span class="ws">${esc(w.dayOne ? fmtDate(w.dayOne) : "no date")}${w.city ? " · " + esc(w.city) : ""}${w.registered !== null ? ` · ${w.registered} registered` : ""}
            ${w.linkedTo ? ` · already linked to ${esc(w.linkedTo.title)}` : ""}</span>
        </button>`).join("")}</div>`;
      list.querySelectorAll("[data-wix]").forEach((b) => {
        b.onclick = async () => {
          dlg.close();
          run(`/wix?event=${encodeURIComponent(ev.id)}&link=${encodeURIComponent(b.dataset.wix)}`, { method: "PUT" },
            (o) => `Linked. Pulled ${o.read} registration${o.read === 1 ? "" : "s"} straight away.`);
        };
      });
    } catch (e) {
      list.innerHTML = `<div class="bad">${esc(e.message)}</div>`;
    }
  };

  // A spreadsheet goes up as plain text; the desk works out the columns.
  const pick = document.getElementById("g-csv"), file = document.getElementById("g-file");
  if (pick && file) {
    pick.onclick = () => file.click();
    file.onchange = async () => {
      const f = file.files?.[0];
      if (!f) return;
      note(`Reading ${f.name}…`);
      try {
        const out = await api(`/attendees?event=${encodeURIComponent(ev.id)}&csv=1`,
          { method: "POST", headers: { "content-type": "text/csv" }, body: await f.text() });
        const n = out.skipped?.length ?? 0;
        const skipped = n ? ` ${n} row${n === 1 ? " had" : "s had"} no usable email and ${n === 1 ? "was" : "were"} left out.` : "";
        note(`${out.added} added, ${out.changed} updated.${skipped}`);
        setTimeout(render, 1400);
      } catch (e) { note(e.message, true); }
      file.value = "";
    };
  }
}

/* ---------- letters ---------- */

/**
 * Saved letters: written once, picked by every event that uses them. The form
 * is built once per letter and never rebuilt while typing — only the preview
 * and the problem list redraw — so the caret stays where it is.
 */
function lettersScreen(data, events, pickId = null) {
  BARRIGHT.innerHTML = `<button class="chip" id="back">Events</button>`;
  document.getElementById("back").onclick = () => { view = { name: "list" }; render(); };
  const letters = data.letters;
  const blanks = data.blanks;
  const upcoming = events.filter((e) => (e.lastDay || e.dayOne) >= todayIso()).sort((a, b) => a.dayOne.localeCompare(b.dayOne));
  const pickable = upcoming.length ? upcoming : events;
  let current = letters.find((l) => l.id === pickId) ?? letters.find((l) => l.kind !== "survey") ?? letters[0] ?? null;
  let dirty = false;

  // Events this letter can be used on come first, so the preview opens on one.
  const eventChoices = (l) => {
    const fit = pickable.filter((e) => letterFits(l ?? {}, e.title)), rest = pickable.filter((e) => !letterFits(l ?? {}, e.title));
    return [...fit, ...rest].map((e) => `<option value="${esc(e.id)}">${esc(e.title)} · ${esc(fmtDate(e.dayOne))}</option>`).join("")
      || `<option value="">No events yet</option>`;
  };

  const pickBar = () => `<div class="lpick">${letters.map((l) => `<button data-lpick="${esc(l.id)}" class="${current?.id === l.id ? "on" : ""}">
      ${esc(l.name)} <small style="opacity:.7">${l.kind === "survey" ? "survey" : "welcome"}${l.onlyFor ? ` · ${esc(l.onlyFor)} only` : ""}</small>${l.problems?.length ? `<span class="warn" title="${esc(l.problems[0])}">!</span>` : ""}</button>`).join("")}
      <button data-lpick="">+ New letter</button></div>`;

  const editor = (l) => `
    <div class="field" style="margin-top:0"><label for="l-name">Name</label>
      <input id="l-name" value="${esc(l?.name ?? "")}" placeholder="Welcome — National Gang Summit"></div>
    <div class="row2">
      <div class="field" style="margin:0"><label for="l-kind">Sent as</label>
        <select id="l-kind"><option value="welcome"${l?.kind !== "survey" ? " selected" : ""}>Welcome letter — before the event</option>
          <option value="survey"${l?.kind === "survey" ? " selected" : ""}>Survey — after the event</option></select></div>
      <div class="field" style="margin:0"><label for="l-subject">Subject</label>
        <input id="l-subject" value="${esc(l?.subject ?? "")}" placeholder="Welcome to {event}"></div>
    </div>
    <div class="field"><label for="l-only">Only for events with these words in the title <span style="text-transform:none;letter-spacing:0;font-family:var(--fb)">(optional)</span></label>
      <input id="l-only" value="${esc(l?.onlyFor ?? "")}" placeholder="RBH ITP">
      <p class="hint" style="margin:6px 0 0">Leave it empty for a letter any event can use. Filled in, only events whose title
        has these words can pick it, and it will never go to any other event.</p></div>
    <div class="field"><label for="l-body">The letter</label>
      <textarea id="l-body" spellcheck="true">${esc(l?.body ?? "")}</textarea>
      <p class="hint" style="margin:6px 0 0">A blank line starts a new paragraph. A line in [square brackets] is a note to
        yourself — the letter will not go while one is left in. Click a blank to put it where your cursor is:</p>
      <div class="blanks">${blanks.map((b) => `<button type="button" data-blank="${esc(b.name)}" title="${esc(b.means)}">{${esc(b.name)}}</button>`).join("")}</div></div>
    <div class="row2">
      <div class="field" style="margin:0"><label for="l-blabel">Button words <span style="text-transform:none;letter-spacing:0;font-family:var(--fb)">(optional)</span></label>
        <input id="l-blabel" value="${esc(l?.buttonLabel ?? "")}" placeholder="Take the survey"></div>
      <div class="field" style="margin:0"><label for="l-blink">Button goes to</label>
        <input id="l-blink" value="${esc(l?.buttonLink ?? "")}" placeholder="{surveyLink}"></div>
    </div>
    <div class="actions">
      <button class="btn btn-gold" id="l-save">${l?.id ? "Save the letter" : "Save as a new letter"}</button>
      ${l?.id ? `<button class="btn btn-ghost" id="l-del">Delete</button>` : ""}
      <span class="hint" id="l-said" style="align-self:center"></span>
    </div>
    ${l?.usedBy?.length ? `<p class="hint">Used by ${l.usedBy.map((e) => esc(e.title)).join(", ")}. Saving changes what those events send.</p>` : ""}`;

  const side = `
    <div class="field" style="margin-top:0"><label for="l-event">See it filled in for</label>
      <select id="l-event">${eventChoices(current)}</select></div>
    <p class="lmeta" id="l-meta"></p>
    <div class="lprobs" id="l-probs"></div>
    <div class="lprev"><iframe id="l-frame" title="The email as it will look" sandbox=""></iframe></div>
    <div class="row2" style="margin-top:14px;align-items:end">
      <div class="field" style="margin:0"><label for="l-to">Send a test to</label>
        <input id="l-to" type="email" placeholder="you@ongia.ca"></div>
      <div><button class="btn btn-navy" id="l-test" style="width:100%">Send a test</button></div>
    </div>
    <p class="hint" id="l-tsaid">A test goes to that one address, marked [TEST], and counts as nobody having had the letter.</p>`;

  const draw = () => {
    ROOT.innerHTML = `<div class="card"><div class="card-head"><div><h2>Letters</h2>
        <div class="s">Written once, used by every event that picks them. Blanks in {curly brackets} are filled in for each event and each person.</div></div></div>
      <div class="card-body">${pickBar()}
        <div class="lgrid"><div>${editor(current)}</div><div>${side}</div></div></div></div>`;
    wire();
  };

  const fields = () => ({
    name: document.getElementById("l-name").value,
    kind: document.getElementById("l-kind").value,
    subject: document.getElementById("l-subject").value,
    body: document.getElementById("l-body").value,
    buttonLabel: document.getElementById("l-blabel").value,
    buttonLink: document.getElementById("l-blink").value,
    onlyFor: document.getElementById("l-only").value,
  });

  let timer = null, seq = 0;
  const refresh = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const mine = ++seq;
      const eventId = document.getElementById("l-event")?.value;
      try {
        const out = await api("/letters?preview=1", { method: "POST", body: JSON.stringify({ letter: fields(), eventId }) });
        if (mine !== seq) return;   // a newer keystroke has already asked
        const probs = document.getElementById("l-probs");
        probs.innerHTML = out.problems?.length
          ? out.problems.map((p) => `<div>${esc(p)}</div>`).join("")
          : out.html ? `<div class="lok">Nothing wrong with it. This is exactly what goes out.</div>` : "";
        document.getElementById("l-meta").innerHTML = out.off
          ? `Emails to attendees are off for this event, so this would not go to its <b>${out.to?.count ?? 0}</b> ${(out.to?.count ?? 0) === 1 ? "person" : "people"}.`
          : out.to
          ? `Goes to <b>${out.to.count}</b> ${out.to.count === 1 ? "person" : "people"} on this event${out.when ? `, on <b>${esc(fmtDate(out.when))}</b>` : ""}. Shown addressed to ${esc(out.to.sample)}.`
          : esc(out.note ?? "");
        if (out.html) document.getElementById("l-frame").srcdoc = out.html;
        const ev = events.find((e) => e.id === eventId);
        const to = document.getElementById("l-to");
        if (!to.value && ev?.contact?.email) to.placeholder = ev.contact.email;
      } catch (e) {
        document.getElementById("l-probs").innerHTML = `<div>${esc(e.message)}</div>`;
      }
    }, 350);
  };

  function wire() {
    let lastBox = document.getElementById("l-body");
    for (const id of ["l-name", "l-kind", "l-subject", "l-only", "l-body", "l-blabel", "l-blink"]) {
      const el = document.getElementById(id);
      el.addEventListener("input", () => { dirty = true; refresh(); });
      el.addEventListener("change", () => { dirty = true; refresh(); });
      if (id === "l-subject" || id === "l-body" || id === "l-blink") el.addEventListener("focus", () => { lastBox = el; });
    }
    document.getElementById("l-event").onchange = refresh;

    ROOT.querySelectorAll("[data-blank]").forEach((b) => {
      b.onclick = () => {
        const box = lastBox;
        const at = box.selectionStart ?? box.value.length, end = box.selectionEnd ?? at;
        box.setRangeText(`{${b.dataset.blank}}`, at, end, "end");
        box.focus();
        box.dispatchEvent(new Event("input"));
      };
    });

    ROOT.querySelectorAll("[data-lpick]").forEach((b) => {
      b.onclick = () => {
        if (dirty && !confirm("You have changes that are not saved. Leave them?")) return;
        current = b.dataset.lpick ? letters.find((l) => l.id === b.dataset.lpick) : { kind: "welcome", name: "", subject: "", body: "", buttonLabel: "", buttonLink: "" };
        dirty = false;
        draw();
      };
    });

    document.getElementById("l-save").onclick = async (e) => {
      const btn = e.currentTarget, said = document.getElementById("l-said");
      btn.disabled = true; said.textContent = "Saving…";
      try {
        const out = current?.id
          ? await api(`/letters?id=${encodeURIComponent(current.id)}`, { method: "PUT", body: JSON.stringify(fields()) })
          : await api("/letters", { method: "POST", body: JSON.stringify(fields()) });
        dirty = false;
        view = { name: "letters", pick: out.letter.id };
        toast(out.letter.problems?.length ? "Saved — but it will not send until the problems are fixed." : "Saved.");
        render();
      } catch (err) { said.textContent = err.message; btn.disabled = false; }
    };

    const del = document.getElementById("l-del");
    if (del) del.onclick = async () => {
      if (!confirm(`Delete "${current.name}"?`)) return;
      try { await api(`/letters?id=${encodeURIComponent(current.id)}`, { method: "DELETE" }); toast("Deleted."); view = { name: "letters" }; render(); }
      catch (err) { document.getElementById("l-said").textContent = err.message; }
    };

    document.getElementById("l-test").onclick = async (e) => {
      const btn = e.currentTarget, said = document.getElementById("l-tsaid"), toBox = document.getElementById("l-to");
      const to = toBox.value.trim() || toBox.placeholder;
      if (!/@/.test(to) || to === "you@ongia.ca") { said.textContent = "Type the address the test should go to."; return; }
      btn.disabled = true; said.textContent = `Sending to ${to}…`;
      try {
        await api("/letters?test=1", { method: "POST", body: JSON.stringify({ letter: fields(), eventId: document.getElementById("l-event").value, to }) });
        said.textContent = `Sent to ${to}. It will arrive marked [TEST].`;
      } catch (err) { said.textContent = err.message; }
      btn.disabled = false;
    };
    refresh();
  }

  draw();
}
