<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONGIA Presenter Agreement</title>
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<meta name="theme-color" content="#0e1a35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Oswald:wght@400;500;600&display=swap">
<style>
  /* ONGIA's palette, softened: this is a form a non-technical presenter fills
     on a phone, not a page that has to impress anyone. */
  :root {
    color-scheme: light;
    --paper:#f2efe8; --card:#fafaf7; --sunk:#edeae2;
    --ink:#12161f; --ink-mid:#2c3448; --muted:#767f92;
    --navy:#1a2f5e; --navy-deep:#0e1a35;
    --gold:#b8922a; --gold-light:#d9ae4b; --gold-pale:#f4ecd6;
    --border:#ddd7c8; --hair:rgba(18,22,31,.10);
    --done:#2f6b4f; --done-bg:#e2efe7;
    --warn:#9a6a12; --warn-bg:#f8ecd5;
    --bad:#a33328; --bad-bg:#f7e3e0;
    --shadow:0 10px 30px rgba(14,26,53,.09), 0 2px 6px rgba(14,26,53,.05);
    --fd:"DM Serif Display",Georgia,serif;
    --fb:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --fu:"Oswald","Arial Narrow",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);
       font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
  h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
  p{margin:0}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}

  .bar{background:var(--navy-deep);color:#fff;padding:12px 18px;display:flex;
       align-items:center;gap:12px;border-bottom:3px solid var(--gold);
       position:sticky;top:0;z-index:10}
  .bar .logo{height:26px;width:auto;display:block;flex:none}
  @media (max-width:430px){.bar .logo{height:22px}}
  .bar .step{margin-left:auto;font-family:var(--fu);font-size:11.5px;white-space:nowrap;
             letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  @media (max-width:430px){.bar{padding:12px 14px;gap:9px}.bar .step{font-size:10.5px;letter-spacing:.08em}}

  .card .banner{display:block;width:calc(100% + 36px);margin:-18px -18px 16px;height:auto;
    border-radius:17px 17px 0 0}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}

  .steps{display:flex;gap:5px;margin-bottom:18px}
  .steps i{flex:1;height:5px;border-radius:999px;background:var(--border);transition:background .25s}
  .steps i.on{background:var(--gold)} .steps i.done{background:var(--navy)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;
        padding:18px;box-shadow:var(--shadow)}
  .card+.card{margin-top:14px}
  .card h2{font-family:var(--fd);font-size:23px;line-height:1.15;margin-bottom:5px}
  .lede{color:#5c6577;font-size:14.5px}

  .facts{display:grid;gap:1px;background:var(--border);border-radius:14px;overflow:hidden;margin-top:16px}
  .fact{background:var(--sunk);padding:11px 14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .fact dt{font-family:var(--fu);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5c6577}
  .fact dd{margin:0;font-size:14.5px;font-weight:600;text-align:right}

  .flag{margin-top:14px;border-radius:14px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;
        background:var(--warn-bg);border:1px solid rgba(154,106,18,.3)}
  .flag strong{color:var(--warn);display:block;font-size:14px}
  .flag p{font-size:13.5px;color:var(--ink-mid);margin-top:3px}

  .field{margin-top:15px}
  .field>label,.qlabel{display:block;font-family:var(--fu);font-size:11px;letter-spacing:.13em;
        text-transform:uppercase;color:var(--ink-mid);margin-bottom:6px}
  input[type=text],input[type=email],input[type=tel],textarea{
    width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);
    border:1px solid var(--border);border-radius:12px;padding:12px 13px;-webkit-appearance:none}
  textarea{resize:vertical;min-height:120px;line-height:1.5}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
  .hint{font-size:13px;color:#5c6577;margin-top:6px}
  .hint.ok{color:var(--done);font-weight:600}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .seg{display:flex;gap:7px}
  .seg button{flex:1;border:1px solid var(--border);background:var(--sunk);color:var(--ink-mid);
    border-radius:999px;padding:11px 6px;font-size:14.5px;font-weight:600;cursor:pointer;
    transition:background .16s,color .16s,border-color .16s}
  .seg button:hover{border-color:var(--gold)}
  .seg button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}

  .qblock{margin-top:16px;padding-top:15px;border-top:1px solid var(--hair)}
  .qblock:first-of-type{border-top:0;padding-top:0}
  .qtext{font-size:15px;font-weight:500;margin-bottom:9px}

  .blurb{font-size:14px;line-height:1.62;color:var(--ink-mid)}
  .blurb+.blurb{margin-top:9px}
  .covers{margin-top:15px;background:var(--gold-pale);border:1px solid var(--gold);
          border-radius:14px;padding:13px 15px;font-size:14px;line-height:1.5;color:var(--ink-mid)}

  .consent{background:var(--sunk);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:11px}
  .consent h3{font-size:15px;font-weight:700;margin-bottom:10px}
  .surface{display:flex;align-items:center;gap:10px;margin-top:9px}
  .surface .sname{flex:1;font-size:13.5px;color:var(--ink-mid);line-height:1.35}
  .surface .seg{flex:0 0 138px}
  .surface .seg button{padding:8px 4px;font-size:13px}

  .attest{display:flex;gap:12px;align-items:flex-start;background:var(--gold-pale);
          border:1px solid var(--gold);border-radius:14px;padding:14px;cursor:pointer}
  .attest input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--gold);margin:1px 0 0}
  .attest span{font-size:14px;line-height:1.45}

  .datebtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--sunk);
    border:1px solid var(--border);border-radius:12px;padding:12px 13px;font-size:16px;cursor:pointer;color:var(--ink)}
  .datebtn[aria-expanded=true]{border-color:var(--gold);background:var(--gold-pale)}
  .datebtn .dv{flex:1} .datebtn .dv.empty{color:var(--muted)}
  .cal{margin-top:9px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px;box-shadow:var(--shadow)}
  .cal-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .cal-top .m{flex:1;text-align:center;font-weight:700;font-size:15px}
  .cal-nav{width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--sunk);
    cursor:pointer;display:grid;place-items:center;font-size:17px;line-height:1;padding:0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-grid .dow{font-family:var(--fu);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);text-align:center;padding-bottom:4px}
  .cal-grid button{aspect-ratio:1;border-radius:999px;border:1px solid transparent;background:transparent;
    color:var(--ink);font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
  .cal-grid button:hover:not(:disabled){border-color:var(--gold)}
  .cal-grid button:disabled{opacity:.26;cursor:default}
  .cal-grid button.inrange{background:var(--gold-pale)}
  .cal-grid button.sel{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
  .cal-foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}

  .upload{display:block;cursor:pointer;margin-top:14px;border:1.5px dashed var(--border);border-radius:14px;padding:20px 14px;
          text-align:center;background:var(--sunk);cursor:pointer}
  .upload .big{font-size:24px} .upload .t{font-weight:600;font-size:14.5px;margin-top:5px}
  .upload .s{font-size:12.5px;color:#5c6577;margin-top:3px}
  .upload input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .upload:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  /* Pick a size the way a phone's share sheet does, with the real file size. */
  .sizes{margin-top:10px}
  .sizes .lab{font-size:12.5px;color:var(--ink-mid);margin-bottom:6px}
  .sizes .row{display:flex;gap:8px;flex-wrap:wrap}
  .sizes button{flex:1 1 150px;min-height:56px;text-align:left;padding:9px 13px;border-radius:13px;cursor:pointer;
    border:1.5px solid var(--border);background:var(--sunk);color:var(--ink);font:inherit;font-size:14px;font-weight:600}
  .sizes button span{display:block;font-weight:400;font-size:12px;color:#5c6577;margin-top:2px;
    font-variant-numeric:tabular-nums}
  .sizes button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
  .sizes button[aria-pressed="true"] span{color:rgba(255,255,255,.75)}
  .sizes button[disabled]{opacity:.5;cursor:not-allowed}
  .upload .thumb{width:74px;height:92px;object-fit:cover;border-radius:10px;display:block;margin:0 auto 6px;
    border:1px solid var(--border);background:#fff}

  /* Subset to Latin + Latin-1 + Latin Extended-A: everything a typed name needs.
     The full .ttf stays on disk for pdfkit, which draws the same signature into
     the PDF server-side, and is listed second so an exotic glyph still resolves. */
  @font-face{font-family:"Signature";font-display:swap;
    src:url(/assets/fonts/GreatVibes-Regular.woff2) format("woff2"),
        url(/assets/fonts/GreatVibes-Regular.ttf) format("truetype")}
  .sig{margin-top:14px;background:var(--sunk);border:1px solid var(--border);border-radius:14px;padding:15px}
  .sig .typed{font-family:"Signature",var(--fd),cursive;font-size:38px;line-height:1.15;color:var(--navy);border-bottom:1.5px solid var(--border);
    padding:4px 6px 6px;min-height:52px;word-break:break-word}
  .sig .meta{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:11.5px;color:var(--muted);
    font-family:var(--fu);letter-spacing:.1em;text-transform:uppercase}

  .nav{display:flex;gap:10px;margin-top:20px}
  .btn{border-radius:999px;padding:14px 24px;font-weight:700;font-size:16px;border:1px solid transparent;
       cursor:pointer;transition:transform .14s,background .18s}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.6;cursor:progress}
  .btn-primary{background:var(--navy);color:#fff;flex:1}
  .btn-gold{background:var(--gold);color:#1c1608;flex:1}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--ink-mid)}

  /* A failed check marks the control it is about, not just the list at the bottom. */
  .field.err>label,.qblock.err>.qtext,.consent.err>h3{color:var(--bad)}
  .field.err input,.field.err textarea,.field.err .datebtn{border-color:var(--bad);background:#fdf3f1}
  .qblock.err,.consent.err{border-left:3px solid var(--bad);padding-left:11px}
  .attest.err{border-color:var(--bad);background:#fdf3f1}
  .errmark{display:block;margin-top:7px;font-size:12.5px;font-weight:600;color:var(--bad)}
  .problems a{color:var(--bad);text-decoration:underline;text-underline-offset:2px}
  /* Sent back for changes is routine, not an error the presenter made. */
  .returned{margin:0 0 14px;background:var(--gold-pale);border:1px solid var(--gold);border-radius:14px;padding:14px 16px}
  .returned b{display:block;color:var(--warn);font-size:15px}
  .returned p{margin:6px 0 0;font-size:14px;color:var(--ink-mid)}
  .returned .btn{margin-top:12px;width:100%;font-size:15px;padding:12px 18px}
  /* Full-width stacked actions: wrapped labels in a pill turn it into an ellipse. */
  .done-actions{display:flex;flex-direction:column;gap:10px;margin:18px 0 0}
  .done-actions .btn{flex:none;width:100%;display:block;text-decoration:none;text-align:center;white-space:nowrap}
  .problems{margin-top:14px;background:var(--bad-bg);border:1px solid var(--bad);border-radius:14px;padding:13px 15px}
  .problems b{color:var(--bad);font-size:14px}
  .problems ul{margin:7px 0 0;padding-left:20px;font-size:14px;color:var(--ink-mid)}
  .problems li{margin-bottom:3px}

  .done-screen{text-align:center;padding:26px 6px}
  .done-screen .tick{width:66px;height:66px;border-radius:999px;background:var(--done-bg);color:var(--done);
    display:grid;place-items:center;margin:0 auto 18px;font-size:32px;border:1px solid var(--done)}
  .done-screen h2{font-family:var(--fd);font-size:26px;margin-bottom:9px}
  .done-screen p{color:var(--muted);font-size:14.5px;max-width:34ch;margin:0 auto}
  .done-list{text-align:left;margin-top:20px;display:grid;gap:1px;background:var(--border);border-radius:14px;overflow:hidden}
  .done-list div{background:var(--sunk);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
  .done-list b{color:var(--done)}
  .ref{margin-top:16px;font-family:var(--fu);font-size:12px;letter-spacing:.1em;color:var(--muted)}

  .loading,.oops{max-width:560px;margin:0 auto;padding:60px 20px;text-align:center;color:var(--muted)}
  .oops h2{font-family:var(--fd);font-size:24px;color:var(--ink);margin-bottom:10px}
  .bar .langbtn{margin-left:10px;background:transparent;color:var(--gold-light);border:1px solid rgba(217,174,75,.55);
    border-radius:999px;padding:5px 12px;font:600 12px var(--fu,inherit);letter-spacing:.06em;cursor:pointer}
  .bar .langbtn:hover{background:rgba(217,174,75,.12)}
</style>
</head>
<body>

  <img class="logo" src="/assets/ongia-logo.png" alt="ONGIA" width="156" height="26">

<div id="root"><p class="loading">Loading your agreement…</p></div>

const DRAFT_KEY = `ongia-draft-${TOKEN}`;
const DRAFT_FIELDS = ["step", "first", "last", "email", "phone", "organization", "talk", "bio", "outline",
  "travel", "travelFrom", "travelTo", "hotel", "hotelFrom", "hotelTo", "expenses",

function saveDraft() {
  if (!DATA || DATA.presenter.status === "approved") return;
  try {
    const keep = { savedAt: new Date().toISOString() };
    for (const k of DRAFT_FIELDS) keep[k] = S[k];
    localStorage.setItem(DRAFT_KEY, JSON.stringify(keep));
  } catch { /* private window, or no room: the form still works */ }
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch {} }
function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d && typeof d === "object" ? d : null;
  } catch { return null; }
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const words = (t) => (t.trim() ? t.trim().split(/\s+/).length : 0);

// 4165550100 → 416-555-0100 as it is typed; an extension survives as " x123".
function formatPhone(raw) {
  const s = String(raw ?? "").trim();
  if (!s) return "";
  if (/^\+(?!1)/.test(s)) return s;
  const m = s.match(/(?:x|ext\.?|poste|#)\s*(\d{0,6})\s*$/i);
  let ext = m ? m[1] : "", hasExt = !!m;
  let digits = (m ? s.slice(0, m.index) : s).replace(/\D/g, "");
  if (digits.length === 11 && digits[0] === "1") digits = digits.slice(1);
  digits = digits.slice(0, 10); // a mask, so stray extra digits are dropped; an extension needs an "x"
  const a = digits.slice(0, 3), b = digits.slice(3, 6), c = digits.slice(6, 10);
  let out = a; if (b) out += "-" + b; if (c) out += "-" + c;
  if (hasExt) out += " x" + ext;
  return out.trim();
}
// Reformat a phone input in place, keeping the caret after the same digit the user was on.
function formatPhoneInput(el) {
  const before = el.value, pos = el.selectionStart ?? before.length;
  const after = formatPhone(before);
  if (after === before) return after;
  const digitsBefore = before.slice(0, pos).replace(/\D/g, "").length;
  el.value = after;
  let i = 0, seen = 0;
  while (i < after.length && seen < digitsBefore) { if (/\d/.test(after[i])) seen++; i++; }
  if (pos >= before.length) i = after.length;
  try { el.setSelectionRange(i, i); } catch { /* not all input types allow it */ }
  return after;
}

const AFTER = { travelTo: "travelFrom", hotelTo: "hotelFrom" };
const RANGE = { travelFrom:["travelFrom","travelTo"], travelTo:["travelFrom","travelTo"],

const pad2 = (n) => String(n).padStart(2, "0");
const toISO = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseISO = (v) => { if (!v) return null; const [y,m,d] = v.split("-").map(Number); return new Date(y, m-1, d); };
const fmtDate = (v) => { const d = parseISO(v); return d ? t("fmt", t("days")[d.getDay()], d.getDate(), t("mons")[d.getMonth()], d.getFullYear()) : ""; };

function dateField(id, label, key) {
  const val = S[key], open = S.openCal === key;
  let h = `<div class="field" id="b-${id}"><label for="${id}">${label}</label>
    <button type="button" class="datebtn" id="${id}" data-cal="${key}" aria-expanded="${open}">
      <span class="dv${val ? "" : " empty"}">${val ? esc(fmtDate(val)) : t("chooseDate")}</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true" style="opacity:.6">
        <rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path>
      </svg></button>`;
  if (open) h += calendar(key);
  return h + "</div>";
}

function calendar(key) {
  const minKey = AFTER[key], min = minKey ? S[minKey] : null;
  const win = DATA.event.travelWindow;
  const cur = S[key] || min || win.from;
  const view = S.calMonth || cur.slice(0,7) + "-01";
  const vd = parseISO(view), y = vd.getFullYear(), m = vd.getMonth();
  const lead = new Date(y, m, 1).getDay();
  const total = new Date(y, m+1, 0).getDate();
  const r = RANGE[key] ?? [], a = r[0] ? S[r[0]] : null, b = r[1] ? S[r[1]] : null;

  let h = `<div class="cal" role="group" aria-label="${t("chooseDate")}"><div class="cal-top">
    <button type="button" class="cal-nav" data-cal-move="-1" aria-label="${t("prevMonth")}">&#8249;</button>
    <span class="m">${t("months")[m]} ${y}</span>
    <button type="button" class="cal-nav" data-cal-move="1" aria-label="${t("nextMonth")}">&#8250;</button>
    </div><div class="cal-grid">`;
  for (const d of t("dow")) h += `<div class="dow">${d}</div>`;
  for (let i = 0; i < lead; i++) h += "<span></span>";
  for (let d = 1; d <= total; d++) {
    const iso = toISO(new Date(y, m, d));
    // Only the training days plus one either side are offered — anything
    // else is a board decision, so the form doesn't pretend otherwise.
    const blocked = (min && iso < min) || iso < win.from || iso > win.to;
    const cls = iso === S[key] ? "sel" : (a && b && iso > a && iso < b ? "inrange" : "");
    h += `<button type="button" class="${cls}" data-cal-pick="${iso}"${blocked ? " disabled" : ""}
           aria-label="${esc(fmtDate(iso))}">${d}</button>`;
  }
  return h + `</div><div class="cal-foot"><span>${min && min > win.from ? esc(t("onOrAfter", fmtDate(min))) : esc(fmtDate(win.from)) + " – " + esc(fmtDate(win.to))}</span>
    <button type="button" class="btn btn-ghost" style="padding:7px 15px;font-size:13.5px" data-cal-close="1">${t("done")}</button>
    </div></div>`;
}

/* ---------- render ---------- */
let lastStep = null;
function render(done) {
  if (done) {
    DONE = done;
    ROOT.innerHTML = `<div class="wrap">${doneMarkup(done)}</div>`;
    STEPCOUNT.textContent = t("submitted");
    window.scrollTo(0, 0);
    return;
  }
  const bars = Array.from({ length: 6 }, (_, i) =>
    `<i class="${i < S.step ? "done" : i === S.step ? "on" : ""}"></i>`).join("");
  const probs = S.problems.map((p) => (typeof p === "string" ? { msg: p, at: null } : p));
  const problems = probs.length
    ? `<div class="problems" role="alert"><b>${t("notQuite")}</b><ul>${probs.map((p) =>
        `<li>${p.at ? `<a href="#" data-goto="${esc(p.at)}">${p.msg}</a>` : p.msg}</li>`).join("")}</ul></div>`
    : "";
  const nav = `<div class="nav">
      ${S.step > 0 ? `<button type="button" class="btn btn-ghost" id="back">${t("back")}</button>` : ""}
      <button type="button" class="btn ${S.step === LAST_STEP ? "btn-gold" : "btn-primary"}" id="next"${sending ? " disabled" : ""}>
        ${sending ? t("sending") : S.step === LAST_STEP ? t("submit") : t("cont")}</button></div>`;

  const keep = lastStep === S.step ? window.scrollY : null;
  const restored = restoredNote
    ? `<div class="flag" style="margin:0 0 14px"><span>💾</span><div><p style="margin:0">${t("restored")}</p></div></div>` : "";
  const banner = DATA.presenter.returnNote
    ? `<div class="returned" role="status"><b>${t("returnedTitle")}</b><p>${esc(DATA.presenter.returnNote)}</p>
        <p style="font-size:13px">${t("returnedHint")}</p>
        ${S.step !== returnStep() ? `<button type="button" class="btn btn-primary" id="returned-go">${t("returnedGo")}</button>` : ""}</div>`
    : DATA.presenter.status === "submitted" && DATA.presenter.submittedAt
      ? `<div class="flag" style="margin:0 0 14px"><span>✓</span><div><p style="margin:0">${t("submittedNote", esc(fmtDate(toISO(new Date(DATA.presenter.submittedAt)))))}</p></div></div>` : "";
  const focusId = document.activeElement?.id;
  ROOT.innerHTML = `<div class="wrap"><div class="steps">${bars}</div>${restored}${banner}${stepMarkup()}${problems}${nav}</div>`;
  // Re-rendering replaces the DOM; put keyboard focus back where it was.
  if (focusId) { const again = document.getElementById(focusId); if (again) again.focus({ preventScroll: true }); }
  STEPCOUNT.textContent = t("stepOf", S.step + 1);

  // Mark every control a check complained about, then take the presenter to the first.
  let firstErr = null;
  for (const p of probs) {
    if (!p.at) continue;
    const el = document.getElementById(p.at);
    const block = el?.closest(".field, .qblock, .consent, .attest, .upload") ?? el;
    if (!block || block.classList.contains("err")) continue;
    block.classList.add("err");
    if (!block.querySelector(".errmark")) block.insertAdjacentHTML("beforeend", `<span class="errmark">${t("errNeeds")}</span>`);
    firstErr ??= block;
  }
  if (firstErr) firstErr.scrollIntoView({ block: "center", behavior: "smooth" });
  else if (keep !== null) window.scrollTo(0, keep);
  else window.scrollTo(0, 0);
  lastStep = S.step;
  saveDraft();

  if (S.openCal) {
    const cal = ROOT.querySelector(".cal");
    if (cal) {
      const over = cal.getBoundingClientRect().bottom - window.innerHeight;
      if (over > 0) window.scrollBy(0, over + 14);
    }
  }
}

/**
 * A presenter sent back for changes should not have to press Continue through
 * their own biography to reach the thing ONGIA asked about. Read the note.
 */
function returnStep() {
  const note = String(DATA?.presenter?.returnNote ?? "").toLowerCase();
  if (/\b(date|dates|travel|hotel|flight|arriv|depart|check|cost|expense|meal|transport|pay|paid|cover)/.test(note)) return 3;
  if (/\b(sign|signature|standing|headshot|photo|consent|permission|copyright)/.test(note)) return 5;
  if (/\b(phone|email|name|organi)/.test(note)) return 1;
  return 2;
}

/* ---------- validation, mirroring the server ---------- */
function validate() {
  // Each problem carries the id of the control it is about, so the step can mark
  // that control and scroll to it instead of leaving a list at the foot of the page.
  const out = [];
  const add = (msg, at) => out.push({ msg, at });
  if (S.step === 1) {
    if (!S.first.trim() || !S.last.trim()) add(t("vName"), S.first.trim() ? "f-last" : "f-first");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email.trim())) add(t("vEmail"), "f-email");
  }
  if (S.step === 2) {
    if (!S.talk.trim()) add(t("vTalk"), "f-talk");
    if (words(S.bio) < 20) add(t("vBio"), "f-bio");
    if (!S.outline.trim()) add(t("vOutline"), "f-outline");
  }
  if (S.step === 3) {
    if (!S.travel) add(t("vTravel"), "q-travel");
    if (!S.hotel) add(t("vHotel"), "q-hotel");
    const win = DATA.event.travelWindow;
    const check = (on, from, to, what, at) => {
      if (!on) return;
      if (!from || !to) add(t("vBoth", what), at);
      else if (to < from) add(t("vOrder", what), at);
      else if (from < win.from || to > win.to) add(t("vWindow", what, fmtDate(win.from), fmtDate(win.to)), at);
    };
    check(S.travel === "yes", S.travelFrom, S.travelTo, t("travelWord"), S.travelFrom ? "b-f-tt" : "b-f-tf");
    check(S.hotel === "yes", S.hotelFrom, S.hotelTo, t("hotelWord"), S.hotelFrom ? "b-f-ht" : "b-f-hf");
    if (!S.expenses.transport) add(t("vCovT"), "q-cov-transport");
    if (S.hotel === "yes" && !S.expenses.hotel) add(t("vCovH"), "q-cov-hotel");
    if (!S.expenses.meals) add(t("vCovM"), "q-cov-meals");
    if (!S.expenses.other) add(t("vCovO"), "q-cov-other");
    if (S.expenses.other === "yes" && !S.expenses.otherText.trim()) add(t("otherNeeded"), "f-other");
  }
  if (S.step === 4) {
    if (!S.copyright) add(t("vCopy"), "f-copy");
    // Name the rows that are unanswered rather than asking for "every line".
    for (const [row, label] of [["photo", t("photos")], ["materials", t("materials")], ["summary", t("summary")]])
      if (!S.media[row]?.internal || !S.media[row]?.public) add(t("vMediaRow", label), `c-${row}`);
  }
  if (S.step === 5) {
    if (!S.goodStanding) add(t("vStanding"), "f-standing");
    if (!S.signature.trim()) add(t("vSign"), "f-sign");
    if (!S.agreed) add(t("vAgree"), "f-agree");
  }
  const seen = new Set();
  return out.filter((p) => !seen.has(p.msg) && seen.add(p.msg));
}

let FILE = null;
/**
 * A photo straight off a phone is often 3–6 MB, which used to be rejected
 * outright. Instead the picture is re-sized here, in the browser, and offered
 * at a few sizes with the real file size of each — the way a phone's own share
 * sheet does it. Nothing leaves the device until they pick one and sign.
 */
let SHOT = null;   // { name, choice, variants: [{ key, label, w, h, blob, size, tooBig }] }
const SHOT_LIMIT = 5 * 1024 * 1024;

const prettyBytes = (n) => n >= 1024 * 1024 ? `${(n / 1024 / 1024).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;

async function decodeImage(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch {}
    try { return await createImageBitmap(file); } catch {}
  }
  const url = URL.createObjectURL(file);
  try {
    return await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("decode"));
      img.src = url;
    });
  } finally { setTimeout(() => URL.revokeObjectURL(url), 10000); }
}

async function shrink(bmp, longEdge) {
  const src = Math.max(bmp.width || bmp.naturalWidth, bmp.height || bmp.naturalHeight);
  const scale = Math.min(1, longEdge / src);
  const w = Math.max(1, Math.round((bmp.width || bmp.naturalWidth) * scale));
  const h = Math.max(1, Math.round((bmp.height || bmp.naturalHeight) * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.82));
  return blob ? { blob, w, h, size: blob.size } : null;
}

async function prepareShot(file) {
  SHOT = { name: file.name, choice: null, variants: [], busy: true };
  S.headshotName = file.name;
  S.problems = [];
  render();
  let bmp;
  try { bmp = await decodeImage(file); } catch {
    SHOT = null; FILE = null; S.headshotName = "";
    S.problems = [{ msg: t("shotUnreadable"), at: "shot-tile" }];
    render(); return;
  }
  const full = Math.max(bmp.width || bmp.naturalWidth, bmp.height || bmp.naturalHeight);
  const variants = [];
  for (const [key, label, edge] of [["small", t("sizeSmall"), 640], ["medium", t("sizeMedium"), 1280]]) {
    if (full <= edge && variants.length) continue;          // no point offering a size it already is
    const out = await shrink(bmp, edge).catch(() => null);
    if (out) variants.push({ key, label, ...out, name: jpegName(file.name) });
  }
  variants.push({ key: "original", label: t("sizeOriginal"), w: bmp.width || bmp.naturalWidth,
    h: bmp.height || bmp.naturalHeight, blob: file, size: file.size, name: file.name, tooBig: file.size > SHOT_LIMIT });
  bmp.close?.();
  // The biggest one that will actually send, so nobody has to think about it.
  const best = [...variants].reverse().find((v) => !v.tooBig) ?? variants[0];
  SHOT = { name: file.name, choice: best.key, variants, busy: false };
  chooseShot(best.key, false);
  render();
}

const jpegName = (name) => `${String(name).replace(/\.[^.]+$/, "") || "headshot"}.jpg`;

function chooseShot(key, redraw = true) {
  const v = SHOT?.variants.find((x) => x.key === key);
  if (!v || v.tooBig) return;
  SHOT.choice = key;
  FILE = new File([v.blob], v.name, { type: v.blob.type || "image/jpeg" });
  S.headshotName = v.name;
  // A thumbnail of the smallest version: they should see what they are sending.
  if (SHOT.previewUrl) URL.revokeObjectURL(SHOT.previewUrl);
  const thumb = SHOT.variants.find((x) => !x.tooBig) ?? v;
  SHOT.previewUrl = URL.createObjectURL(thumb.blob);
  if (redraw) render();
}

function sizePicker() {
  if (!SHOT) return "";
  if (SHOT.busy) return `<p class="hint" style="margin-top:10px">${t("shotReady")}</p>`;
  return `<div class="sizes"><div class="lab">${t("shotSend")}</div><div class="row">${SHOT.variants.map((v) => `
    <button type="button" data-shot="${esc(v.key)}" aria-pressed="${SHOT.choice === v.key}"${v.tooBig ? " disabled" : ""}>
      ${esc(v.label)}<span>${v.w} × ${v.h} · ${v.tooBig ? t("shotTooBig") : prettyBytes(v.size)}</span></button>`).join("")}</div></div>`;
}
// Returns a translation key so the warning follows a later language switch.
async function uploadHeadshot() {
  if (!FILE) return null;
  if (FILE.size > SHOT_LIMIT) return "shotBig";
  try {
    const res = await fetch(`/api/headshot?t=${encodeURIComponent(TOKEN)}`, {
      method: "POST",
      headers: { "content-type": FILE.type || "image/jpeg", "x-file-name": encodeURIComponent(FILE.name) },
      body: FILE,
    });
    await res.json().catch(() => null);
    if (!res.ok) return "shotFail";
    FILE = null;
    return null;
  } catch { return "shotFail"; }
}

async function submit() {
  sending = true; render();
  try {
    const res = await fetch(`/api/agreement?t=${encodeURIComponent(TOKEN)}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ ...S, headshotName: S.headshotName, language: LANG }),
    });
    const out = await res.json();
    if (res.ok) { clearDraft(); out.headshotWarning = await uploadHeadshot(); sending = false; render(out); return; }
    sending = false;
    S.problems = out.problems ?? [serverText(out.error)];
    render();
  } catch {
    sending = false;
    S.problems = [t("netFail")];
    render();
  }
}

/* ---------- events ---------- */
ROOT.addEventListener("click", (e) => {
  // Any deliberate action means they have seen the "picked up where you left off" note.
  if (e.target.closest("button, [data-set], .attest, .upload")) restoredNote = false;
  const set = e.target.closest("[data-set]");
  if (set) {
    const path = set.dataset.path;
    const value = set.dataset.val;
    if (path) {
      const keys = path.split(".");
      let node = S;
      for (const k of keys.slice(0, -1)) node = node[k] ??= {};
      node[keys.at(-1)] = value;
    } else S[set.dataset.set] = value;
    if (set.dataset.set === "hotel" && value === "no") { S.hotelFrom = ""; S.hotelTo = ""; S.expenses.hotel = null; }
    if (set.dataset.set === "travel" && value === "no") { S.travelFrom = ""; S.travelTo = ""; }
    S.problems = [];
    render();
    return;
  }
  const cal = e.target.closest("[data-cal]");
  if (cal) { const k = cal.dataset.cal; S.openCal = S.openCal === k ? null : k; S.calMonth = null; render(); return; }
  const move = e.target.closest("[data-cal-move]");
  if (move) {
    const base = S.calMonth || ((S[S.openCal] || DATA.event.travelWindow.from).slice(0,7) + "-01");
    const d = parseISO(base); d.setMonth(d.getMonth() + Number(move.dataset.calMove));
    S.calMonth = toISO(d); render(); return;
  }
  const pick = e.target.closest("[data-cal-pick]");
  if (pick && !pick.disabled) {
    const field = S.openCal, iso = pick.dataset.calPick;
    S[field] = iso;
    const mate = PAIR[field];
    if (mate && (!S[mate] || S[mate] < iso)) S[mate] = iso;
    S.openCal = null; S.calMonth = null; render(); return;
  }
  if (e.target.closest("[data-cal-close]")) { S.openCal = null; S.calMonth = null; render(); return; }

  if (e.target.id === "back") { S.problems = []; S.step = Math.max(0, S.step - 1); render(); return; }
  const goto = e.target.closest?.("[data-goto]");
  if (goto) {
    e.preventDefault();
    const el = document.getElementById(goto.dataset.goto);
    const block = el?.closest(".field, .qblock, .consent, .attest, .upload") ?? el;
    block?.scrollIntoView({ block: "center", behavior: "smooth" });
    (el?.matches?.("input, textarea, button") ? el : block?.querySelector("input, textarea, button"))?.focus({ preventScroll: true });
    return;
  }
  const sizeBtn = e.target.closest?.("[data-shot]");
  if (sizeBtn) { e.preventDefault(); chooseShot(sizeBtn.dataset.shot); return; }
  if (e.target.id === "returned-go") { restoredNote = false; S.step = returnStep(); S.problems = []; render(); return; }
  if (e.target.id === "next") {
    restoredNote = false;
    const problems = validate();
    if (problems.length) { S.problems = problems; render(); return; }
    S.problems = [];
    if (S.step === LAST_STEP) submit();
    else { S.step++; render(); }
  }
});

ROOT.addEventListener("input", (e) => {
  restoredNote = false;
  const t0 = e.target;
  if (t0.id === "f-shot") {
    const picked = t0.files?.[0] ?? null;
    if (SHOT?.previewUrl) URL.revokeObjectURL(SHOT.previewUrl);
    FILE = null;
    if (!picked) { SHOT = null; S.headshotName = ""; S.problems = []; render(); return; }
    prepareShot(picked);
    return;
  }
  const bind = t0.dataset?.bind;
  if (!bind) return;
  const value = t0.type === "checkbox" ? t0.checked : bind === "phone" ? formatPhoneInput(t0) : t0.value;
  if (bind.includes(".")) {
    const keys = bind.split(".");
    let node = S;
    for (const k of keys.slice(0, -1)) node = node[k] ??= {};
    node[keys.at(-1)] = value;
  } else S[bind] = value;

  if (bind === "first" || bind === "last") {
    const h = document.getElementById("fnhint");
    if (h) h.innerHTML = t("filedAs", esc(fileName()));
  }
  if (bind === "signature") {
    const sl = document.getElementById("sigline");
    if (sl) sl.textContent = t0.value || " ";
  }
  if (t0.dataset.count) {
    const c = document.getElementById("biocount");
    if (c) {
      const n = words(t0.value);
      c.textContent = t("bioCount", n);
      c.className = "hint" + (n >= 250 && n <= 300 ? " ok" : "");
    }
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.openCal) { S.openCal = null; S.calMonth = null; render(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.id === "shot-tile") { e.preventDefault(); document.getElementById("f-shot")?.click(); }
});

/* ---------- boot ---------- */
(async function boot() {
  document.documentElement.lang = LANG;
  ROOT.innerHTML = `<p class="loading">${t("loading")}</p>`;
  if (!TOKEN) {
    ROOT.innerHTML = `<div class="oops"><h2>${t("linkTitle")}</h2><p>${t("linkP")}</p></div>`;
    return;
  }
  try {
    const res = await fetch(`/api/agreement?t=${encodeURIComponent(TOKEN)}`);
    const out = await res.json();
    if (!res.ok) {
      ROOT.innerHTML = `<div class="oops"><h2>${t("openFail")}</h2><p>${esc(serverText(out.error))}</p></div>`;
      return;
    }
    DATA = out;
    let remembered = null; try { remembered = localStorage.getItem("ongia-lang"); } catch {}
    if (out.presenter.language && !remembered) setLang(out.presenter.language);
    if (out.presenter.status === "approved") { ROOT.innerHTML = finalMarkup(); STEPCOUNT.textContent = t("finalWord"); return; }
    Object.assign(S, {
      first: out.presenter.first ?? "",
      last: out.presenter.last ?? "",
      email: out.presenter.email ?? "",
      organization: out.presenter.organization ?? "",
    });
    if (out.draft) {
      const d = out.draft;
      Object.assign(S, {
        phone: formatPhone(d.phone ?? ""), talk: d.talk ?? "", bio: d.bio ?? "", outline: d.outline ?? "",
        travel: d.travel ?? null, travelFrom: d.travelFrom ?? "", travelTo: d.travelTo ?? "",
        hotel: d.hotel ?? null, hotelFrom: d.hotelFrom ?? "", hotelTo: d.hotelTo ?? "",
        expenses: { ...S.expenses, ...(d.expenses ?? {}) },
        copyright: !!d.copyright, goodStanding: !!d.goodStanding, media: d.media ?? S.media,
        signature: d.signature ?? "", headshotName: d.headshotName ?? "",
      });
    }

    // Unsent answers held on this device win, unless the record on the server is
    // newer — which means they signed somewhere else since this draft was saved.
    const local = loadDraft();
    const serverAt = out.presenter.submittedAt ?? out.presenter.review?.returnedAt ?? null;
    if (local && (!serverAt || !local.savedAt || local.savedAt > serverAt)) {
      for (const k of DRAFT_FIELDS) if (local[k] !== undefined) S[k] = local[k];
      S.expenses = { transport: null, hotel: null, meals: null, other: null, otherText: "", ...(local.expenses ?? {}) };
      S.step = Math.min(Math.max(Number(local.step) || 0, 0), LAST_STEP);
      S.problems = [];
      // The chosen headshot file cannot be kept, so never claim one is attached.
      S.headshotName = out.draft?.headshotName ?? "";
      restoredNote = S.step > 0 || !!String(S.talk || S.bio || S.signature).trim();
    } else if (local) {
      clearDraft();
    }
    render();
  } catch {
    ROOT.innerHTML = `<div class="oops"><h2>${t("reachTitle")}</h2><p>${t("reachP")}</p></div>`;
  }
})();
</script>
</body>
</html>
