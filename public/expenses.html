<html lang="en">
<head>

<link rel="icon" href="/assets/expenses-favicon-32.png" sizes="32x32">
<link rel="icon" href="/assets/expenses-favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="/assets/expenses-icon-180.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Oswald:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme:light;
    --paper:#f2efe8; --card:#fafaf7; --sunk:#edeae2;
    --ink:#12161f; --ink-mid:#2c3448; --muted:#596176;
    --navy:#1a2f5e; --navy-deep:#0e1a35;
    --gold:#b8922a; --gold-light:#d9ae4b; --gold-pale:#f4ecd6;
    --border:#ddd7c8; --edge:#bfb49a;
    --done:#2f6b4f; --done-bg:#e2efe7;
    --wait:#8a5d0c; --wait-bg:#f8ecd5;
    --late:#a33328; --late-bg:#f7e3e0;
    --fd:"DM Serif Display",Georgia,serif;
    --fb:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --fu:"Oswald","Arial Narrow",sans-serif;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;-webkit-text-size-adjust:100%}
  body{min-height:100vh;padding-bottom:calc(64px + var(--safe-bottom))}
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}
  .top{position:sticky;top:0;z-index:5;background:var(--navy-deep);color:#fff;border-bottom:3px solid var(--gold);padding:calc(10px + var(--safe-top)) 14px 10px;display:flex;align-items:center;gap:8px;min-height:54px}
  .top h1{font-family:var(--fd);font-weight:400;font-size:21px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:4px 10px 6px 2px;cursor:pointer;opacity:.9}
  .me{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;width:34px;height:34px;font-size:12.5px;font-weight:700;letter-spacing:.04em;cursor:pointer;flex:none}
  .menu{position:absolute;right:12px;top:calc(100% + 6px);background:#fff;color:var(--ink);border:1px solid var(--edge);border-radius:12px;box-shadow:0 10px 30px rgba(14,26,53,.18);padding:12px 14px;width:260px;font-size:14px}
  .menu .who{color:var(--ink-mid);margin:0 0 10px;line-height:1.35}
  main{max-width:560px;margin:0 auto;padding:14px 16px 24px}
  .card{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;margin:0 0 10px}
  .k{font-family:var(--fu);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  .run{background:var(--navy-deep);color:#fff;border-radius:16px;padding:14px 16px 15px;margin:0 0 12px}
  .run .k{color:#c7cbe0}
  .run .big{font-family:var(--fd);font-size:38px;line-height:1.08;margin:2px 0 3px;font-variant-numeric:tabular-nums}
  .run .s{font-size:13.5px;color:#dfe3f0}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;border-radius:999px;padding:13px 16px;font-weight:600;font-size:16px;border:1.5px solid var(--edge);background:#fff;color:var(--ink);cursor:pointer;min-height:48px;text-decoration:none}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1404}
  .btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.ghost{background:#fff}
  .btn.danger{background:none;border-color:transparent;color:var(--late);font-weight:600;min-height:44px}
  .btn svg{flex:none}
  .row2{display:flex;gap:10px;margin:10px 0 4px}.row2 .btn{flex:1;font-size:15px;padding:11px 10px}
  .linkish{display:block;margin:8px auto 0;background:none;border:0;color:var(--navy);text-decoration:underline;font-size:14px;cursor:pointer;padding:6px}
  .day{font-family:var(--fu);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 2px 5px}
  .lines{padding:2px 12px}
  .line{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--border);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
  .line:first-child{border-top:0}
  .thumb{width:44px;height:56px;border-radius:6px;background:#fff;border:1px solid var(--border);flex:none;box-shadow:0 1px 3px rgba(0,0,0,.12);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb.kind{background:var(--sunk);box-shadow:none}
  .line .w{font-weight:600;font-size:15.5px}
  .line .s{font-size:13px;color:var(--muted);margin-top:1px}
  .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;font-size:15.5px}
  .check{font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:4px}
  .check.ok{color:var(--done)}.check.wt{color:var(--wait)}.check.bad{color:var(--late)}.check.mu{color:var(--muted)}
  .needs{font-size:12.5px;color:var(--wait);margin-top:2px}
  .note{font-size:13.5px;color:var(--ink-mid);line-height:1.45}
  .tiny{font-size:12.5px;color:var(--muted);line-height:1.4}
  .empty{text-align:center;padding:26px 10px;color:var(--ink-mid)}
  .empty .big{font-family:var(--fd);font-size:22px;color:var(--navy-deep);margin-bottom:4px}
  .field{margin:0 0 11px}
  .field label,.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin:0 0 4px}
  .read{font-size:10.5px;color:var(--done);font-family:var(--fu);letter-spacing:.1em;text-transform:uppercase}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--edge);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);min-height:46px}
  textarea{min-height:92px;resize:vertical;line-height:1.4}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy)}
  .two{display:flex;gap:10px}.two .field{flex:1;min-width:0}
  .preview{display:flex;gap:12px;align-items:center;margin:0 0 14px}
  .preview .pic{width:96px;height:124px;border-radius:8px;background:#fff;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.14);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--fu);letter-spacing:.1em;cursor:pointer;padding:0}
  .preview .pic img{width:100%;height:100%;object-fit:cover}
  .status{display:flex;gap:8px;align-items:flex-start}
  .spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 0.9s linear infinite;flex:none;margin-top:2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .say{border-radius:12px;padding:11px 13px;margin:0 0 12px;font-size:14px;line-height:1.45}
  .say.bad{background:var(--late-bg);color:var(--late);border:1px solid #e2a79f}
  .say.wt{background:var(--wait-bg);color:var(--wait);border:1px solid #e5c98c}
  .say.ok{background:var(--done-bg);color:var(--done);border:1px solid #9cc7b0}
  .say.mu{background:var(--sunk);color:var(--ink-mid)}
  .calc{font-size:14px;color:var(--ink-mid);margin:-2px 0 12px;font-variant-numeric:tabular-nums}
  .calc b{font-size:17px;color:var(--ink)}
  .shotbox{display:flex;align-items:center;gap:10px}
  .shotbox .thumb{width:40px;height:50px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px max(0px,calc((100vw - 560px) / 2)) calc(6px + var(--safe-bottom))}
  .tabs button{background:none;border:0;font-size:13px;color:var(--muted);padding:8px 10px;min-height:44px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .tabs button.on{color:var(--navy);font-weight:700}
  .tabs .n{background:var(--late);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px;font-weight:700}
  .signin{max-width:400px;margin:36px auto 0;text-align:center}
  .signin img.icon{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(14,26,53,.25)}
  .signin h2{font-family:var(--fd);font-weight:400;font-size:28px;margin:14px 0 4px;color:var(--navy-deep)}
  .signin p{color:var(--ink-mid);margin:0 0 20px;font-size:15px;line-height:1.45}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-bottom));background:var(--navy-deep);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;max-width:min(92vw,480px);box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9;pointer-events:none}
  .toast.bad{background:var(--late)}
  .sheet-bg{position:fixed;inset:0;background:rgba(14,26,53,.82);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
  .sheet-bg img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
  .pdfrow{display:flex;align-items:center;gap:10px}
  .hint{font-size:12.5px;color:var(--muted);margin:-6px 0 11px;line-height:1.4}
</style>
</head>
<body>
<header class="top" id="top">
  <button class="back" id="back" type="button" aria-label="Back" hidden>‹</button>
  <h1 id="title">ONGIA Expenses</h1>
  <button class="me" id="me" type="button" hidden aria-haspopup="true" aria-expanded="false"></button>
  <div class="menu" id="menu" hidden></div>
</header>
<main id="root" aria-live="polite"></main>
<nav class="tabs" id="tabs" hidden></nav>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pick" accept="image/*,application/pdf" hidden>
<input type="file" id="shotpick" accept="image/*,application/pdf" hidden>
<script type="module">
/* ONGIA Expenses: a board member's expense claims, on their phone. The Briefing Room runs it behind the scenes
   (/api/expenses); this page signs in with the member's ONGIA Microsoft account and opens nothing but their claims. */
const $ = (id) => document.getElementById(id);
const ROOT = $("root");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (n) => (Number(n) || 0).toLocaleString("en-CA", { style: "currency", currency: "CAD" });
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
const dayName = (iso) => { const d = new Date(`${iso}T12:00:00`); return d.toLocaleDateString("en-CA", { weekday: "short", month: "short", day: "numeric" }); };
// "12,50" is twelve fifty; "1,250.00" is twelve hundred and fifty.
const parseMoney = (s) => { const t = String(s ?? "").replace(/[$\s]/g, ""); return Number(/^\d+,\d{1,2}$/.test(t) ? t.replace(",", ".") : t.replace(/,/g, "")); };
const longDate = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" });
const ICON = {
  camera: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  car: '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>',
  note: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg>',
  receipt: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 21zM9 8h6M9 12h6M9 16h4"/></svg>',
  pdf: '<span style="font-family:var(--fu);font-size:12px;letter-spacing:.08em">PDF</span>',
  tick: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>',
};
const MS_MARK = '<svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>';

let SESSION = store.get("ongia-exp-session") || "";
let ME = (() => { try { return JSON.parse(store.get("ongia-exp-me") || "null"); } catch { return null; } })();
let HOME = null;          // what /api/expenses answered
let VIEW = { name: "claim" };
let EDIT = null;          // the line being checked or typed
let TAB = "claim";

/* ---------- talking to the Briefing Room ---------- */
async function api(path, { method = "GET", json, body, headers = {} } = {}) {
  let res;
  try {
    res = await fetch(`/api/expenses${path}`, { method, headers: { "x-expense-key": SESSION, ...(json ? { "content-type": "application/json" } : {}), ...headers }, body: json ? JSON.stringify(json) : body });
  } catch { throw Object.assign(new Error("No connection. Check your signal and try again."), { network: true }); }
  const out = await res.json().catch(() => ({}));
  if (res.status === 401) { signOut(false); signInScreen("Your sign-in has run out. Please sign in again."); throw Object.assign(new Error(out.error || "Please sign in again."), { status: 401, quiet: true }); }
  if (!res.ok) throw Object.assign(new Error(out.error || `Something went wrong (${res.status}). Try again.`), { status: res.status });
  return out;
}
let toastTimer = null;
function toast(text, bad = false) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.append(t); }
  t.className = `toast${bad ? " bad" : ""}`; t.textContent = text;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), bad ? 6000 : 3200);
}

/* ---------- signing in: the member's own ONGIA Microsoft account ---------- */
// Microsoft knows the desk's sign-in page as the way back, so the reply comes to /admin.html, which hands it straight
// on to /expenses (see the top of admin.html). The verifier is kept in localStorage so it survives that hop.
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const randomCode = () => b64u(crypto.getRandomValues(new Uint8Array(32)));
const RETURN = () => `${location.origin}/admin.html`;
let AUTH = null;
const authConfig = async () => (AUTH ??= await fetch("/api/auth").then((r) => r.json()).catch(() => ({ microsoft: null })));
async function startMicrosoft() {
  const { microsoft: ms } = await authConfig();
  if (!ms) return signInScreen("Microsoft sign-in isn't set up on this site yet.");
  const verifier = randomCode(), state = randomCode(), nonce = randomCode();
  const challenge = b64u(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  store.set("ongia-xms", JSON.stringify({ verifier, state, nonce, at: Date.now() }));
  const q = new URLSearchParams({ client_id: ms.client, response_type: "code", response_mode: "fragment", redirect_uri: RETURN(),
    scope: "openid profile email", state, nonce, code_challenge: challenge, code_challenge_method: "S256" });
  if (store.get("ongia-xms-pick")) { q.set("prompt", "select_account"); store.del("ongia-xms-pick"); }
  location.assign(`${ms.authority}/oauth2/v2.0/authorize?${q}`);
}
/** Back from Microsoft: true when signed in, words when not, null when this wasn't a sign-in. */
async function finishMicrosoft() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (!p.has("code") && !p.has("error")) return null;
  let saved = null; try { saved = JSON.parse(store.get("ongia-xms") || "null"); } catch {}
  store.del("ongia-xms");
  history.replaceState(null, "", location.pathname);
  const first = (t) => String(t ?? "").split(/\r?\n|Trace ID/)[0].trim();
  if (p.has("error")) return first(p.get("error_description")) || "Microsoft sign-in was cancelled.";
  if (!saved || p.get("state") !== saved.state || Date.now() - saved.at > 20 * 60e3) return "That sign-in didn't start here. Please try again.";
  const { microsoft: ms } = await authConfig();
  if (!ms) return "Microsoft sign-in isn't set up on this site yet.";
  const tok = await fetch(`${ms.authority}/oauth2/v2.0/token`, {
    method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: ms.client, grant_type: "authorization_code", code: p.get("code"),
      redirect_uri: RETURN(), code_verifier: saved.verifier, scope: "openid profile email" }),
  }).then((r) => r.json()).catch(() => ({}));
  if (!tok.id_token) return first(tok.error_description) || "Microsoft didn't finish the sign-in. Please try again.";
  const res = await fetch("/api/expenses?signin=1", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ idToken: tok.id_token, nonce: saved.nonce }) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) return out.error || `Sign-in failed (${res.status}).`;
  SESSION = out.session; ME = out.me;
  store.set("ongia-exp-session", SESSION); store.set("ongia-exp-me", JSON.stringify(ME));
  return true;
}
function signOut(pick = true) {
  SESSION = ""; ME = null; HOME = null;
  store.del("ongia-exp-session"); store.del("ongia-exp-me");
  if (pick) store.set("ongia-xms-pick", "1");
}
function signInScreen(message) {
  chrome({ title: "ONGIA Expenses", back: false, tabs: false, me: false });
  ROOT.innerHTML = `<div class="signin">
    <img class="icon" src="/assets/expenses-icon-180.png" alt="" width="96" height="96">
    <h2>ONGIA Expenses</h2>
    <p>Sign in with your ONGIA Microsoft account, the one you use for your @ongia.ca email.</p>
    ${message ? `<div class="say bad" style="text-align:left"><b>Couldn't sign in.</b> ${esc(message)}</div>` : ""}
    <button class="btn navy" id="ms" type="button">${MS_MARK}<span>Sign in with Microsoft</span></button>
  </div>`;
  $("ms").onclick = (e) => { e.currentTarget.disabled = true; e.currentTarget.lastElementChild.textContent = "Opening Microsoft…"; startMicrosoft(); };
}

/* ---------- the frame: title, back, who, tabs ---------- */
function chrome({ title, back, tabs = true, me = true }) {
  $("title").textContent = title;
  $("back").hidden = !back;
  $("me").hidden = !me || !ME;
  if (ME) $("me").textContent = String(ME.name || ME.email).split(/[\s@.]+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
  $("menu").hidden = true;
  const t = $("tabs");
  t.hidden = !tabs;
  if (tabs) {
    const list = [["claim", "My claim"], ["past", "Past claims"], ...(HOME?.officer ? [["approve", "To approve"]] : [])];
    t.innerHTML = list.map(([k, label]) => `<button type="button" data-tab="${k}" class="${TAB === k ? "on" : ""}" ${TAB === k ? 'aria-current="page"' : ""}>${label}</button>`).join("");
    t.querySelectorAll("[data-tab]").forEach((b) => { b.onclick = () => { TAB = b.dataset.tab; VIEW = { name: TAB }; EDIT = null; render(); window.scrollTo(0, 0); }; });
  }
}
$("me").onclick = (e) => {
  e.stopPropagation();
  const m = $("menu");
  m.hidden = !m.hidden; $("me").setAttribute("aria-expanded", String(!m.hidden));
  m.innerHTML = `<p class="who">Signed in as <b>${esc(ME?.name)}</b><br>${esc(ME?.email)}${ME?.title && ME.title !== "Board member" ? `<br>${esc(ME.title)}` : ""}</p>
    <button class="btn ghost" id="signout" type="button">Sign out</button>`;
  $("signout").onclick = () => { signOut(); signInScreen(); };
};
document.addEventListener("click", (e) => { if (!$("menu").hidden && !e.target.closest("#menu")) $("menu").hidden = true; });
$("back").onclick = () => history.back();

/* ---------- the photo: made small on the phone, kept on it until it has gone ---------- */
async function shrink(file) {
  const isImage = /^image\//.test(file.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(file.name);
  if (!isImage) return { blob: file, thumb: null, name: file.name || "receipt.pdf" };
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const draw = (max, q) => new Promise((res) => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => res(b), "image/jpeg", q);
    });
    const big = await draw(2000, 0.85), thumb = await draw(180, 0.7);
    const name = (file.name || "receipt").replace(/\.[^.]+$/, "") + ".jpg";
    return { blob: big && (big.size < file.size || !/jpe?g|png/i.test(file.type)) ? big : file, thumb, name };
  } catch { return { blob: file, thumb: null, name: file.name || "receipt.jpg" }; }
  finally { URL.revokeObjectURL(url); }
}
const DB = () => new Promise((res, rej) => { const r = indexedDB.open("ongia-expenses", 1); r.onupgradeneeded = () => r.result.createObjectStore("outbox", { keyPath: "id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const tx = async (mode, fn) => { const db = await DB(); return new Promise((res, rej) => { const t = db.transaction("outbox", mode); const s = t.objectStore("outbox"); const out = fn(s); t.oncomplete = () => res(out?.result); t.onerror = () => rej(t.error); }); };
const outbox = {
  add: (item) => tx("readwrite", (s) => s.put(item)).catch(() => {}),
  del: (id) => tx("readwrite", (s) => s.delete(id)).catch(() => {}),
  all: () => tx("readonly", (s) => s.getAll()).catch(() => []),
};
let WAITING = 0;
async function sendItem(item) {
  const out = await api("?add=receipt", { method: "POST", body: item.blob, headers: { "x-file-name": encodeURIComponent(item.name), "x-upload-id": item.id } });
  if (item.thumb) api(`?claim=${out.claim.id}&thumb=${out.line}`, { method: "POST", body: item.thumb }).catch(() => {});
  await outbox.del(item.id);
  return out;
}
/** A photo: kept on the phone first, then sent. If there's no signal, it stays on the phone and goes later. */
async function addReceipt(file, { open = true } = {}) {
  if (!file) return;
  toast("Saving your receipt…");
  const s = await shrink(file);
  const item = { id: crypto.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`, blob: s.blob, thumb: s.thumb, name: s.name, at: Date.now() };
  await outbox.add(item);
  try {
    const out = await sendItem(item);
    HOME.current = out.claim;
    if (s.thumb) THUMBS.set(`${out.claim.id}:${out.line}`, URL.createObjectURL(s.thumb));
    toast("Saved. Claude is reading it.");
    if (open) { openLine(out.line); } else render();
    pollReading();
  } catch (e) {
    if (e.network) { WAITING = (await outbox.all()).length; toast("No signal. The photo is kept on this phone and will be sent when you're back online.", true); render(); }
    else { await outbox.del(item.id); if (!e.quiet) toast(e.message, true); }
  }
}
async function flushOutbox() {
  const items = await outbox.all();
  WAITING = items.length;
  if (!items.length || !SESSION) return;
  let sent = 0;
  for (const it of items.sort((a, b) => a.at - b.at)) {
    try { const out = await sendItem(it); HOME && (HOME.current = out.claim); sent++; }
    catch (e) { if (e.network) break; if (e.status && e.status !== 401) await outbox.del(it.id); }
  }
  WAITING = (await outbox.all()).length;
  if (sent) { toast(`${sent} photo${sent === 1 ? "" : "s"} kept on this phone ${sent === 1 ? "has" : "have"} now been sent.`); await loadHome(); pollReading(); }
}
window.addEventListener("online", () => flushOutbox());
$("cam").onchange = (e) => { const f = e.target.files?.[0]; e.target.value = ""; addReceipt(f); };
$("pick").onchange = (e) => { const f = e.target.files?.[0]; e.target.value = ""; addReceipt(f); };

/* ---------- small pictures of receipts, fetched with the sign-in ---------- */
const THUMBS = new Map();   // "claim:line" → object URL, or "" when there is none
async function fillThumbs() {
  for (const el of ROOT.querySelectorAll("[data-thumb]")) {
    const key = el.dataset.thumb;
    if (THUMBS.has(key)) { const u = THUMBS.get(key); if (u) el.innerHTML = `<img src="${u}" alt="">`; continue; }
    THUMBS.set(key, "");
    const [c, l] = key.split(":");
    fetch(`/api/expenses?claim=${c}&file=${l}&kind=thumb`, { headers: { "x-expense-key": SESSION } })
      .then((r) => (r.ok ? r.blob() : null)).then((b) => { if (!b) return; const u = URL.createObjectURL(b); THUMBS.set(key, u); document.querySelectorAll(`[data-thumb="${key}"]`).forEach((x) => (x.innerHTML = `<img src="${u}" alt="">`)); })
      .catch(() => {});
  }
}

function checkRow(l) {
  const c = l.check ?? {};
  switch (c.state) {
    case "match": return `<div class="check ok">${ICON.tick} Matches the receipt${c.currency ? ` (in ${esc(c.currency)})` : ""}</div>`;
    case "differs": return `<div class="check wt">The receipt says ${money(c.total)}${c.currency ? ` ${esc(c.currency)}` : ""}</div>`;
    case "noamount": return `<div class="check wt">The receipt says ${money(c.total)}. Type the amount you're claiming.</div>`;
    case "reading": return `<div class="check mu"><span class="spin" style="width:12px;height:12px;margin:0"></span> Reading the receipt…</div>`;
    case "unread": return `<div class="check wt">Claude couldn't read it. Tap to type it in.</div>`;
    case "notreceipt": return `<div class="check bad">That doesn't look like a receipt. Tap to check.</div>`;
    case "nototal": return `<div class="check wt">No total on the receipt. Type the amount.</div>`;
    case "mileage": return `<div class="check mu">${esc(l.km ?? 0)} km × ${money(l.rate)}</div>`;

}

    ${lines.length ? `<div class="card" style="margin-top:16px"><div class="k">When you're done</div>
      <div class="note" style="margin-top:3px">It goes to the ${esc((c?.approvers ?? HOME.approvers).join(" and the "))} for approval. Sending isn't switched on yet, and everything you add is saved until it is.</div></div>` : ""}`;
  $("addcam").onclick = () => $("cam").click();
  $("addpick").onclick = () => $("pick").click();

let POLL = null;
function pollReading() {
  clearTimeout(POLL);
  const started = Date.now();
  const tick = async () => {
    const reading = (HOME?.current?.lines ?? []).some((l) => l.check?.state === "reading");
    if (!reading || Date.now() - started > 150e3) return;
    try {
      const out = await api(`?claim=${HOME.current.id}`);
      HOME.current = out.claim;
      if (EDIT) refreshEditor(); else if (VIEW.name === "claim") render();
    } catch { /* try again next tick */ }
    POLL = setTimeout(tick, 2500);
  };
  POLL = setTimeout(tick, 2000);
}

/* ---------- one line: check a receipt, type mileage, or a line with no receipt ---------- */
const TITLES = { receipt: "Check the receipt", mileage: "Mileage", noreceipt: "No receipt" };
function openNew(kind) {
  EDIT = { kind, lineId: null, claimId: HOME?.current?.id ?? null, touched: new Set(), dirty: false };
  history.pushState({ edit: true }, "");
  editorScreen();
}
function openLine(id) {
  const l = HOME?.current?.lines.find((x) => x.id === id);
  if (!l) return;
  EDIT = { kind: l.kind, lineId: id, claimId: HOME.current.id, touched: new Set(), dirty: false };
  history.pushState({ edit: true }, "");
  editorScreen();
}
const lineNow = () => (EDIT?.lineId ? HOME?.current?.lines.find((x) => x.id === EDIT.lineId) : null);
function catOptions(sel) {
  return `<option value="">Choose a category</option>` + (HOME?.categories ?? []).map((c) => `<option value="${c.n}" ${Number(sel) === c.n ? "selected" : ""}>${c.n} · ${esc(c.name)}</option>`).join("");
}
function eventOptions(sel, title) {
  const evs = HOME?.events ?? [];
  const extra = sel && !evs.some((e) => e.id === sel) ? `<option value="${esc(sel)}" selected>${esc(title || "An earlier event")}</option>` : "";
  return `<option value="">Not for an event</option>${extra}` + evs.map((e) => `<option value="${esc(e.id)}" ${sel === e.id ? "selected" : ""}>${esc(e.title)}${e.date ? ` · ${esc(dayName(e.date).replace(/^\w+,?\s*/, ""))}` : ""}</option>`).join("");
}
const readMark = (l, k) => (l?.fromRead?.includes(k) && !EDIT.touched.has(k) ? `<span class="read" data-readmark="${k}">read</span>` : "");
function editorScreen() {
  const l = lineNow() ?? {};
  const k = EDIT.kind;
  chrome({ title: TITLES[k], back: true, tabs: false });
  const isPdf = l.file?.type === "application/pdf";
  const reading = l.check?.state === "reading";
  const readSay = k !== "receipt" ? "" : reading
    ? `<div class="status"><span class="spin"></span><div class="note">Claude is reading your receipt. The boxes will fill in on their own, and you can keep typing.</div></div>`
    : l.read?.state === "failed" ? `<div class="note">${esc(l.read.why || "Claude couldn't read it.")}</div><button class="linkish" id="again" type="button" style="margin:4px 0 0;padding:0;text-align:left">Read it again</button>`
    : l.check?.state === "notreceipt" ? `<div class="note" style="color:var(--late)">That doesn't look like a receipt. Check the photo, or take it again.</div>`
    : `<div class="note">Read from your receipt. Change anything it got wrong.</div>`;
  const foreign = l.check?.currency ? `<div class="say wt">This receipt is in ${esc(l.check.currency)}. Claim what your card was charged in Canadian dollars, from your card statement.</div>` : "";
  ROOT.innerHTML = `
    ${k === "receipt" ? `<div class="preview"><button class="pic" id="pic" type="button" aria-label="See the whole receipt">${isPdf ? ICON.pdf : ICON.receipt}</button><div id="readsay">${readSay}</div></div>` : ""}
    ${k === "mileage" ? `<p class="note" style="margin:0 0 12px">Kilometres you drove your own car for ONGIA, paid to you at ${money(HOME.rate)} a kilometre.</p>` : ""}
    ${k === "noreceipt" ? `<p class="note" style="margin:0 0 12px">For something you paid for without getting a receipt. Say why, and add a screenshot of the charge on your card statement.</p>` : ""}
    <div id="sayslot"></div>
    ${k !== "mileage" ? `<div class="field"><label for="f-paidTo"><span>Paid to</span>${readMark(l, "paidTo")}</label><input id="f-paidTo" autocomplete="off" value="${esc(l.paidTo ?? "")}" placeholder="${k === "noreceipt" ? "Who you paid" : "The business"}"></div>` : ""}
    <div class="two">
      <div class="field"><label for="f-date"><span>Date</span>${readMark(l, "date")}</label><input id="f-date" type="date" value="${esc(l.date ?? "")}"></div>
      ${k === "mileage"
        ? `<div class="field"><label for="f-km"><span>Kilometres</span></label><input id="f-km" inputmode="decimal" autocomplete="off" value="${esc(l.km ?? "")}" placeholder="0"></div>`
        : `<div class="field"><label for="f-amount"><span>${k === "receipt" ? "Total" : "Amount"}</span>${readMark(l, "amount")}</label><input id="f-amount" inputmode="decimal" autocomplete="off" value="${l.amount === null || l.amount === undefined ? "" : esc(Number(l.amount).toFixed(2))}" placeholder="0.00"></div>`}
    </div>
    ${k === "receipt" ? `<div id="matchrow" style="margin:-4px 0 10px"></div>${foreign}` : ""}
    ${k === "mileage" ? `<div class="two"><div class="field"><label for="f-from">From</label><input id="f-from" autocomplete="off" value="${esc(l.from ?? "")}" placeholder="Barrie"></div>
      <div class="field"><label for="f-to">To</label><input id="f-to" autocomplete="off" value="${esc(l.to ?? "")}" placeholder="Toronto"></div></div>
      <div class="calc" id="calc"></div>` : ""}
    <div class="field"><label for="f-category"><span>Category</span>${readMark(l, "category")}</label><select id="f-category">${catOptions(l.category ?? (k === "mileage" ? 8 : ""))}</select></div>
    <div class="field"><label for="f-event">For which event?</label><select id="f-event">${eventOptions(l.eventId ?? "", l.eventTitle)}</select></div>
    <div class="field"><label for="f-purpose"><span>What it was for</span>${readMark(l, "purpose")}</label><input id="f-purpose" autocomplete="off" value="${esc(l.purpose ?? "")}" placeholder="${k === "mileage" ? "Drive to the training" : "Hotel for the presenters"}"></div>
    ${k === "noreceipt" ? `<div class="field"><label for="f-statement">Why is there no receipt?</label><textarea id="f-statement" placeholder="The parking machine didn't print one. The charge is on my Visa.">${esc(l.statement ?? "")}</textarea></div>
      <div class="field"><div class="lab">Card statement</div><div class="shotbox" id="shotbox"></div></div>` : ""}
    <button class="btn gold" id="save" type="button" style="margin-top:6px">${EDIT.lineId ? "Save" : "Add to my claim"}</button>
    <p class="tiny" style="text-align:center;margin:8px 0 0">Saved as you go. Nothing is sent until you submit.</p>
    ${EDIT.lineId ? `<button class="btn danger" id="remove" type="button" style="margin-top:14px">Remove this line</button>` : ""}`;
  for (const id of ["paidTo", "date", "amount", "km", "from", "to", "category", "event", "purpose", "statement"]) {
    const el = $(`f-${id}`); if (!el) continue;
    el.addEventListener("input", () => { EDIT.dirty = true; EDIT.touched.add(id === "event" ? "eventId" : id); document.querySelector(`[data-readmark="${id}"]`)?.remove(); liveChecks(); });
    el.addEventListener("change", () => { EDIT.dirty = true; EDIT.touched.add(id === "event" ? "eventId" : id); liveChecks(); });
  }
  $("save").onclick = () => saveLine({ leave: true });
  if ($("remove")) $("remove").onclick = removeLine;
  if ($("again")) $("again").onclick = readAgain;
  if ($("pic")) { $("pic").onclick = showWhole; showPic(); }
  if (k === "noreceipt") drawShot();
  liveChecks();
}
function liveChecks() {
  const l = lineNow();
  if ($("calc")) {
    const km = parseMoney($("f-km").value);
    $("calc").innerHTML = km > 0 ? `${km} km × ${money(HOME.rate)} = <b>${money(Math.round(km * HOME.rate * 100) / 100)}</b>, paid to you` : `At ${money(HOME.rate)} a kilometre, paid to you`;
  }
  if ($("matchrow") && l) {
    const total = l.read?.found?.total;
    const typed = $("f-amount").value.trim() === "" ? null : parseMoney($("f-amount").value);
    $("matchrow").innerHTML = total === null || total === undefined || l.read?.found?.isReceipt === false ? ""
      : typed !== null && Math.abs(typed - total) < 0.005 ? `<div class="check ok">${ICON.tick} Matches the receipt</div>`
      : `<div class="check wt">The receipt says ${money(total)}</div>`;
  }
}
/** The reading finished while the editor was open: fill only the boxes the person hasn't touched and left empty. */
function refreshEditor() {
  const l = lineNow();
  if (!l || EDIT.kind !== "receipt") return;
  for (const k of l.fromRead ?? []) {
    const el = $(`f-${k}`);
    if (!el || EDIT.touched.has(k) || el.value) continue;
    el.value = k === "amount" ? Number(l[k]).toFixed(2) : l[k];
    const lab = el.closest(".field")?.querySelector("label");
    if (lab && !lab.querySelector(".read")) lab.insertAdjacentHTML("beforeend", `<span class="read" data-readmark="${k}">read</span>`);
  }
  const say = $("readsay");
  if (say && l.check?.state !== "reading") {
    say.innerHTML = l.read?.state === "failed" ? `<div class="note">${esc(l.read.why)}</div><button class="linkish" id="again" type="button" style="margin:4px 0 0;padding:0;text-align:left">Read it again</button>`
      : l.check?.state === "notreceipt" ? `<div class="note" style="color:var(--late)">That doesn't look like a receipt. Check the photo, or take it again.</div>`
      : `<div class="note">Read from your receipt. Change anything it got wrong.</div>`;
    if ($("again")) $("again").onclick = readAgain;
    if (l.check?.currency && !ROOT.querySelector(".say.wt")) $("matchrow")?.insertAdjacentHTML("afterend", `<div class="say wt">This receipt is in ${esc(l.check.currency)}. Claim what your card was charged in Canadian dollars, from your card statement.</div>`);
  }
  liveChecks();
}
function formValues() {
  const v = (id) => $(`f-${id}`)?.value ?? "";
  const num = (s) => (String(s).trim() === "" ? "" : parseMoney(s));
  return { paidTo: v("paidTo"), date: v("date"), amount: num(v("amount")), km: num(v("km")), from: v("from"), to: v("to"),
    category: v("category"), eventId: v("event"), purpose: v("purpose"), statement: v("statement") };
}
async function saveLine({ leave = false } = {}) {
  const btn = $("save"); if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const body = formValues();
    let out;
    if (EDIT.lineId) out = await api(`?claim=${EDIT.claimId}&line=${EDIT.lineId}`, { method: "PUT", json: body });
    else { out = await api(`?add=${EDIT.kind}${EDIT.claimId ? `&claim=${EDIT.claimId}` : ""}`, { method: "POST", json: body }); EDIT.lineId = out.line; EDIT.claimId = out.claim.id; }
    HOME.current = out.claim; EDIT.dirty = false;
    if (leave) { toast("Saved to your claim."); history.back(); }
    return true;
  } catch (e) {
    if (!e.quiet) toast(e.message, true);
    if (btn) { btn.disabled = false; btn.textContent = EDIT?.lineId ? "Save" : "Add to my claim"; }
    return false;
  }
}
async function leaveEditor() {
  // Going back keeps what was typed: a person shouldn't lose a half-finished line to the back button.
  if (EDIT?.dirty && (EDIT.lineId || Object.values(formValues()).some((x) => x !== "" && x !== null))) await saveLine();
  EDIT = null; VIEW = { name: "claim" }; TAB = "claim";
  render(); window.scrollTo(0, 0);
}
async function removeLine() {
  if (!confirm("Remove this line from your claim?")) return;
  try { const out = await api(`?claim=${EDIT.claimId}&line=${EDIT.lineId}`, { method: "DELETE" }); HOME.current = out.claim; EDIT.dirty = false; toast("Removed."); history.back(); }
  catch (e) { if (!e.quiet) toast(e.message, true); }
}
async function readAgain() {
  try { const out = await api(`?claim=${EDIT.claimId}&again=${EDIT.lineId}`, { method: "POST" }); HOME.current = out.claim; editorScreen(); pollReading(); }
  catch (e) { if (!e.quiet) toast(e.message, true); }
}
const FULL = new Map();
async function fullFile(kind = "file") {
  const key = `${EDIT.claimId}:${EDIT.lineId}:${kind}`;
  if (FULL.has(key)) return FULL.get(key);
  const r = await fetch(`/api/expenses?claim=${EDIT.claimId}&file=${EDIT.lineId}${kind === "file" ? "" : `&kind=${kind}`}`, { headers: { "x-expense-key": SESSION } });
  if (!r.ok) return null;
  const b = await r.blob(); const out = { url: URL.createObjectURL(b), type: b.type };
  FULL.set(key, out); return out;
}
async function showPic() {
  const l = lineNow(); if (!l || l.file?.type === "application/pdf") return;
  const small = THUMBS.get(`${EDIT.claimId}:${EDIT.lineId}`);
  if (small) $("pic").innerHTML = `<img src="${small}" alt="Your receipt">`;
  const f = await fullFile(); if (f && $("pic")) $("pic").innerHTML = `<img src="${f.url}" alt="Your receipt">`;
}
async function showWhole() {
  const f = await fullFile(); if (!f) return toast("Couldn't open the receipt.", true);
  if (/pdf/.test(f.type)) { window.open(f.url, "_blank"); return; }
  const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.innerHTML = `<img src="${f.url}" alt="Your receipt">`;
  bg.onclick = () => bg.remove(); document.body.append(bg);
}
async function drawShot() {
  const l = lineNow();
  const box = $("shotbox"); if (!box) return;
  box.innerHTML = l?.shot
    ? `<div class="thumb" id="shotthumb">${/pdf/.test(l.shot.type) ? ICON.pdf : ICON.note}</div><div style="flex:1"><div class="check ok">${ICON.tick} Added</div><div class="tiny">${esc(l.shot.name)}</div></div><button class="btn ghost" id="shotadd" type="button" style="width:auto;padding:9px 14px;min-height:40px;font-size:14px">Replace</button>`
    : `<button class="btn ghost" id="shotadd" type="button">${ICON.camera}<span>Add a screenshot of the charge</span></button>`;
  $("shotadd").onclick = async () => {
    if (!EDIT.lineId) { if (!(await saveLine())) return; editorScreen(); }
    $("shotpick").click();
  };
  if (l?.shot && !/pdf/.test(l.shot.type)) { const f = await fullFile("shot"); if (f && $("shotthumb")) $("shotthumb").innerHTML = `<img src="${f.url}" alt="">`; }
}
$("shotpick").onchange = async (e) => {
  const file = e.target.files?.[0]; e.target.value = ""; if (!file || !EDIT?.lineId) return;
  if (EDIT.dirty) await saveLine();
  toast("Adding the card statement…");
  const s = await shrink(file);
  try {
    const out = await api(`?claim=${EDIT.claimId}&shot=${EDIT.lineId}`, { method: "POST", body: s.blob, headers: { "x-file-name": encodeURIComponent(s.name) } });
    HOME.current = out.claim; FULL.delete(`${EDIT.claimId}:${EDIT.lineId}:shot`); toast("Card statement added."); drawShot();
  } catch (err) { if (!err.quiet) toast(err.message, true); }
};

/* ---------- past claims, and claims to approve ---------- */
function pastScreen() {
  chrome({ title: "Past claims", back: false });
  const past = HOME?.past ?? [];
  ROOT.innerHTML = past.length
    ? past.map((c) => `<div class="card"><div class="k">${esc(c.month || "")} · ${esc(c.status)}</div><div style="font-weight:600;margin-top:2px">${c.total !== null ? money(c.total) : ""}</div></div>`).join("")
    : `<div class="empty"><div class="big">Nothing sent yet</div>Claims you send show up here, each with where it stands: waiting for approval, approved or paid.</div>`;
}
function approveScreen() {
  chrome({ title: "To approve", back: false });
  ROOT.innerHTML = `<div class="empty"><div class="big">Nothing waiting for you</div>When a board member sends a claim that needs your approval, it shows here.</div>`;
}

function render() {
  if (!SESSION) return signInScreen();
  if (!HOME) { chrome({ title: "ONGIA Expenses", back: false, tabs: false }); ROOT.innerHTML = `<div class="empty"><span class="spin" style="display:inline-block"></span></div>`; return; }
  if (EDIT) return editorScreen();
  if (VIEW.name === "past") return pastScreen();
  if (VIEW.name === "approve") return approveScreen();
  return claimScreen();
}

/* ---------- start ---------- */
(async () => {
  const done = await finishMicrosoft().catch((e) => e.message);
  if (typeof done === "string") { store.set("ongia-xms-pick", "1"); return signInScreen(done); }
  if (!SESSION) return signInScreen();
  render();
  try { await loadHome(); await flushOutbox(); if ((HOME?.current?.lines ?? []).some((l) => l.check?.state === "reading")) pollReading(); }
  catch (e) { if (!e.quiet) { ROOT.innerHTML = `<div class="say bad">${esc(e.message)}</div><button class="btn ghost" id="reload" type="button">Try again</button>`; $("reload").onclick = () => location.reload(); } }
})();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && SESSION && HOME && !EDIT) loadHome().then(flushOutbox).catch(() => {}); });
</script>
</body>
</html>
