<style>
  :root{
    color-scheme:light;
    --paper:#f2efe8; --card:#fafaf7; --sunk:#edeae2;
    --ink:#12161f; --ink-mid:#2c3448; --muted:#596176;
    --navy:#1a2f5e; --navy-deep:#0e1a35;
    --gold:#b8922a; --gold-light:#d9ae4b; --gold-pale:#f4ecd6;
    --border:#ddd7c8; --edge:#bfb49a;
    --done:#2f6b4f; --done-bg:#e2efe7;
    --wait:#8a5d0c; --wait-bg:#f8ecd5;
    --late:#a33328; --late-bg:#f7e3e0;
    --fd:"DM Serif Display",Georgia,serif;

    --fu:"Oswald","Arial Narrow",sans-serif;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;-webkit-text-size-adjust:100%}
  body{min-height:100vh;padding-bottom:calc(64px + var(--safe-bottom))}
  html{overscroll-behavior-y:none}   /* the app's own pull to refresh, below, instead of the page bouncing */
  .ptr{position:fixed;left:50%;top:calc(var(--safe-top) + 60px);z-index:4;transform:translate(-50%,-56px);display:flex;align-items:center;gap:8px;background:#fff;color:var(--navy);border:1px solid var(--edge);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(14,26,53,.16);opacity:0;pointer-events:none;white-space:nowrap}
  .ptr.on{opacity:1}.ptr.fading{transition:transform .2s ease,opacity .2s ease}.ptr .spin{margin:0}
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}
  .top{position:sticky;top:0;z-index:5;background:var(--navy-deep);color:#fff;border-bottom:3px solid var(--gold);padding:calc(10px + var(--safe-top)) 14px 10px;display:flex;align-items:center;gap:8px;min-height:54px}
  .top h1{font-family:var(--fd);font-weight:400;font-size:21px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:4px 10px 6px 2px;cursor:pointer;opacity:.9}

  .menu{position:absolute;right:12px;top:calc(100% + 6px);background:#fff;color:var(--ink);border:1px solid var(--edge);border-radius:12px;box-shadow:0 10px 30px rgba(14,26,53,.18);padding:12px 14px;width:260px;font-size:14px}
  .menu .who{color:var(--ink-mid);margin:0 0 10px;line-height:1.35}
  main{max-width:560px;margin:0 auto;padding:14px 16px 24px}
  .card{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;margin:0 0 10px}
  .k{font-family:var(--fu);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  .run{background:var(--navy-deep);color:#fff;border-radius:16px;padding:14px 16px 15px;margin:0 0 12px}

  .run .big{font-family:var(--fd);font-size:38px;line-height:1.08;margin:2px 0 3px;font-variant-numeric:tabular-nums}

  .btn:disabled{opacity:.55;cursor:default}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1404}
  .btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}

  .day{font-family:var(--fu);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 2px 5px}
  .lines{padding:2px 12px}
  .line{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--border);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}

  .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;font-size:15.5px}
  .check{font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:4px}
  .check.ok{color:var(--done)}.check.wt{color:var(--wait)}.check.bad{color:var(--late)}.check.mu{color:var(--muted)}
  .needs{font-size:12.5px;color:var(--wait);margin-top:2px}
  .note{font-size:13.5px;color:var(--ink-mid);line-height:1.45}

  .empty{text-align:center;padding:26px 10px;color:var(--ink-mid)}

  .field{margin:0 0 11px}

  input,select,textarea{width:100%;background:#fff;border:1px solid var(--edge);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);min-height:46px}

  .say.wt{background:var(--wait-bg);color:var(--wait);border:1px solid #e5c98c}

  .shotbox{display:flex;align-items:center;gap:10px}
  .shotbox .thumb{width:40px;height:50px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px max(0px,calc((100vw - 560px) / 2)) calc(6px + var(--safe-bottom))}
  .tabs button{background:none;border:0;font-size:13px;color:var(--muted);padding:8px 10px;min-height:44px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .tabs button.on{color:var(--navy);font-weight:700}
  .tabs .n{background:var(--late);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px;font-weight:700}
  .signin{max-width:400px;margin:36px auto 0;text-align:center}
  .signin img.icon{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(14,26,53,.25)}
  .signin h2{font-family:var(--fd);font-weight:400;font-size:28px;margin:14px 0 4px;color:var(--navy-deep)}
  .signin p{color:var(--ink-mid);margin:0 0 20px;font-size:15px;line-height:1.45}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-bottom));background:var(--navy-deep);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;max-width:min(92vw,480px);box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9;pointer-events:none}
  .toast.bad{background:var(--late)}
  .sheet-bg{position:fixed;inset:0;background:rgba(14,26,53,.82);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
  .sheet-bg img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
  .pdfrow{display:flex;align-items:center;gap:10px}
  .hint{font-size:12.5px;color:var(--muted);margin:-6px 0 11px;line-height:1.4}
  .pill{display:inline-block;font-family:var(--fu);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:2px 9px;font-weight:500;vertical-align:middle;white-space:nowrap}
  .pill.ok{background:var(--done-bg);color:var(--done)}.pill.wt{background:var(--wait-bg);color:var(--wait)}.pill.bad{background:var(--late-bg);color:var(--late)}.pill.mu{background:var(--sunk);color:var(--muted)}.pill.test{background:#2c3448;color:#fff}
  .allok{background:var(--done-bg);border:1.5px solid #9cc7b0;border-radius:14px;padding:12px 14px;margin:0 0 10px;display:flex;gap:11px}
  .allok .tick{width:30px;height:30px;border-radius:50%;background:var(--done);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .allok b{color:var(--done)}
  .looks{background:var(--wait-bg);border:1.5px solid #e5c98c;border-radius:14px;padding:12px 14px;margin:0 0 10px}
  .looks b{color:var(--wait)}.looks ul{margin:6px 0 0;padding-left:18px}.looks li{margin:4px 0;font-size:14px;line-height:1.4;color:var(--ink-mid)}
  .bigbtns{display:flex;gap:10px;margin:4px 0 10px}.bigbtns .btn{flex:1;padding:15px 10px;font-size:17px;min-height:54px}
  .btn.green{background:var(--done);border-color:var(--done);color:#fff}.btn.green:disabled{opacity:1}.btn.red{background:var(--late);border-color:var(--late);color:#fff}
  .btn.dim{opacity:.4}
  .stamp{background:var(--done-bg);border-radius:12px;padding:12px 14px;color:var(--done);font-weight:600;display:flex;gap:10px;align-items:center;margin:0 0 10px;font-size:15px}
  .stamp span{font-weight:400}
  .sentback{background:var(--late-bg);border:1.5px solid #e2a79f;border-radius:14px;padding:12px 14px;margin:0 0 12px}
  .sentback b{color:var(--late)}
  .quote{white-space:pre-wrap;margin-top:4px}
  .slot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14.5px}.slot:first-of-type{border-top:0}
  .slot>div:first-child{min-width:0;flex:1}.slot .r{flex:none;font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}.slot .r.ok{color:var(--done);font-weight:600}.slot .r.you{color:var(--wait);font-weight:600}
  .lock{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:11px 13px;font-size:13.5px;margin:0 0 10px;line-height:1.4}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.chips button{border:1px solid var(--edge);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;min-height:38px;cursor:pointer}.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .testbar{background:repeating-linear-gradient(135deg,#2c3448 0 10px,#39425a 10px 20px);color:#fff;font-size:13px;padding:8px 14px;text-align:center;border-radius:10px;margin:0 0 12px}
  .rowbtn{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .rowbtn:first-child{border-top:0}.rowbtn .w{font-weight:600;font-size:15px}.rowbtn .s{font-size:13px;color:var(--muted);margin-top:2px}
  details.more{margin:0 0 10px}details.more>summary{cursor:pointer;font-size:14px;color:var(--navy);padding:8px 2px;list-style:none}details.more>summary::-webkit-details-marker{display:none}
  details.more>summary:before{content:"›";display:inline-block;margin-right:6px;transition:transform .15s}details.more[open]>summary:before{transform:rotate(90deg)}
  .hist li{font-size:13px;color:var(--ink-mid);margin:4px 0;line-height:1.4}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;font-size:14px;line-height:1.35;cursor:pointer}
  .switch input{width:22px;height:22px;min-height:0;flex:none}
  .btn.small{width:auto;min-height:44px;padding:8px 18px;font-size:15px;flex:none}
  .say .acts{display:flex;align-items:center;gap:6px;margin-top:10px}.say .acts .linkish{margin:0}
  .sheet{position:fixed;inset:0;background:var(--paper);z-index:20;overflow:auto;padding-bottom:30px}
  /* The receipt viewer: full screen, the receipt alone zooms (Andrew, 3 Nov 2026). */
  .viewer{position:fixed;inset:0;z-index:40;background:#0b1222;color:#fff;display:flex;flex-direction:column;touch-action:none;overscroll-behavior:contain}
  .viewer .vtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(8px + var(--safe-top)) 12px 6px 16px;font-size:15px;font-weight:600}
  .viewer .vclose{width:46px;height:46px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:20px;line-height:1;cursor:pointer;flex:none}
  .viewer .vstage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
  .viewer .vimg{max-width:calc(100% - 16px);max-height:calc(100% - 8px);transform-origin:center center;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;border-radius:4px;background:#fff}
  .viewer .vimg.settle{transition:transform .18s ease-out}
  .viewer .vmsg{color:#c9d3e6;font-size:15px;text-align:center;padding:20px}

  .viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:30px;cursor:pointer}
  .viewer .vnav[hidden]{display:none}.viewer .vprev{left:8px}.viewer .vnext{right:8px}

  .viewer .vcap .flag{color:#f2c46d;font-weight:600}.viewer .vcap .tiny{color:#9fb0cc;margin-top:4px}

  .center{text-align:center}

<body>
<header class="top" id="top">
  <button class="back" id="back" type="button" aria-label="Back" hidden>‹</button>
  <h1 id="title">ONGIA Expenses</h1>
  <button class="me" id="me" type="button" hidden aria-haspopup="true" aria-expanded="false"></button>
  <div class="menu" id="menu" hidden></div>
</header>
<main id="root" aria-live="polite"></main>
<nav class="tabs" id="tabs" hidden></nav>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pick" accept="image/*,application/pdf" hidden>
<input type="file" id="shotpick" accept="image/*,application/pdf" hidden>
<script type="module">
/* ONGIA Expenses: a board member's expense claims, on their phone. The Briefing Room runs it behind the scenes
   (/api/expenses); this page signs in with the member's ONGIA Microsoft account and opens nothing but their claims. */
const $ = (id) => document.getElementById(id);
const ROOT = $("root");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (n) => (Number(n) || 0).toLocaleString("en-CA", { style: "currency", currency: "CAD" });
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
// The year shows when it isn't this year, so a receipt dated January 2023 doesn't read as this January.
// A speaker stipend is paid by ONGIA: no receipt, reason or card statement (Andrew, 3 Nov 2026). Category 10, as on the server.
const STIPEND = 10;
const stipendLine = (l) => Number(l?.category) === STIPEND;
const NR_INTRO = ["For something you paid for without getting a receipt. Say why, and add a screenshot of the charge on your card statement. A speaker stipend needs neither: pick Speaker Stipend as the category.",
  "A speaker stipend needs no receipt, no reason and no card statement. Fill in who it was paid to, the amount and the event."];
const dayName = (iso) => { const d = new Date(`${iso}T12:00:00`); return d.toLocaleDateString("en-CA", { weekday: "short", month: "short", day: "numeric", ...(d.getFullYear() !== new Date().getFullYear() ? { year: "numeric" } : {}) }); };
// "12,50" is twelve fifty; "1,250.00" is twelve hundred and fifty.
const parseMoney = (s) => { const t = String(s ?? "").replace(/[$\s]/g, ""); return Number(/^\d+,\d{1,2}$/.test(t) ? t.replace(",", ".") : t.replace(/,/g, "")); };
/*
 * A money box works like a till (Andrew, 3 Nov 2026: "when I manually type an amount in, I don't want to enter the
 * decimal ... and it should show as a $"). The digits fill in from the cents: 4 2 5 0 reads $42.50, and backspace takes
 * the last digit off. The phone shows its number pad. A pasted amount with its own decimal point is read as written.
 */
const tillText = (n) => (n === null || n === undefined || n === "" || !Number.isFinite(Number(n)) ? "" : "$" + Number(n).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
function tillBox(el) {
  if (!el) return;
  el.addEventListener("input", (e) => {
    let n = null;
    if (/^insertFrom(Paste|Drop)$|^insertReplacementText$/.test(e.inputType ?? "") && /[.,]\d{1,2}\s*$/.test(el.value)) n = parseMoney(el.value);
    else { const d = el.value.replace(/\D/g, "").replace(/^0+/, "").slice(0, 9); n = d ? Number(d) / 100 : null; }
    el.value = tillText(Number.isFinite(n) ? n : null);

// Microsoft knows the desk's sign-in page as the way back, so the reply comes to /admin.html, which hands it straight
// on to /expenses (see the top of admin.html). The verifier is kept in localStorage so it survives that hop.
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function startMicrosoft() {

  const verifier = randomCode(), state = randomCode(), nonce = randomCode();
  const challenge = b64u(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  store.set("ongia-xms", JSON.stringify({ verifier, state, nonce, at: Date.now() }));
  const q = new URLSearchParams({ client_id: ms.client, response_type: "code", response_mode: "fragment", redirect_uri: RETURN(),
    scope: "openid profile email", state, nonce, code_challenge: challenge, code_challenge_method: "S256" });
  if (store.get("ongia-xms-pick")) { q.set("prompt", "select_account"); store.del("ongia-xms-pick"); }
  location.assign(`${ms.authority}/oauth2/v2.0/authorize?${q}`);
}
/** Back from Microsoft: true when signed in, words when not, null when this wasn't a sign-in. */
async function finishMicrosoft() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (!p.has("code") && !p.has("error")) return null;
  let saved = null; try { saved = JSON.parse(store.get("ongia-xms") || "null"); } catch {}
  store.del("ongia-xms");
  history.replaceState(null, "", location.pathname);
  const first = (t) => String(t ?? "").split(/\r?\n|Trace ID/)[0].trim();
  if (p.has("error")) return first(p.get("error_description")) || "Microsoft sign-in was cancelled.";
  if (!saved || p.get("state") !== saved.state || Date.now() - saved.at > 20 * 60e3) return "That sign-in didn't start here. Please try again.";
  const { microsoft: ms } = await authConfig();
  if (!ms) return "Microsoft sign-in isn't set up on this site yet.";
  const tok = await fetch(`${ms.authority}/oauth2/v2.0/token`, {
    method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: ms.client, grant_type: "authorization_code", code: p.get("code"),
      redirect_uri: RETURN(), code_verifier: saved.verifier, scope: "openid profile email" }),
  }).then((r) => r.json()).catch(() => ({}));
  if (!tok.id_token) return first(tok.error_description) || "Microsoft didn't finish the sign-in. Please try again.";
  const res = await fetch("/api/expenses?signin=1", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ idToken: tok.id_token, nonce: saved.nonce }) });
  const out = await res.json().catch(() => ({}));

}

/*
 * Pull down to refresh (Andrew, 3 Nov 2026): a home-screen app has no reload button. At the top of a screen, pulling
 * down past the mark and letting go loads the app again: the newest version, and everything fresh. Never in a form
 * (a receipt, mileage, no receipt), a full-screen view or a screen with something typed in, where a reload would lose
 * it. Photos waiting to
 * go are kept on the phone and still go after it.
 */
(() => {
  const MARK = 72;
  const pill = document.createElement("div");
  pill.className = "ptr"; pill.setAttribute("aria-hidden", "true");
  document.body.append(pill);
  // Nor while anything has been typed on the screen: a reason for sending a claim back, a payment reference, away dates.
  const typed = () => [...ROOT.querySelectorAll("input, textarea")].some((x) => !/^(hidden|checkbox|radio|file|button|submit)$/.test(x.type) && x.value !== x.defaultValue);
  const can = () => !EDIT && !document.querySelector(".sheet, .viewer") && $("menu").hidden && window.scrollY <= 0 && !typed();
  let y0 = null, pulled = 0;
  const hide = () => { pill.classList.add("fading"); pill.classList.remove("on"); pill.style.transform = ""; };
  addEventListener("touchstart", (e) => { y0 = e.touches.length === 1 && can() ? e.touches[0].clientY : null; pulled = 0; }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (y0 === null) return;
    pulled = e.touches[0].clientY - y0;
    if (pulled <= 8 || window.scrollY > 0) { hide(); return; }
    pill.classList.remove("fading"); pill.classList.add("on");
    pill.style.transform = `translate(-50%, ${Math.min(pulled, MARK * 1.5) * 0.7 - 56}px)`;
    pill.textContent = pulled >= MARK ? "Let go to refresh" : "Pull down to refresh";
  }, { passive: true });
  const end = () => {
    if (y0 === null) return;
    y0 = null;
    if (pulled >= MARK && can()) { pill.innerHTML = `<span class="spin"></span><span>Refreshing…</span>`; location.reload(); }
    else hide();

/* ---------- the photo: made small on the phone, kept on it until it has gone ---------- */
async function shrink(file) {
  const isImage = /^image\//.test(file.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(file.name);
  if (!isImage) return { blob: file, thumb: null, name: file.name || "receipt.pdf" };
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const draw = (max, q) => new Promise((res) => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => res(b), "image/jpeg", q);
    });
    const big = await draw(2000, 0.85), thumb = await draw(180, 0.7);
    const name = (file.name || "receipt").replace(/\.[^.]+$/, "") + ".jpg";
    return { blob: big && (big.size < file.size || !/jpe?g|png/i.test(file.type)) ? big : file, thumb, name };
  } catch { return { blob: file, thumb: null, name: file.name || "receipt.jpg" }; }
  finally { URL.revokeObjectURL(url); }
}
const DB = () => new Promise((res, rej) => { const r = indexedDB.open("ongia-expenses", 1); r.onupgradeneeded = () => r.result.createObjectStore("outbox", { keyPath: "id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

const outbox = {
  add: (item) => tx("readwrite", (s) => s.put(item)).catch(() => {}),
  del: (id) => tx("readwrite", (s) => s.delete(id)).catch(() => {}),
  all: () => tx("readonly", (s) => s.getAll()).catch(() => []),
};
let WAITING = 0;
async function sendItem(item) {
  const out = await api(`?add=receipt${item.where ?? ""}`, { method: "POST", body: item.blob, headers: { "x-file-name": encodeURIComponent(item.name), "x-upload-id": item.id } });
  if (item.thumb) api(`?claim=${out.claim.id}&thumb=${out.line}`, { method: "POST", body: item.thumb }).catch(() => {});
  await outbox.del(item.id);

}
/** A photo: kept on the phone first, then sent. If there's no signal, it stays on the phone and goes later. */
async function addReceipt(file, { open = true } = {}) {
  if (!file) return;
  toast("Saving your receipt…");
  const s = await shrink(file);
  const item = { id: crypto.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`, blob: s.blob, thumb: s.thumb, name: s.name, at: Date.now(), where: whereTo() };
  await outbox.add(item);
  try {
    const out = await sendItem(item);
    HOME.current = out.claim;
    if (s.thumb) THUMBS.set(`${out.claim.id}:${out.line}`, URL.createObjectURL(s.thumb));
    toast("Saved. Claude is reading it.");
    if (open) { openLine(out.line); } else render();
    pollReading();
  } catch (e) {
    if (e.network) { WAITING = (await outbox.all()).length; toast("No signal. The photo is kept on this phone and will be sent when you're back online.", true); render(); }
    else { await outbox.del(item.id); if (!e.quiet) toast(e.message, true); }

/** Where a new line goes: the claim on screen, else a new one (a test one in test mode). */
const whereTo = () => (HOME?.current?.canEdit ? `&claim=${HOME.current.id}` : TESTMODE() ? "&test=1" : "");
async function flushOutbox() {
  const items = await outbox.all();
  WAITING = items.length;
  if (!items.length || !SESSION) return;
  let sent = 0;
  for (const it of items.sort((a, b) => a.at - b.at)) {
    try { const out = await sendItem(it); HOME && (HOME.current = out.claim); sent++; }
    catch (e) { if (e.network) break; if (e.status && e.status !== 401) await outbox.del(it.id); }
  }
  WAITING = (await outbox.all()).length;

}
window.addEventListener("online", () => flushOutbox());

/*
 * The count on the icon on an iPhone (Andrew, 3 Nov 2026: "add the allow button for the badge"). An iPhone shows a

function badgeState() {

  if (said === "granted") { paintBadge(); toast("Done. The count shows on the app icon."); }
  else if (said === "denied") toast("Your phone said no. You can turn it on in Settings, Notifications, ONGIA Expenses.", true);
  $("badgeask")?.remove();

}

async function deleteClaim() {

let POLL = null;
function pollReading() {
  clearTimeout(POLL);
  const started = Date.now();
  const tick = async () => {
    const reading = (HOME?.current?.lines ?? []).some((l) => l.check?.state === "reading");
    if (!reading || Date.now() - started > 150e3) return;
    try {
      const out = await api(`?claim=${HOME.current.id}`);
      HOME.current = out.claim;
      if (EDIT) refreshEditor(); else if (VIEW.name === "claim") render();
    } catch { /* try again next tick */ }
    POLL = setTimeout(tick, 2500);
  };
  POLL = setTimeout(tick, 2000);
}

async function lineSheet(c, l) {
  if (!l) return;
  const cat = HOME?.categories?.find((x) => x.n === Number(l.category));
  const kv = (k, v) => (v || v === 0 ? `<div class="kv"><span class="k2">${esc(k)}</span><span class="v">${esc(v)}</span></div>` : "");
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<header class="top"><button class="back" type="button" aria-label="Back" data-close>‹</button><h1>${esc(l.kind === "mileage" ? "Mileage" : l.paidTo || "Receipt")}</h1></header>
    <main>${l.kind === "receipt" || l.shot ? `<div id="sheetpic" class="card" style="text-align:center;padding:10px"><span class="spin" style="display:inline-block"></span></div>` : ""}
    <div class="card">${kv("Paid to", l.paidTo)}${kv("Date", l.date ? longDate(l.date) : "")}${kv("Amount", l.amount === null || l.amount === undefined ? "" : money(l.amount))}
      ${l.kind === "mileage" ? kv("Distance", `${l.km} km × ${money(l.rate)}`) + kv("From", l.from) + kv("To", l.to) : ""}
      ${kv("Category", cat ? `${cat.n} · ${cat.name}` : "")}${kv("Event", l.eventTitle)}${kv("What it was for", l.purpose)}</div>
    ${l.kind === "receipt" ? `<div class="card">${checkRow(l) || `<div class="note">Not checked against the receipt.</div>`}</div>` : ""}
    ${l.kind === "noreceipt" && stipendLine(l) ? `<div class="card"><div class="check mu">Speaker stipend: no receipt needed</div></div>` : ""}
    ${l.kind === "noreceipt" && !stipendLine(l) ? `<div class="card"><div class="check wt">Amount not confirmed</div><div class="note">Compare ${esc(money(l.amount))} with the charge on the card statement${l.shot ? " above" : ""}.</div></div>
      <div class="card"><div class="k">Why there's no receipt</div><div class="note quote">${esc(l.statement)}</div></div>` : ""}</main>`;
  document.body.append(el);
  history.pushState({ sheet: true }, "");
  el.querySelector("[data-close]").onclick = () => history.back();
  const kind = l.kind === "noreceipt" ? "shot" : "file";
  if (!el.querySelector("#sheetpic")) return;
  try {
    const r = await fetch(`/api/expenses?claim=${encodeURIComponent(c.id)}&file=${encodeURIComponent(l.id)}${kind === "shot" ? "&kind=shot" : ""}`, { headers: { "x-expense-key": SESSION } });
    if (!r.ok) throw new Error();
    const b = await r.blob(); const u = URL.createObjectURL(b);
    FULL.set(`${c.id}:${l.id}:${kind}`, { url: u, type: b.type });
    el.querySelector("#sheetpic").innerHTML = /pdf/.test(b.type) ? `<a class="btn ghost" href="${u}" target="_blank" rel="noopener">Open the PDF</a>` : `<button class="zoomin" id="zoomin" type="button" aria-label="Look closer at the ${kind === "shot" ? "card statement" : "receipt"}"><img src="${u}" alt="The ${kind === "shot" ? "card statement" : "receipt"}" style="max-width:100%;border-radius:8px"></button><div class="tiny" style="margin-top:6px">${kind === "shot" ? "The card statement. " : ""}Tap it to zoom in.</div>`;
    const z = el.querySelector("#zoomin"); if (z) z.onclick = () => openViewer(c, l.id);
  } catch { el.querySelector("#sheetpic").innerHTML = `<div class="note">Couldn't load the picture.</div>`; }
}

function pastScreen() {
  chrome({ title: "Past claims", back: false });
  const past = HOME?.past ?? [];
  ROOT.innerHTML = testBar() + (past.length
    ? `<div class="card" style="padding:2px 14px">${past.map((c) => claimRow(c, c.sentAt ? `sent ${new Date(c.sentAt).toLocaleDateString("en-CA", { month: "short", day: "numeric" })}` : "")).join("")}</div>`
    : `<div class="empty"><div class="big">Nothing sent yet</div>Claims you send show up here, each with where it stands: waiting for approval, approved or paid.</div>`);
  wireRows();
}

/* ---------- what waits on me, and handing off while away ---------- */
const OFFICER_TITLE = { president: "President", vp: "VP of Operations", treasurer: "Treasurer" };
const officerEmail = (role) => HOME?.executives?.find((x) => x.title === OFFICER_TITLE[role])?.email;
function approveScreen() {
  chrome({ title: "To approve", back: false });
  let h = testBar();
  for (const si of HOME.standingIn ?? []) h += `<div class="say mu">${si.backup ? `You're the second person for the ${esc(si.title)} (${esc(si.name)})` : `You're standing in for the ${esc(si.title)} (${esc(si.name)})`} until ${esc(longDate(si.until))}.</div>`;
  h += `<div class="day">Waiting for you</div>` + (HOME.toApprove.length ? `<div class="card" style="padding:2px 14px">${HOME.toApprove.map((c) => claimRow(c, c.as && /^for /.test(c.as) ? c.as : "")).join("")}</div>`
    : `<div class="card"><div class="note">Nothing waiting for you. When a claim needs your approval, it shows here and you get an email.</div></div>`);
  if (HOME.toPay.length || HOME.me.role === "vp") h += `<div class="day">To pay</div>` + (HOME.toPay.length ? `<div class="card" style="padding:2px 14px">${HOME.toPay.map((c) => claimRow(c, "approved, send the e-transfer")).join("")}</div>` : `<div class="card"><div class="note">No approved claims waiting to be paid.</div></div>`);
  const roles = Object.keys(HOME.away ?? {});
  if (roles.length) {
    const own = roles.filter((r) => r === HOME.me.role), others = roles.filter((r) => r !== HOME.me.role);
    h += own.map((r) => awayCard(r, true)).join("");
    if (others.length) h += `<details class="more" ${others.some((r) => HOME.away[r]) ? "open" : ""}><summary>Hand off for ${esc(others.map((r) => firstName(HOME.executives.find((x) => x.email === officerEmail(r))?.name)).join(" or "))} (if they forgot)</summary>${others.map((r) => awayCard(r, false)).join("")}</details>`;
  }
  ROOT.innerHTML = h;
  wireRows();
  for (const r of roles) wireAway(r);
}
function awayCard(r, isMe) {
  const d = HOME.away[r];
  const who = HOME.executives.find((x) => x.email === officerEmail(r));
  const head = isMe ? "Going away?" : `${esc(who?.name)}, ${esc(OFFICER_TITLE[r])}`;
  if (d) return `<div class="card" id="away-${r}"><div class="k">${isMe ? "Your approvals" : head}</div>
      <div class="note" style="margin-top:3px">${d.inForce ? "Handed" : "Will be handed"} to <b>${esc(d.toName)}</b> from ${esc(longDate(d.from))} to ${esc(longDate(d.until))}.${d.backupName ? ` When ${esc(firstName(d.toName))} can't take one, it goes to ${esc(d.backupName)}.` : ""}</div>
      ${(d.mail ?? []).filter((m) => !m.ok).map((m) => `<div class="say wt" style="margin:8px 0 0">The email to ${esc(m.to)} didn't go: ${esc(m.why)}</div>`).join("")}
      <button class="btn ghost" data-back="${r}" type="button" style="margin-top:10px">${d.inForce ? (isMe ? "I'm back" : "End it now") : "Cancel it"}</button></div>`;
  const ex = HOME.executives.filter((x) => x.email !== officerEmail(r));
  const opts = (sel, none) => (none ? `<option value="">No one</option>` : "") + ex.map((x) => `<option value="${esc(x.email)}" ${x.email === sel ? "selected" : ""}>${esc(x.name)} · ${esc(x.title)}</option>`).join("");
  const firstTo = r === "vp" ? officerEmail("president") : officerEmail("vp");
  const backup = ex.find((x) => x.email !== firstTo && !Object.values(OFFICER_TITLE).includes(x.title))?.email ?? "";
  return `<div class="card" id="away-${r}"><div class="k">${head}</div>
    <p class="note" style="margin:4px 0 10px">${isMe ? "Hand your approvals" : `Hand ${esc(firstName(who?.name))}'s approvals`}${r === "vp" ? " and recording the payments" : ""} to another executive while ${isMe ? "you're" : "they're"} away. Claims waiting move to them at once.</p>
    <div class="field"><label for="to-${r}">Who stands in</label><select id="to-${r}">${opts(firstTo)}</select></div>
    <div class="field"><label for="bk-${r}">If they can't take one (their own claim, or one they already approve)</label><select id="bk-${r}">${opts(backup, true)}</select></div>
    <div class="two"><div class="field"><label for="fr-${r}">First day away</label><input id="fr-${r}" type="date" value="${todayHere()}"></div>
      <div class="field"><label for="un-${r}">Last day away</label><input id="un-${r}" type="date"></div></div>
    <div id="pv-${r}"></div>
    <button class="btn navy" data-save="${r}" type="button">Hand off ${isMe ? "my" : "their"} approvals</button></div>`;
}
function wireAway(r) {
  const b = ROOT.querySelector(`[data-back="${r}"]`);
  if (b) b.onclick = async () => { b.disabled = true; try { HOME = await api(`?away=${r}${TESTMODE() ? "&test=1" : ""}`, { method: "DELETE" }); toast("Done. Approvals come back as normal."); render(); } catch (e) { b.disabled = false; if (!e.quiet) toast(e.message, true); } };
  const save = ROOT.querySelector(`[data-save="${r}"]`);
  if (!save) return;
  const val = (k) => $(`${k}-${r}`).value;
  let timer = null;
  const preview = () => { clearTimeout(timer); timer = setTimeout(async () => {
    const box = $(`pv-${r}`); if (!box) return;
    if (!val("un")) { box.innerHTML = `<p class="tiny" style="margin:-4px 0 10px">Pick the last day away to see who takes what.</p>`; return; }
    try {
      const out = await api(`?awaypreview=${r}&to=${encodeURIComponent(val("to"))}&backup=${encodeURIComponent(val("bk"))}&from=${val("fr")}&until=${val("un")}`);
      box.innerHTML = `<div class="k" style="margin-bottom:2px">Who takes what</div><ul class="preview-rows">${out.rows.map((x) => `<li><span>${esc(x.label)}</span><b>${x.stuck ? "stays with " + esc(firstName(HOME.executives.find((e) => e.email === officerEmail(r))?.name)) : esc(x.name)}</b></li>`).join("")}</ul>`;
    } catch (e) { box.innerHTML = `<div class="say bad" style="margin:0 0 10px">${esc(e.message)}</div>`; }
  }, 250); };
  for (const k of ["to", "bk", "fr", "un"]) $(`${k}-${r}`).addEventListener("change", preview);
  preview();
  save.onclick = async () => {
    save.disabled = true;
    try { HOME = await api(`?away=${r}${TESTMODE() ? "&test=1" : ""}`, { method: "PUT", json: { to: val("to"), backup: val("bk"), from: val("fr"), until: val("un") } }); toast("Handed off. They've been emailed."); render(); }
    catch (e) { save.disabled = false; if (!e.quiet) toast(e.message, true); }
  };
}

let ALLF = "all";
function allScreen() {
  chrome({ title: "All claims", back: false });
  const all = HOME.all ?? [];
  const F = { all: ["All", () => true], waiting: ["Waiting", (c) => c.status === "submitted"], approved: ["To pay", (c) => c.status === "approved"], paid: ["Paid", (c) => c.status === "paid"], back: ["Sent back", (c) => c.status === "rejected"] };
  const shown = all.filter(F[ALLF][1]);
  const tests = all.filter((c) => c.test).length;
  ROOT.innerHTML = `${testBar()}<div class="chips">${Object.entries(F).map(([k, [label, fn]]) => `<button type="button" data-f="${k}" class="${ALLF === k ? "on" : ""}">${label} ${all.filter(fn).length}</button>`).join("")}</div>
    ${shown.length ? `<div class="card" style="padding:2px 14px">${shown.map((c) => claimRow(c, c.sentAt ? `sent ${new Date(c.sentAt).toLocaleDateString("en-CA", { month: "short", day: "numeric" })}` : "")).join("")}</div>` : `<div class="card"><div class="note">No claims here.</div></div>`}
    ${HOME.me.role === "president" ? `<div class="card" style="margin-top:18px"><div class="k">Test claims</div><p class="note" style="margin:4px 0 10px">Every claim marked TEST, from everyone, with its receipts${tests ? `: ${tests} sent, plus any still being built` : ""}. Real claims aren't touched.</p>
      <button class="btn danger" id="purge" type="button" style="border:1.5px solid var(--late)">Delete all test claims</button></div>` : ""}`;
  ROOT.querySelectorAll("[data-f]").forEach((b) => { b.onclick = () => { ALLF = b.dataset.f; allScreen(); }; });
  wireRows();
  if ($("purge")) $("purge").onclick = async () => {
    if (!confirm("Delete every test claim, from everyone, with its receipts? Real claims aren't touched. This can't be undone.")) return;
    try { const out = await api(`?purge=tests${TESTMODE() ? "&test=1" : ""}`, { method: "POST" }); HOME = out; toast(`Deleted ${out.purged.claims} test claim${out.purged.claims === 1 ? "" : "s"}.`); render(); }
    catch (e) { if (!e.quiet) toast(e.message, true); }
  };
}

function render() {
  if (!SESSION) return signInScreen();
  if (!HOME) { chrome({ title: "ONGIA Expenses", back: false, tabs: false }); ROOT.innerHTML = `<div class="empty"><span class="spin" style="display:inline-block"></span></div>`; return; }
  if (EDIT) return editorScreen();
  if (VIEW.name === "view" && OPEN) return viewScreen();
  if (VIEW.name === "past") return pastScreen();
  if (VIEW.name === "approve" && HOME.tabs.includes("approve")) return approveScreen();
  if (VIEW.name === "all" && HOME.tabs.includes("all")) return allScreen();
  return claimScreen();
}

/* ---------- start ---------- */
// A link from an email (/expenses#claim=…) opens that claim, after signing in if need be.
{ const m = location.hash.match(/^#claim=([a-z0-9-]{4,40})$/); if (m) { store.set("ongia-exp-open", m[1]); history.replaceState(null, "", location.pathname); } }
(async () => {
  const done = await finishMicrosoft().catch((e) => e.message);
  if (typeof done === "string") { store.set("ongia-xms-pick", "1"); return signInScreen(done); }
  if (!SESSION) return signInScreen();
  render();
  try {
    await loadHome();
    const want = store.get("ongia-exp-open");
    if (want) { store.del("ongia-exp-open"); openClaim(want); }
    await flushOutbox(); if ((HOME?.current?.lines ?? []).some((l) => l.check?.state === "reading")) pollReading();
  }
  catch (e) { if (!e.quiet) { ROOT.innerHTML = `<div class="say bad">${esc(e.message)}</div><button class="btn ghost" id="reload" type="button">Try again</button>`; $("reload").onclick = () => location.reload(); } }
})();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !SESSION || !HOME || EDIT) return;
  if (VIEW.name === "view" && OPEN) api(`?claim=${OPEN.id}`).then((o) => { OPEN = o.claim; loadHome().catch(() => {}); }).catch(() => {});
  else loadHome().then(flushOutbox).catch(() => {});
});
// The app was open when an email link was tapped: open that claim.
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#claim=([a-z0-9-]{4,40})$/); if (m && SESSION) { history.replaceState(null, "", location.pathname); openClaim(m[1]); } });
</script>
</body>
