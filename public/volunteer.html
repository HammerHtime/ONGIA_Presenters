<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONGIA Volunteer Agreement</title>
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<meta name="theme-color" content="#0e1a35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Oswald:wght@400;500;600&display=swap">
<style>
  /* The same look as the presenter agreement: a form a volunteer reads on a phone. */
  :root {
    color-scheme: light;
    --paper:#f2efe8; --card:#fafaf7; --sunk:#edeae2;
    --ink:#12161f; --ink-mid:#2c3448; --muted:#767f92;
    --navy:#1a2f5e; --navy-deep:#0e1a35;
    --gold:#b8922a; --gold-light:#d9ae4b; --gold-pale:#f4ecd6;
    --border:#ddd7c8; --hair:rgba(18,22,31,.10);
    --done:#2f6b4f; --done-bg:#e2efe7;
    --bad:#a33328; --bad-bg:#f7e3e0;
    --shadow:0 10px 30px rgba(14,26,53,.09), 0 2px 6px rgba(14,26,53,.05);
    --fd:"DM Serif Display",Georgia,serif;
    --fb:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --fu:"Oswald","Arial Narrow",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);
       font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
  h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
  p{margin:0}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}

  .bar{background:var(--navy-deep);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;
       border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:10;
       padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .bar .logo{height:26px;width:auto;display:block;flex:none}
  @media (max-width:430px){.bar .logo{height:22px}.bar{padding:12px 14px}}
  .bar .langbtn{margin-left:auto;background:transparent;color:var(--gold-light);border:1px solid rgba(217,174,75,.55);
    border-radius:999px;padding:5px 12px;font:600 12px var(--fu,inherit);letter-spacing:.06em;cursor:pointer;min-height:32px}
  .bar .langbtn:hover{background:rgba(217,174,75,.12)}

  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
  .card+.card{margin-top:14px}
  .card h2{font-family:var(--fd);font-size:23px;line-height:1.15;margin-bottom:5px}
  .lede{color:#5c6577;font-size:14.5px}

  .facts{display:grid;gap:1px;background:var(--border);border-radius:14px;overflow:hidden;margin-top:16px}
  .fact{background:var(--sunk);padding:11px 14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .fact dt{font-family:var(--fu);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5c6577;flex:none}
  .fact dd{margin:0;font-size:14.5px;font-weight:600;text-align:right}

  .field{margin-top:15px}
  .field>label{display:block;font-family:var(--fu);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:6px}
  input[type=text],input[type=email],input[type=tel]{
    width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);
    border:1px solid var(--border);border-radius:12px;padding:12px 13px;-webkit-appearance:none}
  input::placeholder{color:var(--muted);opacity:.75}
  .hint{font-size:13px;color:#5c6577;margin-top:6px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:420px){.row2{grid-template-columns:1fr}}

  /* The terms are the agreement, so they are on the page rather than behind a link. */
  .termlist{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:1px;background:var(--border);border-radius:14px;overflow:hidden;counter-reset:t}
  .termlist li{background:var(--sunk);padding:12px 14px 12px 44px;font-size:14.5px;line-height:1.5;position:relative;counter-increment:t}
  .termlist li::before{content:counter(t);position:absolute;left:13px;top:12px;width:22px;height:22px;border-radius:999px;
    background:var(--navy);color:#fff;font:600 12px/22px var(--fu);text-align:center}
  .termlist b{display:block;font-size:15px;margin-bottom:2px}

  .attest{display:flex;gap:12px;align-items:flex-start;background:var(--gold-pale);border:1px solid var(--gold);
          border-radius:14px;padding:14px;cursor:pointer;margin-top:12px}
  .attest input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--gold);margin:1px 0 0}
  .attest span{font-size:14px;line-height:1.45}

  @font-face{font-family:"Signature";font-display:swap;
    src:url(/assets/fonts/GreatVibes-Regular.woff2) format("woff2"),url(/assets/fonts/GreatVibes-Regular.ttf) format("truetype")}
  .sig{margin-top:14px;background:var(--sunk);border:1px solid var(--border);border-radius:14px;padding:15px}
  .sig .typed{font-family:"Signature",var(--fd),cursive;font-size:38px;line-height:1.15;color:var(--navy);border-bottom:1.5px solid var(--border);
    padding:4px 6px 6px;min-height:52px;word-break:break-word}
  .sig .meta{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:11.5px;color:var(--muted);
    font-family:var(--fu);letter-spacing:.1em;text-transform:uppercase}

  .btn{border-radius:999px;padding:14px 24px;font-weight:700;font-size:16px;border:1px solid transparent;cursor:pointer;
       transition:transform .14s,background .18s;width:100%;display:block;text-align:center;text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.6;cursor:progress}
  .btn-gold{background:var(--gold);color:#1c1608}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--ink-mid)}
  .nav{margin-top:20px}

  /* A failed check marks the control it is about, not just the list at the bottom. */
  .field.err>label{color:var(--bad)}
  .field.err input{border-color:var(--bad);background:#fdf3f1}
  .attest.err{border-color:var(--bad);background:#fdf3f1}
  .errmark{display:block;margin-top:7px;font-size:12.5px;font-weight:600;color:var(--bad)}
  .problems{margin-top:14px;background:var(--bad-bg);border:1px solid var(--bad);border-radius:14px;padding:13px 15px}
  .problems b{color:var(--bad);font-size:14px}
  .problems ul{margin:7px 0 0;padding-left:20px;font-size:14px;color:var(--ink-mid)}
  .problems li{margin-bottom:3px}
  .problems a{color:var(--bad);text-decoration:underline;text-underline-offset:2px}
  .restored{margin-bottom:14px;background:var(--gold-pale);border:1px solid var(--gold);border-radius:14px;padding:11px 14px;font-size:14px}

  .done-screen{text-align:center;padding:26px 6px}
  .done-screen .tick{width:66px;height:66px;border-radius:999px;background:var(--done-bg);color:var(--done);
    display:grid;place-items:center;margin:0 auto 18px;font-size:32px;border:1px solid var(--done)}
  .done-screen h2{font-family:var(--fd);font-size:26px;margin-bottom:9px}
  .done-screen p{color:var(--muted);font-size:14.5px;max-width:34ch;margin:0 auto}
  .done-list{text-align:left;margin-top:20px;display:grid;gap:1px;background:var(--border);border-radius:14px;overflow:hidden}
  .done-list div{background:var(--sunk);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
  .done-list b{color:var(--done)}
  .ref{margin-top:16px;font-family:var(--fu);font-size:12px;letter-spacing:.1em;color:var(--muted)}
  .done-actions{display:flex;flex-direction:column;gap:10px;margin:18px 0 0}

  .loading,.oops{max-width:560px;margin:0 auto;padding:60px 20px;text-align:center;color:var(--muted)}
  .oops h2{font-family:var(--fd);font-size:24px;color:var(--ink);margin-bottom:10px}
</style>
</head>
<body>

<div class="bar">
  <img class="logo" src="/assets/ongia-logo.png" alt="ONGIA" width="156" height="26">
  <button type="button" class="langbtn" id="lang" aria-label="Switch language / Changer de langue">Français</button>
</div>

<div id="root"><p class="loading">Loading your agreement…</p></div>

<script type="module">
const ROOT = document.getElementById("root");
const LANGBTN = document.getElementById("lang");
const TOKEN = location.pathname.startsWith("/v/")
  ? location.pathname.slice(3)
  : new URLSearchParams(location.search).get("t") ?? "";

/* ---------- language ---------- */
// The whole form follows their language; the copy ONGIA files stays English.
let LANG = (() => { try { return localStorage.getItem("ongia-lang"); } catch { return null; } })()
  || (/^fr/i.test(navigator.language) ? "fr" : "en");

const T = {
en: {
  pageTitle: "ONGIA Volunteer Agreement", loading: "Loading your agreement…", other: "Français",
  head: "Volunteer Agreement",
  hello: (f, t) => `Hello ${f}. Thank you for volunteering with ONGIA at <b>${t}</b>. Please check your details, read the terms below, and sign to confirm.`,
  dates: "Event date", datesMany: "Event dates", venue: "Venue", city: "City",
  aboutYou: "About you", first: "First name", last: "Last name", email: "Email", org: "Agency or organization",
  phone: "Contact number", phoneHint: "So the event lead can reach you at the event.",
  signHead: "Confirm and sign", typeName: "Type your full name to sign", eSig: "Electronic signature",
  agreed: "I understand that my typed name constitutes a legally binding electronic signature and certifies that the information contained in this agreement is accurate and complete.",
  submit: "Sign and send", sending: "Sending…",
  keepsHere: "Need to finish later? You can close this page and come back on the same device before you sign. Your answers stay saved on it until you do.",
  restored: "Picked up where you left off — your answers are still here.",
  notQuite: "Not quite there", errNeeds: "Needs an answer",
  vName: "Please add your first and last name.", vEmail: "That email address doesn't look right.", vPhone: "Please add a contact number.",
  vTerms: "Please read and agree to the Volunteer Terms.", vStanding: "Please confirm you are in good standing and not under a formal investigation.",
  vSign: "Please type your name to sign.", vAgree: "Please confirm your electronic signature.",
  doneTitle: "Thank you — you're signed", doneP: "ONGIA has your signed Volunteer Agreement.",
  signedOn: (d) => `Signed ${d}`, emailedTo: (e) => `A copy was emailed to ${e}`,
  notEmailed: "We couldn't email your copy, so please download it below.",
  reference: (r) => `Reference ${r}`, download: "Download your signed copy",
  alreadyTitle: "You've already signed", alreadyP: "ONGIA has your signed Volunteer Agreement. There is nothing more to do.",
  questions: (n) => `Questions? Reply to your ONGIA email${n ? ` or contact ${n}` : ""}.`,
  errInvalidLink: "This link isn't valid. Check it came from ONGIA, or ask us for a new one.",
  errSigned: "This agreement has already been signed. Contact ONGIA if something needs changing.",
  netFail: "Couldn't reach ONGIA — check your connection and try again.", generic: "Something went wrong. Please try again.",
  linkTitle: "This link is incomplete", linkP: "Open the link from your ONGIA email, or ask us to send it again.",
  openFail: "We couldn't open this agreement", reachTitle: "We couldn't reach ONGIA", reachP: "Check your connection and refresh the page.",
  months: ["January","February","March","April","May","June","July","August","September","October","November","December"],
  mons: ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], days: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
  fmt: (dn, d, mo, y) => `${dn} ${d} ${mo} ${y}`,
},
fr: {
  pageTitle: "Entente de bénévole d'ONGIA", loading: "Chargement de votre entente…", other: "English",
  head: "Entente de bénévole",
  hello: (f, t) => `Bonjour ${f}. Merci de faire du bénévolat avec ONGIA à <b>${t}</b>. Veuillez vérifier vos coordonnées, lire les conditions ci-dessous et signer pour confirmer.`,
  dates: "Date de l'événement", datesMany: "Dates de l'événement", venue: "Lieu", city: "Ville",
  aboutYou: "À propos de vous", first: "Prénom", last: "Nom", email: "Courriel", org: "Organisme ou organisation",
  phone: "Numéro de téléphone", phoneHint: "Pour que la personne responsable de l'événement puisse vous joindre sur place.",
  signHead: "Confirmer et signer", typeName: "Tapez votre nom complet pour signer", eSig: "Signature électronique",
  agreed: "Je comprends que mon nom tapé constitue une signature électronique juridiquement contraignante et atteste que les renseignements contenus dans la présente entente sont exacts et complets.",
  submit: "Signer et envoyer", sending: "Envoi…",
  keepsHere: "Besoin de terminer plus tard? Vous pouvez fermer cette page et y revenir sur le même appareil avant de signer. Vos réponses y restent enregistrées jusque-là.",
  restored: "Nous avons repris là où vous vous étiez arrêté — vos réponses sont toujours là.",
  notQuite: "Presque", errNeeds: "Réponse requise",
  vName: "Veuillez indiquer votre prénom et votre nom.", vEmail: "Cette adresse courriel semble incorrecte.", vPhone: "Veuillez indiquer un numéro de téléphone.",
  vTerms: "Veuillez lire et accepter les conditions applicables aux bénévoles.", vStanding: "Veuillez confirmer que vous êtes en règle et que vous ne faites l'objet d'aucune enquête officielle.",
  vSign: "Veuillez taper votre nom pour signer.", vAgree: "Veuillez confirmer votre signature électronique.",
  doneTitle: "Merci — c'est signé", doneP: "ONGIA a reçu votre entente de bénévole signée.",
  signedOn: (d) => `Signée le ${d}`, emailedTo: (e) => `Une copie a été envoyée à ${e}`,
  notEmailed: "Nous n'avons pas pu vous envoyer votre copie par courriel; veuillez la télécharger ci-dessous.",
  reference: (r) => `Référence ${r}`, download: "Télécharger votre copie signée",
  alreadyTitle: "Vous avez déjà signé", alreadyP: "ONGIA a reçu votre entente de bénévole signée. Il n'y a rien d'autre à faire.",
  questions: (n) => `Des questions? Répondez à votre courriel d'ONGIA${n ? ` ou communiquez avec ${n}` : ""}.`,
  errInvalidLink: "Ce lien n'est pas valide. Vérifiez qu'il provient bien d'ONGIA ou demandez-nous un nouveau lien.",
  errSigned: "Cette entente a déjà été signée. Communiquez avec ONGIA si quelque chose doit être modifié.",
  netFail: "Impossible de joindre ONGIA — vérifiez votre connexion et réessayez.", generic: "Une erreur s'est produite. Veuillez réessayer.",
  linkTitle: "Ce lien est incomplet", linkP: "Ouvrez le lien depuis votre courriel d'ONGIA ou demandez-nous de le renvoyer.",
  openFail: "Impossible d'ouvrir cette entente", reachTitle: "Impossible de joindre ONGIA", reachP: "Vérifiez votre connexion et actualisez la page.",
  months: ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],
  mons: ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."], days: ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."],
  fmt: (dn, d, mo, y) => `${dn} ${d === 1 ? "1er" : d} ${mo} ${y}`,
},
};
const t = (k, ...a) => { const v = T[LANG][k] ?? T.en[k]; return typeof v === "function" ? v(...a) : v; };
// The server answers in English; the few messages a volunteer can meet are mapped here.
const serverText = (msg) => /isn't valid/.test(msg ?? "") ? t("errInvalidLink") : /already been signed/.test(msg ?? "") ? t("errSigned") : (msg ?? t("generic"));
function setLang(l) {
  LANG = l; try { localStorage.setItem("ongia-lang", l); } catch {}
  document.documentElement.lang = l; LANGBTN.textContent = t("other"); document.title = t("pageTitle");
  if (DATA) render();
}
LANGBTN.textContent = t("other");
LANGBTN.onclick = () => setLang(LANG === "fr" ? "en" : "fr");

let DATA = null, DONE = null, sending = false, restored = false;
const S = { first: "", last: "", email: "", organization: "", phone: "", termsAccepted: false, standing: false, signature: "", agreed: false, problems: [] };

/**
 * Answers are kept on the device as they are typed and put back on the way in, so a
 * phone that discards the tab costs nothing. Keyed by the link, so a shared tablet
 * never shows one volunteer's answers to another; cleared the moment they sign.
 */
const DRAFT_KEY = `ongia-vdraft-${TOKEN}`;
const DRAFT_FIELDS = ["first", "last", "email", "organization", "phone", "termsAccepted", "standing", "signature", "agreed"];
const saveDraft = () => { try { const keep = {}; for (const k of DRAFT_FIELDS) keep[k] = S[k]; localStorage.setItem(DRAFT_KEY, JSON.stringify(keep)); } catch {} };
const clearDraft = () => { try { localStorage.removeItem(DRAFT_KEY); } catch {} };
const loadDraft = () => { try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) ?? "null"); return d && typeof d === "object" ? d : null; } catch { return null; } };

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// 4165550100 → 416-555-0100 as it is typed; an extension survives as " x123".
function formatPhone(raw) {
  const s = String(raw ?? "").trim();
  if (!s) return "";
  if (/^\+(?!1)/.test(s)) return s;
  const m = s.match(/(?:x|ext\.?|poste|#)\s*(\d{0,6})\s*$/i);
  let ext = m ? m[1] : "", hasExt = !!m;
  let digits = (m ? s.slice(0, m.index) : s).replace(/\D/g, "");
  if (digits.length === 11 && digits[0] === "1") digits = digits.slice(1);
  digits = digits.slice(0, 10);
  const a = digits.slice(0, 3), b = digits.slice(3, 6), c = digits.slice(6, 10);
  let out = a; if (b) out += "-" + b; if (c) out += "-" + c;
  if (hasExt) out += " x" + ext;
  return out.trim();
}
function formatPhoneInput(el) {
  const before = el.value, pos = el.selectionStart ?? before.length;
  const after = formatPhone(before);
  if (after === before) return after;
  const digitsBefore = before.slice(0, pos).replace(/\D/g, "").length;
  el.value = after;
  let i = 0, seen = 0;
  while (i < after.length && seen < digitsBefore) { if (/\d/.test(after[i])) seen++; i++; }
  if (pos >= before.length) i = after.length;
  try { el.setSelectionRange(i, i); } catch {}
  return after;
}

const parseISO = (v) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v ?? ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmtDate = (v) => { const d = parseISO(v); return d ? t("fmt", t("days")[d.getDay()], d.getDate(), t("mons")[d.getMonth()], d.getFullYear()) : ""; };
const today = () => { const d = new Date(), p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };

/* ---------- checks ---------- */
function validate() {
  const out = [];
  const add = (msg, at) => out.push({ msg, at });
  if (!S.first.trim() || !S.last.trim()) add(t("vName"), S.first.trim() ? "f-last" : "f-first");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email.trim())) add(t("vEmail"), "f-email");
  if (S.phone.replace(/\D/g, "").length < 7) add(t("vPhone"), "f-phone");
  if (!S.termsAccepted) add(t("vTerms"), "f-terms");
  if (!S.standing) add(t("vStanding"), "f-standing");
  if (!S.signature.trim()) add(t("vSign"), "f-sign");
  if (!S.agreed) add(t("vAgree"), "f-agree");
  return out;
}
const problemList = (list) => `<div class="problems" role="alert"><b>${t("notQuite")}</b><ul>${list.map((p) => `<li>${p.at ? `<a href="#" data-goto="${esc(p.at)}">${esc(p.msg)}</a>` : esc(p.msg)}</li>`).join("")}</ul></div>`;
const has = (id) => S.problems.some((p) => p.at === id);
const errMark = (id) => (has(id) ? `<span class="errmark">${t("errNeeds")}</span>` : "");

/**
 * Once a warning is showing, it goes the moment its answer is right, without an
 * extra click. Only the warning list and the red marks change, so the box being
 * typed in keeps its cursor.
 */
function refreshProblems() {
  const now = validate();
  const still = new Set(now.map((p) => p.at));
  for (const block of ROOT.querySelectorAll(".err")) {
    const ids = [...block.querySelectorAll("[id]")].map((x) => x.id);
    if (!ids.some((id) => still.has(id))) { block.classList.remove("err"); block.querySelector(".errmark")?.remove(); }
  }
  S.problems = now;
  const box = ROOT.querySelector(".problems");
  if (!box) return;
  if (!now.length) box.remove();
  else box.querySelector("ul").innerHTML = now.map((p) => `<li><a href="#" data-goto="${esc(p.at)}">${esc(p.msg)}</a></li>`).join("");
}

/* ---------- screens ---------- */
function formMarkup() {
  const ev = DATA.event, T2 = DATA.terms[LANG] ?? DATA.terms.en;
  const many = ev.lastDayIso && ev.lastDayIso !== ev.dayOneIso;
  const field = (id, key, label, type = "text", extra = "") => `<div class="field${has(id) ? " err" : ""}"><label for="${id}">${label}</label>
      <input id="${id}" data-bind="${key}" type="${type}" value="${esc(S[key])}" ${extra}>${errMark(id)}</div>`;
  const box = (id, key, text) => `<label class="attest${has(id) ? " err" : ""}" for="${id}"><input id="${id}" type="checkbox" data-bind="${key}"${S[key] ? " checked" : ""}><span>${text}</span></label>`;
  return `<div class="wrap">
    ${restored ? `<div class="restored">${t("restored")}</div>` : ""}
    <div class="card"><h2>${t("head")}</h2>
      <p class="lede">${t("hello", esc(S.first || DATA.volunteer.first), esc(ev.title))}</p>
      <dl class="facts">
        <div class="fact"><dt>${many ? t("datesMany") : t("dates")}</dt><dd>${esc(many ? `${fmtDate(ev.dayOneIso)} – ${fmtDate(ev.lastDayIso)}` : fmtDate(ev.dayOneIso))}</dd></div>
        ${ev.venue ? `<div class="fact"><dt>${t("venue")}</dt><dd>${esc(ev.venue)}</dd></div>` : ""}
        <div class="fact"><dt>${t("city")}</dt><dd>${esc(ev.city)}</dd></div>
      </dl></div>
    <div class="card"><h2>${t("aboutYou")}</h2>
      <div class="row2">${field("f-first", "first", t("first"), "text", 'autocomplete="given-name"')}${field("f-last", "last", t("last"), "text", 'autocomplete="family-name"')}</div>
      ${field("f-email", "email", t("email"), "email", 'autocomplete="email" inputmode="email"')}
      ${field("f-org", "organization", t("org"), "text", 'autocomplete="organization"')}
      <div class="field${has("f-phone") ? " err" : ""}"><label for="f-phone">${t("phone")}</label>
        <input id="f-phone" data-bind="phone" type="tel" value="${esc(S.phone)}" autocomplete="tel" inputmode="tel" placeholder="416-555-0100">
        ${errMark("f-phone")}<p class="hint">${t("phoneHint")}</p></div></div>
    <div class="card"><h2>${esc(T2.title)}</h2><p class="lede">${esc(T2.intro)}</p>
      <ol class="termlist">${T2.items.map(([h, x]) => `<li><b>${esc(h)}</b>${esc(x)}</li>`).join("")}</ol></div>
    <div class="card"><h2>${t("signHead")}</h2>
      ${box("f-terms", "termsAccepted", esc(T2.termsBox))}
      ${box("f-standing", "standing", esc(T2.standing))}
      <div class="field${has("f-sign") ? " err" : ""}" style="margin-top:18px"><label for="f-sign">${t("typeName")}</label>
        <input id="f-sign" data-bind="signature" type="text" value="${esc(S.signature)}" autocomplete="off" placeholder="${esc(`${S.first} ${S.last}`.trim())}">${errMark("f-sign")}</div>
      <div class="sig"><div class="typed" id="sigline">${S.signature ? esc(S.signature) : "&nbsp;"}</div>
        <div class="meta"><span>${t("eSig")}</span><span>${esc(fmtDate(today()))}</span></div></div>
      ${box("f-agree", "agreed", t("agreed"))}
      ${S.problems.length ? problemList(S.problems) : ""}
      <div class="nav"><button type="button" class="btn btn-gold" id="submit"${sending ? " disabled" : ""}>${sending ? t("sending") : t("submit")}</button></div>
      <p class="hint" style="margin-top:12px">${t("keepsHere")}</p></div></div>`;
}

function signedMarkup(result) {
  const v = DATA.volunteer, fresh = !!result;
  const at = v.signedAt ? fmtDate(v.signedAt.slice(0, 10)) : fmtDate(today());
  const emailed = result ? result.emailed !== false : null;
  const pdf = result?.pdf ?? `/api/volunteer?t=${encodeURIComponent(TOKEN)}&pdf=1`;
  const contact = DATA.event.contact?.name ?? "";
  return `<div class="wrap"><div class="card done-screen"><div class="tick">✓</div>
    <h2>${fresh ? t("doneTitle") : t("alreadyTitle")}</h2><p>${fresh ? t("doneP") : t("alreadyP")}</p>
    <div class="done-list">
      <div><b>✓</b><span>${t("signedOn", esc(at))}</span></div>
      ${fresh ? `<div><b>${emailed ? "✓" : "!"}</b><span>${emailed ? t("emailedTo", esc(S.email || v.email)) : t("notEmailed")}</span></div>` : ""}
    </div>
    <div class="done-actions"><a class="btn btn-gold" href="${esc(pdf)}">${t("download")}</a></div>
    <p class="ref">${t("reference", esc(result?.reference ?? v.reference))}</p>
    <p class="hint" style="margin-top:8px">${t("questions", esc(contact))}</p></div></div>`;
}

function render() {
  document.title = t("pageTitle");
  ROOT.innerHTML = DONE ? signedMarkup(DONE) : DATA.volunteer.status === "signed" ? signedMarkup(null) : formMarkup();
  if (DONE || DATA.volunteer.status === "signed") window.scrollTo(0, 0);
}

/* ---------- events ---------- */
ROOT.addEventListener("input", (e) => {
  const el = e.target, key = el.dataset?.bind;
  if (!key) return;
  S[key] = el.type === "checkbox" ? el.checked : key === "phone" ? formatPhoneInput(el) : el.value;
  if (key === "signature") { const line = document.getElementById("sigline"); if (line) line.innerHTML = S.signature ? esc(S.signature) : "&nbsp;"; }
  saveDraft();
  if (S.problems.length) refreshProblems();
});
ROOT.addEventListener("click", (e) => {
  const go = e.target.closest("[data-goto]");
  if (go) { e.preventDefault(); const el = document.getElementById(go.dataset.goto); el?.scrollIntoView({ block: "center", behavior: "smooth" }); el?.focus({ preventScroll: true }); return; }
  if (e.target.closest("#submit")) submit();
});

async function submit() {
  if (sending) return;
  S.problems = validate();
  if (S.problems.length) {
    render();
    const first = document.getElementById(S.problems[0].at);
    first?.scrollIntoView({ block: "center", behavior: "smooth" }); first?.focus({ preventScroll: true });
    return;
  }
  sending = true; render();
  try {
    const res = await fetch(`/api/volunteer?t=${encodeURIComponent(TOKEN)}`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ first: S.first, last: S.last, email: S.email, organization: S.organization, phone: S.phone,
        termsAccepted: S.termsAccepted, standing: S.standing, signature: S.signature, agreed: S.agreed, language: LANG }),
    });
    const out = await res.json().catch(() => ({}));
    sending = false;
    if (res.ok) { clearDraft(); DATA.volunteer.status = "signed"; DONE = out; render(); return; }
    S.problems = (out.problems ?? [serverText(out.error)]).map((m) => ({ msg: m, at: null }));
    render();
  } catch {
    sending = false;
    S.problems = [{ msg: t("netFail"), at: null }];
    render();
  }
}

/* ---------- boot ---------- */
(async function boot() {
  document.documentElement.lang = LANG;
  ROOT.innerHTML = `<p class="loading">${t("loading")}</p>`;
  if (!TOKEN) { ROOT.innerHTML = `<div class="oops"><h2>${t("linkTitle")}</h2><p>${t("linkP")}</p></div>`; return; }
  try {
    const res = await fetch(`/api/volunteer?t=${encodeURIComponent(TOKEN)}`);
    const out = await res.json();
    if (!res.ok) { ROOT.innerHTML = `<div class="oops"><h2>${t("openFail")}</h2><p>${esc(serverText(out.error))}</p></div>`; return; }
    // Their language first, while DATA is still unset, so switching it draws nothing.
    let remembered = null; try { remembered = localStorage.getItem("ongia-lang"); } catch {}
    if (out.volunteer.language && !remembered) setLang(out.volunteer.language);
    DATA = out;
    Object.assign(S, { first: out.volunteer.first ?? "", last: out.volunteer.last ?? "", email: out.volunteer.email ?? "", organization: out.volunteer.organization ?? "" });
    const d = loadDraft();
    if (d && out.volunteer.status !== "signed") {
      for (const k of DRAFT_FIELDS) if (d[k] !== undefined) S[k] = d[k];
      S.phone = formatPhone(S.phone);
      restored = !!String(d.signature || d.phone).trim() || d.termsAccepted || d.standing;
    }
    render();
  } catch {
    ROOT.innerHTML = `<div class="oops"><h2>${t("reachTitle")}</h2><p>${t("reachP")}</p></div>`;
  }
})();
</script>
</body>
</html>
