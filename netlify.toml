[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/assets/**"]

# The nightly backup puts the desk as deployed (pages, functions, config) in the zip beside the data, so these two
# functions carry the files. Other functions carry only the assets the PDFs use.
[functions."backup-run-background"]
  included_files = ["public/**", "netlify/functions/**", "scripts/**", "netlify.toml", "package.json", "package-lock.json", "README.md", "CLAUDE.md"]

[functions."backup-schedule"]
  included_files = ["public/**", "netlify/functions/**", "scripts/**", "netlify.toml", "package.json", "package-lock.json", "README.md", "CLAUDE.md"]

# Short, readable URLs for the things people are sent: agreements, volunteer agreements, sponsor forms.
[[redirects]]
  from = "/a/*"
  to = "/agreement.html"
  status = 200

[[redirects]]
  from = "/v/*"
  to = "/volunteer.html"
  status = 200

# The housekeeping questions sent to an event's attendees (food allergies, socials).
[[redirects]]
  from = "/q/*"
  to = "/reply.html"
  status = 200

# An event's survey (feedback), each attendee's own link.
[[redirects]]
  from = "/f/*"
  to = "/survey.html"
  status = 200

[[redirects]]
  from = "/s/*"
  to = "/sponsor.html"
  status = 200

# ONGIA Expenses: the board's expense claims, its own app on the phone.
[[redirects]]
  from = "/expenses"
  to = "/expenses.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Browsers expect the app manifest with its own type (the site sends nosniff).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Expenses opens inside the Briefing Room's main area on a computer (Andrew 3 Nov 2026), in a frame on the site's own
# page. Every other page stays unframeable (DENY above); for Expenses, frame-ancestors 'self' allows this site's own
# pages only, and browsers follow it in place of X-Frame-Options. Without it the desk showed a blank screen.
[[headers]]
  for = "/expenses"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"

[[headers]]
  for = "/expenses.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"

[[headers]]
  for = "/expenses.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
